methods:
- method_id: R01
  brand_name: 选项加戏
  source_name: 过度推测
  aliases:
  - A+B检查
  - 查新增
  question_type: 阅读理解
  role: decider
  primary_role: decider
  secondary_roles: []
  output_type: decide
  student_symptoms:
  - 两个选项都像原文，找到定位句仍无法区分。
  - 选项前半句能对上，但整项是否成立拿不准。
  trigger_cues:
  - 候选核心与原文对应，但又多出参与者、目的、用途、时间、范围、因果或确定程度。
  - 原文是部分、多数、可能或具体行为，候选把它扩大为全部、必然或特定目的。
  core_action: 把候选拆成原文已有内容 A 加新增内容 B。
  decision_rule: 只核 B 是否存在直接或间接文本依据；B 无依据才排除。
  verification: '回到定位句和必要上下文，标出 A 的对应。

    单独列出 B 改变的对象、关系、范围、时间或强度。

    搜索直接陈述或由事实、数量与上下文构成的间接支持。

    排除后仍对保留项做正向核对，不以剩一项代替证明。'
  stop_rule: 没逐字出现，不等于没有依据。
  common_wrong_instinct: 看到 A 正确，就默认 A+B 整项正确。
  failure_cases:
  - 候选与原文没有可确认的共同核心 A，不应强行拆分。
  - 题干本身要求合理推断时，仍需按题干范围判定间接支持。
  - 方法只排除一个加戏项时，不能自动证明其他项。
  counterexamples:
  - 候选虽未逐字出现，但原文事实或数量关系已对 B 构成充分间接支持，不得以加戏排除。
  - 候选含绝对词，但原文的确给出全称或必然关系，绝对词本身不构成错误。
  transfer_pattern: 适用于不同题材中的目的、因果、参与者、时间、范围、程度和确定性扩写检查。
  memory_line: 原文 A，选项 A+B，只查 B。
  anti_rule: 绝对词 ≠ 必错。
  visual_formula: "原文：A\n     ↓\n候选：A + B\n           ↑\n        只查这里"
  challenge_prompt: 先不要选答案，只找出哪个选项比原文多说了一部分，并指出多出的内容。
  source_references:
  - repository: https://github.com/rockpunkgod/ANSWER.git
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
    path: gaokao-english/references/reading-comprehension.md
    heading: 过度推测
  - repository: https://github.com/rockpunkgod/ANSWER.git
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
    path: gaokao-english/references/course-evidence.md
    heading: 其他已激活阅读方法
  can_follow:
  - 跳读定位
  - 同源替换
  - R09
  usually_before:
  - 正向验证
  usually_after:
  - 定位与必要上下文核对
  conflicts_with: []
  cannot_replace:
  - 定位
  - 主旨建模
  - 保留项正向验证
  levels:
    L1: 识别候选中明显新增的词语或人物。
    L2: 识别新增的原因、目的或用途。
    L3: 识别范围、程度、时间和确定性的变化。
    L4: 区分无依据扩写与有事实、数量或上下文支持的间接推断。
  compact:
    line: 原文 A，选项 A+B，只查 B。
    boundary: 这句只是检查动作，必须回文判定 B 是否有直接或间接依据。
    10s: 两项都像原文？把多说的那项拆成 A+B，只查 B。B 没有直接或间接依据，才排除。
    30s: 两个选项都像原文时，先看谁多了目的、原因、范围、时间或确定程度。比如原文只有 A，选项却说 A+B，不用重查 A，只查 B。B 无依据才排。刹车句是：没原词不等于没依据。
    90s: '当候选核心能对上原文，但又多了参与者、目的、用途、时间、范围、因果或确定程度时，启动选项加戏。先保留原文已有的 A，圈出新增 B，再回定位句和必要上下文只为
      B 求证。反例是：候选虽然没逐字出现，但原文事实或数量关系已充分支持 B，这时不是加戏，必须停止排除。另外，本法只能证明当前项的 B 有没有依据，不能因排了一项就宣布剩下项正确。


      挑战：先别选答案，只指出哪个选项比原文多说了什么，再说那部分需要回哪里求证。'
  full:
    summary: 保留候选与原文的共同核心，仅对新增断言求证；只有无直接也无间接支持时才排除。
    boundaries:
    - 不做原词匹配
    - 不把绝对词机械判错
    - 不由排除一项推出剩余项正确
  cases:
    canonical: cases/R01/canonical/case.yaml
    counterexample: cases/R01/counterexamples/case.yaml
    boundary: cases/R01/boundary/case.yaml
    transfer: cases/R01/transfer/case.yaml
    hard: cases/R01/hard/case.yaml
  four_step_card:
    start: 两个选项都像原文，其中一个比原文多说一截。
    first_cut: 把该选项圈成原文已有 A 和新增 B。
    judge: 只回文核 B；无直接也无间接依据才排除。
    stop: B 有合理文本支持时，不得以没原词为由继续排除。
  practicality_gate:
    status: design_complete_empirical_pending
    trigger: 可从候选相对原文多出的参与者、目的、范围、时间、因果或确定性识别，不依赖答案。
    action: 圈出候选共同核心 A，下划新增 B，只对 B 回文求证。
    output: decide；对当前加戏候选作有依据排除或保留，不自动定其他项。
    stop: 找到 B 的直接或间接支持，或无法分出稳定 A 时停止。
    transfer: A+B 拆分可迁移到任何题材的断言扩写检查。
    efficiency: 把整项反复比较缩成只查 B，减少比较维度和犹豫。
    misuse_cost: high；把没原词当无依据会直接误排正确项，因此 Trigger 必须有明确 B，Stop 必须核间接支持。
  first_use_test:
    status: designed_not_run
    trigger_success: null
