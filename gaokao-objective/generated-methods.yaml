  four_step_card:
    start: 刚开始七选五，A–G 在句型、主角或真谓语时间上有可观察差异。
    first_cut: 不填空，先在选项区把句型、主角、时间各分一次组。
    judge: 用组别减少优先比较项，然后拼回空前空后核对完整内容。
    stop: 分组后必须停止形式判断；内容不闭环就暂留，不定案。
  practicality_gate:
    status: design_complete_empirical_pending
    trigger: 只需观察 A–G 的句型角色、主角/话题与真谓语时间，不依赖答案。
    action: 给选项标 S句型、P主角、T时间三类标签，把当前空的优先组拼回两侧。
    output: reduce；只输出减少后的优先候选组。
    stop: 三维都无区分度，或已进入正文内容比较时停止分组。
    transfer: 三维标记不依赖文章题材，可迁移到任何七选五选项集。
