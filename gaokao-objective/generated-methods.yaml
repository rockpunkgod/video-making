methods:
- method_id: R01
  brand_name: 选项加戏
  source_name: 过度推测
  aliases:
  - A+B检查
  - 查新增
  question_type: 阅读理解
  role: decider
  primary_role: decider
  secondary_roles: []
  output_type: decide
  student_symptoms:
  - 两个选项都像原文，找到定位句仍无法区分。
  - 选项前半句能对上，但整项是否成立拿不准。
  trigger_cues:
  - 候选核心与原文对应，但又多出参与者、目的、用途、时间、范围、因果或确定程度。
  - 原文是部分、多数、可能或具体行为，候选把它扩大为全部、必然或特定目的。
  core_action: 把候选拆成原文已有内容 A 加新增内容 B。
  decision_rule: 只核 B 是否存在直接或间接文本依据；B 无依据才排除。
  verification: '回到定位句和必要上下文，标出 A 的对应。

    单独列出 B 改变的对象、关系、范围、时间或强度。

    搜索直接陈述或由事实、数量与上下文构成的间接支持。

    排除后仍对保留项做正向核对，不以剩一项代替证明。'
  stop_rule: 共同核心A未确认时不强拆；B有直接或间接支持时停止排除，不能因没原词判错；排除后仍核保留项。
  common_wrong_instinct: 看到 A 正确，就默认 A+B 整项正确。
  failure_cases:
  - 候选与原文没有可确认的共同核心 A，不应强行拆分。
  - 题干本身要求合理推断时，仍需按题干范围判定间接支持。
  - 方法只排除一个加戏项时，不能自动证明其他项。
  counterexamples:
  - 候选虽未逐字出现，但原文事实或数量关系已对 B 构成充分间接支持，不得以加戏排除。
  - 候选含绝对词，但原文的确给出全称或必然关系，绝对词本身不构成错误。
  transfer_pattern: 适用于不同题材中的目的、因果、参与者、时间、范围、程度和确定性扩写检查。
  memory_line: 原文 A，选项 A+B，只查 B。
  anti_rule: 绝对词 ≠ 必错。
  visual_formula: "原文：A\n     ↓\n候选：A + B\n           ↑\n        只查这里"
  challenge_prompt: 先不要选答案，只找出哪个选项比原文多说了一部分，并指出多出的内容。
  source_references:
  - repository: https://github.com/rockpunkgod/ANSWER.git
    path: gaokao-english/references/reading-comprehension.md
    heading: 过度推测
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  - repository: https://github.com/rockpunkgod/ANSWER.git
    path: gaokao-english/references/course-evidence.md
    heading: 其他已激活阅读方法
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  can_follow:
  - 跳读定位
  - 同源替换
  - R09
  usually_before:
  - 正向验证
  usually_after:
  - 定位与必要上下文核对
  conflicts_with: []
  cannot_replace:
  - 定位
  - 主旨建模
  - 保留项正向验证
  levels:
    L1: 识别候选中明显新增的词语或人物。
    L2: 识别新增的原因、目的或用途。
    L3: 识别范围、程度、时间和确定性的变化。
    L4: 区分无依据扩写与有事实、数量或上下文支持的间接推断。
  compact:
    line: 原文 A，选项 A+B，只查 B。
    boundary: 这句只是检查动作，必须回文判定 B 是否有直接或间接依据。
    10s: 选项多说一截？先拆原文已支持的A和新增B；B无直接或间接依据才排。
    30s: 选项多说一截？先在原文和候选里划出确实说同一件事的那一段，再圈候选额外多说的词。例如，只说参加，却多出为了获奖，要另查获奖目的。A没核实先不拆；B有支持不能排，排一项不证明另一项。
    90s: 选项多说一截？把候选拆成原文已有内容 A 加新增内容 B。这一步得到的是当前候选的保留、排除或待定判断；不能由剩余项自动定案。判断时，只核 B 是否存在直接或间接文本依据；B
      无依据才排除。什么时候停，共同核心A未确认时不强拆；B有直接或间接支持时停止排除，不能因没原词判错；排除后仍核保留项。反例示意，候选虽未逐字出现，但原文事实或数量关系已对
      B 构成充分间接支持，不得以加戏排除。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，先不要选答案，只找出哪个选项比原文多说了一部分，并指出多出的内容。
  full:
    summary: 把候选拆成原文已有内容 A 加新增内容 B。 只核 B 是否存在直接或间接文本依据；B 无依据才排除。
    source_boundary: 共同核心A未确认时不强拆；B有直接或间接支持时停止排除，不能因没原词判错；排除后仍核保留项。
    boundaries:
    - 共同核心A未确认时不强拆；B有直接或间接支持时停止排除，不能因没原词判错；排除后仍核保留项。
    - 候选虽未逐字出现，但原文事实或数量关系已对 B 构成充分间接支持，不得以加戏排除。
    - 候选含绝对词，但原文的确给出全称或必然关系，绝对词本身不构成错误。
    section_ids: &id001
    - 079728b2a0305ff9
    beginner_support:
      first_micro_action: 先在原文和候选里划出确实说同一件事的那一段，再圈候选额外多说的词。
      prerequisite: 先读清题干所问对象，能说明当前这句谁做什么；挡住判断的词不认识，先标出求助，不用词面相似代替句意。
      if_stuck: 先停在已确认的词句位置；读不清决定性词义或核心关系时标缺口，不排选项。
      example: 只说参加，却多出为了获奖，要另查获奖目的。
      example_scope: 关系/结构示意，非完整试题，不计真题或已验案例。
      micro_action_is_not_completion: 完成第一小步不等于完整方法成功；继续完成四步卡的判断与停止核验。
      short_stop: A没核实先不拆；B有支持不能排，排一项不证明另一项。
    presentation_revision: 2026-10-28.2
    source_update_note: 主客一致补观察/假设与语义施受边界；主语、时态、动静独立保名，不借七选五分组。期末两首一尾来源不覆盖三化入口。
  cases:
    canonical: cases/R01/canonical/case.yaml
    counterexample: cases/R01/counterexamples/case.yaml
    boundary: cases/R01/boundary/case.yaml
