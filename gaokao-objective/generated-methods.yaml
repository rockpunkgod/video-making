- method_id: R06
  brand_name: 主旨缺块
  source_name: 主旨缺失
  aliases:
  - 全文拼图
  - 核心块覆盖
  question_type: 阅读理解
  role: decider
  primary_role: decider
  secondary_roles: []
  output_type: decide
  student_symptoms:
  - 主旨题总在两个相关选项之间摇摆。
  - 容易选范围最大、词频最高或只概括一部分的选项。
  trigger_cues:
  - 题干问全文主旨、写作目的或最佳标题。
  - 多个候选都与全文相关，差别在遗漏核心块、扩大范围或换了块之间的关系。
  core_action: 先把全文压成 2–4 个不可缺核心块 A+B+C，再用候选逐块拼图。
  decision_rule: 候选要覆盖全文核心组合，同时不新增、替换或扭曲核心块之间的关系。
  verification: '由题干与候选共同概念形成待验主题，不立即定案。

    回文核对开头、结尾和各段首句，识别 2–4 个贯穿核心块及其关系。

    把每个候选拆成谈什么与作什么判断，标注缺块、多块或错关系。

    对最终候选回查全文覆盖，说明没有遗漏哪些核心块。'
  stop_rule: 范围大，不等于主旨对。
  common_wrong_instinct: 把抽象、范围大、包含其他选项或出现段数多当作正确主旨。
  failure_cases:
  - 明确局部细节题或某一段事实题不使用全文拼图。
  - 文章主要段落缺失时无法建立完整核心组合，应停止而不补造。
  counterexamples:
  - 候选覆盖的词更多，但把原文的对比改成因果，仍应排除。
  - 候选字面较短，但用上位概念准确覆盖 A+B+C 且关系正确，不能因词少排除。
  transfer_pattern: 可迁移到全文主旨、写作目的和最佳标题中的覆盖—关系双重检查。
  memory_line: 先拼齐核心块，再查块间关系。
  anti_rule: 范围最大 ≠ 主旨。
  visual_formula: '全文：A + B + C

    候选1：A + B       → 缺 C

    候选2：A + B + C   → 再查关系

    候选3：A + C       → 关系被换'
  challenge_prompt: 先不选主旨，用三个短语写出全文不能少的核心块，再标注每个选项缺了哪块或换了什么关系。
  source_references:
  - repository: https://github.com/rockpunkgod/ANSWER.git
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
