    90s: '当主要段落齐全，任务是全文主题、态度、结构或长文框架时，才启动三步压文。首尾段、段首句和重复词只负责取证，最后产物必须是对象+核心判断+全文任务的骨架卡。反例是：某个背景词反复出现，但作者真正要论证的是它引发的变化；只抄高频词会缺掉核心判断。另一个反例是首段只铺背景，真正判断在后文，所以段首不等于中心句。这个方法的职责是建框架，不直接选答案。


