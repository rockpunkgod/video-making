  - 空前空后证据尚未闭合
  trigger_cues:
  - 当前空要核前后提示，近处不足才需更远上下文。
  core_action: 圈两侧对象、动作、评价、时间及候选额外前提；近处够则回填，不够写缺口并向真实复现、回答、结果或评价扩。
  decision_rule: 产出线索与候选的实际联系和回填核验；多个线索一并核，不只截支持初选的一处。
  verification: 产出线索与候选的实际联系和回填核验；多个线索一并核，不只截支持初选的一处。 仍不足就暂留，找到独立提示后返回，不强制原空号；相邻待定空、已占项或先报答案不互证。
  stop_rule: 仍不足就暂留，找到独立提示后返回，不强制原空号；相邻待定空、已占项或先报答案不互证。
  common_wrong_instinct: 只看空后半句或自己猜定的相邻空，拼出一个看似合理的理由就停止找证据。
  failure_cases:
  - 只看空后半句或自己猜定的相邻空，拼出一个看似合理的理由就停止找证据。
  - 仍不足就暂留，找到独立提示后返回，不强制原空号；相邻待定空、已占项或先报答案不互证。
  counterexamples:
  - 当前空和相邻空都未确定，却各自依赖对方猜出的含义；两空互相顺口不形成独立题面证据。
  transfer_pattern: 新篇仍核两侧实际提示与候选要求，不把左右句数固定，也不借未证空位答案。
  memory_line: 圈两侧对象、动作、评价、时间及候选额外前提；近处够则回填，不够写缺口并向真实复现、回答、结果或评价扩。
  anti_rule: 相邻已填 ≠ 独立证据。
  visual_formula: "空前：谁/动作/时间\n      ↘ 候选 ↙\n空后：对象/评价/结果\n足够 → 回填核验（verify）\n不足 →\
    \ 扩证/暂留；不以猜空互证"
  challenge_prompt: 先不填，圈本空前后各一条实际提示，写它们分别约束哪个对象或关系；没有就标缺口而不是借相邻答案。
