  core_action: 只标学生自写的第1/5/6/9/10句功能，写清衔接、桥接、解决与回扣，不算给定首句
  decision_rule: 用1/5/6/9/10五个参考功能位核即时反应、段间桥接、第二段接续、冲突解决、主题回扣；映射学生自写内容的功能，不以句数判分。
  verification: 只标学生自写的第1/5/6/9/10句功能，写清衔接、桥接、解决与回扣，不算给定首句。用1/5/6/9/10五个参考功能位核即时反应、段间桥接、第二段接续、冲突解决、主题回扣；映射学生自写内容的功能，不以句数判分。
    给定首句不计学生十句，未抄首句正常；实际不是十句时按功能映射，不为凑数删合理内容。缺原文或首句不判完整衔接，独立升华句非必需。
  stop_rule: 给定首句不计学生十句，未抄首句正常；实际不是十句时按功能映射，不为凑数删合理内容。缺原文或首句不判完整衔接，独立升华句非必需。
  common_wrong_instinct: 只记十句模板，觉得第九句有结果就代表核心矛盾已经解决。
  failure_cases:
  - 只记十句模板，觉得第九句有结果就代表核心矛盾已经解决。
  - 给定首句不计学生十句，未抄首句正常；实际不是十句时按功能映射，不为凑数删合理内容。缺原文或首句不判完整衔接，独立升华句非必需。
  counterexamples:
  - 十一句但桥接、解决、回应均成立，不因多一句扣分；第九句只交代次要事件而核心矛盾未解，不能按句位宣布完成。此为功能示意，不是真题。
  transfer_pattern: 换剧情仍核五项功能，句数和具体动作随故事调整。
