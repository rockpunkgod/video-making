- method_id: W02
  brand_name: 十句五锚
  source_name: 十句五定法
  aliases:
  - 十句五定法
  question_type: 读后续写
  method_type: framework
  role: framework
  primary_role: framework
  secondary_roles: []
  output_type: interpret
  student_symptoms:
  - 需要搭两段功能提纲或诊断桥接
  trigger_cues:
  - 两段开头语和原文齐全，需要检查实际自写内容的功能衔接。
  core_action: 先标自写两段开头、第一段末、结局与收束五个功能位；采用自写十句时才对应1/5/6/9/10。
  decision_rule: 按真实位置核接首句、必要段间桥接、冲突解决和主题回应；产出功能缺口，不按编号评分。
  verification: 按真实位置核接首句、必要段间桥接、冲突解决和主题回应；产出功能缺口，不按编号评分。 句数不同按现稿映射，不凑十句；给定首句不要求重抄；已衔接就不重述或补可省过渡。
  stop_rule: 句数不同按现稿映射，不凑十句；给定首句不要求重抄；已衔接就不重述或补可省过渡。
  common_wrong_instinct: 只记十句模板，觉得第九句有结果就代表核心矛盾已经解决。
  failure_cases:
  - 只记十句模板，觉得第九句有结果就代表核心矛盾已经解决。
  - 句数不同按现稿映射，不凑十句；给定首句不要求重抄；已衔接就不重述或补可省过渡。
  counterexamples:
  - 十一句但桥接、解决、回应均成立，不因多一句扣分；第九句只交代次要事件而核心矛盾未解，不能按句位宣布完成。此为功能示意，不是真题。
  transfer_pattern: 换剧情仍核五项功能，句数和具体动作随故事调整。
  memory_line: 先查五个功能，十句只是可选句位。
  anti_rule: 十句齐 ≠ 功能齐。
  visual_formula: '实际自写位置 → 接首句 / 搭桥 / 接第二首句 / 解决 / 回应

    采用十句 → 可映射1/5/6/9/10

    句数不同 → 仍查功能，不凑数

    给定首句不必重抄'
  challenge_prompt: 先不写全文，在实际提纲上标五个功能位置；若选十句框架，再对应1/5/6/9/10，指出哪座桥确实必要。
  source_references:
