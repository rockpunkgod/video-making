  entry_copy: '两个选项都像原文时，先别比哪个读起来更顺。第一眼看候选是不是比原文多了人、目的、原因、范围、时间或确定程度。把它拆成原文已经说的 A
    和后来多出的 B，只回文查 B。B 无直接也无间接依据才排除。B 能由事实、数量或上下文合理推出时必须停，不能因没有原词就排。换题材后仍然可以重复 A+B→只查
    B。


    你可以直接说：这个选项在加戏，我只查它多出的那一截。'
