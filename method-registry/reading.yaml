methods:
  - method_id: R01
    brand_name: 选项加戏
    source_name: 过度推测
    aliases: [A+B检查, 查新增]
    question_type: 阅读理解
    role: decider
    primary_role: decider
    secondary_roles: []
    output_type: decide
    student_symptoms:
      - 两个选项都像原文，找到定位句仍无法区分。
      - 选项前半句能对上，但整项是否成立拿不准。
    trigger_cues:
      - 候选核心与原文对应，但又多出参与者、目的、用途、时间、范围、因果或确定程度。
      - 原文是部分、多数、可能或具体行为，候选把它扩大为全部、必然或特定目的。
    core_action: 把候选拆成原文已有内容 A 加新增内容 B。
    decision_rule: 只核 B 是否存在直接或间接文本依据；B 无依据才排除。
    verification:
      - 回到定位句和必要上下文，标出 A 的对应。
      - 单独列出 B 改变的对象、关系、范围、时间或强度。
      - 搜索直接陈述或由事实、数量与上下文构成的间接支持。
      - 排除后仍对保留项做正向核对，不以剩一项代替证明。
    stop_rule: 没逐字出现，不等于没有依据。
    common_wrong_instinct: 看到 A 正确，就默认 A+B 整项正确。
    failure_cases:
      - 候选与原文没有可确认的共同核心 A，不应强行拆分。
      - 题干本身要求合理推断时，仍需按题干范围判定间接支持。
      - 方法只排除一个加戏项时，不能自动证明其他项。
    counterexamples:
      - 候选虽未逐字出现，但原文事实或数量关系已对 B 构成充分间接支持，不得以加戏排除。
      - 候选含绝对词，但原文的确给出全称或必然关系，绝对词本身不构成错误。
    transfer_pattern: 适用于不同题材中的目的、因果、参与者、时间、范围、程度和确定性扩写检查。
    memory_line: 原文 A，选项 A+B，只查 B。
    anti_rule: 绝对词 ≠ 必错。
    visual_formula: |-
      原文：A
           ↓
      候选：A + B
                 ↑
              只查这里
    challenge_prompt: 先不要选答案，只找出哪个选项比原文多说了一部分，并指出多出的内容。
    source_references:
      - repository: https://github.com/rockpunkgod/ANSWER.git
        commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
        path: gaokao-english/references/reading-comprehension.md
        heading: 过度推测
      - repository: https://github.com/rockpunkgod/ANSWER.git
        commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
        path: gaokao-english/references/course-evidence.md
        heading: 其他已激活阅读方法
    can_follow: [跳读定位, 同源替换, R09]
    usually_before: [正向验证]
    usually_after: [定位与必要上下文核对]
    conflicts_with: []
    cannot_replace: [定位, 主旨建模, 保留项正向验证]
    levels:
      L1: 识别候选中明显新增的词语或人物。
      L2: 识别新增的原因、目的或用途。
      L3: 识别范围、程度、时间和确定性的变化。
      L4: 区分无依据扩写与有事实、数量或上下文支持的间接推断。
    compact:
      line: 原文 A，选项 A+B，只查 B。
      boundary: 这句只是检查动作，必须回文判定 B 是否有直接或间接依据。
    full:
      summary: 保留候选与原文的共同核心，仅对新增断言求证；只有无直接也无间接支持时才排除。
      boundaries: [不做原词匹配, 不把绝对词机械判错, 不由排除一项推出剩余项正确]
    cases:
      canonical: cases/R01/canonical/case.yaml
      counterexample: cases/R01/counterexamples/case.yaml
      boundary: cases/R01/boundary/case.yaml
      transfer: cases/R01/transfer/case.yaml
    four_step_card:
      start: 两个选项都像原文，其中一个比原文多说一截。
      first_cut: 把该选项圈成原文已有 A 和新增 B。
      judge: 只回文核 B；无直接也无间接依据才排除。
      stop: B 有合理文本支持时，不得以没原词为由继续排除。
    practicality_gate:
      status: design_complete_empirical_pending
      trigger: 可从候选相对原文多出的参与者、目的、范围、时间、因果或确定性识别，不依赖答案。
      action: 圈出候选共同核心 A，下划新增 B，只对 B 回文求证。
      output: decide；对当前加戏候选作有依据排除或保留，不自动定其他项。
      stop: 找到 B 的直接或间接支持，或无法分出稳定 A 时停止。
      transfer: A+B 拆分可迁移到任何题材的断言扩写检查。
      efficiency: 把整项反复比较缩成只查 B，减少比较维度和犹豫。
      misuse_cost: high；把没原词当无依据会直接误排正确项，因此 Trigger 必须有明确 B，Stop 必须核间接支持。
    first_use_test:
      status: designed_not_run
      trigger_success: null
      action_success: null
      evidence_success: null
      stop_rule_success: null
      no_answer_backfit: null
      final_result: pending_real_student_test
    evaluation:
      baseline: 逐项阅读+全断言并行比较+常规排除
      trigger_precision: null
      trigger_recall: null
      resolution_rate: null
      standalone_rate: null
      assist_rate: null
      false_trigger_rate: null
      transfer_rate: null
      time_complexity_gain: null
      primary_benefit_hypothesis: 减少候选比较维度，提高对无依据扩写的检出率。
    usefulness_level: Useful
    status: candidate
    version: 1.0.0

  - method_id: R02
    brand_name: 谁干的陷阱
    source_name: 主客一致
    aliases: [三槽位核对, 谁做什么对谁]
    question_type: 阅读理解
    role: decider
    primary_role: decider
    secondary_roles: []
    output_type: decide
    student_symptoms:
      - 原文和选项关键词一样，但关系总判错。
      - 容易把愿望当事实、把能力当意愿，或把动作发出者和承受者调换。
    trigger_cues:
      - 谁想做与谁真正做了之间可能被偷换。
      - 谁有能力与谁有意愿之间可能被偷换。
      - 谁发出动作与动作指向谁之间可能被偷换。
    core_action: 把原文和候选都填进谁 → 做什么 → 对谁三个槽位。
    decision_rule: 原文与候选任一槽位发生无依据交换，或愿望/事实、能力/意愿被混同，才排除。
    verification:
      - 保留原文和候选的完整谓语，分别填写三槽位。
      - 核对每个人物是愿望、能力、看法，还是已发生事实。
      - 题干问实际或直接结果时，只认已发生的对应事实。
      - 若三槽位一致，再核范围、否定、时间和其他候选差异。
    stop_rule: 关键词一样，不代表动作关系一样。
    common_wrong_instinct: 只看人名和动词出现过，不核谁发出、谁承受以及动作是否已发生。
    failure_cases:
      - 题面没有可比的主体、施受或愿望/事实差异时，本法不单独定案。
      - 通过本检查只证明槽位未偷换，不证明范围、因果或程度正确。
    counterexamples:
      - 主体未在候选里重复，但题干已明示共同对象；不能仅因候选没重复主体就判错。
      - 原文确实说某主体具有能力且表达意愿，两者同时成立，不得为了应用方法强行二分。
    transfer_pattern: 适用于人物观点、机构措施、研究发现、主动/被动和多参与者事件。
    memory_line: 谁，做什么，对谁。
    anti_rule: 同词 ≠ 同关系。
    visual_formula: |-
      原文：谁 ─动作→ 对谁
      候选：谁 ─动作→ 对谁
              逐槽对齐，不许换位
    challenge_prompt: 先不判选项，把原文和候选各自写成谁、做什么、对谁，再圈出变了的槽位。
    source_references:
      - repository: https://github.com/rockpunkgod/ANSWER.git
        commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
        path: gaokao-english/references/reading-comprehension.md
        heading: 主客一致
      - repository: https://github.com/rockpunkgod/ANSWER.git
        commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
        path: gaokao-english/references/course-evidence.md
        heading: 主客一致
    can_follow: [跳读定位, 代词指代, 逻辑简化]
    usually_before: [正向验证]
    usually_after: [定位到完整谓语]
    conflicts_with: []
    cannot_replace: [范围核对, 因果核对, 保留项正向验证]
    levels:
      L1: 识别明显的动作发出者和承受者。
      L2: 区分愿望与已发生事实。
      L3: 区分能力、意愿、看法和实际结果。
      L4: 处理省略主体、代词、被动和多参与者的间接关系。
    compact:
      line: 谁→做什么→对谁，三格对不上才排。
      boundary: 同关键词只是入口，三槽位一致也只通过本项检查。
    full:
      summary: 核对愿望/事实、能力/意愿与施事/受事，只在题面出现可比差异时使用。
      boundaries: [不自行扩写施受关系, 不由能力推出意愿, 不由愿望推出已实现]
    cases:
      canonical: cases/R02/canonical/case.yaml
      counterexample: cases/R02/counterexamples/case.yaml
      boundary: cases/R02/boundary/case.yaml
      transfer: cases/R02/transfer/case.yaml
    four_step_card:
      start: 原文和选项有同样的人物与动词，但可能把愿望、能力、事实或施受关系换了。
      first_cut: 把两句各自填成谁→做什么→对谁。
      judge: 三格任一格无依据换位，或愿望/事实、能力/意愿被混同，才排除。
      stop: 三格对齐后就停止本法；它不证明范围、因果或程度正确。
    practicality_gate:
      status: design_complete_empirical_pending
      trigger: 可由多主体、愿望/事实、能力/意愿或主动/被动差异触发。
      action: 圈主体，下划完整谓语，用箭头连到承受者，再两句对齐。
      output: decide；对关系偷换项作排除或保留，仅解决主客关系差异。
      stop: 无可比关系差异，或三槽位已对齐时停止。
      transfer: 三槽位可迁移到人物、机构、研究和被动句。
      efficiency: 把含多人物的长句缩成三格，降低代词与施受关系的工作记忆负担。
      misuse_cost: high；无换位时强套会虚构关系，所以必须有可观察主体或施受差异。
    first_use_test:
      status: designed_not_run
      trigger_success: null
      action_success: null
      evidence_success: null
      stop_rule_success: null
      no_answer_backfit: null
      final_result: pending_real_student_test
    evaluation:
      baseline: 整句翻译+凭语感比选项
      trigger_precision: null
      trigger_recall: null
      resolution_rate: null
      standalone_rate: null
      assist_rate: null
      false_trigger_rate: null
      transfer_rate: null
      time_complexity_gain: null
      primary_benefit_hypothesis: 提高主体、动作、对象与事实状态的对齐准确率。
    usefulness_level: Useful
    status: candidate
    version: 1.0.0

  - method_id: R06
    brand_name: 主旨缺块
    source_name: 主旨缺失
    aliases: [全文拼图, 核心块覆盖]
    question_type: 阅读理解
    role: decider
    primary_role: decider
    secondary_roles: []
    output_type: decide
    student_symptoms:
      - 主旨题总在两个相关选项之间摇摆。
      - 容易选范围最大、词频最高或只概括一部分的选项。
    trigger_cues:
      - 题干问全文主旨、写作目的或最佳标题。
      - 多个候选都与全文相关，差别在遗漏核心块、扩大范围或换了块之间的关系。
    core_action: 先把全文压成 2–4 个不可缺核心块 A+B+C，再用候选逐块拼图。
    decision_rule: 候选要覆盖全文核心组合，同时不新增、替换或扭曲核心块之间的关系。
    verification:
      - 由题干与候选共同概念形成待验主题，不立即定案。
      - 回文核对开头、结尾和各段首句，识别 2–4 个贯穿核心块及其关系。
      - 把每个候选拆成谈什么与作什么判断，标注缺块、多块或错关系。
      - 对最终候选回查全文覆盖，说明没有遗漏哪些核心块。
    stop_rule: 范围大，不等于主旨对。
    common_wrong_instinct: 把抽象、范围大、包含其他选项或出现段数多当作正确主旨。
    failure_cases:
      - 明确局部细节题或某一段事实题不使用全文拼图。
      - 文章主要段落缺失时无法建立完整核心组合，应停止而不补造。
    counterexamples:
      - 候选覆盖的词更多，但把原文的对比改成因果，仍应排除。
      - 候选字面较短，但用上位概念准确覆盖 A+B+C 且关系正确，不能因词少排除。
    transfer_pattern: 可迁移到全文主旨、写作目的和最佳标题中的覆盖—关系双重检查。
    memory_line: 先拼齐核心块，再查块间关系。
    anti_rule: 范围最大 ≠ 主旨。
    visual_formula: |-
      全文：A + B + C
      候选1：A + B       → 缺 C
      候选2：A + B + C   → 再查关系
      候选3：A + C       → 关系被换
    challenge_prompt: 先不选主旨，用三个短语写出全文不能少的核心块，再标注每个选项缺了哪块或换了什么关系。
    source_references:
      - repository: https://github.com/rockpunkgod/ANSWER.git
        commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
        path: gaokao-english/references/reading-comprehension.md
        heading: 主旨缺失
      - repository: https://github.com/rockpunkgod/ANSWER.git
        commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
        path: gaokao-english/references/course-evidence.md
        heading: 其他已激活阅读方法
    can_follow: [R09, mainly题与主旨大意]
    usually_before: [最终全文覆盖回查]
    usually_after: [R09]
    conflicts_with: []
    cannot_replace: [局部细节核对, 全文取证, 错误关系检查]
    levels:
      L1: 识别明显只覆盖一段的候选。
      L2: 把全文压成 2–4 个核心块并比较覆盖。
      L3: 区分缺块、扩大范围和换属性。
      L4: 在覆盖齐全时继续核对对比、因果、变化等块间关系。
    compact:
      line: 全文先拼 A+B+C，主旨要不缺块也不换关系。
      boundary: 拼图只用于全文主旨、目的或标题任务，不用于明确细节题。
    full:
      summary: 用开头、结尾和各段首句验证核心组合，再比较候选的覆盖与完整判断。
      boundaries: [重复词不定案, 范围大不定案, 包含其他候选不定案, 指出以偏概全时必须说明遗漏块]
    cases:
      canonical: cases/R06/canonical/case.yaml
      counterexample: cases/R06/counterexamples/case.yaml
      boundary: cases/R06/boundary/case.yaml
      transfer: cases/R06/transfer/case.yaml
    four_step_card:
      start: 全文主旨、目的或标题题中，多个选项都相关却一直二选一。
      first_cut: 先写出全文 2–4 个不可缺核心块 A+B+C。
      judge: 对照候选是否缺块、多块或把块间关系换错。
      stop: 明确细节题、单段题或主要段落不全时停止。
    practicality_gate:
      status: design_complete_empirical_pending
      trigger: 只由全文主旨、写作目的或最佳标题任务触发。
      action: 从开头、结尾和各段主要任务提取 2–4 块，再给候选标缺块/多块/错关系。
      output: decide；用覆盖与关系排除主旨干扰项。
      stop: 题干范围不是全文，或无法建立可验核心块时停止。
      transfer: 核心块覆盖+块间关系可迁移到不同文体的全文概括。
      efficiency: 把多个抽象选项转成少量核心块对照，减少反复回文和范围犹豫。
      misuse_cost: high；核心块提错会系统性误判，因此必须先由全文取证而不是从候选倒推。
    first_use_test:
      status: designed_not_run
      trigger_success: null
      action_success: null
      evidence_success: null
      stop_rule_success: null
      no_answer_backfit: null
      final_result: pending_real_student_test
    evaluation:
      baseline: 逐项凭相关性和抽象程度判断
      trigger_precision: null
      trigger_recall: null
      resolution_rate: null
      standalone_rate: null
      assist_rate: null
      false_trigger_rate: null
      transfer_rate: null
      time_complexity_gain: null
      primary_benefit_hypothesis: 提高全文覆盖与关系完整性，降低以偏概全和范围贪大。
    usefulness_level: Useful
    status: candidate
    version: 1.0.0

  - method_id: R09
    brand_name: 三步压文
    source_name: 三化法
    aliases: [对象-判断-结构, 全文压缩]
    question_type: 阅读理解
    role: framework
    primary_role: framework
    secondary_roles: []
    output_type: interpret
    student_symptoms:
      - 长文读完只记得零散事实，说不出全文在完成什么任务。
      - 主旨题只会数重复词或抄段首句，无法形成完整主题判断。
    trigger_cues:
      - 主要段落齐备，任务是全文主题、态度、主体结构、最佳标题或长文框架。
      - 候选相关但需要先弄清文章始终围绕谁/什么、作什么判断以及如何展开。
    core_action: 依次压出对象、核心判断和全文结构任务。
    decision_rule: 只有对象+核心判断+全文任务同时得到全文取证，才形成可供主旨判断的框架。
    verification:
      - 先从题干与主旨选项提出待验假设。
      - 用有效首尾段、中间段首句及必要展开取证；重复词只是可选入口。
      - 压对象：全文主要一直围绕谁或什么问题。
      - 压判断：作者主要在说它怎样、为什么或发生什么变化。
      - 压结构：判定解释、对比、问题—答案、变化、论证或分类等实际全文任务。
      - 回全文检查没有丢失否定、范围、条件、态度和关系。
    stop_rule: 词频高，不等于主题完整。
    common_wrong_instinct: 找到重复词或首尾句就停，没有压出作者对对象的核心判断和全文任务。
    failure_cases:
      - 局部事实、明确单段题或主要段落缺失时不启动全文框架。
      - 段首是背景或设问时，必须继续看段尾、回答与展开，不能把入口当阅读上限。
    counterexamples:
      - 某词全文高频，但它只是背景对象，未表达核心判断；仅凭词频不能定主旨。
      - 首段只引入背景，真正判断在后文展开；不能把首段话题直接当全文任务。
