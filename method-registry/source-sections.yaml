  57bc90ecca1e951c:
    path: gaokao-english/references/course-evidence.md
    heading: 方法名与批注的核查
    line_start: 29
    line_end: 36
    content: '## 方法名与批注的核查


      方法名须结合对应题型的独立技巧说明或明确口述定义确认。不能把选项旁的诊断标签、例题结论、题型名称或系列课标题直接升级为独立解法；也不能因一个技巧曾出现在批注里，就否认其另有明确的方法说明。


      2026-10-11首轮核查开明致学120份DOCX、18份PDF的可提取文本及仓库随包语料，确认所查题后“主旨缺失”批注承担排除诊断、“完形语篇逻辑破译”为系列标题；不能据这些批注否认其他课程有主旨缺失专门说明。后续全面规则核查已实看6个扫描PDF页，并直接解析此前未解析的1份旧DOC；关键DOCX定义回查原始正文XML。10份Word的24个嵌入媒体未全量视觉复查。首轮旧原视频与蒸馏目录不可用，后续已找回G盘旧蒸馏并取得D盘新视频，具体范围见末尾补记，仍不宣称全材料逐字审阅或全课程音画复核完成。后文早期“待接”是当时状态，若有后续续接记录以该记录更新覆盖状态；音轨接到尾不等于全部语义、答案链或全方法验收。


      保留条目有独立于选项批注的支持：主客一致见26S春第1讲正文课题；同源替换见11.10高三秋季第13次讲义独立标题及“名词定位，动词逻辑”；并列删除见9.16高三秋季第4次讲义“技巧：并列删除”；逻辑简化与因果选果见26S秋季第9讲独立定义；例子非答案见26S秋季第3讲原则说明；三化法见春季主旨大意讲义的三项化简说明。比较级谨慎选、阅读代词指代保留既有规则页记录，讲义中的“比较级谨慎选择”“代词先还原”作补充，不以七选五同名指代段落替代阅读命名证据。七选五三一致、总起句、对应词、逻辑关系、褒贬一致及完形瞻前顾后继续使用各自已登记的对应题型规则证据；本次未发现第二个仅靠排除批注登记的独立方法，不据此宣布全部适用边界已重新验收。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
