  4a9de82ef9741f92:
    path: gaokao-english/references/seven-five.md
    heading: 单复一致
    line_start: 61
    line_end: 64
    content: '### 单复一致


      本题型独立原名，身份为指代／概括对象的一致性检查。候选与正文在单复数上形成真实差异时，先还原具体所指与概括范围，再核数及两侧内容；单复形式只缩小范围。复数事物可由单数概括性名词承接，是否成立看它实际概括的是哪一组内容，不能机械同形。它不增加开头第四维分组，也不新增整题流程；名称不能因动作已包含在对应词和主体核对中而删除。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  3a67ea5d2919e50c:
    path: gaokao-english/references/seven-five.md
    heading: 逻辑判断内容关联
    line_start: 65
    line_end: 75
    content: '### 逻辑判断内容关联


      七选五课程独立原名及功能说明。对应的已验操作为分析选项、浏览结构、回原文用逻辑与内容双核：先照既定三一致一次分组，再带实际区别找突破口，比较连接关系及它连接的具体主体、动作与范围。逻辑通顺但内容不接、内容相关但关系相反，都不能定案。本名与逻辑关系法分别保留，不因操作相关就合名，也不据题名新增另一套固定整题顺序。


      - 话题一致：主体／核心话题延续的功能说法，按主语一致小节核真实对象与动作，不只看语法主语。

      - 小词突破：查核入口说法，从有区分度的候选线索找容易验证的空，再回正文；少数组或小词本身不定案。

      - 大胆假设、小心求证：课堂求证表达，先形成暂定候选，再按具体内容确认或改选，占项和排剩不能代替证据。

      - 积极跳读法：赠25口头操作名，按当前所需内容线索跳读查关联；不借阅读专门版本的前提或另造七选五整题流程。

      - 框架：覆盖辅助说法，核概括表达实际管辖的内容范围，不以概括性直接选。

      - 包含：覆盖辅助说法，核当前候选是否真实承接全部所需内容，不借阅读大词原则或据范围大定案。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  be3f1c1eb7c11ee7:
    path: gaokao-english/references/seven-five.md
    heading: 主语一致
    line_start: 76
    line_end: 85
    content: '## 主语一致


      触发：候选的语法主语、核心话题、指代或祈使句的省略行动者可形成相关组。


      快判：开头先扫候选主体并暂定分组，再回正文还原当前核心人、物或概念。正文新线索改变指代或核心话题时，调整当前候选的优先级并继续核内容；发现漏纳或指代初筛错误可内部更正，在当前比较中自然说明，不重新展示完整三一致分组。共同主体或同一代词仍须比较“谁对什么做什么”。


      执行链：须按“候选主体归组、回文确认当前主体与对象、比较同组候选的动作与段落推进”的依赖给出可核依据。开头三维分组仍须落到字母完整展示；开头之后的逐空过程只展示影响定案的组和实质差别，不重复完整主体表。


      边界：课程中的“主语”不只指语法主语，宾语代词也可能承接核心话题；多个祈使句虽共享行动者，也可能针对不同对象。只证明相关而未接通具体内容时暂留。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  13b2d5c88710b11a:
    path: gaokao-english/references/seven-five.md
    heading: 时态一致
    line_start: 86
    line_end: 95
    content: '## 时态一致


      触发：候选中真正承担时间关系的谓语可形成主要时态或时间关系组。


      快判：开头先找真谓语并暂定时间组，再回正文确认当前事件的局部时间线。完成时、情态形式及看似过去式的形式先核句中作用，非谓语词形不承担句子时态；正文出现新的时间或事件转换线索时，调整当前候选的优先级并继续核内容；发现漏纳或真谓语初筛错误可内部更正，在当前比较中自然说明，不重新展示完整三一致分组。候选谓语无明显差异时，可用时间状语回文查找对应阶段，但它仍是待核线索。


      执行链：须按“真谓语归组、回文确认局部时间线、比较同组候选的主体、动作、指代、评价和两侧内容”的依赖给出可核依据。开头三维分组仍须落到字母完整展示；开头之后的逐空过程只展示影响定案的时间组和实质差别，不重复全部谓语表。


      边界：课程说同一事件或主题中通常保持一致，不是整篇表面时态相同。一般情况、具体经历和经历后的感悟可以属于不同层次；实际事件顺序和时间切换优先。同一时间组仍有多个候选时，必须在组内比较主体、动作、指代、评价及两侧内容，不能只把其中一项与异组候选比较后定案。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  d815465ca190a14f:
    path: gaokao-english/references/seven-five.md
    heading: 逻辑关系法
    line_start: 96
    line_end: 108
    content: '## 逻辑关系法


      触发：候选或正文存在转折/对比、因果、并列/递进、例证、问题—措施或时间/顺序关系。


      快判：把标志与两侧完整内容一起读，明确前后各说什么、关系方向是什么。没有显式连接词时，也要看前后句是在转折、并列、递进、解释、例证还是总结。多个标志共存时不能只取一个；同连接词候选先视为同组，再比较主体、动作、对象和范围。


      必要分支：


      - 否定“只做某事”不等于完全禁止它。前文明确说某种方式不是唯一方式、当前位置要求接出另一种方式时，原方式的另一个作用不能冒充另一种方式。

      - 例子必须实际支持对应观点，不机械要求抽象句或具体句。

      - 问题—措施还要核行动时点；事前准备不能由事后补救替代。时间词必须连同真实事件关系理解。

      - 只接上前句而与后句限制冲突不能定案；两侧都成立后再核段落任务。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  a3ba542eeb862762:
    path: gaokao-english/references/seven-five.md
    heading: 褒贬一致
    line_start: 109
    line_end: 116
    content: '## 褒贬一致


      触发：前后或候选有明确肯定、否定、评价方向，或转折改变评价方向。


      快判：先读完整命题及否定范围，再判断候选是在陈述困难、否定价值、提出帮助还是评价结果。方向相同的候选继续比较对象、具体处境、措施和句间功能。


      边界：中性描述不强分褒贬；含负面处境的句子可能是在说明改善办法，含否定形式也可能表达肯定意义。担忧后的回应与直接赞美处境不同。另一空使用了竞争项，不能替代当前空证据。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  bc08120bdb403da0:
    path: gaokao-english/references/seven-five.md
    heading: 整篇与现场输出
    line_start: 117
    line_end: 120
    content: '## 整篇与现场输出


      整篇七选五只启用本篇各空实际触发的七法，不把主体、时态、结构三一致机械用于每个空。整篇开头统一完成并展示一次三一致初筛，单题则在该题开头完成并展示一次，随后回正文和实际触发的方法；内部初筛错误允许更正，在当前比较中自然说明，不在每个新线索或每个空后向学生重演完整分组。形式一致、同词、位置或时态只能缩小范围，不能因某组选项较少、已占用或只剩一项自动定案。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  c8a128adb1c07e71:
    path: gaokao-english/references/seven-five.md
    heading: 定案与输出
    line_start: 121
    line_end: 127
    content: '## 定案与输出


      自然点明本题实际调用的课程方法，说明已核验分支中的实际检查、决定性内容关系和选出或排除结论；没有实际调用的名称不为逐题报方法而凑用。开头三维分组落到字母的展示不得省略；开头之后的逐空过程，初筛提示只在它确实构成关键判据，或解释暂留有必要时写出。


      按实际使用方法下的执行链或核对，展开影响定案的候选缩小、回文确认和实质差别。输出用自然口述推进，不排成整齐的固定分组表、模板标题或机械编号；不穷举无关候选，也不复述私人思维。三一致的完整分组只在开头交代一次，后面直接说正文怎样把候选留下或排掉；初筛有误时在当前比较中说明更正及依据，不重演完整分组。


      只排除一项不能据剩余项自动定案。若多个候选仍通过，说明具体缺口并暂留。整篇完成后按课程“排除项分析”回查未选候选的内容承接与断言范围；仍难排时返回可能对应的已填位置。此核对必须执行，但不要求向学生逐项展示全部分组和排除过程。

      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  132f42a2b5680a23:
    path: gaokao-english/SKILL.md
    heading: 入口契约
    line_start: 1
    line_end: 7
    content: '---

      name: gaokao-english

      description: 高考英语阅读理解、七选五、完形填空及已核听力职责与训练答疑。只使用本 Skill 中由课程原始材料核验的方法，从当前题面证据现场讲题；方法问答保留课程原名及适用边界。分析类方法先点明再展示动作，固定判据类技巧直接点明。未覆盖、证据不足、版本冲突或材料不清时说明具体缺口。语法填空走
      gaokao-grammar-fill，应用文与读后续写走 gaokao-writing。

      ---


      # 高考英语课程答疑


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  21afe640717014fd:
    path: gaokao-english/SKILL.md
    heading: 不可越过的边界
    line_start: 8
    line_end: 23
    content: '## 不可越过的边界


      教学事实只来自`references/course-evidence.md`登记的课程证据与各题型模块。旧版 Skill、通用经验、答案键和模型常识都不能替代课程证据。


      教学层决定方法叫什么、何时触发、怎样比较以及何时不能定案；交付层负责把判断过程和结论按课程顺序讲给学生，不能补步骤、改条件、扩范围或解决课程内部冲突。


      不得把文件名当方法证据，选项旁的判项批注和排除理由不自动构成方法名，课程系列标题也不能当作单题解法；方法命名须有对应题型的独立技巧说明或明确口述定义。不得把单个例题事实升级为普遍规则，不得给课程没有命名的操作自创方法名，不得静默合并不同版本。例题只用于核验可迁移动作和条件分支；处理新题时只使用当前题面的证据，不搬入蒸馏底稿中的答案、题材、固定词对、口误或单题捷径。


      名称按证据中承担的功能处理：篇章主题词用于形成或核验框架，图像联想用于辅助定位，干扰项类型用于说明候选哪里不成立，口诀或比喻用于帮助记忆，系列标题用于标明课程内容；这些身份不自动等于独立解题算法。课程有专门说明页或口头定义的名称不能因用语口语化就否认其来源，但是否独立调用仍以本模块激活状态、可执行动作与边界为准。判项说法须还原成当前题的对象、动作、关系或新增限定，再核题面证据，不能只报标签或口号定答案。主旨缺失虽另有课程专门说明，按用户指定继续作为诊断及主旨覆盖核对处理，不重新单列方法。


      面对整篇新文章，先按题面路由到对应题型，再逐题判断当前文章实际触发的已激活方法。只调用有触发条件且能解决当前候选差异的方法，未触发的方法不为覆盖方法表而调用，题型之间也不得借用同名或相似操作。每个实际调用的方法仍须完成其模块规定的证据核对，证据足够即停，证据不足按该模块暂留、扩看或停止。整篇内部完成必要的全文或段落回查，学生端按原题号汇总，不逐项罗列未使用方法。


      目标是尽快锁定真正区分候选的题面关系，完成足够验证后停止。做题顺序按课程要求走：七选五按容易突破的先做；阅读 A、B 篇按题目顺序做，C、D 篇先主旨、后细节、后猜词；完形不强制固定空号顺序或两遍作答，按已核验课程职责及当前证据推进，疑难暂留，找到独立提示后返回并整体核查。阅读和七选五不任意重排，不把一个题型的顺序搬到别的题型，也不能先取答案再倒贴技巧。不得省略会改变答案的对象、主体、范围、否定、条件、比较、因果、时间或核对环节；也不要求在稿子里复刻课堂话术、报答先后或无关候选的逐项长讲。


      现场解题讲解感是最高交付优先级。七选五整篇先统一扫选项并做一次三一致暂定分组，单题则在该题开头做一次；阅读和完形按各自模块进入，只在当前题的实际竞争处比较候选，不套七选五的开头分组；随后指回题面、形成有依据的候选、按老师已核验的依赖顺序当场回文核对、比较竞争项，并在证据闭合后定案。输出要像老师边读边判断的自然口述，不排成过于整齐的标题、表格、固定编号或模板化步骤。暂定不等于答案，课堂中先出现的口头选项也不能代替新题证据。稿子里不能删掉必要的定位、比较、回文或核对动作。七选五的主体、时态、结构三一致只在开头分组一次，分组没有区分度的维度要如实标记，之后不重复机械展示，但允许按新证据纠正初筛误判，并在当前比较中说明变化；最终仍由当前空的内容关系和实际触发方法定案。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  1c5f3aeedb4c1b8d:
    path: gaokao-english/SKILL.md
    heading: 每次都要执行
    line_start: 24
    line_end: 38
    content: '## 每次都要执行


      先完整读取`references/delivery-contract.md`和`references/router.md`。


      按题面而不是文件名识别题型，只读取当前需要的一个模块：


      - 阅读理解读取`references/reading-comprehension.md`。

      - 七选五读取`references/seven-five.md`。

      - 完形填空读取`references/cloze.md`。

      - 听力读取`references/listening.md`。


      本 Skill 只处理这三类客观题和听力。学生拿来语法填空，说明不处理并交给`gaokao-grammar-fill`；拿来应用文或读后续写，交给`gaokao-writing`。不用本
      Skill 的解题方法硬套别的题型。


      学生询问课程依据、版本差异、方法是否为课程原名或未覆盖内容时，再读取`references/course-evidence.md`。不要把内部证据编号、置信度、冲突台账或核验过程写进学生答案。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  5d9c40d606617073:
    path: gaokao-english/SKILL.md
    heading: 决策顺序
    line_start: 39
    line_end: 54
    content: '## 决策顺序


      一，确认决定答案所需的原文、题干和选项完整清楚；关键内容看不清就指出位置并停止。


      二，确认请求范围。整篇处理整篇，单题只处理该题，方法请求只解释该方法。


      三，进入对应模块，检查方法的触发、前提和禁用条件。学生点名的方法不匹配时，不强套也不默换。


      学生点名判项说法、口诀或比喻时，先说明它在该题型中指的具体检查动作；对应动作已经核验的，可按该动作解释或演示，不误报为课程没有该说法，也不虚称在调用独立方法。其实际内容尚未核验时，只说明已确认含义与具体缺口，不凭名称补出通用流程。


      四，选择实际触发的已激活课程方法，抓首个有区别力的线索缩小范围，再核真正决定候选差异的对象、动作、关系或限制。证据足够即定案；证据不足则扩看、暂留或停止。多个方法确实联用时，分别说明各自解决什么差异。


      五，交付一份完整的现场讲解：按课程要求的做题顺序推进，阅读 A、B 篇顺题，C、D 篇按主旨、细节、猜词推进；七选五按突破口推进；完形按课程职责和实际证据推进，不强制固定空号或遍数，实际暂留与返回须讲清依据。每题从题面证据一步步走到结论，先看哪儿、看到什么、所以下一步查什么，查完给结论。**顺序本身要讲出来**，让学生听得出这一步为什么先做、下一步为什么接这个，不能默默按顺序走。分析类的方法先点明再展示动作，固定判据类的排除或选定技巧直接点明。方法只能定位或排除时，不据剩余项自动选，也不为展示过程补造固定步骤。整篇一次交完，结尾按原题号汇总一次。


      六，没有激活方法或现有证据不能唯一确定时，按`references/evidence-gaps.md`处理。已找到课程定义但尚未验收的名称，说明当前 Skill
      未激活及具体缺口，不误称课程没有该方法；不调用旧版规则或临时发明流程。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  51cc8242fc35fd50:
    path: gaokao-english/SKILL.md
    heading: 当前激活范围
    line_start: 55
    line_end: 72
    content: '## 当前激活范围


      阅读“大词原则”“大小原则”分别保留原名，已激活为真实语义包含竞争中的范围比较辅助，具体触发与动作见阅读模块各自小节；主旨及细节均可按所问范围核查，不以范围较大单独定案，也不借完形同名规则。


      阅读新增独立原名主语一致、时态一致、动静一致，分别核对应主体、时间与事实状态、变化／状态及具体属性；按阅读模块独立小节调用，不合名，也不借七选五三一致分组。主客一致另保意愿／事实和施受方向。语言冰山理论是解释框架，阅读理解基本流程与两首一尾定主题保期末课来源，不覆盖既定题序或三化入口。七选五单复一致是独立原称的一致性检查，逻辑判断内容关联是已核逻辑、内容双核原名，不增加开头分组维度或另造整题顺序。完形行文结构、首句完整定主题、组合口诀及无信靠主题等分别按结构认识、策略及回查提示处理，详各模块。


      阅读另补题干永远对、连连看、一一对应、最短逻辑、逻辑最近、图片定位法、构图定位法的已验辅助职责，按阅读模块各自入口使用；词义题两项原职责及其他课堂称呼也见该模块。七选五代词指代法的独立名称按对应词／主体中已验子动作解释，不新增第八运行法；完形复现等原称按完形模块的已验分支调用。名称补全不等于所有强口径激活，方法、诊断、口诀、训练和材料标题仍分清身份。


      - 阅读理解：已激活原名为主客一致、同源替换、比较级谨慎选、过度推测、因果选果、并列删除、例子非答案、三化法、代词指代和逻辑简化；课程材料另支持跳读定位、积极阅读法中的名词定出处、题文同序、动词定逻辑以及mainly题的主旨大意操作。阅读褒贬一致已验为标题/段意及对象评价、认知因果、词义方向三类有限候选的比较判据，须按阅读模块各自触发并回文核完整含义，不是独立整题算法；积极阅读中的褒贬定态度另有受限作者评价观察，两者分列。主旨类任务的三化入口按课程现场顺序执行：先读题干和主旨题选项形成假设，再看有效首尾段，最后看中间段首句；重复词缺失时跳过重复词观察，但不跳过首尾与段首核验。定位阅读法是应用文阅读课程题名，顺藤摸瓜、左顾右盼、中心思想是8.7讲义原名；名称各自保留，已验动作和未验强版本按阅读模块分开处理。阅读按题面任务分流，不按文体硬套方法；最终都须回原文确认。

      - 积极阅读法的重复定主旨：已受限支持主题及展开框架预判，按阅读模块核共同／反复概念、形成预期，再由正文实际展开验证和比较完整判断；不是三化法别名，不按词频或缺原词定案，不要求积极阅读各分支同时全用。

      - 积极阅读法的褒贬定态度：作者倾向任务中，评价来源可确认时，受限核所问对象／方面、完整评价及否定条件，再比方向与当前具体含义并回文求正向支持；方向不独自定案，不将实现未知等同态度模糊。不是标题／段意褒贬一致的别名，不整体拒绝已证观察，也不扩成所有态度词或复杂来源算法。

      - 记叙文全文主旨／标题：首段法、合并法、首尾呼应法已有受限操作，核心名词法已有反复主题对象观察辅助，按阅读模块触发；四项不是所有记叙题的固定入口，不规定固定顺序，也不要求每题全部调用。首段形成框架，核心名词形成待验主题，合并核段落主次，首尾整合两端真实信息，最终仍回全文比较候选覆盖；核心名词法可观察反复出现的原词或可确认的同义主题表达，词义、所指或覆盖无法确认时按具体缺口继续求证，不以未展示逐段扫描或计频整体拒绝已证观察。

      - 七选五：总起句做题法、结构一致、主语一致、时态一致、对应词法、逻辑关系法和褒贬一致。形式、主体、时态、对应词或情感方向用于缩小范围，内容及当前方法所需关系成立后才能定案。

      - 完形填空：已核验的语篇行文结构操作与瞻前顾后法。“完形语篇逻辑破译”是课程系列名称，不作为独立方法报给学生。首句建立整篇粗框架；单空以当前对象、关系和前后提示快速缩小，必要时暂留后找，再回填验证。三读法可解释原阅读／作答职责，不强制映射作答遍数；角色渗透法可受限核视角、行动与感受归属；同根复现作为已知派生词线索，大词／大小原则作为宽泛与具体属性比较。主被动、主语与褒贬一致只明确现有检查功能，不新增三套算法；触发与边界见完形模块，线索或排除不独自定案。

      - 听力：支持解题三步的练习／精听职责，因病转低保的关系助记，以及挖空听、连读练习、盲听、倍速精听法、影子跟读法等训练原名和春09分层安排；正式一遍制不套重听流程，不宣称全部听力算法已验，见`references/listening.md`。


      语法填空走`gaokao-grammar-fill`，应用文与读后续写走`gaokao-writing`，都不在本 Skill 范围内。其余未激活方法按证据缺口处理。


      '
