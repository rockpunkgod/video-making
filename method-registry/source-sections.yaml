    line_start: 515
    line_end: 521
    content: '## 2026-10-13阅读课程原名与有限入口增量


      8.7《精深阅读满分策略记叙文之细节题做题法(上)》原PDF第1页由root亲自渲染实看，独立列“顺藤摸瓜—文章结构”“左顾右盼—核心词”和“中心思想”。前两项的定义限记叙细节；赠09词义题660–960秒原音机器稿及740秒原帧另支持左顾右盼的目标词前后真实语境核对，附近不足可扩看，方向不独自定具体词义。中心思想原名确证，但原件所述借生活常识及泛推理未作运行验收，不以mainly题流程覆盖它的全部原义。应用文阅读课程题名“应用文定位阅读法（上／下）”“定位阅读法”见对应原PDF；题名不独自证明另一套算法，一般定位仍按已验各法触发。详`E:/新建文件夹/video-distillation-remaining-20261013/TERMINOLOGY_OBJECTIVE.md`及`G:/gaokao-course-terminology-20261013/reading-terms.md`。


      寒假第3次阅读讲义独立列“分句结构法”三步：句子分列、复杂句再分列、只关心考点主语信息。赠15机器稿1473–1530秒有明确三步口述，1517–1526秒按当前考点解释为关注相关内容；1580–1830秒及1700秒原帧有分句后回前文核原因的代表实施。原句第三步保留，不能改成只看语法主语或删除答题相关否定、条件和关系；括号法、劫匪插葱各保留自身结构辅助身份。见`E:/新建文件夹/video-distillation-remaining-20261013/reading/CD_GIFT_METHOD_REVIEW.md`。


      秋03`D:/秋季班/03.精深阅读满分策略：解题技巧（一）.mp4`与`E:/开明致学/【课上讲义】第3讲 阅读(26S秋季).docx.docx`分别有原音代表和“褒贬一致”独立定义；五个成功音窗共1980源秒／1382机器段，与13张原帧及原讲义交叉核。机器翻译题支持对象评价／内容判断中的方向初筛，随后核转折两侧对同一对象的完整评价；Ben
      Franklin同篇两题分别支持认知因果解释的方向初筛后核真实心理关系、词义方向初筛后用语境区分具体义。同篇多题不倍增独立材料。此三入口只受限调用“褒贬一致”名称，不与积极阅读“褒贬定态度”合并，不泛化为所有作者态度、细节或猜词题；方向和排剩项均不定案。未人耳逐字复听、未验同向细义及复杂来源。详`E:/新建文件夹/video-distillation-remaining-20261013/reading/AUTUMN03_METHOD_REVIEW.md`与root在`acceptance.md`的亲核记录。原题故事、候选字母、固定词对及强说法不迁运行。

      '
