  1edd110b396bf0e6:
    path: gaokao-grammar-fill/references/course-evidence.md
    heading: 客观题课程取证入口
    line_start: 1
    line_end: 4
    content: '# 客观题课程取证入口


      四类题型已核实的操作要点写在各自模块，不必每题读本文件。仅在追问“课程怎么说”、方法归属不明、发现版本差异或模块未覆盖时使用。本文不是新题型，也不改变两类作文。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  2ebcaabbdf63dfdf:
    path: gaokao-grammar-fill/references/course-evidence.md
    heading: 如何使用新问答包
    line_start: 5
    line_end: 12
    content: '## 如何使用新问答包


      若同级存在 `kaiming-english-qa`，先读取它的 `SKILL.md`，再在该包目录使用 `python scripts/library.py
      search 关键词 --limit 12`，或直接搜索 `references/corpus`。读取命中的完整相关段落，不拿检索摘要作结论。下列 ID
      对应 `references/corpus/ID.txt`，讲义全名、原件与质量提示见该包 `references/catalog.json`。


      涉及导图、手写或乱码时，同时读该包 `references/visual-recovery.md` 与对应原图/原件。补录是人工概述，不是无误逐字稿。该包不存在时，已写入本技能的规则仍可用；额外课程问题向用户索取相应讲义，不依赖固定电脑路径、不自动联网安装，也不声称已查看不存在的资料。


      来源优先核对明确勘误，其次核对题干、例句、解析是否属于同一题。区分课程原话、对课程的操作整理和基础语法解释。发现课件分类简写或解析错误，不照抄成普遍规则；需要用户决定的教学取舍，列出具体矛盾再询问。来源检索与内部检查不写进学生口播；用户问出处时才自然说明讲义、章节、页或题。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  d34293cc5d3ad544:
    path: gaokao-grammar-fill/references/course-evidence.md
    heading: 语法填空
    line_start: 13
    line_end: 20
    content: '## 语法填空


      - 7.11《语填无提示词（上）》，`0957ffbfe1d4`，PDF第6页：例题含 `its (it)`、`mine (I)`、`themselves
      (they)`。文件名不代表所有练习均无提示词；代词变形必须有路可走。第4页图另有主格、宾格、物主、反身及 it 的不同功能。

      - 8.4《实词准确使用》，`24c4e1bcbc7f`，PDF第3—4页：`environmental protection (protect)`、`the
      development (develop) of...`。动词提示也可能派生名词；同页 `marriage ceremony` 说明名词也能作定语。介词后
      `spending` 则说明名词性位置与动名词需按搭配区分。

      - 7.23《无提示词准确使用（下）》，`a005fe48587e`，PDF第14—15页《论语》练习第62题：`... are important.
      ___, ren is...`，解析给 `However/Yet`。无提示词不能封闭为四类；However 在此作副词，其他候选仍按实际句法分析。

      - 9.15讲义，`1b8569fdf480`，Word段208—225“Six Arts”第56、65题：谓语解析先语态，再时态和一致。课程覆盖这三项，但不能把某个整理顺序称为课程唯一规定。

      - 8.4讲义明确将早前 `the day in which` 改为 `on which`。7.23另有题干与婚礼解析错配，回答时须以本题结构取证，不能自动照答案解析讲。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  f429179030c536c1:
    path: gaokao-grammar-fill/references/course-evidence.md
    heading: 七选五
    line_start: 21
    line_end: 28
    content: '## 七选五


      - 春季第8讲《内容一致法（下）》，`ce31f1ee2a89`，Word段4—11：分组首看三一致，褒贬是底层、核心内容为额外补充；完整分组后找最少的另类项；先分析区别，再读文章找对应，最后用关系做题。不能把这些依据强制排成七步。

      - 寒假第1讲，`bd3d57951710`：结构区别明显时先看祈使句、半句话、感叹句、非谓语，主语及时态可叠加；寒假第9讲 `723a89ecf530`：分组后找逻辑词突破，内容判断仍须确认逻辑。

      - 春季第3讲《内容一致法（中）》，`50c9c2921bbc`，Word段42“Once it warms up...”是天气 it；寒假第9讲的“it’s
      common to experience...”为形式主语用法。二者不是找不到回指就应排除的选项。

      - 春季第3讲，Word段19，`Being a good guest begins...` 的语法主语为动名词短语；原注“人作主语”是内容焦点的简写。春季第8讲段69—70的
      they 分组包含 `The reason ... is that they...`，they 是从句主语。讲解分组时说明所比较的是主句、从句还是内容对象，不能偷换。

      - 春季第8讲段20—23将 `Follow/Dry/Confirm...` 归于祈使句结构；春季第3讲段61 `stimulated` 才是明确的过去时线索。建议功能不是时态。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  164a3136aee1978f:
    path: gaokao-grammar-fill/references/course-evidence.md
    heading: 完形填空
    line_start: 29
    line_end: 33
    content: '## 完形填空


      - 春季第7讲《句间的上下呼应（下）》，`e357e2f1d603`，Word段9—17：首句定主题与褒贬；扫选项判词性；读文章知大意；同词性找关联；本句再前后句；无提示看主旨；暂跳、第二遍回收。配平标为慎用，不得替代文本证据。

      - 寒假第2讲《瞻前顾后法》，`317d24e8d7ef`，Word段3—14：中心、角色、顺序、5W1H、目的辅助理解，同词性查找提示。完整框架随读文形成，不能仅凭首句提前断言动机与结局。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  40887326db774bc1:
    path: gaokao-grammar-fill/references/course-evidence.md
    heading: 阅读理解
    line_start: 34
    line_end: 40
    content: '## 阅读理解


      - 春季第5讲《模拟真题精讲精练》，`8a983005d4a0`，Word段2—12：三化组成是首尾段、段首句、重复词；操作从题目重复词提出候选，再带着候选读首尾求证。主旨题读文章前读选项，细节题先只读题干。

      - 同讲段7—8：首尾段读首尾句；中间段一般读首句，首句是背景时优先读段尾。不能固定要求每个段落都读首尾，也不能见疑问句就直接丢弃该段。

      - 春季第6讲《主旨大意高分策略（下）》，`4f44c9603481`，Word段2—5：说明/议论篇的主旨、细节、猜词顺序。技能按已出现题型保持相对顺序；“缺类跳过”是操作化说明，不是逐字引文。

      - 文体判断用于选择路线，不能因篇次 C、D 默认说明/议论。应用文定位阅读、记叙文顺藤摸瓜保留独立流程；篇章主旨和结构若是具体题目的证据，必须讲给学生，只有路由和质量检查保持静默。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  e611ca9dbd40e48b:
    path: gaokao-grammar-fill/references/course-evidence.md
    heading: 26S 系列（2026-09-17 新入）
    line_start: 41
    line_end: 82
    content: '## 26S 系列（2026-09-17 新入）


      26S 系列共 61 份（暑假、秋季、寒假、春），是另一个学年的完整课程，其“精深阅读满分策略：解题技巧”与各题型“满分法则”部分已并入对应模块的「26S
      讲义新增内容」小节。ID 为源文件 SHA-256 前 12 位。


      - 第1讲 阅读（26S寒），`d892e875aec5`：积极阅读法、四定（重复定主旨、褒贬定态度、名词定出处、动词定逻辑）、题干定位段落加选项定位句子、猜词三步。

      - 第3讲 阅读（26S秋），`61b6755e7580`：例子非答案（含标志词与选项特征）、褒贬一致（含词表与 Although A, B 的转折重点在
      B）。

      - 第4讲 阅读（26S暑），`9df916ff6445`：跳读定位、重复就是力量三层（选项重复、题干重复印证、文章重复）、劫匪插葱、三化与定位与劫匪插葱的分工。

      - 第5讲 阅读（26S秋），`f69560e241dd`：画蛇添足（含词表，易被加料的是形容词、副词、介词短语）、图片记忆法、结构词做题法（只报名）。

      - 第6讲 阅读（26S寒），`f9ddf1b85250`：三化法步骤与两个目标、优先定位口径“比数绝重大”。

      - 第7讲 阅读（26S暑，OCR），`612d876b0611`：题干永远对三要点、大词原则的跨题型分工、连连看、CD 篇时间分配。

      - 第9讲 阅读（26S秋），`15700ed30e31`：逻辑简化（三问法）、因果选果三条理由、选项四种关系、细节题定位两步。

      - 第9讲 阅读（26S暑，OCR 差，存疑），`a176c5a193df`：同源替换、比较级谨慎选三条注意。该件出现“做题顺序 3—2—1”等残缺标注，**未能确认原意，用前须核对原
      PDF**。

      - 第12讲 阅读（26S秋），`986b02405750`：过度推测（忠实原文）三特征、妖项助攻（妖项只作辅助，回文验证必不可少）。

      - 第12讲 阅读（26S暑），`4d4bac3f80f9`：代词代指（代词先还原）、最短逻辑与就近原则、大词与小词选择规则、定位词层级、词内词外同源规则（横线内是字面解释不可用，横线外是同源提示可用）。

      - 第15讲 阅读（26S秋），`80429a6d6613`：负负得正（显性否定词与隐性否定词表）、选项定位五类词、选项判断三抓手。

      - 第15讲 阅读（26S暑），`613391e1fad9`：并列删除（选项层面，含排他项判断）、构图定位法、完整做题流程。

      - 第2讲 七选五（26S寒），`d72ea842975f`：褒贬一致为底层、选项分组三层、转折词两侧褒贬相反、负负得正、明贬实褒、让步（重要的在后面）。

      - 第4讲 七选五（26S秋），`98adf98a088f`：三一致高效解题法五步、特殊组三类命名（主语特殊、时态特殊、结构特殊）、语义是根本。

      - 第5讲 七选五（26S暑），`a9a6385b74fa`：结构一致（段落层与篇章层）、七选五解题思路、小标题直接与间接、总起词与总结词表。

      - 第7讲 七选五（26S寒），`33fd20467a47`：对应词法、逻辑关系法（五类关系与标志词表）、半句话原则。口诀“因病转低保”出自此处（内部记忆，口播不念）。

      - 第10讲 七选五（26S秋），`e8226007d7ec`：时态一致、一致性的两个层面（选项之间、选项与文章）、meanwhile 提示时态一致、泛比较。

      - 第3讲 完形（26S寒），`fa8fbd97ff0e`：瞻前顾后法、首句作用、名词复现原则、口诀完整版“首句完整定主题，相同词性定答案。名词抓复现，动词看逻辑，形副判褒贬，无信靠主题”。

      - 第8讲 完形（26S暑，PDF·OCR），`31ce01392e31`：名词四类复现定义、完型思路四步、选小词、切忌用常识做题、主被动一致。**该件为扫描件自动识别，英文与数字错误多，细节须核对原
      PDF**。

      - 第10讲 完形（26S暑），`a3b091fdc47a`：动作流（因果、承接、伴随）、对标词、熟词生义、配平量化规则（每字母最多四个、至少三个）。

      - 第11讲 完形（26S寒），`c864107970c6`：方法内容很薄，主体是逐题解析与翻译；仅“无提示不答案”等零散条目。

      - 第13讲 完形（26S秋），`fcc324e69cfe`：副词三考查面与解题四步、完型三步与逻辑定位词、副词连词辨析细则、熟词生义清单。

      - 第2讲 语法填空（26S秋），`5178eb92bf28`：有提示词专项。like 不能作连词、形容词变副词拼写四则、名词加 of 看是否唯一、可数名词单数优先考虑冠词、done
      的有 be 无 be 二分、practice 被动后接 to do。

      - 第3讲 语法填空（26S暑），`89aae11908d5`：无提示词专项。同一个考点一般不重复考查、括号内所给单词一次变形、since 与 before
      两个句型、as 与 though 让步倒装差异、as 四类用法、about 与 to 及 to 与 on 的内容和结果判据。另有“不必先通读全文，带着考点做题”。

      - 第13讲 语法填空（26S寒），`a9654f117f77`：谓语动词专项。时态判定三步法、宾语从句不缺成分时 why 与 how 与 that 的判据、主谓一致的就近与就远原则及单复同型、集合名词等细则、虚拟语气（otherwise
      加 would have done）。

      - 第4讲 作文（26S寒），`fab54a0ec427`：应用文之书信类。五审法审核维度表、读背仿三步走、分数锚定、三类书信模板、作文练习顺序四阶段、反向劫匪插葱、写作误区与提分技巧。

      - 第8讲 应用文，`737507400dff`：写人类文体方法、人物介绍评分口诀、投稿类身份与时态定调。

      - 第13讲 写作（26S暑），`c06dc16cb094`：活动类。好作文三步、三段式、逻辑补充句四变体、多时间用 What we anticipate
      most is、not only but also 只用一次、语料蓝绿标注约定。

      - 第8讲 续写（26S寒），`ab469ef954cc`：PTSD（目的、方式、苦难、结局）、解题四步骤、八个技巧、三条基本规律（含节外生枝：制造冲突）、十句五定表格版、分数分层训练目标。

      - 第14讲 续写（26S寒），`3cd3de1662e1`：PTSD（需求、困难、方法、结局加升华）、三重匹配与双重升华、四步精准续写、情节节点法、黄金法则（根力魂光）、gap
      读法、肌肉句与骨架句。

      - 第16讲 续写（26秋季），`c8fbccb3f2f0`：动作链与动作面（Skill 1 两个并列动词、Skill 2 三个并列动词，动作最多分解三个、名词最好两个）、五档升级路径、第五档标准与句子框架公式、分档升级全解析。

      - 第11讲 作文（26S秋），`5a8a48e72eb1`：正文实为续写——结尾升华金句积累、四大主题升华句、考点三要素（卷面、字数、升华句）。

      - 第16讲 作文（26S暑），`ea3328fcef59`：正文实为续写——五步成文法、两个首句中的名词都需提及、升华不是必须。


      **课件归类提醒**：文件名带“作文”的第 11 讲（26S秋）与第 16 讲（26S暑）正文是读后续写；文件名带“续写”的第 8 讲（26S寒）实际文件名方括号内多一个空格。按文件名判断题型会出错，要按正文标题归类。


      **未纳入本技能的内容**：26S 系列的听力讲义（第2讲 26S暑、第10讲 26S寒、第8讲 26S春）不在本技能范围；10 份「综合／模拟套卷」经扫描**不含语法填空方法**，其方法内容属阅读理解与七选五，已并入对应模块；第5讲
      模拟套卷（26S寒）含**阅读表达（简答题）**方法，本技能未设该题型模块，暂未收录。


      '
