      阅读(26S暑假).docx.docx`P3–8尤其P6的主题明确及多个题目主旨词前提，只约束该跳读版本，不扩成所有名词定位的前提。春季第7讲上下呼应（下）P16明确首遍空着、第二遍检查再做。


      阅读待验收名称：秋季第3讲P15–21及春季第6讲P133有阅读褒贬一致定义；寒假阅读第1讲P4–7列积极阅读法四项（重复定主旨、褒贬定态度、名词定出处、动词定逻辑），后两项已有运行操作，不表示前两项及组合已闭环。暑假阅读第4讲P10–13有重复就是力量；秋季阅读第12讲P12–18、春季第5讲P27有妖项助攻；春季第6讲P135–136有动静一致、因果倒置短定义。`【春季课上讲义】第1讲
      说明文之主旨大意高分策略上.docx.docx`P26–27有选项倒推法。`9.15 高三班秋季第3次课上讲义（记叙文）.docx.docx`P7有一般六要素，P25–26有首段法、核心名词法、合并法和原写“首位呼应法”；这些独立登记待验收，非把单例5W事实带入运行层。


