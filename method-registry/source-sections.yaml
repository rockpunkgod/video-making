  3f0307af95397320:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 情节构思：PTSD 四步法
    line_start: 197
    line_end: 200
    content: '### 情节构思：PTSD 四步法


      PTSD 用于研读首句、构思情节、搭大纲：P＝Needs 需求或目标（主角需要什么）；T＝Difficulties 困难或波折（遇到什么障碍）；S＝Solutions
      方法或行动（如何实现需求）；D＝Denouement 结局加升华（最终结果与感悟）。实战时配一张 P/T/S/D 四行表，每行写核心问题与具体情节对应。另有一版同音定义：P＝目的、T＝方式、S＝苦难、D＝结局，P
      后标注所属主题。两版并存，用时选一套说清即可，不混用。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  36bfff089dd7b672:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 解题四步骤
    line_start: 201
    line_end: 204
    content: '### 解题四步骤


      ①通读全文，掌握大意，理清 who、when、where、why、what、how 六要素 ②研读首句，构思情节，即 PTSD ③回扣原文，增加细节 ④修改润色，整洁誊写。润色可灵活使用无灵主语句、非谓语短语、独立主格结构、复合句、强调句。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  7404eebf2dc7c52b:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 八个技巧（情节节奏模板）
    line_start: 205
    line_end: 208
    content: '### 八个技巧（情节节奏模板）


      ①情绪描写（恐惧、震惊、愤怒、绝望、悲伤、愧疚、高兴、兴奋、羞愧）②细节描写（面部细节、肢体动作、环境细节）③转折描写（个人努力或借助外界帮助，事情有了转折）④转机描写（似乎有了转机，抱有希望、感到欣慰）⑤失望描写（问题还没解决或出现新问题，跌宕起伏）⑥新法描写（突然有了一个想法，一句话说明，峰回路转）⑦结局描写（过了一段时间，事情有了最后的转折，向好的正能量发展）⑧总结描写（点明主题，呼应前文）。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  d9120aa3501ea2ec:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 三条基本规律
    line_start: 209
    line_end: 212
    content: '### 三条基本规律


      ①和原文保持一致（衔接、连贯、语言风格一致）②保持曲转起伏，即**节外生枝：制造冲突**③正能量原则。第②条要求**合理制造**、**寻找文中矛盾**，即在原文矛盾轨道上制造波折，不是凭空新事件。本节据此覆盖上文“不要鼓励节外生枝”的写法；但无铺垫、脱离原文矛盾的新增事件仍判为不成立。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  8519c17ad352b6fa:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 三重匹配与双重升华
    line_start: 213
    line_end: 216
    content: '### 三重匹配与双重升华


      本质是“原文的延伸而非创造”，以原文为根基实现情节、情感、风格的统一，最终达成主题与认知的升华。①主题锚定：紧扣核心主题，不可偏离主线，避免新增无关情节
      ②情节逻辑：遵循“危机升级→转机出现→危机解除”链条，第一段强化危机再引入转机，形成“极致困境→意外帮助”的反差 ③情感递进：贴合人物心理变化轨迹，通过动作与环境对比体现，避免直白抒情
      ④风格匹配：延续原文叙事风格。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  dc0352401381faf7:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 四步精准续写
    line_start: 217
    line_end: 220
    content: '### 四步精准续写


      ①审题定位（约 3 分钟）：提取基础设定（人称、时态、场景）、核心冲突、衔接线索、情感基调，列出续写约束 ②情节构思（约 5 分钟）：用**情节节点法**搭框架——第一段环境渲染一到两句、转机触发一句、互动核心两句、情感收束一句；第二段途中铺垫、细节深化、危机解除、主题升华一到两句
      ③语言表达（约 10 分钟）：用细节描写替代直白陈述，聚焦环境、动作、心理三类细节，复用原文高分结构 ④校验优化（约 2 分钟）：逻辑校验（呼应伏笔、两段衔接）、格式校验（用给定开头句、词数
      140–160、语法）、细节校验（善意动作、升华完成）。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  e90f8e14394665b7:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 黄金法则（内部记忆）
    line_start: 221
    line_end: 224
    content: '### 黄金法则（内部记忆）


      原文是“根”，所有情节、情感、语言都以原文要素为依据；冲突是“力”，第一段强化危机、第二段解决危机；细节是“魂”，用环境、动作、神态描写替代直白抒情；主题是“光”，结尾升华原文主旨，让故事从事件上升到感悟。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  0704baa69272c2a5:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: gap 读法与首句规则
    line_start: 225
    line_end: 228
    content: '### gap 读法与首句规则


      读首句要找 gap、确定主人公和可能的主题，再带着问题读文章。凡两个首句中出现的**名词都需提及**，出现的**任务都需涉及**。矛盾来自原文。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  c07ba63b18c4746d:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 动作链与动作面（人物刻画核心）
    line_start: 229
    line_end: 238
    content: '### 动作链与动作面（人物刻画核心）


      把动作过程分解成一连串细微动作形成动作链，写出连贯性，再用副词增加色彩。


      Skill 1：主语 + 动作 A + and + 动作 B（两个并列动词）。例：They jumped into the car and drove
      to the amusement park excitedly.


      Skill 2：主语 + 动作 A，动作 B + and + 动作 C（三个并列动词）。例：She dashed forward in a hurry,
      knelt down and held her son into her arms tightly.


      配比规则：动作最多分解三个，名词最好两个。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  da71883c7cd6b2bc:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 五档升级路径（训练用）
    line_start: 239
    line_end: 250
    content: '### 五档升级路径（训练用）


      第一档到第二档，从无从下笔到能写完整：三要素锁定法（核心人物、核心矛盾、关键线索）；“段首句＋2 动作＋1 结局”框架；简单句扩展公式（基础句加时间、地点、方式状语，保底不低于
      120 词）；致命错误零容忍（时态统一、单复数正确、拒绝中式直译）。


      第二档到第三档，从能写完整到写顺写对：伏笔呼应法（每个人物行为对接原文伏笔）；因果逻辑链（因为 A、所以 B、最终 C）；进阶句式三选一（介词短语作状语、简单定语从句、宾语从句）；词汇精准替换法。


      第三档到第四档，从写顺写对到写好写全：三维细节添加法（每段至少两处动作、神态、环境细节）；实用高分句式包（非谓语动词、with 复合结构、宾语从句）；意合衔接替代法（关键词复现加代词指代，替代
      and/so/then 堆砌）；主题明确法。


      第四档到第五档，从写好写全到亮点突出：微转折设计法（在解决问题中加入一个拓展性转折）；质感词汇替换法（vintage、tarnished、honed 等场景化高级词）；多变句式组合（非谓语加定语从句加独立主格，每段不超过三处）；主题升华法。


      此表与上文的评分档次是同一套五档，升级路径说明的是每一档缺什么、下一档要补什么；给分按评分规范走。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  674c3cedbc56722a:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 第五档作文标准与句子框架
    line_start: 251
    line_end: 256
    content: '### 第五档作文标准与句子框架


      词汇层面：精准化高级词汇替换基础词（clutch 替 grip、unshakable 替 great、tuck 替 put），搭配地道，加入细节限定词。句式层面：以复合句为核心，融合一到两种复杂结构，状语从句加非谓语或介词短语作伴随状语为高频组合。内容层面：多层细节描写（动作加场景加情感），传递明确情感，叙事符合现实。表达层面：流畅有感染力、无语法错误，避免中式直译。


      通用句子框架公式：场景状语 + 主句（动作加细节）+ 伴随状语（情感或动作延伸）。套用时注意：宾语修饰成分贴合语境，不为“高级”堆砌；非谓语动词的逻辑主语与主句主语一致；情感修饰词与场景匹配。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  8de2c93d899d552b:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 肌肉句与骨架句
    line_start: 257
    line_end: 260
    content: '### 肌肉句与骨架句


      凡是冲突、重点扩写句都在**不定**的句子中展开，称为**肌肉句**，用来冲击高分；凡是**确定句**都是功能句，称为**骨架句**，确保文章逻辑一致、不偏题。不定句位的写法是“会啥写啥、言之成理”，写有把握的内容，展示背诵素材功力。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  9a5f5241e9e86926:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 主题三大类的定义
    line_start: 261
    line_end: 264
    content: '### 主题三大类的定义


      人与自我是**自我突破**（“你”的问题及其解决方案）；人与社会是**互相帮助**（社会和谐、更好的彼此）；人与自然是**尊重生命**（和谐共处）。另有把第三类写作“人与环境”（自然灾害、意外事件、社会压力）的，含义相近。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  b096635f1943a034:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 十句五定法的功能表
    line_start: 265
    line_end: 268
    content: '### 十句五定法的功能表


      第一段：句 1（定）衔接提示句；句 2 行动或心理描写；句 3 细节描写或思考分析；句 4 转折铺垫或想法萌芽；句 5（定）过渡到第二段。第二段：句 6（定）衔接提示句；句
      7 细节描写或心理加行动；句 8 行动描写或人物反应；句 9（定）交代结局；句 10（定）点睛升华。其余 5 句用于补足因果链和画面。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  540b6fb2783f6027:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 素材与考点
    line_start: 269
    line_end: 274
    content: '### 素材与考点


      考点三要素是卷面、字数、升华句（采分点），核心是不偏题。四大主题升华句分类：助人与善举、个人成长、亲情友情、历险脱困。素材清单：金句 80 个（动作描写、心情描写、环境描写、凑字数句子），升华句
      10 个，10 个句式结构加 100 个核心高分词。**升华句不是必须项**，本模块据此把点题作为进阶项处理，不因学生没写独立升华句就判重大缺失。


      分数分层训练目标：115 分以下以客观题为主，作文抓写作框架加基础句式表达；115–130 分积累好词好句；目标 135 分以上要提升客观题速度，给作文留出时间。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  b767427de3baefc8:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 跳定思提润的英文并列名（五步成文法）
    line_start: 275
    line_end: 278
    content: '### 跳定思提润的英文并列名（五步成文法）


      第一步 Skim-through for Clues；第二步 Identify Conflict, Define Theme；第三步 Overall Conception,
      Material Extraction；第四步 Frame-building, Outline Refinement；第五步 Theme-elevation,
      Polishing and Perfecting。第一步先读两个首句（人物 Who、状态动作 What、时间地点 When/Where），带着猜测去读文章。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  6ce36be46e316d46:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 反向劫匪插葱
    line_start: 279
    line_end: 282
    content: '### 反向劫匪插葱


      句式转化工具，指被动语态和无灵主语，也用于复用原文高分结构。标准三段式：简化（写出小学语文水平的简体中文）；简单句翻译（直译）；优化升级（升级句式、介词短语、非谓语、从句、高级替换词语）。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  363d35dec7fda958:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 26S春 补充（人与自然专项）
    line_start: 283
    line_end: 306
    content: '### 26S春 补充（人与自然专项）


      **人与自然三分型**：①生存挑战——靠冷静应对和坚韧不拔成功脱险 ②自然观察与学习——通过对自然的观察增进理解与敬畏，推动科研或个人成长 ③生态保护与救援——在保护救援自然生命中展现责任感与同理心，最终保护生态或救下动物。


      **人与自然四步框架**：①问题解决前的负面情绪 ②解决过程 ③解决后的积极情绪 ④主题升华。三型均按这四层组织语料。


      **情绪词汇分级**：负面——悲伤痛苦 miserable，焦虑紧张 uneasy、panic-stricken，愤怒懊恼 annoyed、indignant，绝望无助
      desperate、overwhelmed，尴尬内疚 embarrassed、mortified，动态激起 a wave of sorrow、be overcome
      with grief。正面——淡定自信 poised，治愈温暖 gracious、sanguine，愉悦欣喜 exhilarated、ecstatic。


      **三类万能句式及位置约束**（本讲最硬的操作规则）：心情万能句式只用于五句非功能句；动作万能句式只用于五句非功能句，用于解决困境和问题；环境万能句式只用于五句非功能句，选择背诵、凑字数，**不能放在结尾，一般放在第一段或第二段的第三句话**。


      **升华句只用于结尾**：三类的句式均用强调句，落笔时按成长、帮助、自然三种主题各选对应的一类；抽象词要换成原文内容，用来抢救过于平淡的文章。


      **万能句式三步套用法**：①背熟该句 ②找到“对手方”（可以是自己）并确定情绪 ③尽量照搬原句。槽位结构是“对手方 + 动作 + 情绪”。


      **四条总纲**：①原文不是最重要的，只给背景和主题框架，构思不用炫技，靠的是写作，不需要死扣细节 ②十句五定的确定功能句保逻辑严谨，注意上下文呼应（抄上下文关键词）③十句非五定句是展现写作功力处，靠前放模板句、高级词汇
      ④结尾不一定非要升华，但文章太平时用升华句抢救。


      **两种结局走向**：机缘巧合找到了（最合乎常理）；或还是没找到，但一定要有其他收获，如找回与父亲的回忆、决定持续努力。


      **原文关键元素必须兑现**：原文里出现的物件与线索，在续写中都要有着落，不能悬空。续写基本都是问题解决型，要学会找到藏在文章中的矛盾点。


      **描写对象交替推进**：原文、回忆、当下交替出现，人物与物件交替推进情节。


      **与上文的张力**：26S春第11讲把重心压在“写作（语言）”上，弱化原文根基与情节构思，与上文“三重匹配：原文是根”和“节外生枝：制造冲突”侧重不同。落地时按本节采纳其倾向，但“无铺垫、脱离原文矛盾的新增事件不成立”仍然保留。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  92e0a369b6533dee:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 批改交付格式
    line_start: 307
    line_end: 322
    content: '## 批改交付格式


      不要展示题型判断过程。按以下顺序输出：


      书写属于条件项：只有看到原始手写稿且书写已经影响交际时，才在整体结论或重点语言修改中简要说明扣分依据；其余情况不单列“书写美观性”。


      1. 整体结论：给出分数区间或建议分数、所属档次及最关键证据；先肯定一项真实优点，再指出一个最优先改进点。

      2. 框架诊断：分别写原文衔接、人物人设、故事逻辑、情节走向、主旨立意；引用原文或段首句证据说明。

      3. 十句五定图：按“第一段句 1 / 句 5、第二段句 6 / 句 9 / 句 10”说明现稿是否完成相应功能，并给出需要补写的功能句。

      4. 情感与细节：画出情感变化，指出哪里缺触发、过渡、动作、心理、环境或神态细节。

      5. 细致语言修改：逐处给出原句、建议改法和原因，覆盖明确的语法及相关语言错误，先说明影响理解和反复出现的问题；同类错误可合并解释，但标清各处位置和改法。可选润色单独说明，不作为语法错误。

      6. 修改提纲：先给两段中文提纲，每句只写逻辑功能和核心事件。

      7. 修改稿：保留学生原意和可用句子，补齐桥接、冲突解决和点题，再升级语言；不得改变原文人物、关键事实或叙事视角。

      8. 方法练习：只选本次最需要的一项，如段首句反推、情感线补全、动作链、十句五定或富兰克林翻译训练。


      语气口语化、具体、鼓励式，但不能虚构优点，也不能用“高级句型”掩盖情节偏离或逻辑断层。

      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  d49944ab3441bc54:
    path: gaokao-writing/SKILL.md
    heading: 入口契约
    line_start: 1
    line_end: 11
    content: '---

      name: gaokao-writing

      description: 高考英语作文老师。应用文与读后续写的写作指导与批改，两套评分规范和反馈模板各自独立。用于应用文写作或批改、读后续写写作或批改、作文疑问解答。不处理语法填空、七选五、完形填空、阅读理解（见
      gaokao-english）。

      ---


      # 高考英语作文


      按开明致学课程的写法与评分规范带学生写作、批改作文。不自创同名方法，不把知识清单或整理标题当成固定步骤。


      应用文与读后续写是两个独立模块，各自的评分、结构诊断和反馈格式不通用。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  52f60aee56dc2f7e:
    path: gaokao-writing/SKILL.md
    heading: 只管写作与批改
    line_start: 12
    line_end: 19
    content: '## 只管写作与批改


      本技能只处理应用文和读后续写的写作指导与批改。学生拿来客观题（语法填空、七选五、完形填空、阅读理解），说明这里不处理，让他走 `gaokao-english`。


      不虚构学生原稿，不虚构批改分数。缺题目、原文、段首句或学生全文时，只处理现有信息能支持的部分，并明确哪些评分维度暂时无法判断，不臆测完整分数。


      学生的作文里没出现两段段首句是正常的，不算缺项，批改只看学生该写的那部分。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  c44d8625ed323d07:
    path: gaokao-writing/SKILL.md
    heading: 交付形态：微信答疑消息
    line_start: 20
    line_end: 30
    content: '## 交付形态：微信答疑消息


      给学生的回复是**微信上回学生的消息**，不是一份排好的批改报告。


      - **要有活人感**。像老师坐在对面跟学生说话，不是系统在出评估单。语气自然，句子长短不一，该肯定就肯定，该直说就直说。

      - **不要那么齐整**。不排编号条目、不分点罗列、不加小标题、不套固定表格。该连着说的地方就连着说，不必每一点都单独起一行对齐。

      - 纯文本，对话里直接给。不用 Markdown 符号，不用引号括住原句，不排目录。

      - 不写成讲义或提纲，不加报告栏目、评分表样式的排版、箭头流程。


      排版不拘束，**内容不打折**：该指出的问题要指出，该给的原句、改法和理由要给全。活人感不等于糊弄。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  c7154ff3faa440bf:
    path: gaokao-writing/SKILL.md
    heading: 批改顺序
    line_start: 31
    line_end: 38
    content: '## 批改顺序


      先整体框架，后细节语言。先判断是否完成任务、是否切题、结构是否成立，再处理语法、词汇、拼写和句式升级。


      先指出真实优点，再给出最影响得分的问题。每个问题都要落到原句、修改示例和可复用方法，避免只报错或整篇代写。


      批改要细致：上述几个问题是优先级概括，不是完整批改的数量上限。先按各自课程诊断写作思路、结构和可优化之处，再逐句检查语法及相关语言问题；明确错误应逐处指出并给出改法与原因。同类错误可合并解释规则，但要标清各处原句及修改。区分必须纠正的错误与可选择的表达优化，不把正确表达判错。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  351318940f795786:
    path: gaokao-writing/SKILL.md
    heading: 两个独立模块
    line_start: 39
    line_end: 48
    content: '## 两个独立模块


      - **应用文写作或批改**：必须读取 [references/application-writing-and-correction.md](references/application-writing-and-correction.md)，使用应用文五审法、15
      分五档评分、对应写作方法和应用文批改反馈话术。

      - **读后续写写作或批改**：必须读取 [references/continuation-writing-and-correction.md](references/continuation-writing-and-correction.md)，使用原文线索、十句五定法、25
      分五档评分、对应续写方法和读后续写批改反馈话术。


      两类作文只共用先整体后细节和鼓励式表达原则；不得合并评分表、批改清单、参考范文或改写结果，也不得把两类分数相加或换算。


      用户只要求写作时，不虚构学生原稿或批改分数；用户要求批改时，保留学生原意，先说明影响档次的核心问题，再改语言。


      学生只是问某个写作方法（比如十句五定法怎么用、五审法审什么）时，按对应模块里的说法答，用课程原名，不换成通用说法，也不顺手把整类作文讲一遍。

      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
