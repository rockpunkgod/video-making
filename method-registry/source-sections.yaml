  fc5f913741544fa4:
    path: gaokao-grammar-fill/references/course-evidence.md
    heading: 2026-10-30 音画与讲义复核增量
    line_start: 15
    line_end: 36
    content: '### 2026-10-30 音画与讲义复核增量


      以下是五批有界复核后进入本模块的原名与边界，不表示每部课逐分钟通审，也不把原题答案带入新题。声证为原音本地机器转写，结合清楚原帧与讲义确认，不称人工逐字听写。


      - 秋季第2讲：150、840秒原帧确认**有提示词——一看二思解题法**，职责为先看所给词类，再思变化和用法；749–858、936–1100秒原音及对应题面核分句边界、时间参照与客观描述，不将整篇已有谓语或邻句过去时覆盖所有嵌套分句。

      - 暑假第3讲上：179–191秒原音明确**介冠联**为介词、冠词、连词简称；200–241、473–478秒说明先无提示词。194–442秒的考点不重复、词形只变一次等是往年观察而非考试硬配额；同人称再现也不能脱离支配关系直接判反身代词。第一批其他短课存在不同现场推进，单独保留来源，不用来改本模块现行整篇顺序。

      - 暑假第18讲答疑：4004.2秒清楚原帧写找谓语、不好找先**劫匪插葱**、再判断所在空考点；3700–4250秒原音核到略结构只为当前层级，做从句内部空要恢复该从句。春季非谓视频2720–2748秒再证同一职责。另源机器稿的同音异字不据此静默改写原稿。

      - 春季第10讲语填DOCX及11页PDF实页5（印页196）明确原程序标题**非谓语动词解题步骤**：逻辑主语及主被动，再看与谓语动作关系；定语、状语、宾补分别找逻辑主语，不自造“二步法”或与内部三轴整理合名。**吾看两厅三室一感觉**按该课动词清单助记保名，不作为新算法。

      - 对应春季视频文件序号11、原课第10讲：2650秒原帧确认**To do VS doing（填doing的三原则）**；2450–2760、3100–3460、4800–5150秒原音及5042.670秒原帧完成三组代表。先判非谓语，再比较目的与伴随／状态／自然结果；3393–3399秒明说一例只占两条，5131–5135秒明确不能只见逗号就秒。保原三项，收紧为取舍线索，不要求全部齐全。

      - 同份春季讲义“所有完成形式不能作定语”为过强全称，运行模块已勘误：不得据此排除适当后置不定式中的完成形式；普通完成分词定语与完成不定式分开。视频4869–4948秒的实际先发生而不用完成式也只支持不机械强加完成式，不能推出没
      before/after 就永禁完成式。

      - 寒假第17讲谓语课：264–511秒区分完成谓语与非谓语外形，1477–1565秒提示 by 可表差额，7353–7738秒核倒装真正主语及一致。7567–7614秒口述与7626.975秒原帧同时出现误把前置宾语当主语、把倒装后主语误作定从而配复数的错误，当前已核窗未纠正；保留为隔离勘误，不作为正确例证或迁入规则。7315–7343秒将整个主语从句称就近也不推广成凡
      whether...or 都就近。

      - 同课补核3240–3550秒原音及3270秒新原帧，补闭旧稿3244秒后截断：3244–3262秒所说“三步”实际是找时间提示、判主被动、再核过去完成参照；原屏**备考建议**分**时态判定三步法**、**被动语态公式**、**高频陷阱**三个栏目。后两者分别是结构知识与易错清单，不注册“备考三步法”，不与动词三步或非谓程序合名。原音误识的
      done、be 及单复数词形以清楚题面和上下文为准，不照错拼输出。

      - **费曼学习法**名称另有8.7讲义 `4481343df15e` 第3页清楚原字，原件重渲核对。寒假第13听力课尾8041–8047秒在语填答疑中明确用该名指梳理错题、强化知识点；寒17原稿3218–3223秒提合书再过知识，机器识“非卖学习法”，3222秒原帧没有同名字形。分别保留来源和raw异字，不谎称该帧直接证名；运行模块只登记学习复盘辅助用途，不借阅读同名补出完整步骤，也不升为语填答案算法。


      复核资料归档名为 `course-distillation-20261030`；逐源层级在 `other/OTHER_REVIEW.md`、`other/batch2/OTHER_BATCH2_REVIEW.md`、`batch3/other/OTHER_BATCH3_REVIEW.md`、`batch4/other/OTHER_BATCH4_REVIEW.md`、`batch5/other/OTHER_BATCH5_REVIEW.md`。正式模块已包含可用边界，不依赖这些外置审计资料才能讲题。


      - 7.11《语填无提示词（上）》，`0957ffbfe1d4`，PDF第6页：例题含 `its (it)`、`mine (I)`、`themselves
      (they)`。文件名不代表所有练习均无提示词；代词变形必须有路可走。第4页图另有主格、宾格、物主、反身及 it 的不同功能。

      - 8.4《实词准确使用》，`24c4e1bcbc7f`，PDF第3—4页：`environmental protection (protect)`、`the
      development (develop) of...`。动词提示也可能派生名词；同页 `marriage ceremony` 说明名词也能作定语。介词后
      `spending` 则说明名词性位置与动名词需按搭配区分。

      - 7.23《无提示词准确使用（下）》，`a005fe48587e`，PDF第14—15页《论语》练习第62题：`... are important.
      ___, ren is...`，解析给 `However/Yet`。无提示词不能封闭为四类；However 在此作副词，其他候选仍按实际句法分析。

      - 9.15讲义，`1b8569fdf480`，Word段208—225“Six Arts”第56、65题：谓语解析先语态，再时态和一致。课程覆盖这三项，但不能把某个整理顺序称为课程唯一规定。

      - 8.4讲义明确将早前 `the day in which` 改为 `on which`。7.23另有题干与婚礼解析错配，回答时须以本题结构取证，不能自动照答案解析讲。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  58aa1dfc76e6526f:
    path: gaokao-grammar-fill/references/course-evidence.md
    heading: 七选五
    line_start: 37
    line_end: 44
    content: '## 七选五


      - 春季第8讲《内容一致法（下）》，`ce31f1ee2a89`，Word段4—11：分组首看三一致，褒贬是底层、核心内容为额外补充；完整分组后找最少的另类项；先分析区别，再读文章找对应，最后用关系做题。不能把这些依据强制排成七步。

      - 寒假第1讲，`bd3d57951710`：结构区别明显时先看祈使句、半句话、感叹句、非谓语，主语及时态可叠加；寒假第9讲 `723a89ecf530`：分组后找逻辑词突破，内容判断仍须确认逻辑。

      - 春季第3讲《内容一致法（中）》，`50c9c2921bbc`，Word段42“Once it warms up...”是天气 it；寒假第9讲的“it’s
      common to experience...”为形式主语用法。二者不是找不到回指就应排除的选项。

      - 春季第3讲，Word段19，`Being a good guest begins...` 的语法主语为动名词短语；原注“人作主语”是内容焦点的简写。春季第8讲段69—70的
      they 分组包含 `The reason ... is that they...`，they 是从句主语。讲解分组时说明所比较的是主句、从句还是内容对象，不能偷换。

      - 春季第8讲段20—23将 `Follow/Dry/Confirm...` 归于祈使句结构；春季第3讲段61 `stimulated` 才是明确的过去时线索。建议功能不是时态。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  60738ac3695eb379:
    path: gaokao-grammar-fill/references/course-evidence.md
    heading: 完形填空
    line_start: 45
    line_end: 49
    content: '## 完形填空


      - 春季第7讲《句间的上下呼应（下）》，`e357e2f1d603`，Word段9—17：首句定主题与褒贬；扫选项判词性；读文章知大意；同词性找关联；本句再前后句；无提示看主旨；暂跳、第二遍回收。配平标为慎用，不得替代文本证据。

      - 寒假第2讲《瞻前顾后法》，`317d24e8d7ef`，Word段3—14：中心、角色、顺序、5W1H、目的辅助理解，同词性查找提示。完整框架随读文形成，不能仅凭首句提前断言动机与结局。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  94359d4ecca635fc:
    path: gaokao-grammar-fill/references/course-evidence.md
    heading: 阅读理解
    line_start: 50
    line_end: 56
    content: '## 阅读理解


      - 春季第5讲《模拟真题精讲精练》，`8a983005d4a0`，Word段2—12：三化组成是首尾段、段首句、重复词；操作从题目重复词提出候选，再带着候选读首尾求证。主旨题读文章前读选项，细节题先只读题干。

      - 同讲段7—8：首尾段读首尾句；中间段一般读首句，首句是背景时优先读段尾。不能固定要求每个段落都读首尾，也不能见疑问句就直接丢弃该段。

      - 春季第6讲《主旨大意高分策略（下）》，`4f44c9603481`，Word段2—5：说明/议论篇的主旨、细节、猜词顺序。技能按已出现题型保持相对顺序；“缺类跳过”是操作化说明，不是逐字引文。

      - 文体判断用于选择路线，不能因篇次 C、D 默认说明/议论。应用文定位阅读、记叙文顺藤摸瓜保留独立流程；篇章主旨和结构若是具体题目的证据，必须讲给学生，只有路由和质量检查保持静默。


      '
