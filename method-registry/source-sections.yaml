  46072a2745cacb12:
    path: gaokao-english/references/course-evidence.md
    heading: 代词指代
    line_start: 119
    line_end: 126
    content: '### 代词指代


      来源 VIDEO_506197D7A2F4 的0分钟技巧页要求“代词先还原”；本轮0至22分钟本地ASR与对应画面局部核对，补明通常就近但可扩大范围、状态与目标须区分、可借后文倒推而非禁止后看。状态候选还要核对象、比较属性、范围与否定，不能仅匹配名词。4至9分42秒的词义例支持有限的指示解释分支：先判词性，再还原明确解释关系，最后核候选语义，不扩成全面猜词流程。保留教师跨题型类比的上下文，不按板书标签改变阅读路由。旧名词限定更正历史保留，规则页HIGH、两类例题MEDIUM；原始转写有误识别，不宣称直接逐字听核或全方法验收。


      补核同源22至30分钟，概念例支持从指示命名句回看被概括行为，继续还原行为句内部代词，核所问对象、动作及肯否。共同对象定位与指示还原是两种入口，不强制串行；表面未重复名词不等于没有对象承接。24、26、28及28分30秒画面对齐，证据MEDIUM。转写与清晰画面词面不一致时结合语境以画面为准，原稿保留；该窗口不是直接逐字听核，下一词义例仅开头。


      同源68分50秒至71分08秒的ASR与69、70、71分钟画面局部对齐，补明多个实体候选同数时，要按句中动作区分参与者角色再回填。这里只解释既有数与内容一致要求，不将本例特定关系排除推广为通则，未讲到的候选理由不补造。证据MEDIUM，非直接逐字听核。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  5a5e4921c70dc55f:
    path: gaokao-english/references/course-evidence.md
    heading: 其他已激活阅读方法
    line_start: 127
    line_end: 160
    content: '### 其他已激活阅读方法


      “同源替换”仅用于同义、反义或同根词定位和缩小范围，仍需回到原文内容核对；“比较级谨慎选”要求先找到原文真实比较对象、范围、程度和条件，没有原文比较关系时不得凭选项的比较级形式作答。


      同源替换来源 VIDEO_C8325C7612E6 在16、18、20、24分钟抽样画面给出多成分对应，并板书名词定位、动词逻辑、形副范围；32、34、36分钟下一例继续核对近义动作与否定。由此细化定位后的对象、关系、修饰及条件检查。原10分钟记录中把单例操作标为明确步骤或边界的标签已更正；单例连接词排除和重复词数量说法仍留底稿，不作为通用运行规则。


      VIDEO_506197D7A2F4在66分27秒至68分46秒的ASR与66至69分钟逐分钟画面补充：原定位词未原样出现时，改用题干其他动作及近义表达定位，再核对象与候选属性。只解释定位入口的条件变化，不新增固定次序，具体词对不进入运行层；证据MEDIUM，非全方法音频验收。


      比较级来源 VIDEO_3DD67F77C661 的16至24分钟指定抽样画面核对评价对象、相对程度与最高程度；29:12–33:24的本地ASR与原帧对齐补足另一例从比较信号定位到核双方、属性、方向和题干对象的动作，并保留原句条件与情态范围。同一对象的多个比较属性须逐项对应，不能跨维度替代；具体词对、答案、题材、最近位置捷径和课堂类比不进入运行层。例题解释置信度MEDIUM，不宣称整课或全部语义完成；课程原名不变，也不把板书中的另一表述登记为方法别名。


      “逻辑简化”课程给出“三问法”：主旨是什么、态度褒贬如何、文章结构怎样。来源 VIDEO_672B4D7AC462 的18、20、22、24、26、28分钟抽样分开记录静态解析与动态动作标注，旧20分钟记录不再充当完整固定顺序的证明。30、32分钟长句板书明确先找谓语，再划分修饰与从句，最后结合词组理解；例题解析支持保留比较条件、平均与约数、程度和时段。53:28–58:12的本地ASR与原帧对齐补足另一例用题干时间或状态限定定位现状，并说明已有局限不能无据加强为过时；课堂同时存在“未提比较”与正文已有比较词、以及对象层级桥接未证两处疑点，因此不宣称全题唯一答案或完整长句证明。三问、长句分支与本例局部动作不混成固定步骤；例题解释MEDIUM，不代表整课或全部语义验收。


      “过度推测”课程在1至7分钟连续显示完整技巧说明：无原文直接或间接支持、加入主观常识、把限定描述绝对化是三类主要特征；操作上要求逐项判断选项与文章内容是否相符。直接和间接支持都算文本依据，因此该方法不是原词匹配，也不能把绝对词机械判错。


      来源 VIDEO_FA7A9B87AE91 的52、54、56、58、60分钟抽样画面逐项比较时间范围及用途与专门目的的差异；62分钟用明确更新间隔核对频率比较，并保留多数范围。运行层因此同时解释无依据添加的排除与有事实支持的改写，不能把“不逐字相同”视为过度推测。两条例题证据来自同一题，不重复抬高独立证据强度，置信度MEDIUM；时间均按源视频位置记录，不使用画面内另一计时器。


      来源 VIDEO_506197D7A2F4 的32:00–32:43本地ASR与32、33分钟原帧对齐，补充“过度推测”如何检查行为之外新增的目的或变化；43:33–49:42及51:50–52:58与44至53分钟逐分钟原帧对齐，补充“逻辑简化”如何将连续动作与题干所问方向核对，并区分局部提及与段落主要内容。两条为MEDIUM局部例题解释，非该方法全课或全方法音频验收；转写词面差异结合语境以清晰画面旁注，原ASR保留。口述范围疑点、未讲完的后续判断及现场AI翻译均留底稿，不作为新增规则。


      “因果选果”课程在2至4分钟明确说明：两个选项互为因果时，一般选择结果，除非题目明确要求原因。课程把原因视为可能的铺垫、结果视为更可能承载核心事件或影响；后续例题用连续动作的最终落点示范结果识别。运行层必须保留“同一因果链”“一般情况下”和“明确问原因时例外”三项限定。


      来源 VIDEO_32AC898539C2 的12、14、16分钟动作链仅辅助说明结果识别，原证据已收窄，不声称该例独立证明两个候选互为因果。22、24、26分钟通过批注区分操作背景与观察结果；27:26–34:01及37:39的本地ASR与原帧对齐补足另一例“先核完整内容、再判关系、最后按教师认定关系择优”的课堂动作，但正文未清楚证明两个候选处于同一因果链，因此该例只证明课堂应用，不放宽运行触发前提。50、52、54、56、58、62、64分钟补核目的题的背景/结论及最终选择标注，支持题干方向与候选内容分开判断、真实背景不等于主要目的；42至48分钟提出的条件桥接仍未获完整证明。另有
      VIDEO_CA1ABDAC65AE 的80:08–83:33本地ASR与原帧对齐，把题干所指现象、原文显性原因、现象解释及同段其他信息分开，支持明确问原因时按题干方向选因；教师未将其命名为“因果选果例外”，画面也未见该题字母标红。两例均为MEDIUM范围解释；运行层不扩大触发，不用常识补桥接。


      “主旨缺失”课程把主旨题干扰项分为细节干扰、片面概括和无关内容，并要求先从题干与选项重复信息形成主题假设，再到文章开头、结尾及各段首句求证，最后比较谁最全面准确且没有遗漏。重复信息只用于大胆假设，回文验证才可定案；课程同时说明细节题不适用主旨缺失排除。


      来源 VIDEO_643DE3C9770B 的13:04–22:47短段观点题说明，共同主题、上位概念或包含关系只能建立相关性，还须核候选对对象所作的完整判断、范围及是否无据增加特定人群、方式或必要性要求；教师同时明确该题只给一个段落、不同于全文。该局部动作与当前“不对明确某段题调用全文主旨流程”的边界并列保留，不自动扩大适用范围。84:00–90:00与122:00–126:00两个非连续本地ASR窗口补强全文标题例的对象、完整判断及结尾动作核对；90–122分钟未音核，教师对一项只覆盖末段的理由又与可见前文信息存在张力，完整排除链不代补。三条记录均为MEDIUM局部解释；具体题材、答案、固定词对和三化法入口不进入正式运行规则，不宣称连续讲解、全部段落功能或唯一答案证明已完成。


      “并列删除”专门课程要求把映射到原文同层并列内容的候选作为一组判断，同时明确题干若只限定其中一项就必须拆开独立核对。另一课程的总结页补充主旨题中两个并列小项与准确包含项的覆盖比较，并提醒
      and 可能表示先后而非并列。运行层因此只把连接词作为观察入口，保留题干限定、语义并列和题型范围三重边界。


      来源 VIDEO_CA1ABDAC65AE 的10:35–20:35本地ASR与原帧对齐，补足先锁定题干所问状态、定位候选信息、按教师分组共同排除，再正向核剩余概括的课堂动作；教师分组清楚，但三项严格同层关系未证，不据此放宽“同层并列”触发。40:19–50:05另一例先按题干限定共同排除范围外一组，再核剩余候选的具体动作、原因和完整限定；其中一项完整限定未逐项核清，前层相关信息也不改写成全文不存在。运行层继续要求语义同层、题干范围和正向内容依据同时成立，不按转折位置、原词或剩余项数量机械定案。例题解释置信度MEDIUM，不宣称全部排除理由闭合。


      “例子非答案”课程在约20分钟画面中给出完整技巧页：例子通常用于论证观点或主题，举例词及具体人物、地点、事件只负责定位；举例目的题中，只复述例子细节而没有触及所支持观点的选项大概率是干扰项。观点句常见于段首、段尾或转折处，但课程的“通常”“大概率”不能绝对化，最终必须验证例子与观点的支持关系。两份登记视频画面高度一致，按同一讲次重复发布处理，不作为独立证据重复抬高置信度。


      “三化法”课程在约10分钟画面中给出完整技巧页，把方法拆为化简首尾段、化简段首句和化简重复词。首尾段用于锁定主题词与作者态度，各段首句用于梳理总分结构和段落功能，题干及主旨题选项中的重复名词用于建立概念框架。16:26–17:10连续原声又明确重复词只是尽量寻找的入口，有时并不存在，找不到便转回首尾与段首，因此三类观察不发布为固定第一、第二、第三步。规则页另列反讽陷阱，但本次两个代表材料只补实设问回答分支，正式运行不新增反讽动作。高二目录中的两份视频时长和画面一致，按同一讲次重复发布处理；高三同名课程画面不同，尚未并入该证据链。


      '
