      完形新增课堂音轨与原帧补上此前仅文本重构的具体／宽泛候选比较，现有先核具体提示、再回主线找泛项正向支持及行动／感受归属检查不变；主被动名称有新口述来源，不新增独立算法。同根定义画面与名称已有，本轮仍未取得专门实战回链，不暂停现行已知派生线索。包含即选、无证猜大词、强施受词义与角色必定情感方向等口径保留为争议，不运行，不恢复固定空号或遍数。


      七选五新增空后these加概括名词整体表达反查前句内容的较窄样本，支持现行对应词／主语分支及问题—措施关系核查，不是独立代词法全部边界或裸复数代词硬筛验收。候选It只得篇章功能预测，画面This未有原音还原闭环；“一般”与“一定含名词项”冲突未勘误。初筛漏纳后纠正、无实际单复差异不由答案倒贴分组已有新现场来源，不改开头三一致一次及容易突破优先。


      来源、实际成本与未验音窗见`course-evidence.md`的2026-10-13三题型有界新视频补证及三个冻结报告；本次不把局部样本数当完整方法数，也不迁原例故事、词对、答案或强口径进运行模块。


