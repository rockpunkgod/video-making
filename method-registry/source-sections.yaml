  86930d8a2a7f39be:
    path: gaokao-english/references/course-evidence.md
    heading: 例子非答案的局部操作复核
    line_start: 173
    line_end: 178
    content: '### 例子非答案的局部操作复核


      来源 VIDEO_81C31AF17B80 的24、26、28、30、32、34分钟细化具体对象到概括对象的对应，并区分细节、态度与内容错误。34:24–41:45的本地ASR与原帧对齐进一步补足用途题识别、题干共同对象承接、例子到相邻观点及同主题候选的作用方向核对；其余候选只得到“未提当前主题”的口述排除理由，未逐项穷尽完整作用。44至52分钟指定抽样中的引语例区分复述材料与概括举例用途，并用相邻观点验证。来源
      VIDEO_506197D7A2F4 的89:30–90:42局部动作还表明：主题相关不足以证明候选新增的具体关系，发现缺少文本依据应撤回初判。以上只迁移抽象操作，固定二选一捷径、题内内容和答案不发布；直接询问例中事实的适用边界仍未由本批实战验证。证据均为MEDIUM局部音画或视觉材料，不宣称全课、完整答案链或全方法闭环。


      三化法补核来源 VIDEO_883578D5AF3B 的14:00–29:58与32:00–43:59两窗连续本地ASR及选定原帧。两组不同全文材料说明：重复概念只生成待验证框架，随后还要核对象、动作、属性、范围、设问后的回答与展开、结尾收束和全文覆盖；找不到重复词时仍可从首尾与段首进入。展示正文含省略号，不能补造未展示段落；“只看每段首句”与“首尾完整读、中间读段首”的口径并存，不发布为阅读上限。正式三化法因此只受限用于主要段落齐备的全文主旨、标题、态度或框架任务；局部事实、明确单段或缺主要段落时不调用，反讽分支仍未进入运行层。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  19e3c2370970eef9:
    path: gaokao-english/references/course-evidence.md
    heading: 证据门禁
    line_start: 179
    line_end: 183
    content: '## 证据门禁


      VIDEO_506197D7A2F4本轮接完94分钟至132分43秒课尾本地ASR，并与95至132分钟逐分钟及132分42秒共39张原帧局部对齐。98:53–101:49解释核心动作对应后仍核附加参与者、候选代词还原后再比主体；101:49–106:46解释单方数值不足、比较时间阶段不可偷换，教师同时保留该题推断不严谨的疑问，不能以倾向答案替代完整证明。121:05–124:48说明题干已明示共同对象时，候选未复写不等于缺失，还需回文比较动作及修饰关系；教师先漏看后自纠的过程单独保留，不把首次未找到作为不存在。新增三条MEDIUM，只解释既有方法，不发布原题对象、词对或答案；全课连续转写到尾仍非直接逐字听核或全方法验收。


      方法进入运行层至少需要可追溯的课程证据、明确目标、触发、可执行动作、验证方式、禁用或停止条件以及例题落点。仅有文件名、单张标题页、自动转写候选或单个例题行为不能激活方法。

      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  dba42e053595968b:
    path: gaokao-english/references/delivery-contract.md
    heading: 学生交付合同
    line_start: 1
    line_end: 4
    content: '# 学生交付合同


      输出是一条给单个学生的微信答疑消息，不是报告、讲义或内部审计。开头只称呼一次“同学”，语气自然、直接。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  c67e427be2476907:
    path: gaokao-english/references/delivery-contract.md
    heading: 交付内容
    line_start: 5
    line_end: 20
    content: '## 交付内容


      把题做给学生看，从题面证据一步步走到结论。讲解按课程要求的做题顺序推进，不按原题号机械顺讲；只有最后汇总才按原题号。每一步的判断过程看得见：先看哪儿、看到什么、所以下一步查什么，查完再给结论。


      **顺序本身也要讲出来，不能默默按顺序走。** 七选五要说清先做哪个空、凭什么说它容易突破；阅读 C、D 篇要说清先把主旨题做掉、再回头做细节和猜词；完形要说清这一空第一遍定不下来先放着、后面凭什么能回收；语法填空要说清先把无提示词的空过完再回头做有提示词的。让学生听得出这一步为什么先做、下一步为什么接这个。


      课程方法要真的用出来，不省略会改变答案的对象、主体、范围、否定、条件、比较、因果、时间或核对环节。


      方法要先点明再展示动作。分析类的方法，先说清这一步用的是哪个方法，再展示它在这道题上怎么做，让判断过程看得见；固定判据类的排除或选定技巧，直接点明即可，不必展开过程。点明是嵌在讲解里的，句子连着说下去，不另设方法小结或方法复习那样的栏目。


      开场直接说“我们来分析一下”，然后进题面证据。不交代题型名，也不交代要用哪个方法，方法名放到实际用到它的那一题里说。


      整篇一次交完，不分批，长一点没关系。讲完全部按原题号汇总一次答案，中间不报答案串。


      先给可复核证据，再给结论。不以答案键为理由，不评价答案键，不评价学生对了几空错了几空。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  d9227fd018e5a452:
    path: gaokao-english/references/delivery-contract.md
    heading: 交付形态
    line_start: 21
    line_end: 30
    content: '## 交付形态


      只交付纯文本，不使用 Markdown 标题、列表、表格、链接、代码块或内部字段。中文只使用逗号、句号和问号，引号一律不用，中文原词和英文原词都直接嵌在句子里；英文原文自身的标点照原文，题号按题面保留。


      要有活人感，像老师坐在旁边跟学生说话，语气自然，句子长短可以不齐；不要那么齐整，不排编号条目、不分点罗列、不加小标题、不做表格，该连着说就连着说。排版不拘束，但内容不打折，课程顺序和证据链一条都不能少，活人感不等于把方法步骤省掉。


      不得把整篇讲解写成重复的“题号，用某方法，一句对应关系，所以选某项”。这种格式即使答案和方法名正确，也不算现场讲解。往后用“这里先看”“再回到”“这两个还在竞争”“现在才能定”一类自然衔接呈现实际收缩过程，不机械重复同一句式。七选五整篇另有开头要求，见《做题顺序》一节：先展示三一致分组，再说从哪个另类项或突破口先做。


      必要时用设问牵住注意力，先把学生此刻心里的疑问问出来紧接着自己答；自己接住，问完给依据，不连珠不满篇，答案显而易见的地方不问。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  80097a5ebb7614ba:
    path: gaokao-english/references/delivery-contract.md
    heading: 不写什么
    line_start: 31
    line_end: 44
    content: '## 不写什么


      不写大段翻译或逐句解释。原文只在需要时短引决定答案的几个词，念完一句话说清它在本题的作用，不整句翻译，不把段落通译一遍，不为凑篇幅复述原文。


      课程口诀只供内部记忆，稿里不复述、不用口诀收尾；方法名可以说，学生要认的是那个方法名。


      不写镜头停顿指令、师生角色脚本、旁白或舞台说明。不做文风表演，不刻意写错字、碎句、表情或犹豫，不编造错误尝试，不装不会，不演语气。


      不展示证据编号、来源台账、置信度、路由、内部推理或质检过程，不提识图过程，不说已核对。不得自称教师，不得虚构教师原话、课堂记忆或“老师讲过这道题”。


      学生发来图片时稿子里不提这件事，不写“图片里”“图中”“你发的图”“如图所示”“截图上看”，也不交代自己是怎么看到题的；题目里的英文、题号、选项照常引用。


      题面关键字词或选项辨认不清时，具体说清是哪一处、哪一空、哪个词，然后停下等学生补，不猜着讲、不自行补一个意思、不按推测的版本继续做。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  c087e45a16752b01:
    path: gaokao-english/references/delivery-contract.md
    heading: 做题顺序
    line_start: 45
    line_end: 58
    content: '## 做题顺序


      做题和讲解都按课程要求的顺序走，不按难易自由重排，也不能把一个题型的顺序搬到别的题型。


      七选五是四个题型里唯一按容易突破的先做的：先分析找区别，**按三一致的分组结果要展示出来，落到具体字母**，说清哪几项同属结构一致、哪几项同属主语一致、哪几项同属时态一致；哪一维在本题没有区分度就如实说没有，不编造组。然后找另类项先做，看突破口，带着区别读正文找对应，最后用关系定。分组只在开头展示一次，后面直接说正文怎样把候选留下或排掉，不逐空重复分组。别的题型都不按这个来。


      阅读按篇分两套。A 篇、B 篇按题目顺序做；C 篇、D 篇先主旨、后细节、后猜词，猜词最后做。篇号只是常见对应，判据仍是全文的中心任务，不能只看篇号顺序。


      完形按原空号走两遍，第一遍拿不准的先跳过，回头第二遍再做，不预先按难易重排。


      语法填空整篇先做无提示词的空，再做有提示词的空，每遍内部按原空号，最后按原空号汇总。不是顺着空号一路做下去。


      学生只问一处时，按他问的那一处讲，不必把整篇的几遍走完。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  1574e5aab98c8498:
    path: gaokao-english/references/delivery-contract.md
    heading: 范围
    line_start: 59
    line_end: 65
    content: '## 范围


      学生只问一处就只解决这一处，按对应模块给这一处需要的候选、上下文和核对，不泛讲整个题型，不顺手把其他空和全篇答案报一遍。


      学生问的是方法本身而不是某道题时，按题目型模块里那条步骤链答，用课程原名，不换成通用说法，也不顺手把整个题型讲一遍。


      学生点名用某个方法做某道题时，交付稿必须真的用那个方法，按它自己的步骤走，不用同模块别的办法顶替。指定方法与题型对不上时，先说明它属于哪个题型、为什么在这里用不了，再问是换题还是换方法。

      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  3bd4b067610ebee7:
    path: gaokao-english/references/evidence-gaps.md
    heading: 尚未激活的题型
    line_start: 1
    line_end: 9
    content: '# 尚未激活的题型


      听力和综合训练目前虽在课程目录中存在材料，但还没有完成足以支持方法执行的名称、步骤、触发、边界、例题与验证闭环。语法填空、完形填空和应用文目前只开放已明确取证的局部规则或操作模式，不代表这些题型的完整课程流程已经闭环。


      阅读“三化法”已经受限激活，但只覆盖主要段落齐备的全文主旨、标题、态度或框架任务。局部事实题、明确单段题或缺少主要段落的题面不在这一范围；不得借方法名补造缺失正文。


      遇到这些请求时，不得复用旧版 Skill 的流程，不得用通用英语知识冒充课程教法，也不得根据视频文件名推断老师的步骤。


      给学生的处理方式应简短明确，说明当前课程资料还不足以支持按本课程方法作答，并指出需要补充或核验的具体内容。如果题面本身也不完整，优先说明题面缺口。

      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  325a7bd6bf58f7b4:
    path: gaokao-english/references/listening.md
    heading: 听力
    line_start: 1
    line_end: 6
    content: '# 听力


      课程没有提供听力方法。听力讲义和音频已纳入来源台账，但时间戳转写与教师讲解的对齐尚未完成，**当前没有可调用的课程方法**。


      不因此改用通用听力技巧，也不根据文件名或题型常识生成课程流程。学生问听力方法时，照实说明课程材料里这一块还没有可用的方法，不硬凑步骤。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  e68cdb2a99505da8:
    path: gaokao-english/references/listening.md
    heading: 交付与其他题型一致
    line_start: 7
    line_end: 19
    content: '## 交付与其他题型一致


      听力虽然无方法可讲，交付形态仍按 `delivery-contract.md` 的同一套要求，不另立规矩：


      - 一条给单个学生的微信答疑消息，开头只称呼一次「同学」，语气自然、直接。

      - 只交付纯文本，不使用 Markdown 标题、列表、表格、链接或内部字段。

      - 中文只使用逗号、句号和问号，引号一律不用；英文原文自身的标点照原文。

      - 要有活人感，不排编号条目、不分点罗列、不加小标题、不做表格。

      - 不写大段翻译或逐句解释，原文只在需要时短引。

      - 不写镜头停顿指令、师生角色脚本、旁白或舞台说明，不做文风表演。

      - 不展示证据编号、来源台账、置信度、路由、内部推理或质检过程。

      - 材料或题目辨认不清时，具体说清是哪一处，然后停下等学生补，不猜、不自行补全、不按推测版本继续。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  f40f1d6a694e1187:
    path: gaokao-english/references/listening.md
    heading: 边界
    line_start: 20
    line_end: 22
    content: '## 边界


      有方法可讲时按课程证据补进来，没有就停在这里。只解释课程已经给出的内容，不补造解法，也不把别题型的方法搬过来。

      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  bc6a0fa4b4a4e881:
    path: gaokao-english/references/reading-comprehension.md
    heading: 阅读理解
    line_start: 1
    line_end: 8
    content: '# 阅读理解


      当前激活课程原名“主客一致”“同源替换”“比较级谨慎选”“过度推测”“因果选果”“主旨缺失”“并列删除”“例子非答案”“三化法”“代词指代”和“逻辑简化”。课程原始材料另有“跳读定位”“跳读法”“积极阅读法”“名词定出处”“题文同序”“动词定逻辑”和“mainly题／主旨大意题”的直接证据。学生说“定位阅读法”“顺藤摸瓜”“左顾右盼”或“中心思想”时，按下方映射理解，不把这些未证名称冒充课程原名或新增独立方法。


      只调用题面真正触发的方法。先抓能缩小范围的信号，再核决定候选差异的对象、动作、属性、范围或关系；证据足够即可停止，不要求逐项长讲。定位、形式一致或排除一项不等于最终正确，所有结论仍须回到原文。


      做题顺序按篇分两套：**A 篇、B 篇按题目顺序做；C 篇、D 篇先主旨、后细节、后猜词，猜词最后做**。篇号只是常见对应（A 应用文、B 记叙文、C、D
      说明议论文），判据仍是全文中心任务，不能只看篇号定顺序。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  8a05d7a33ec3022c:
    path: gaokao-english/references/reading-comprehension.md
    heading: 按题型任务分流，不按文体硬套
    line_start: 9
    line_end: 18
    content: '## 按题型任务分流，不按文体硬套


      课程原始材料没有为当前阅读方法建立一张“应用文专用、记叙文专用、说明文专用”的完整方法表。篇号和文体只能帮助理解文章组织方式，不能决定方法。先判题目问的是定位细节、主旨或段落大意、指代、因果、比较、例子作用还是复杂逻辑，再调用对应方法；同一篇文章可以因不同题目调用不同方法，但不能把一个方法的边界搬到另一题。


      需要从题干回到原文找段落、句子、事件位置或信息区时，可调用课程原名**跳读定位**，以及积极阅读法中的**名词定出处、题文同序、动词定逻辑**。这套动作适用于任何材料中确有定位需求的阅读题，不能写成应用文专属，也不能把大标题、小标题、数字、日期或专名扩成固定清单。


      学生说“顺藤摸瓜”，只映射到名词定出处和题文同序在有事件推进材料中的局部用法；学生说“左顾右盼”，只映射到定位后补读必要上下文并核动词逻辑。两个说法都不是已证课程原名，不能作为记叙文专属方法，也不能替代主客、因果、指代等题目实际需要的方法。


      学生说“中心思想”，先按题干区分全文主旨和段落大意，调用课程 mainly 题／主旨大意题的已证动作：扫选项共同主题，去同求异，回所问范围核贯穿内容，排片面和范围偷换，再定概括是否闭合。全文结构不清时才调用三化法；全文主旨、目的或标题的干扰项核对调用主旨缺失。中心思想不是记叙文专用方法，也不能直接覆盖所有推断、作者意图或人物品质题。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  f361077dcacb47ff:
    path: gaokao-english/references/reading-comprehension.md
    heading: 阅读方法适用边界
    line_start: 19
    line_end: 30
    content: '## 阅读方法适用边界


      下列方法按题面任务调用，不按文章文体调用：主客一致检查意愿与事实、能力与意愿或施受关系偷换；同源替换核对可定位内容的同义、反义、同根或结构对应；比较级谨慎选处理真实相对关系；过度推测检查候选新增的对象、目的、范围、因果或确定程度；因果选果只在同一因果链且题干方向允许时使用；并列删除只在同层并列和题干范围成立时使用；例子非答案只在题目问例子作用时使用；代词指代只在题目要求还原指代时使用；逻辑简化只在复杂句、复杂段落或复杂关系需要还原主干时使用。这些方法没有被课程证据限定为某一种文体，也不能因文体判断而整包调用。


      下列方法有明确任务范围：三化法用于主要段落齐备而需要建立全文主题、态度、结构或框架的任务；主旨缺失用于全文主旨、写作目的或最佳标题的候选干扰检查；mainly题操作用于题干明确问全文或段落主要内容、中心论点、主题或主要讨论对象。局部细节、明确某段事实题或缺少主要段落时，不调用全文三化法或主旨缺失流程。


      **说明文、议论文**（常见于 C、D 篇）：主力是**三化法**和**逻辑简化**。三化法化简首尾段、段首句和重复词，用来定主题、态度和结构；逻辑简化用三问法查主旨、态度褒贬和结构，长句先找谓语再划分介词短语、非谓语、插入语和从句。全文主旨、写作目的和最佳标题用**主旨缺失**。这一路按先主旨、后细节、后猜词做。


      **三类都可能触发**：主客一致、比较级谨慎选、过度推测、并列删除、例子非答案。按当前题面实际触发调用，不能因为判了某一类文体就把整包搬过来。


      阅读内部不得调用七选五的主体、时态、结构分组，也不得把完形首句或瞻前顾后名词复现当作阅读方法。多个阅读法联用时，分别说清各自解决的对象、关系或范围差异。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  eabe3dd37fa4d962:
    path: gaokao-english/references/reading-comprehension.md
    heading: 主客一致
    line_start: 31
    line_end: 38
    content: '## 主客一致


      触发：选项与对应原文可能在意愿和事实，能力和意愿，或动作发出者与承受者之间发生偷换。没有这些可比差异时不用本法单独定答案。


      快判：并排保留完整谓语，按题面实际出现的差异选择检查维度，不强制串行。比较人物是希望、打算或看法，还是事实已经成立；或比较谁发出动作、动作指向谁。候选有明显肯否对立时可先缩小，再核被肯定或否定的具体动作、对象和状态。题干问实际或直接结果时，只认已经发生的对应事实。


      边界：愿望目标不等于已实现，能力不等于意愿，相同肯否也可能说不同内容。只有确认偷换才可排除；一致只通过这一项检查，不能自行扩写题面没有的施受关系。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  6666ada9f1f24eb8:
    path: gaokao-english/references/reading-comprehension.md
    heading: 同源替换
    line_start: 39
    line_end: 46
    content: '## 同源替换


      触发：题干、候选与原文之间存在可核的同义、反义、同根或共同结构表达，可用于定位和缩小范围。


      快判：在可定位的细节题中先抓题干所问对象、动作或关系及其限制，锁定正文段落；再用候选中有区分度的名词或名词短语定位对应句。找到句子后先核同一对象及动词关系，再比较候选与原文的形副修饰、范围和程度能否同义或等值替换，最后回题干确认整项回答所问。某个定位词未原样出现，可换同一问题中的动作及近义表达；题干已经明示共同对象时，名词复现无区分度，直接比较它们对对象作出的完整断言。


      现场详解：明确说出题干定位线索、所在段落、选项对应句子，再把真正竞争的动作逻辑和修饰范围并排核对。边界：同词或近义词命中不能直接选；多个对应词也不能按数量定案。修饰成分相似也不能单独定案，必须保留否定、条件、主体、对象和完整谓语；所在句不能闭合时扩看必要上下文，不任意补省略信息。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  0286ea8d84554809:
    path: gaokao-english/references/reading-comprehension.md
    heading: 比较级谨慎选
    line_start: 47
    line_end: 54
    content: '## 比较级谨慎选


      触发：题干或候选出现比较、最高程度或可核的相对关系。


      快判：优先定位正文的真实比较，核双方、属性、方向、程度、范围、时间阶段和条件。同义改写可以成立，但必须仍在同一维度；候选改变属性、阶段、对象或强度则不能接受。


      边界：没有同一个比较词只表示尚未定位，单方数值不能完成比较。原文有相对比较不自动支持最高级，最高级也不自动错误。后来表现不能补成先前性质；未定位、已证伪和仍有疑点要分开。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  044ac82fa0d47a9d:
    path: gaokao-english/references/reading-comprehension.md
    heading: 过度推测
    line_start: 55
    line_end: 62
    content: '## 过度推测


      触发：候选核心内容似乎对应，但可能额外加入参与者、目的、用途、时间、范围、因果或确定程度。


      快判：先保留候选核心断言，再检查它多说了什么。新增内容没有直接或间接文本支持才排除；原文用事实或数量关系支持的概括，即使没有逐字复述也可成立。


      边界：间接支持也是支持，绝对词不是自动错误。不得把部分或多数扩大为全部，不把可能改成必然，也不把行为补成未经说明的目的。只排除一个过度项不能证明剩余项正确。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  15040a878068eea0:
    path: gaokao-english/references/reading-comprehension.md
    heading: 因果选果
    line_start: 63
    line_end: 70
    content: '## 因果选果


      触发：至少两个候选各自有文本支持，并且正文支持它们属于同一因果链。共同对象、连续动作、矛盾、并列或纯先后不够触发。


      快判：先服从题干。明确问 why、reason 或 cause 时，锁定所问现象和正文相连原因，不执行“选果”。题干未明确问因时，再分清同链候选中的原因、中间结果和最终结果，一般优先核结果项是否承载题干所问的核心事件、影响或主要信息。


      边界：课程说的是一般偏好，不是见因果必选最后一项。两个候选必须先各自成立、同链桥接也必须有原文依据；结果项仍须回答题干且不扩大范围。段落目的题还要区分背景与主要结论，过程、观察结果和研究重点不能混用。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  30dc89c0d75b4e5e:
    path: gaokao-english/references/reading-comprehension.md
    heading: 主旨缺失
    line_start: 71
    line_end: 78
    content: '## 主旨缺失


      触发：只用于全文主旨、写作目的或最佳标题；明确细节题不用。


      快判：可由题干和候选共同概念提出待验证主题，再查文章开头、结尾和各段首句。候选都相关时，把每项拆成“谈什么”和“作什么判断”，比较谁只覆盖局部，谁准确涵盖核心关系，谁扩大或换了属性。


      边界：重复词、范围更大、包含其他候选或出现段数更多都不能定案。指出以偏概全时须说明遗漏的核心内容。候选动作可同义概括，但必须有全文对应依据。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  1e472a9b9651a5a0:
    path: gaokao-english/references/reading-comprehension.md
    heading: 并列删除
    line_start: 79
    line_end: 86
    content: '## 并列删除


      触发：至少两个候选映射到原文同层并列内容。and、also 或同话题只提供入口，不能单独证明同层。


      快判：先说明并列组共同解释什么，再与题干对象、状态和范围比较。题干未限定组内一项时，可共同保留或排除；只问其中一方面时拆开核。状态发生变化时，分别核变化前后，锁定题干实际问哪一阶段。


      边界：共同排除必须有不能回答所问的内容理由，不能只因它们位于转折前。主旨题中准确包含并列小项的候选才可比较覆盖，细节题不享有包含项优先。排组后剩余项仍须有正向依据，不能因只剩一项定案。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  9ad7dfba5f2dff1d:
    path: gaokao-english/references/reading-comprehension.md
    heading: 例子非答案
    line_start: 87
    line_end: 94
    content: '## 例子非答案


      触发：题干询问为什么提及某人物、地点、数据、研究、引用或事件，或该例说明什么。直接问例中事实时不用本法排除细节项。


      快判：用举例标志或具体对象定位例子，分开“例中发生什么”和“作者借此说明什么”，再读例子前后观点。候选同主题时，直接比较它声称的是原因、后果、危害、重要性还是其他作用，用例中动作和前后评价核方向。


      边界：重复人名、数字或例子细节不是作用答案，更抽象也不自动正确。新增作用没有依据就撤回初判；引用和数据也要区分复述材料与概括用途。段首、段尾和主题词都只是查找入口。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  4311f90fc985aca0:
    path: gaokao-english/references/reading-comprehension.md
    heading: 三化法
    line_start: 95
    line_end: 102
    content: '## 三化法


      触发：文章主要段落齐备，任务是全文主题、作者态度、主体结构、最佳标题，或需要先为长文建立框架。局部事实、明确单段或缺主要段落时不调用。


      快判：三化法的默认现场顺序是，先题干和主旨题选项，提取重复词或共同概念形成假设；再化简有效首尾段，读首尾句确认主题词和褒贬；再化简中间各段首句，梳理结构和段落功能；最后回到全文核候选覆盖。这个顺序是现场入口，不是机械固定三步；首尾段、段首句和重复词可按题面切换观察入口，重复词缺失时跳过而不停止。首段背景不算有效首段，中间段首句若是背景则优先看段尾；段首设问须连同回答和展开。


      边界：重复概念不是答案，不能只数词频。共同对象确定后仍核动作、属性、范围与条件；首尾、段首也不是阅读上限。主要段落缺失或无法建立可验证框架时停止，不补造未展示内容；未核反讽分支不启用。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  dfb7dd8dc0c2e8a1:
    path: gaokao-english/references/reading-comprehension.md
    heading: 代词指代
    line_start: 103
    line_end: 112
    content: '## 代词指代


      触发：题目要求判断代词、指示表达、状态或命名概念所指内容。


      快判：先还原代词。实体指代可用单复数缩小，再用所在谓语区分动作参与者并回填；多个同数候选时直接比角色和限定。状态指代要保留谁处于什么状态、动作、否定和程度，分清需要改变的原状态与希望达到的结果。附近不足时扩大上下文，也可借后文倒推后回原处验证。


      指示性解释清楚时，可用于有限词义分支：先据句中位置和并列关系判断词性，再还原实际解释，最后核候选语义。概念命名句则回看它概括的行为，行为内部仍有代词时继续还原；也可由候选共同对象定位，不强制两入口串行。


      边界：最近名词、数一致、相同词语或同词性都不能单独定案。状态不能缩成一个名词，结果不能冒充原状态；相邻全部描述也不能都当词义。没有明确指示解释关系时停止有限词义分支。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  50c776e095b0086b:
    path: gaokao-english/references/reading-comprehension.md
    heading: 逻辑简化
    line_start: 113
    line_end: 122
    content: '## 逻辑简化


      触发：复杂句、复杂段落或选项关系需要先看清主干、态度或结构。


      快判：课程“三问法”检查主旨、态度褒贬和结构，但按题干调用相关观察，不要求局部题三问齐做。长句难读时先找谓语，再划分介词短语、非谓语、插入语和从句并结合词组理解。问过程时核同一对象的动作是否真实连接；问现状时把当前状态与后续目标分开。


      比较句要还原省略动作，并保留平均、约数、程度、时间和条件。简化后把核心关系与题干、候选对齐，再回原句确认没有丢失否定、转折、条件、比较或因果。


      边界：划分结构不是删掉修饰后直接作答。动作多不等于构成过程，目标不等于已经实现，转折后也不自动是答案；改变结论范围的修饰必须保留。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  7a963f5609d19db8:
    path: gaokao-english/references/reading-comprehension.md
    heading: 跳读定位（学生常说定位阅读法）
    line_start: 123
    line_end: 132
    content: '## 跳读定位（学生常说定位阅读法）


      课程原名：跳读定位，教师口述中也称跳读法。学生说定位阅读法时映射到本节，但不把后者写成教师原名。触发：题干需要由题面回到原文寻找对应段落、句子、事件位置或信息区，尤其材料按区块提供信息时。


      快判：先读题干，判断所问对象并把范围缩到段落、事件区间或信息区；再用专名、大写、数字、比较词、否定等醒目标志定位。定位后按课程“名词定位、动词逻辑、形副范围”核完整断言和必要上下文。题文同序可以缩小范围，但定位词不等于答案。


      价格、人数、日期、距离若是题目条件的一部分，按题面计算或比较，不能只找同数字。其他比较、资格、出处和目的关系，只有当前题面实际出现时才核，不扩成固定清单。


      边界：定位到段落或区块不等于定案，仍须核对象、动作、范围、否定和条件。猜词题可能与其他题共享段落，不能绝对一题一段；不能把看到图表、小标题、同数字或最近位置当作答案；未证“两选一先看短项”等扩写不启用。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  c51d31bdcc7d5e16:
    path: gaokao-english/references/reading-comprehension.md
    heading: 名词定出处与题文同序（学生常说顺藤摸瓜）
    line_start: 133
    line_end: 140
    content: '## 名词定出处与题文同序（学生常说顺藤摸瓜）


      课程原名和直接证据来自积极阅读法中的“名词定出处”和“题文同序”。学生说顺藤摸瓜时映射到这组动作，但名称未证为课程原名。触发：细节题需要沿人物、事件或文章推进缩小出题点。


      快判：抓题干或选项中有区分度的人物、地点、事物名词，结合题文同序估计出题区间，再回文核同一对象做了什么、处于什么阶段。顺序只用于定位，不能代替动作和范围核对。


      边界：同一人物可能跨段出现，插叙、回叙或跨段综合时不能机械按顺序；题干问原因、结果、品质或主旨时，仍调用相应已证方法。例题中的固定词对、5W清单和单题答案不迁移。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  9f5952ba46e2e61c:
    path: gaokao-english/references/reading-comprehension.md
    heading: 定位后上下文核对（学生常说左顾右盼）
    line_start: 141
    line_end: 148
    content: '## 定位后上下文核对（学生常说左顾右盼）


      课程原始材料未证“左顾右盼”为方法名。学生使用这个说法时，只映射为跳读定位后必要的上下文核对和积极阅读法中的“动词定逻辑”。触发：定位句本身不能闭合题干所问关系。


      快判：先找疑似句，再按当前关系扩大到必要的前后文，补清前因、后果、指代或转折，最后回到完整断言核主体和动作。不是固定先读左一句再读右一句。


      边界：比较时看主体和动作，不只看同词。附近不足时扩大范围，仍要说明补到的内容怎样支持本题；名称未证，不能限定为记叙文专属，也不能与完形的瞻前顾后法混用。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  e86b48de8f954f83:
    path: gaokao-english/references/reading-comprehension.md
    heading: mainly题与主旨大意（学生常说中心思想）
    line_start: 149
    line_end: 158
    content: '## mainly题与主旨大意（学生常说中心思想）


      课程原始材料直接支持的是mainly题、主旨大意题和段落大意题。学生说中心思想时映射到本节。触发：题干问全文或段落主要内容、中心论点、主题或主要讨论对象。


      快判：先分清全文范围还是段落范围，扫选项找共同主题对象，再去同求异，带着差异回到所问范围核哪种内容贯穿其中，排除只覆盖局部、堆细节、扩大范围或偷换对象的项。共同主题词、抽象程度和首尾结构只能提供入口，不能单独定案。


      边界：若当前段落主题已清楚，不机械调用三化法；全文主旨、目的或标题的范围与干扰项核对仍按主旨缺失。未有课程证据支持把本节扩成记叙文专用，也不能据此直接处理所有推断、作者意图和人物品质题。


      边界：品质由反复出现的行为、关键选择和结局支持，不从一次动作武断定性。推断只走证据支持的一小步，不替人物编动机，结尾感悟必须与前面经历相符。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  45520a599da9cbf4:
    path: gaokao-english/references/reading-comprehension.md
    heading: 现场与整篇输出
    line_start: 159
    line_end: 162
    content: '## 现场与整篇输出


      单题现场讲解可先报有题面依据的暂定关系，再回原文核对象、动作、范围和逻辑；未触发的阅读方法不补讲。整篇请求只在各题实际调用的方法处停留，不能为了显示十一法而逐法套用。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  cad93ba752127bd4:
    path: gaokao-english/references/reading-comprehension.md
    heading: 输出
    line_start: 163
    line_end: 165
    content: '## 输出


      每题写本题实际使用的课程原名、决定性原文关系和选出或排除结论。多个方法联用时只说明各自实际作用。一个方法只完成定位或排除时，仍须用题面正向证据核答案，不能据剩余项自动选。证据不足时指出具体缺口并停止。

      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  12557f9aa3b76711:
    path: gaokao-english/references/router.md
    heading: 请求路由
    line_start: 1
    line_end: 17
    content: '# 请求路由


      先按题面结构识别题型，再读对应模块。标题、年级、课程文件名和答案字母都不是路由依据。


      完整文章后有 A 到 D 选择题，进入阅读理解。正文含五个空并提供 A 到 G 七个候选句，进入七选五。短文中有连续空位且每空配四个词项，进入完形。听力材料读本目录的
      `listening.md`。


      短文空位中部分带括号提示词，那是语法填空，不在本 Skill 范围，交给 `gaokao-grammar-fill`。要求续写两段且给出段首句，或要求书信、通知、演讲等短文，那是作文，交给
      `gaokao-writing`。这两类都不要用本 Skill 的解题方法硬套。


      请求类型分为讲具体题、纠正学生判断、解释方法、指定方法做题。无论哪种请求，都先检查该题型是否有激活方法，再检查触发与边界。请求范围还要区分整篇与单题。整篇按题型逐题构建实际触发方法集合，只调用对应模块的方法；单题按当前空或题干的触发条件处理。七选五整篇默认在开头统一按主体一致、时态一致、结构一致形成一次暂定分组，单题则在该题开头分组一次；分组要落到具体字母，没有可观察区别的维度如实说明。完成后按容易突破的空推进并回正文求证，不在后续逐空重新分组。


      当前可执行阅读路由包括已激活的主客一致、同源替换、比较级谨慎选、过度推测、因果选果、主旨缺失、并列删除、例子非答案、三化法、代词指代和逻辑简化。课程证据还支持跳读定位、积极阅读法中的名词定出处、题文同序、动词定逻辑，以及mainly题的主旨大意操作；学生说定位阅读法、顺藤摸瓜、左顾右盼或中心思想时，按阅读模块的映射解释，不把未证名称当作独立课程原名。七选五、完形及其他题型路由保持不变。路由隔离是硬边界：阅读仅进入阅读模块，七选五仅进入七选五模块，完形仅进入完形模块。跨题型的同名词、首句、复现、主线或逻辑动作不能作为方法证据。


      阅读模块分工两层。入口层按文体给优先顺序，帮学生省下逐题判断任务的开销：A 篇这类应用文先按定位入口走，B 篇这类记叙文先按事件线走，C、D 篇这类说明文议论文先按主旨走。主旨类任务进入三化法时，先读题干和主旨题选项形成假设，再看有效首尾段，最后看中间段首句；重复词缺失时跳过该观察，仍完成首尾和段首核验。调用层按题面实际问什么来定：需要快速回原文找对应位置时用跳读定位及名词定出处、题文同序；需要核前后关系时用动词定逻辑和必要上下文；全文或段落主旨题按mainly题操作，并在全文结构不清时调用三化法、主旨缺失。主客、同源、比较、过度推测、因果、并列、例子、代词和逻辑简化均按各自题面触发条件调用。


      入口层只是做题优先顺序，不是课程规定的方法对照表；课程没有为阅读方法建立文体专属表，两层冲突时以题面任务为准。用户口语中的定位阅读法、顺藤摸瓜、左顾右盼和中心思想只作映射标签，不把应用文或记叙文专属规则写成课程事实。


      学生指定的方法若不存在、未激活、与题型不匹配或越过禁用条件，直接说明不能按该方法可靠处理，不得默默换方法。

      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  d7565655970548ff:
    path: gaokao-english/references/seven-five.md
    heading: 七选五
    line_start: 1
    line_end: 6
    content: '# 七选五


      当前激活课程原名：总起句做题法、结构一致、主语一致、时态一致、对应词法、逻辑关系法、褒贬一致。目标是用实际触发的技巧尽快缩小候选，再以决定性内容关系和必要核对定案。形式、位置、同词、时态或褒贬只能提供入口；没有内容闭环时暂留，不硬选。


      做题顺序：**按容易突破的先做**，先分析找区别，完全分组落到字母，找另类项先做，看突破口，带着区别读正文找对应，最后用关系定。这是四个题型里唯一按难易挑题的，不推广到别的题型。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  1f0cf16c1e5de56a:
    path: gaokao-english/references/seven-five.md
    heading: 共同行为
    line_start: 7
    line_end: 14
    content: '## 共同行为


      - 整篇现场先统一扫一遍七个选项的结构角色、主体或核心话题和真谓语时态，分别形成结构一致、主语一致、时态一致的暂定组；单题则在该题开始时做同样的一次初筛。三维没有可观察区别时如实标记无区分度，不编造组。分组完成后立即回到老师的内容解题顺序，带着暂定组核空位前后和段落中的主体、对象、动作、时间线、句间功能及段落任务；正文新线索只能用于核正文和比较候选，不重新机械分组。随后按当前题面实际触发的内容、对应词、逻辑或褒贬方法定案，内容不闭合时暂留。

      - **三一致的分组结果要展示给学生，落到具体字母**：分别说清哪几项同属结构一致、哪几项同属主语一致、哪几项同属时态一致；某一维在本题没有可观察区别时如实说没有区分度，不编造组。整篇在开头展示一次，单题在该题开头展示一次，后面直接说正文怎样把候选留下或排掉，不逐空重复分组。

      - 初筛只决定优先核哪几项。保留组都接不上时，重查初筛依据和暂放项；题面已明确否定的项不能无据恢复。

      - 同一形式仍有多项时，比较完整断言中的主体、动作、对象、范围及上下句功能。只报真实使用的方法，不罗列未用方法。

      - 多个候选都能局部接上同一后续结果时，先用空前已给的具体条件和全段持续处理的问题限定范围，再核各自完整断言与条件、结果及段落任务是否共同成立。不能只因一项主观上更像原因，就在题面没有否定依据时撤销另一项已经成立的关系。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  1fcc9966ce085922:
    path: gaokao-english/references/seven-five.md
    heading: 总起句做题法
    line_start: 15
    line_end: 22
    content: '## 总起句做题法


      触发：空位在段首或第一段段尾附近，后文围绕一个主题展开原因、策略、分类、例子或步骤。


      快判：先确定候选需要统领一个段落还是后面的若干分项，再概括各分项的共同主题和展开方向。候选必须既覆盖整个管辖范围，又能引出实际展开；只对应一个例子、数据或步骤的项不能定案。Here
      are、There are、as follows、following ways/tips/strategies、主题词复现和位置都只是提示。


      必要核对：还原候选代词与前文的承接；有竞争项时，预测“若选此项，后面各分项应谈什么”，再与实际展开比较。段首形式一致或同动词而对象不同，仍不成立。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  a8f0c4ae44ae61ff:
    path: gaokao-english/references/seven-five.md
    heading: 结构一致
    line_start: 23
    line_end: 34
    content: '## 结构一致


      触发：小标题、段落或段内总分、相同句型、特殊句式，或空位需要补完同一句。


      快判：先判空位的结构角色，再比较完整句型；结构留下的候选必须继续核实际内容。补同一句时用课程“半句话原则”，检查空前未完成的结构和连接关系。大小写仅作辅助，I
      在句中仍大写。


      必要分支：


      - 小标题要看整段共同主线，不能只复述一个作用或结果；标题只限定方面，不直接证明段内空。

      - 平行句比较完整动作与结果。不同说法可能是在重述同一内容，也可能是不同做法或效果，不能只数并列词。

      - 判断句型看整句；句首修饰、否定或动词形式不能替代结构分析。两项结构都成立时，以对象、动作和段落任务区分。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  92ec24e9e7003cba:
    path: gaokao-english/references/seven-five.md
    heading: 对应词法
    line_start: 35
    line_end: 50
    content: '## 对应词法


      触发：候选与正文出现可核的同词、同义/近义表达、代词指代、概括表达或成对对象。只有存在明确词语、指代或整句内容的呼应时才命名对应词法；仅仅同属一个主题、都能翻译通或都在谈相似概念，不足以触发。


      快判：定位呼应后，立即说清它连接的是哪个对象、事件或整句内容，再把候选放回两侧。对应词只缩小范围，不单独定案。


      详解核对：若同词、近义呼应或指代让多个候选都能局部接通，比较各候选完整断言怎样承接空前条件、空后结果和全段任务，说明真正区分处，不能用增加重词列举代替关系核对。


      必要分支：


      - 代词可承接名词、整件事或一组内容；形式 it 先读真正被评价的动作，不强找名词先行词。

      - 指示词加概括名词要整体读，判断承接的是对象、事件、问题还是做法。another 表示同类增项；latter 必须先找到语义上真实成对的对象及顺序。

      - 解释、原因或总结必须在上文已有对象或前提后出现，不能因同词提前安放。段落交界处连下一段起句一起核。

      - 全文标题若适用于多数候选，只提供范围背景；近义且同向的候选须比较具体对象、事件层级和概括范围。

      - 当前空证据不足可先做关联空再返回，但本空仍须有自身内容依据，不能仅靠选项已被占用。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  7c0a77869754a1dc:
    path: gaokao-english/references/seven-five.md
    heading: 主语一致
    line_start: 51
    line_end: 60
    content: '## 主语一致


      触发：候选的语法主语、核心话题、指代或祈使句的省略行动者可形成相关组。


      快判：开头先扫候选主体并暂定分组，再回正文还原当前核心人、物或概念。正文新线索改变指代或核心话题时，调整当前候选的优先级并继续核内容，不重新展示或重建三一致分组。共同主体或同一代词仍须比较“谁对什么做什么”。


      执行链：须按“候选主体归组、回文确认当前主体与对象、比较同组候选的动作与段落推进”的依赖给出可核依据。只展示影响定案的组和实质差别，不列完整主体表。


      边界：课程中的“主语”不只指语法主语，宾语代词也可能承接核心话题；多个祈使句虽共享行动者，也可能针对不同对象。只证明相关而未接通具体内容时暂留。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  4a9de82ef9741f92:
    path: gaokao-english/references/seven-five.md
    heading: 时态一致
    line_start: 61
    line_end: 70
    content: '## 时态一致


      触发：候选中真正承担时间关系的谓语可形成主要时态或时间关系组。


      快判：开头先找真谓语并暂定时间组，再回正文确认当前事件的局部时间线。完成时、情态形式及看似过去式的形式先核句中作用，非谓语词形不承担句子时态；正文出现新的时间或事件转换线索时，调整当前候选的优先级并继续核内容，不重新展示或重建三一致分组。候选谓语无明显差异时，可用时间状语回文查找对应阶段，但它仍是待核线索。


      执行链：须按“真谓语归组、回文确认局部时间线、比较同组候选的主体、动作、指代、评价和两侧内容”的依赖给出可核依据。只展示影响定案的时间组和实质差别，不列全部谓语表。


      边界：课程说同一事件或主题中通常保持一致，不是整篇表面时态相同。一般情况、具体经历和经历后的感悟可以属于不同层次；实际事件顺序和时间切换优先。同一时间组仍有多个候选时，必须在组内比较主体、动作、指代、评价及两侧内容，不能只把其中一项与异组候选比较后定案。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  03214bbc4e91eae2:
    path: gaokao-english/references/seven-five.md
    heading: 逻辑关系法
    line_start: 71
    line_end: 83
    content: '## 逻辑关系法


      触发：候选或正文存在转折/对比、因果、并列/递进、例证、问题—措施或时间/顺序关系。


      快判：把标志与两侧完整内容一起读，明确前后各说什么、关系方向是什么。没有显式连接词时，也要看前后句是在转折、并列、递进、解释、例证还是总结。多个标志共存时不能只取一个；同连接词候选先视为同组，再比较主体、动作、对象和范围。


      必要分支：


      - 否定“只做某事”不等于完全禁止它。前文明确说某种方式不是唯一方式、当前位置要求接出另一种方式时，原方式的另一个作用不能冒充另一种方式。

      - 例子必须实际支持对应观点，不机械要求抽象句或具体句。

      - 问题—措施还要核行动时点；事前准备不能由事后补救替代。时间词必须连同真实事件关系理解。

      - 只接上前句而与后句限制冲突不能定案；两侧都成立后再核段落任务。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  3d13a787824e210c:
    path: gaokao-english/references/seven-five.md
    heading: 褒贬一致
    line_start: 84
    line_end: 91
    content: '## 褒贬一致


      触发：前后或候选有明确肯定、否定、评价方向，或转折改变评价方向。


      快判：先读完整命题及否定范围，再判断候选是在陈述困难、否定价值、提出帮助还是评价结果。方向相同的候选继续比较对象、具体处境、措施和句间功能。


      边界：中性描述不强分褒贬；含负面处境的句子可能是在说明改善办法，含否定形式也可能表达肯定意义。担忧后的回应与直接赞美处境不同。另一空使用了竞争项，不能替代当前空证据。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  282e1aff555d0c22:
    path: gaokao-english/references/seven-five.md
    heading: 整篇与现场输出
    line_start: 92
    line_end: 95
    content: '## 整篇与现场输出


      整篇七选五只启用本篇各空实际触发的七法，不把主体、时态、结构三一致机械用于每个空。整篇开头统一完成一次三一致初筛，单题则在该题开头完成一次，随后只回正文和实际触发的方法，不在每个新线索或每个空后重复分组。形式一致、同词、位置或时态只能缩小范围，不能因某组选项较少、已占用或只剩一项自动定案。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  d815465ca190a14f:
    path: gaokao-english/references/seven-five.md
    heading: 定案与输出
    line_start: 96
    line_end: 102
    content: '## 定案与输出


      每题给实际课程方法名、决定性内容关系和选出或排除结论。初筛提示只在它确实构成关键判据，或解释暂留有必要时写出。


      按实际使用方法下的执行链或核对，展开影响定案的候选缩小、回文确认和实质差别。输出用自然口述推进，不排成整齐的固定分组表、模板标题或机械编号；不穷举无关候选，也不复述私人思维。三一致只在开头交代一次，后面直接说正文怎样把候选留下或排掉。


      只排除一项不能据剩余项自动定案。若多个候选仍通过，说明具体缺口并暂留。整篇完成后按课程“排除项分析”回查未选候选的内容承接与断言范围；仍难排时返回可能对应的已填位置。此核对必须执行，但不要求向学生逐项展示全部分组和排除过程。

      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  132f42a2b5680a23:
    path: gaokao-english/SKILL.md
    heading: 入口契约
    line_start: 1
    line_end: 7
    content: '---

      name: gaokao-english

      description: 高考英语客观题答疑。识别阅读理解、七选五、完形填空三类请求，只使用本 Skill 中已经由课程原始材料核验并激活的方法，从题面证据一步步把题做给学生看；这三类的方法问答也由本
      Skill 答。分析类方法先点明再展示动作，固定判据类技巧直接点明。遇到未覆盖、证据不足、课程版本冲突或题面不可辨认时停止推断并说明缺口。语法填空走 gaokao-grammar-fill，应用文与读后续写走
      gaokao-writing。

      ---


      # 高考英语课程答疑


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  21afe640717014fd:
    path: gaokao-english/SKILL.md
    heading: 不可越过的边界
    line_start: 8
    line_end: 21
    content: '## 不可越过的边界


      教学事实只来自`references/course-evidence.md`登记的课程证据与各题型模块。旧版 Skill、通用经验、答案键和模型常识都不能替代课程证据。


      教学层决定方法叫什么、何时触发、怎样比较以及何时不能定案；交付层负责把判断过程和结论按课程顺序讲给学生，不能补步骤、改条件、扩范围或解决课程内部冲突。


      不得把文件名当方法证据，不得把单个例题事实升级为普遍规则，不得给课程没有命名的操作自创方法名，不得静默合并不同版本。例题只用于核验可迁移动作和条件分支；处理新题时只使用当前题面的证据，不搬入蒸馏底稿中的答案、题材、固定词对、口误或单题捷径。


      面对整篇新文章，先按题面路由到对应题型，再逐题判断当前文章实际触发的已激活方法。只调用有触发条件且能解决当前候选差异的方法，未触发的方法不为覆盖方法表而调用，题型之间也不得借用同名或相似操作。每个实际调用的方法仍须完成其模块规定的证据核对，证据足够即停，证据不足按该模块暂留、扩看或停止。整篇内部完成必要的全文或段落回查，学生端按原题号汇总，不逐项罗列未使用方法。


      目标是尽快锁定真正区分候选的题面关系，完成足够验证后停止。做题顺序按课程要求走：七选五按容易突破的先做，是三类题型里唯一按难易挑题的；阅读 A、B 篇按题目顺序做，C、D
      篇先主旨、后细节、后猜词；完形按原空号走两遍，第一遍拿不准的先跳过，回头第二遍再做。不按难易自由重排，不把一个题型的顺序搬到别的题型，也不能先取答案再倒贴技巧。不得省略会改变答案的对象、主体、范围、否定、条件、比较、因果、时间或核对环节；也不要求在稿子里复刻课堂话术、报答先后或无关候选的逐项长讲。


      现场解题讲解感是最高交付优先级。整篇说明先统一扫选项并做一次必要的暂定分组，单题则在该题开头做一次；随后指回题面、形成有依据的候选、按老师已核验的依赖顺序当场回文核对、比较竞争项，并在证据闭合后定案。输出要像老师边读边判断的自然口述，不排成过于整齐的标题、表格、固定编号或模板化步骤。暂定不等于答案，课堂中先出现的口头选项也不能代替新题证据。稿子里不能删掉必要的定位、比较、回文或核对动作。七选五的主体、时态、结构三一致只在开头分组一次，分组没有区分度的维度要如实标记，之后不重复机械调用，最终仍由当前空的内容关系和实际触发方法定案。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  5df62696fa9eddcb:
    path: gaokao-english/SKILL.md
    heading: 每次都要执行
    line_start: 22
    line_end: 36
    content: '## 每次都要执行


      先完整读取`references/delivery-contract.md`和`references/router.md`。


      按题面而不是文件名识别题型，只读取当前需要的一个模块：


      - 阅读理解读取`references/reading-comprehension.md`。

      - 七选五读取`references/seven-five.md`。

      - 完形填空读取`references/cloze.md`。

      - 听力读取`references/listening.md`。


      本 Skill 只处理这三类客观题和听力。学生拿来语法填空，说明不处理并交给`gaokao-grammar-fill`；拿来应用文或读后续写，交给`gaokao-writing`。不用本
      Skill 的解题方法硬套别的题型。


      学生询问课程依据、版本差异、方法是否为课程原名或未覆盖内容时，再读取`references/course-evidence.md`。不要把内部证据编号、置信度、冲突台账或核验过程写进学生答案。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  6ac640bfb686950f:
    path: gaokao-english/SKILL.md
    heading: 决策顺序
    line_start: 37
    line_end: 50
    content: '## 决策顺序


      一，确认决定答案所需的原文、题干和选项完整清楚；关键内容看不清就指出位置并停止。


      二，确认请求范围。整篇处理整篇，单题只处理该题，方法请求只解释该方法。


      三，进入对应模块，检查方法的触发、前提和禁用条件。学生点名的方法不匹配时，不强套也不默换。


      四，选择实际触发的已激活课程方法，抓首个有区别力的线索缩小范围，再核真正决定候选差异的对象、动作、关系或限制。证据足够即定案；证据不足则扩看、暂留或停止。多个方法确实联用时，分别说明各自解决什么差异。


      五，交付一份完整的现场讲解：按课程要求的做题顺序推进，不按原题号机械顺讲，每题从题面证据一步步走到结论，先看哪儿、看到什么、所以下一步查什么，查完给结论。**顺序本身要讲出来**，让学生听得出这一步为什么先做、下一步为什么接这个，不能默默按顺序走。分析类的方法先点明再展示动作，固定判据类的排除或选定技巧直接点明。方法只能定位或排除时，不据剩余项自动选，也不为展示过程补造固定步骤。整篇一次交完，结尾按原题号汇总一次。


      六，没有激活方法或现有证据不能唯一确定时，按`references/evidence-gaps.md`处理，不调用旧版规则或临时发明流程。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  5eb9a74af4c969d7:
    path: gaokao-english/SKILL.md
    heading: 当前激活范围
    line_start: 51
    line_end: 59
    content: '## 当前激活范围


      - 阅读理解：已激活原名为主客一致、同源替换、比较级谨慎选、过度推测、因果选果、主旨缺失、并列删除、例子非答案、三化法、代词指代和逻辑简化；课程材料另支持跳读定位、积极阅读法中的名词定出处、题文同序、动词定逻辑以及mainly题的主旨大意操作。主旨类任务的三化入口按课程现场顺序执行：先读题干和主旨题选项形成假设，再看有效首尾段，最后看中间段首句；重复词缺失时跳过重复词观察，但不跳过首尾与段首核验。定位阅读法、顺藤摸瓜、左顾右盼和中心思想只作为学生自然说法映射，不是已证的独立课程原名。阅读按题面任务分流，不按应用文、记叙文、说明文或议论文硬套方法；各法的严格触发和必要分支见阅读模块，最终都须回原文确认。

      - 七选五：总起句做题法、结构一致、主语一致、时态一致、对应词法、逻辑关系法和褒贬一致。形式、主体、时态、对应词或情感方向用于缩小范围，内容及当前方法所需关系成立后才能定案。

      - 完形填空：完形语篇逻辑破译和瞻前顾后法。首句建立整篇粗框架；单空以当前对象、关系和前后提示快速缩小，必要时暂留后找，再回填验证。

      - 听力：课程没有提供听力方法，只有交付形式与其他题型一致，见`references/listening.md`。


      语法填空走`gaokao-grammar-fill`，应用文与读后续写走`gaokao-writing`，都不在本 Skill 范围内。其余未激活方法按证据缺口处理。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  46357c0c64038ca6:
    path: gaokao-english/SKILL.md
    heading: 失败保护
    line_start: 60
    line_end: 62
    content: '## 失败保护


      题面不足，指出缺少哪一处。课程证据不足，说明现有课程资料不能支持该方法判断。只能确认部分链条时只交付可确认部分，不用常识补齐。

      '
