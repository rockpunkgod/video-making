  1f050bb93702e098:
    path: gaokao-english/references/course-evidence.md
    heading: 结构一致
    line_start: 61
    line_end: 66
    content: '### 结构一致


      七选五视频约 30 分钟处明确要求先判断结构，再匹配内容。结构判断包括小标题形式、段落或段内总分关系、相同句型和特殊句式，内容阶段逐一匹配名词与动词。该方法已覆盖名称、触发、动作和结构不能单独定答案的边界。


      来源 VIDEO_8A6B414B9571 的10、12、14、16、17分钟样本展示小标题从整句形式分组到段内对象匹配；74、76、78分钟另一例比较整段主线与局部结果，板书小标题必须全面涵盖。现补0–18分钟本地ASR及14张指定原帧：学生漏纳句首带修饰的候选后，教师回看整句分类，再以已给标题形式初筛，最后回段落核对象与动作。11:02–11:41口述分类与左侧标注一致，右侧相反标签仍留底稿；13:52纠错针对候选分组，不冒称教师已纠右屏标签。只补强原方法，不发布最短项优先或表面单复必须相同规则。例题解释MEDIUM；后续已补74–90分钟音画局部对齐，详见本文件最新记录，其他分支仍待核，非全方法验收。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  aa20d9d9be2213e4:
    path: gaokao-english/references/course-evidence.md
    heading: 七选五总起句做题法
    line_start: 67
    line_end: 72
    content: '### 七选五总起句做题法


      两门同名课程都显示完整技巧说明：总起句通常位于段首或第一段段尾，功能是概括段落主旨并引领下文；课程把“不含数据、例子、步骤等局部细节”的概括性，以及引出原因、策略、分类并形成总分关系的引领性列为两大特征。常见形式和位置都只能帮助生成候选，不能单独决定答案；候选仍须以实际统领范围和后文组织结构验证。另一课程另明确说明近期题目可能省略显性逻辑词，此版本边界继续保留。


      来源 VIDEO_B3A7A75E903E 现补0–40分钟两窗1178段本地ASR和46个实看原帧。03:46–08:43连续讲解明确概括与引领功能，并用短例说明形式提示后仍要回看分项结构；其中代表短例先由提示形成早期候选，追问竞争项时再把候选转成对后续各分项的内容预测，并以实际覆盖范围复核。课后的“三一致”总结不能倒放成答题前已经完整执行的固定分组。10:04–17:48的两个短例进一步说明总起候选须覆盖全部分项，小标题只限定待核范围。20:00–39:45的一组完整代表例显示：同形式候选仍须比较动作对象，暂时降低优先级不等于永久排除，全文总起要用后续多个分项验证；指示表达既可由当前篇章功能确定有限自指，也可能承接前一句整件事，后一分支须按后句评价或结果核验，不能只取最近名词或补入正文未给的前提。运行解释不采用固定先后、精确原词要求、颜色等级或具体句式捷径。例题解释MEDIUM；本地ASR加选帧局部对齐不等于直接听核、逐项穷尽排除或完整课程复核。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  d2c3eb62ea050619:
    path: gaokao-english/references/course-evidence.md
    heading: 七选五对应词法与逻辑关系法
    line_start: 73
    line_end: 88
    content: '### 七选五对应词法与逻辑关系法


      对应词法来源 VIDEO_6DD0BBEF4E90 的6分钟技巧页明确相同词、同义词、近义词的关键词呼应；10分钟为分组总结，53分15秒明确三一致用于缩小范围、内容匹配用于求证。旧10分钟记录已撤去单帧涵盖全部操作的泛称。逻辑关系法区分转折/对比、因果、并列/递进、例证和时间/顺序，要求核关系方向及例子支持的观点。两者都不能凭单一词语定案。


      对应词课现已补完0–128:15.7媒体末尾连续本地ASR。摄影例的指代、概括内容与相关对象关系已有局部音画对齐；旧12分钟同时标注候选与概念的记录收窄，以11–13分钟分组、14分钟正文和19分钟稳定填答分别记录。43:52–52:53智能家居例现有连续音频，补实词群、局部方面、下一段转向及教师明确保留意见；不包装成毫无疑问的完美对应。情绪传染完整题补篇章功能和暂存回查两项条件解释。完美主义完整题再补标题管辖范围及同倾向候选的语义维度比较。均为MEDIUM，不增方法名、固定题序或单例词对；本媒体音频覆盖完成不等于20条方法全验收。


      同课37:20–42:11的代表片段先由标题和候选中的对应提示形成待验证项，随即追问能否直接选择，再拆完整断言、句内指代、主体和评价，回正文核主体与关系后才口头定案。该顺序只支持本次对应词入口及继续求证，不发布“标题永远优先”或见同词即选。


      来源 VIDEO_EBD3BA66DC83 的19、20、21分钟画面及补核的17至22分钟连续原声ASR说明：相同连接词和句架先归组，再比较主体与限制范围，并核对空前空后。2026-09-19已更正此前将干扰项误写成正确衔接的蒸馏记录，局部口头讲解支持这一更正；这不是课程内部勘误。此条件分支为例题操作整理，置信度MEDIUM，不声明直接听核或全课验收。


      同课24:03–25:50的代表片段从候选逻辑提示进入，继续读取完整句、纠正关系解释并用正文评价求证；该窗口没有证明最终屏幕填答或竞争项已经逐项排尽。因此只把“提示进入后核完整关系与正文”写入运行解释，不把单一连接词设为答案或固定优先级。


      同课8至16、29至35、80至90分钟已提取连续原声并作本地ASR与抽样画面的局部核对：补回旧分类遗漏的例证关系，说明补充层次、问题与措施的衔接及行动时点；允许从候选提示进入后回文核验，不规定唯一操作顺序。新增解释为MEDIUM，原题只留底稿。转折标签、局部指代排除及词义疑点继续保留，不迁移为通则。机器转写不是直接听核，以上窗口也不等于全方法或全课音频验收。


      同课补核35至50、90至100分钟原声ASR及对应画面：45分52秒至46分59秒通过否定范围和后续具体动作说明进一步参与的含义，不把只做某事与完全不做混淆；94分20秒至96分09秒把指示表达连同概括名词核其内容类别及当前段话题。前者解释逻辑关系法，后者补充对应词法的语义回接，均为MEDIUM局部例题解释，不增课程方法名。未见的候选排除理由及最终填答画面不补写。


      '
