  3527a85c4fe668d9:
    path: gaokao-grammar-fill/references/grammar-fill.md
    heading: 使用边界
    line_start: 3
    line_end: 9
    content: '## 使用边界


      本模块只处理语法填空。不要先凭中文意思猜词；先看空位结构，再判断词性或语法功能，最后用句意复核。

      开场不用解释整套语法流程；直接进入第一空，在各空点明实际知识点，并用该句解释结构和变化依据。通用定义只在学生理解本空确实需要时随题简述。


      下文是对课程知识与例题的操作整理，不把“有无提示词双路判断”等整理标题冒称课程原名。逐空点明实际知识点，如词性转换、物主代词、定语从句、谓语时态语态或非谓语逻辑主语。来源及勘误见
      [course-evidence.md](course-evidence.md) 的语法部分。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  781c4478d621bf5c:
    path: gaokao-grammar-fill/references/grammar-fill.md
    heading: 总路线
    line_start: 10
    line_end: 26
    content: '## 总路线


      1. 先用意群划分句子；长句用“劫匪插葱”暂时拿掉介词短语、非谓语、插入语和从句，抓主干。

      2. 问：“这个空有没有给提示词？”

      3. **无提示词**：优先检查冠词、介词、代词、并列连词/从属连接词/关系词；句法已完整、空位连接前后句意时，还要检查连接副词，不能把可能答案锁死为四类。

      4. **有提示词**：先确定空位成分，再决定是否需要词性转换，或名词、代词、形容词、副词、数词、动词的形态变化。提示词的原词性不等于答案词性。

      5. **确认空位需要动词形式后**，才分谓语与非谓语。`environmental ___ (protect)` 需要名词 `protection`，不是非谓语；`the
      ___ (develop) of...` 需要 `development`。名词性位置也可能容纳动名词，要依据结构、搭配与意思区分，不能见介词就一律填
      doing。

      6. 给答案。有典型误区时说明为什么不能填另一形式。


      解释空位时以未填句为准：先确定空、逗号和主句各在什么位置，再命名句法作用。例如“Surrounded by trees, the house stays
      cool.”的句首分词短语作状语，不能称名词后的定语；“the house surrounded by trees”中才检查后置修饰。引用已填形式时说明这是回看已填空，不称为原先空前的文字。语法结论只约束实际结构，不把本题标点不适合某词泛化为“这个词不能放句首”。


      整篇不必先通读全文，带着考点做题即可。两条全卷自检：


      一是**同一个考点一般不重复考查**——谓语通常考两个不同时态或同一时态的不同语态，非谓语考 to do/-ing/-ed 中的一到三个，名词考动词变名词或单数变复数，形容词考变副词或比较等级，介词、冠词、代词在同一语篇一般只考一次。做完用它反查有没有重复，作为纠偏手段。


      二是**括号内所给单词一般只变形一次**——考查副词就给形容词，考查名词就给动词或形容词，考查形容词就给名词或动词，考查名词复数就给名词单数。括号里的词性几乎不是答案词性。


      '
