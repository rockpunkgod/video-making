  b57c209b70019de8:
    path: gaokao-english/references/course-evidence.md
    heading: 七选五时态一致
    line_start: 71
    line_end: 76
    content: '### 七选五时态一致


      两份同讲次课程文件在约10分钟画面中都明确把“时态一致”定义为选项时态与上下文时间线一致，并把适用范围限定在同一事件或同一主题的描述。约20分钟后的例题总结把时态一致列为“三一致”分组标准，同时另列小词和内容一致，证明它用于分组和排除而不能单独定案。两个来源内容高度一致，按重复发布处理，不当作独立证据重复抬高置信度。


      来源 VIDEO_EA1B17009E6B 已接完0–129:34.691七窗连续本地ASR并实看130个逐分钟偏移原帧。08:55–10:54补强“时态一致”的规则定义；11:03–32:20的短例先由时态形成候选组，再回正文时间点、主体和内容验证。32:30起的完整实战同样先识别候选真谓语并按时间关系分组，再回当前空位核局部时间线、主体和内容；41:20出现提前口头选择，随后仍继续比较竞争项，46:06再次明确选择并结束该空说明。该过程不证明所有排除均已严格展开，也不支持把未经验证的早期选择直接写成最终定案。32:30–65:30第一组完整五空实战还显示同为过去时仍需区分继续动作、所见评价、人物差异和指代对象，过去经历可转入一般感悟。78:20–111:20第二组完整实战进一步明确具体过去研究只是支持一般观点的例子；只有候选确属当前研究事件时才回到过去时，不能因段中出现过去时或最近动词就统管当前空。三条证据均来自同源，不重复抬高独立样本强度；原题、答案、固定词对、题面瑕疵和“缺某连接词就错”等单例解法不发布。强制先时态、无额外时间点必须同一时态等强说法保留原语境，不静默改写为绝对规则。本地ASR加原帧局部对齐非直接听核，完整媒体覆盖也不等于全部强说法获接受。


      '
