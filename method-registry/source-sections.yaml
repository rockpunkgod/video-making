    line_start: 5
    line_end: 22
    content: '## 2026-10-30五课程增量验收与旧缺口更新


      独立底稿根`E:/新建文件夹/course-distillation-20261030`，入口FINAL_REVIEW、ROOT_ACCEPTANCE、ACCEPTED_NAMES及三板块逐源表。本次只把已验动作和边界增量写入正式模块，不迁原题、字母、固定词对、口误或强保证。原音为本地机器稿结合原帧／讲义，非人工逐字听写；旧证身份分整视频SHA、完整代表音窗SHA、抽样音画对应，不把后两者抬成整个视频一致。下列更新覆盖历史同项的全面待核状态，未覆盖的真实缺口继续保留。


      - 阅读主客一致：春01三代表分别核意愿／行为、观察／假设、施受角色；第一批OBJECTIVE_REVIEW第七节与第五批OBJECTIVE_BATCH5的1500–2100、2700–3300补窗闭合后两分支。给与受是语义角色，不限语法被动；will必实现、缺原词即排等强说法不运行。

      - 阅读时态一致：春04独立原定义900秒帧，0–900及900–1500原音和1150帧支持两代表；核实际时间及事实状态，不与动静或七选五同名合并。within与after不机械同义。

      - 阅读主语一致：第四批春07 60秒定义帧及0–1900原音两代表；首例900秒先选后975–1022纠正的课堂推进完整保留，不能用旧红字当最终选择。主体与动作同核、正确项仍需正向支持。

      - 阅读动静一致：第五批春10 60秒定义帧、0–3100五原音窗及1050/1850/2820原帧有四有界代表，比较变化／状态和具体属性。have an
      increase等完整表达也能表变化，不机械词表分类；旧标题动态分支、受限持续语义与本定义分源保留。

      - 阅读大词原则：第一批秋03 6508–6805补得先回文核具体限制、后点名原则的链。声画包含字母冲突以及完整断言并无真实包含的张力留档，不扩大为主题相关或范围大就选。三化入口沿用先题干／主旨选项→有效首尾→中间段首。

      - 阅读语言冰山理论／阅读理解基本流程／两首一尾定主题：第三批期末规划900–1500原音及1189.5／1400帧。前者是解释框架，后两者为原栏目及先主题后逐题的来源；代表仅有界，不与三化或积极阅读合名，不覆盖既定用户题序。

      - 七选五单复一致：第一批秋08 7161–7317与8016.9帧，保独立原名及一致性检查身份，不硬筛单复同形。总起句做题法春03讲义及0–1500原音两简例补概括性、引领性和三一致→考点→回文入口，不称所有后文已逐项听核。第四批春05
      60秒原帧与0–1750原音三代表补逻辑判断内容关联独立原名及逻辑／内容双核；春04／05为同堂转码抽样对应，不倍增代表。

      - 完形：第三批寒14下篇三材料补瞻前顾后、独立线索返回及未解空不可互证；第四批春08补行文结构／首句完整定主题。other/OTHER_REVIEW春02
      1530–2130明确首句完整定主题，相同词性定答案，3300–3780补无信息靠主题／无信靠主题的回查职责，末空未收束不冒称完整定答。各名称保留身份，不恢复强制空号或遍数。

      - 听力：other/OTHER_REVIEW暑02 4500–6540原音及6400帧补倍速精听法、影子跟读法；秋季听力3300–3900、4200–4800、6300–6900补挖空听、连读练习、盲听训练及角色、完整关系核对代表。other/batch2/OTHER_BATCH2_REVIEW寒13
      7964.5原屏解题三步与900–1440／3300–3940等代表，明确练习／精听条件，不套考试无限回放。第四批other春09 900–1009原音、1231.912帧证因病转低保五关系助记，7802.112帧及课尾原音证三项分层训练，125+为对象不是速题法。训练、助记、答题职责分别登记，不借七选五同名顺序。


      春02原音暂识“比数绝重大”的口诀仍未完整核准字形及余项展开，只确证“比”对应比较级先核查，不能由谐音补字造固定扫描清单。旧听力“无任何可调用方法”、阅读时态未独立确证及主客施受无代表等全面否定，现由本节和运行模块更新；未核强口径不借增量激活。


      春12密卷原件`E:/开明致学/（课上讲义）第12讲 考前押题密卷（一）（26S春）.docx.docx`于本次直接只读原DOCX XML，段号P58极速定位逻辑、P96图表题极速逻辑（不是摘要所简写的图表题逻辑）、P289主旨定位法、P425
      mention 题模板，另有定位逻辑、主旨定位、例子→证明观点、定位专家观点等逐题小标题。四首一句绝杀口诀在P129/247/365/462，分别是各篇后总结。均按题解标签／助记身份登记，未取得课堂原音确认独立算法；共同要求一定在统一说明区、主旨必看末段、科学文目的必报发现等不运行，原题字词不迁入通则。可对应已验定位、结构覆盖及例子作用的职责已写入阅读模块，不能因为不激活新法而漏其名称。当前F春课程未发现对应密卷授课媒体，不用另一同号春12自然作文代证。


      '
