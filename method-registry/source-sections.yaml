  8cc4571377b8183a:
    path: gaokao-writing/references/application-writing-and-correction.md
    heading: 复习路径与分数锚定
    line_start: 176
    line_end: 183
    content: '### 复习路径与分数锚定


      **读-背-仿三步走**：读英文，熟读至背诵；背中文，背大致含义；仿写，走富兰克林写作法。


      **分数锚定策略**：课程以基础模板用稳作中等分段训练锚点，再练三种写作表达方法；这不是保证分数或独立评分项。


      **作文练习的顺序四阶段**：①写作模板（中文思路的记忆和简单英文的翻译）②八十个金句（基本句子和词汇素材的积累）③挑战高分（九大句型和高级词语）④冲击满分（两简一复从和句式重构）。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  27cf55e8f2cf7c93:
    path: gaokao-writing/references/application-writing-and-correction.md
    heading: 五审法的审核维度表
    line_start: 184
    line_end: 189
    content: '### 五审法的审核维度表


      审文体：明确体裁（书信、倡议、演讲、图表），确认匹配的模板框架。审对象：确定交际对象（朋友、老师、教授、公众），据此调整语气与称呼。审要点：逐一核对题目要求的内容，如建议信三条建议、邀请信的时间地点活动。审逻辑：检查是否符合模板框架（“现象—分析—建议”“问候—核心内容—祝福”），过渡词是否自然。审语言：核查时态一致、无重大语法错误，替换基础词汇提升质感。


      操作细节：圈出题目中的限定词，如“因病休假”要强调健康、“来自爱尔兰”可提及距离或时差。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  674a33a24f97831a:
    path: gaokao-writing/references/application-writing-and-correction.md
    heading: 三种写作表达方法的细化
    line_start: 190
    line_end: 199
    content: '### 三种写作表达方法的细化


      基础句式锚定法：锚定核心主体，锁定动作或状态（含系表结构），嵌入场景细节（时间、地点）。讲义标注为“小学语文造句”。


      复杂句式模块法：先有准确的主干简单句，再把相关动作各写成简单句，按真实逻辑用从句、非谓语、连接词或介词短语粘连。寒4徒步例中的“两简一复从”是主干之后加两个相关简单句再合成复杂表达的扩句训练，不是整篇句数或从句配额。


      两简一复从的国庆来源另存：第1讲以当前只有两句为由说用不上，第2讲却用此名指两句信息合并。两处名称使用范围有张力，不能统一成两句必可或必不可。讲当前句子时保主句谓语，按实际关系把另一信息作修饰或从句；被问该原名时说明来源，不借续写寒14定义消除应用文异文。


      长句翻译重构法：语义解构（拆语义单元，识别核心信息与修饰信息）；语序重组（按英文主体、动作、场景组织）；细节校准（时态、词性、单复数）；风格统一（按逻辑优化衔接）。课程提到的
      110／120 是当时能力或分数目标下的粗略训练分流，不能写成整篇词数阈值；看信息复杂度和学生表达能力选法。连续口述重构及另一独立完整例尚未核，不宣称新题已全面验收。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  1c2d18c01623f09f:
    path: gaokao-writing/references/application-writing-and-correction.md
    heading: 富兰克林写作法（五步）
    line_start: 200
    line_end: 203
    content: '### 富兰克林写作法（五步）


      ①把中文简化，去掉不必要的修饰 ②翻译成英文 ③对照范文 ④背诵自己缺失的词或句式 ⑤想进一步提高时可让 AI 帮忙升级单词和句型。中英填空可作练习形式，但“挖空法”另有独立原名，不合并为五步的固定一步。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  826bddb7694b0a21:
    path: gaokao-writing/references/application-writing-and-correction.md
    heading: 反向劫匪插葱
    line_start: 204
    line_end: 207
    content: '### 反向劫匪插葱


      寒4在扩句示范中以此称呼把已写出的相关简单句拆组、拼贴；画面列从句、非谓语、介词短语三类粘连方式。按实际语义选用，不能按口诀逐字拆出固定步骤或固定先后，也不能把此处定义借给续写同名法。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  7022e0285ab88322:
    path: gaokao-writing/references/application-writing-and-correction.md
    heading: 三类高频书信的模板结构
    line_start: 208
    line_end: 213
    content: '### 三类高频书信的模板结构


      邀请信属求人型，建议信属帮人型，感谢信属传情型。每类都按“常用表达（发出邀请、活动安排及意义、望应邀盼回复等功能块）→ 黄金模板（基本模板加升级模板）→
      仿写实操（题材、人称时态语气、要点分段）”。


      建议信升级模板把三条建议分别用祈使句、定语从句、条件状语从句，一条建议一种句型。感谢信升级模板结构：感谢内容 → 背景 → 具体回忆 → 再次致谢 →
      祝愿。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  106f75b81b28e301:
    path: gaokao-writing/references/application-writing-and-correction.md
    heading: 写人类（人物介绍）文体方法
    line_start: 214
    line_end: 229
    content: '### 写人类（人物介绍）文体方法


      人物介绍可核四类内容：基本身份（姓名、职业、国籍）→ 突出成就（主要贡献、典型事迹、荣誉）→ 个人品质（性格、精神品质）→ 社会影响（对他人或社会的积极意义）。“四件套”为整理便称，并非已核课程原名；依题目选择相关内容。


      结构：开头段概括引入（人物重要性加核心特质）；主体段按**时间轴**（早期经历、关键事件、当前成就）或按**品质加事例**（Trait 1 加 Example
      1，Trait 2 加 Example 2）分层展开；结尾段总结评价（精神传承或学习意义）。


      人称时态：第三人称客观视角；现有人物用一般现在时写成就、一般过去时写早年经历；历史人物用一般过去时。


      定语从句、分词结构、强调句是本课的句式素材；“三件套”为整理便称，按表达需要选用。


      典型错误：信息堆砌、主次颠倒（过度描写外貌忽略品质）、时态混乱（He is born in 1950）。要避免主观评价，把 I think he is
      the greatest 改成 He is widely recognized as...。中文姓名拼写要正确（Zhang Guimei，不是 Zhang
      Gui Mei）。


      备考：建立“人物档案库”，按科学家、运动员、文化名人分类整理中英双语素材；背诵万能评价句；做同一人物 50 词与 100 词的对比练习。临场快速列提纲，确定三个核心品质及对应事例；避免复杂生词，用准确代替华丽；结尾用名言或比喻升华。


      **人物介绍评分口诀（内部记忆，口播不念）**：身份成就需分明，事例品质紧相承，数据细节增可信，精神升华得高分。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  a79d6eef78245bd4:
    path: gaokao-writing/references/application-writing-and-correction.md
    heading: 投稿类的身份与时态定调
    line_start: 230
    line_end: 233
    content: '### 投稿类的身份与时态定调


      前三步骤：①审题判定文体为投稿 ②因文体是投稿，作者身份在正文中不必交代 ③因主体部分是介绍人物生平事迹，全文总体时态定为一般过去时，首尾两段用一般现在时。三段论：第一段列举并引出人物；第二段人物简介及事迹；第三段启示。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  48bd60cb771e7ad0:
    path: gaokao-writing/references/application-writing-and-correction.md
    heading: 活动类的三段式与散点技巧
    line_start: 234
    line_end: 247
    content: '### 活动类的三段式与散点技巧


      三段式：首段目的 → 中段活动具体内容 → 尾段邀请信（期待回复）或其他（活动意义）。


      检查顺序：审题和时态 → 三段式 → 逻辑词 → 段落内 → 三段话 → 词汇和句型升级 → 书面和检查语法。


      **逻辑补充句**：首段末尾加一句承上启下句，四种变体——Here are some details about this exciting event.
      / Here are the details of this meaningful event. / Here are some highlights
      of this event. / Here are some fascinating aspects of this event.


      课程曾用 `What we anticipate most is...` 和 `not only...but also` 示范表达重点；须先核语义与文体是否合适，不把单题示例设为每篇必用句型。


      **语料标注约定**：蓝色用于扩充语料，绿色标重点词汇或短语；“必须背、必须使用”为该课训练安排，不作陌生题写作或评分硬要求。


      **好作文的检查点**：审题（是否偏题、信息点是否缺失）、格式、考点信息；句型和词汇的丰富度；句子不够丰富时用细节例子补充；卷面工整。卷面是**训练目标**，评分仍按书写评价边界执行，不因字体美观给分或扣分。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  bbf310a6ee245b95:
    path: gaokao-writing/references/application-writing-and-correction.md
    heading: 写作误区与提分技巧
    line_start: 248
    line_end: 255
    content: '### 写作误区与提分技巧


      常见误区：结构混乱（混合段落）、要点遗漏、语言过度口语化（I miss you a lot! 应改具体化表达）。


      提分做法：审题精准（圈限定词）、细节填充（添加符合校园情境的事件）、文化礼仪（对外教用礼貌用语）、句式多样（复合句）、结尾技巧（暗示未来互动，如 Looking
      forward to your early return! 比 Good luck! 更具期待性）。


      范例改进法：把笼统句改具体——“Are you better now? We miss you.”改为“I hope your health has improved
      since your return to Ireland. It’s such a pity you couldn’t attend the recent
      cultural exchange day—your advice was greatly missed!”


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  037a6e97d44a42b0:
    path: gaokao-writing/references/application-writing-and-correction.md
    heading: 26S春 补充
    line_start: 256
    line_end: 265
    content: '### 26S春 补充


      **三段话格式**（春5演讲示范）：①补全除题面明确考点外仍需交代的背景或主题 ②完成具体要点 ③按交际目的收束，最好扣主题。给几个要点就完成几个，不移用其他题的三理由配额；已给标题、首尾如何抄写按题目要求，不以该示范统一规定。


      **保留格式抄原文**：春5现场口诀，保所练句型骨架，取题面或标题核心词，再按交际目的换词和补连接。不是逐字照抄整句，也不只指抄给定首尾。原邀请结尾被移入演讲时，教师明确称为适配演示、并非很合适的演讲结尾，要求改变邀请用词；不能把邀请模板推荐为所有演讲的标准结尾。


      **背结构，改小词**：春5主讲义与回放轴的独立口诀。保符合文体的结构，按当前对象、活动、时态和目的改词；与上一口诀职责有关，原名仍各自保留。


      **中文→词汇→句型的草稿表**：按春5现场先用中文简记内容，再列将用词汇，最后放入合适句型，不写完整英文草稿。表格空间列序是中文、句型、词汇，步号却为1、3、2；回放轴摘要也写中文→句型→词汇，与现场有差异。这里沿用现场和表头步号，不宣称所有来源一致；“三联草稿表”为整理便称。文体与句型配对只是示例，不是每题固定要求。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  0fb8642fc0fb3859:
    path: gaokao-writing/references/application-writing-and-correction.md
    heading: 国庆应用文：修改流程与表达训练
    line_start: 266
    line_end: 281
    content: '### 国庆应用文：修改流程与表达训练


      **应用文写作的五步法**：用于修改与批改，原五块为审题与时态核查→结构与要点梳理→衔接与细节优化→语言与句式升级→最终检查清单。现场会按当前问题往返检查；先核身份、目的、要点，再补真实细节与逻辑、改语言、复查常错。它与五审法、六步训练法各自保名，不改成全部应用文唯一写作顺序。


      五个编号表达技巧各自使用，不合并为旧三种写作表达方法：


      - **换词，简单词变成高级词**：对已准确的内容，按语义、搭配和语体选择更具体或多样的词；不把课堂词对视为恒等替换，不要求常用词全换。

      - **加词，丰富语意，增加形副**：给对象或动作补题意允许且相关的修饰，让信息具体；不按形副数量评分，不凭空增加属性。

      - **换主语，告别以人开头的大白话**：同一信息可改以事件、物品或概念为主语，并重建谓语和逻辑归属；不禁用人称主语，不把主观意愿改成客观事实。

      - **单句变成复合句**：按完整命题之间的真实关系组合句子，保主句与修饰归属；原表也列with／without结构，保原题名，但不把所有这类结构判成含从句的复合句。

      - **单一句式变为多句式**：已有内容成立时，按需要用名词化、介词短语、省略或非谓语等减少重复；保原义、逻辑主语和时间关系，不堆句型。


      **形容词叠加**：赠46表达训练原名，可用两个语义相容的形容词描写同一对象；按当前对象和搭配选词，不设每句双形容词配额，也不沿用同帧误标的语态判断。


      思辨题三个构思模型分别保名：**问题-分析-建议模型**用于解释问题并给针对性建议；**现象-利弊-总结模型**用于评价现象，不强制利弊均等；**观点-论据-论证模型**是国庆视频完整原名，讲义末字写作**观点-论据-论证模**，用相关支持说明观点，不把无据统计当事实。现场讲先陈述问题、现象或观点，主体作相应分析，末尾建议或总结；这是该思辨课的组织口径，不强加到活动执行类，也不从名称补每段句数。三个名称与职责已证，但独立完整实施证不足，不把同一篇范文计作三篇、也不声称已核三套逐题完整算法。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  df4cea9abfa81119:
    path: gaokao-writing/references/application-writing-and-correction.md
    heading: 春5文体模板与修辞建议
    line_start: 282
    line_end: 295
    content: '### 春5文体模板与修辞建议


      课名演讲不限制其全部内容为演讲。按当前任务分别选原栏目：**发言稿模板**（引主题、内容、感想祝福）、**建议信模板**（背景与建议、分项建议、希望）、**投稿征文模板**（目的、情况、总结）、**报道模板**（事件、经过、简评）、**人物介绍类模板**（引人物、描述、评价）、**邀请信模板**（邀请、安排与意义、期待回复）、**求助信模板**（表意、原因、希望）、**申请信模板**（意图、优势、期望）、**告知信**（即将发生的事或回复询问）。这些是文体模板目录，不是一套演讲算法；题面要点与交际对象优先。自我介绍在对方需要知道身份时简要交代，不把投稿示例泛化为所有投稿禁止介绍身份。


      **先声夺人开头句**、**引人入胜篇中句**、**画龙点睛结尾句**分别是各文体的功能位置栏目，依所选文体完成引入、展开与收束，不把栏目名当跨文体无条件套句法。


      演讲中的**排比句式**、**比喻手法**、**反问技巧**、**把握语言节奏**、**丰富词汇表达**分别为修辞和语言建议。并行结构需有真实并列内容，比喻、反问、停顿与长短变化服务当前主题和语气，用词受准确性、搭配和语体约束，不要求五项齐全。


      **基础范文到升级范文的三段式**：优化原因固定四条，覆盖词汇替换、句式升级、逻辑衔接词、字数精简、立意升华五个维度。


      **具体升级手法**：not only...but also 倒装；形容词或分词作状语；as 引导倒装；first and foremost 与 last
      but not least 替换 first 和 last；精简冗余句、严格贴合字数；逻辑词 thus、more importantly。


      **制作步骤类写法**：First、Then、Finally 加祈使句动作链。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  fc664e8d7ec2b8a7:
    path: gaokao-writing/references/application-writing-and-correction.md
    heading: 补充课程名称与材料身份
    line_start: 296
    line_end: 319
    content: '## 补充课程名称与材料身份


      以下逐名说明已有职责；整理简称、材料栏目和例题示范不升级为课程独立算法。


      - 劫匪插葱 反向进行：原口诀表述，已有模块拆组／拼贴职责见反向劫匪插葱小节；不凭字面拆造顺序。

      - 读-背-仿（三步走）：原训练表述，对应本模块熟读英文、记中文大意、富兰克林仿写的职责，不是临场必走三遍。

      - 核心要素：人物介绍原栏目，含身份、成就、品质、社会影响；国籍如适用才写，内容依题选择，不强制四段。

      - 品质+事例：人物主体段的一种可选构思逻辑，与时间轴择适合者使用，不强制两套都做或固定三品质。

      - 句式多样化：人物课的句式素材栏目，按内容选择定语从句、分词结构、强调句，不要求三种齐全。

      - 好作文三步：课程检查／训练标题，内容是审题格式与考点、内容语言丰富度与细节、卷面训练；不压成唯一严格程序或美观评分项。

      - 蓝色标注：暑13该讲扩充语料的材料约定，熟读积累但不要求背诵；绿色是该讲重点词汇短语的背用要求。颜色含义不跨材料泛化，陌生题按语境选用，不据颜色扣分。

      - 应用文写作前三步骤：历史人物投稿例的审题示范，具体动作见投稿小节；不能泛化为全部投稿禁止自我介绍或一律过去时。

      - 报道“一般结构”：原文体框架，时间地点目的参与者→经过→评价或感悟，按当前报道任务用，不套邀请结构。

      - 活动三段式：整理简称，对应活动课原名三段式，不冒充另一套课程原名。

      - 三种句子生成法：整理者总称，对应的课程总称是三种写作表达方法，不另增第四种方法。

      - 人物四件套：整理者对核心要素的便称，未核为课程逐字原名。

      - 句式多样化三件套：整理者称呼，相关三类素材已核，组合名称未核为原名。

      - 要点—句型—词汇三联草稿表：整理名称，实际原表操作仍是中文→词汇→句型，不按便称或表列空间顺序倒置。

      - 初阶：填空训练（强化重点句型）：赠课原训练栏目，读熟后遮词、回忆、核错，基础不足先熟读；不是新题现场作答算法。

      - 刻意仿写：赠课训练栏目，保实际语义关系与可迁结构、按新对象和任务改写，不复刻原例人物事实。

      - 扩展能力：国庆的课程组织栏目，涉及五大话题与九大句型／九大句式；不是新解题法。成员未完整核齐，不自行补齐目录，数量不作单篇配额。

      - 升级复杂句：国庆单句表达训练称呼，按实际原因、建议、目的或结果组织复杂表达，不把所有合句都强冠两简一复从。

      - 功能句式、升华句、部分金句：课程对不同素材的背用要求；国庆偏重点背功能与错漏，赠49另要求整篇背熟，分来源保留训练差异，不变为每篇必须逐项使用。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  4c3b55d00760d42d:
    path: gaokao-writing/references/application-writing-and-correction.md
    heading: 批改交付格式
    line_start: 320
    line_end: 334
    content: '## 批改交付格式


      不要展示题型判断过程。按以下顺序输出：


      书写属于条件项：只有看到原始手写稿且书写已经影响交际时，才在整体结论或重点修改中简要说明降档依据；其余情况不单列“书写美观性”。


      1. 整体结论：给出分数区间或建议分数、所属档次及最关键证据；先肯定一项真实优点，再指出一个最优先改进点。

      2. 五审结果：分别写文体、对象、要点、逻辑、语言。要点用“已覆盖 / 不充分 / 遗漏 / 偏离”标记。

      3. 细致修改：逐处给出原句、建议改法和原因，覆盖明确的语法及相关语言错误；同类错误可合并解释，但保留各处位置与改法。另行说明可选表达优化，不把风格偏好当成语法错误。

      4. 结构优化：用简短提纲说明开头、主体、结尾怎样重排或补全。

      5. 修改稿：保留学生原意和能用的句子，先补任务与逻辑，再改语言；不得擅自加入改变任务的信息。

      6. 方法练习：从单句锚定、模块组篇、长句重构或富兰克林法中选一个最适合本次问题的练习。

      7. 配套素材：仅在有帮助时给 3–5 个可迁移表达或一个简短骨架，不用大段模板淹没反馈。


      语气口语化、具体、鼓励式，但不能虚构优点或淡化会影响分数的关键问题。

      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  596de3e74bdb9393:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 读后续写写作与批改
    line_start: 1
    line_end: 4
    content: '# 读后续写写作与批改


      本文件只用于读后续写，不能使用应用文的五审法、15 分档次或应用文模板。题型识别只做内部路由，交付稿不要复述“这是读后续写”或展示判断过程。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  7b4c299267a685c2:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 使用边界
    line_start: 5
    line_end: 12
    content: '## 使用边界


      - 写作指导至少需要原文和两段开头语；批改最好再有学生完整续写和清晰的书写图片或转写文本。

      - 学生的作文里没出现两段段首句是正常的。段首句由题面给出，答卷不必抄；不要因此当作缺失或扣分。批改只看学生自己写的部分，按用户约定为自写句编号；讲义有把题面首句计入句
      1/6 的另一表格口径，不能据此要求学生重抄。

      - 缺少原文或任一段开头语时，只能校对现有语言，不能判断情节衔接、人物一致、主题或完整分数。

      - 书写和字数只按实际可见内容判断；无法辨认处标记“不确定”，不要脑补。

      - 评分依据是内容、语言表达和篇章结构。十句五定法是开明致学的构思与诊断工具，不是官方单独扣分项。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  d2dc77b78b7ce906:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 25 分评分规范
    line_start: 13
    line_end: 35
    content: '## 25 分评分规范


      先判断内容与原文的融洽度、情节合理性和完整性，再综合语言与衔接确定档次。按课程第五档制给出档次与分数区间。


      | 档次 | 分数 | 特征 | 判断要点 |

      |---|---:|---|---|

      | 第五档 | 21–25 | 亮点突出 | 情节与原文融洽，有自然转折或层次；细节和语言准确有效，句式有变化，不生硬堆砌 |

      | 第四档 | 16–20 | 写好写全 | 核心冲突得到解决，细节较具体，语言流畅，结构和衔接清楚 |

      | 第三档 | 11–15 | 写顺写对 | 因果基本清晰，人物行为有依据，语言通顺，错误较少 |

      | 第二档 | 6–10 | 能写完整 | 有基本故事和结果，但逻辑有断层、表达生硬或错误较多 |

      | 第一档 | 0–5 | 无从下笔 | 内容离题、碎片化、字数不足；时态不统一、单复数出错、中式直译等致命错误多发 |


      学生答卷不写段首句是正常的，表中涉及开头语的衔接项只看学生写的部分跟题面开头语接不接得上，不因为答卷里没有开头语而扣分。


      秋16的句型数量、动作数量和升华练习是分档训练目标，不是本表的官方独立评分要求；是否点题要看情节和题意，不能单因缺一条独立升华句降档。


      附加规则：


      - 词数少于 120 时酌情扣分，通常建议控制在 150 词左右。

      - 拼写和标点按其对交际的影响处理；英式、美式拼写和词汇用法均可接受。

      - 书写差到影响交际时酌情扣分。只有看到原始书写时才能使用这一条。

      - 价值导向应积极，续写的高潮和结尾要顺承原文情节与语言风格。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  09015032f4ec758b:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 书写评价边界
    line_start: 36
    line_end: 43
    content: '### 书写评价边界


      - 书写只评价“是否已经影响交际”，不单独评价美观程度，也不设置卷面美观分、字体分或书法式等级。

      - 只有提供清晰的原始手写作文图片时才评价书写；转写文本、键入文本或无法看清的图片不作判断。

      - “影响交际”是指部分单词、字母或信息无法可靠辨认，已经妨碍阅卷者理解故事；仅仅不够漂亮、个人不喜欢某种字体或一般性的书写差异，不构成扣分依据。

      - 确认影响交际时，依规范结合实际影响程度酌情扣分，并指出造成辨认困难的实际位置；不得预设固定扣分值。没有影响交际时，不因书写另行扣分。

      - 反馈只需简短说明，例如：“原稿中___处较难辨认，影响了这一处情节的理解；建议书写时优先保证字母和单词能够清楚区分。”不要输出额外的美观度评分或超出规范的书写训练量表。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  a9f982dcfec817d9:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 先框架后语言
    line_start: 44
    line_end: 57
    content: '## 先框架后语言


      批改须细致覆盖写作思路和语法两个层面。先依课程的原文线索、构思步骤和十句五定功能位检查学生的构思：矛盾怎样推进、人物为何行动、两段怎样接续、情绪如何变化、结局怎样解决冲突并回应主题。每个思路问题引用原文或段首句与学生原句，讲清缺少哪一步、为什么不合理以及怎样补写或调整；对合理但单薄的情节，给出具体细节优化位置和示例。随后逐句检查语法，包括句子主干、谓语与非谓语、时态语态、主谓一致、从句连接、人称指代、单复数、冠词、介词和词性，并检查搭配、拼写和标点。逐处给出原句、保留原意的改句及原因；同类错误可合并解释，但每处修改不能遗漏。重点概括不是纠错数量上限；区分确定错误与可选润色，不为了高级而改掉准确自然的表达。按总入口要求用纯文本自然段呈现。


      语言再漂亮，只要人物、冲突或段首句衔接错误，就先修框架。依次核查：


      1. 原文衔接：续写是否从原文末尾自然发生，是否利用原文已给事实和伏笔。

      2. 人物人设：人物身份、关系、性格、能力、认知和行为动机是否前后一致。

      3. 故事逻辑：时间、地点、因果、动作顺序、距离和物理条件是否合理；转折是否有铺垫。

      4. 情节走向：第一段能否自然通向第二段开头；第二段是否解决原文的核心矛盾并交代结果。

      5. 主旨立意：结局是否由情节自然推出，回应原文叙述意图，并落在人与自我、人与社会或人与自然的合适方向。


      不要鼓励节外生枝、突然增加关键人物、夸张复杂的事故、无铺垫的反转或为了标新立异而更换主题。正向结局也必须符合原文，不可强行大团圆。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  40089c4aea5930c9:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 开明致学五步法：跳定思提润
    line_start: 58
    line_end: 59
    content: '## 开明致学五步法：跳定思提润


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  1136f0ec086fab00:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 一 跳：跳读文章，弄清线索
    line_start: 60
    line_end: 66
    content: '### 一 跳：跳读文章，弄清线索


      - 先看两段开头语，明确需要回原文寻找什么；再读原文，并回到段首句验证。

      - 用 5W1H 梳理人物、关系、时间、地点、事件和原因。

      - 优先读主人公相关句、人物谓语动词、原文首尾、每段首句，以及 so、but、however 等强逻辑句。

      - 记录叙事视角、时空线、情节线和各关键人物的情感线；人物关系复杂时画出关系和动作链。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  1b0ba42794bd8a00:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 二 定：确定冲突，锁定主题
    line_start: 67
    line_end: 72
    content: '### 二 定：确定冲突，锁定主题


      - 找显性冲突和隐性冲突，写清“谁因为什么遇到什么问题”。

      - 用“主人公 → 核心矛盾 → 解决方向 → 主旨”补全逻辑链。

      - 主题必须包含主要矛盾，可落在人与自我、人与社会或人与自然；结尾升华不能脱离故事。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  7a74f41a6546aa31:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 三 思：整体构思，提取素材
    line_start: 73
    line_end: 79
    content: '### 三 思：整体构思，提取素材


      - 原文末尾、第一段开头和第二段开头共同限定第一段；第二段开头和主题共同限定第二段。

      - 第一段负责承上启下、推进或转折，并在末尾搭桥到第二段。

      - 第二段负责完成高潮、解决冲突、交代结果，再用动作或感悟自然点题。

      - 同时画出时间线和情感线。情绪应随事件变化，避免从绝望瞬间跳到狂喜。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  9b52c2a999ab29a2:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 四 提：完成提纲，定词定句
    line_start: 80
    line_end: 85
    content: '### 四 提：完成提纲，定词定句


      - 先用中文列每段约 5 句的简明提纲，再选能推动情节的动作动词、准确的心情形容词和必要的环境词。

      - 每句话先确定逻辑功能，再决定句型。优先保证清楚、正确；高级结构只能服务情节。

      - 平时可练简化中文→自行英译→对照范文→记录缺失表达，或另做挖空仿写；续写来源未核到“富兰克林法”作为原名，不能借应用文同名认定。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  0cf979fcaa4e9965:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 五 润：检查主题回应，润色修改
    line_start: 86
    line_end: 91
    content: '### 五 润：检查主题回应，润色修改


      - 补充动作、心理、神态、环境或简短对话，让故事有画面；每段选 1–2 处最有效的细节即可。

      - 检查上下文照应、段间过渡、时态、人物指代、主谓一致、名词单复数、词性、搭配、拼写和标点。

      - 若写主题感悟，检查它是否由解决结果自然推出；没有独立升华句时，仍核结局是否回应原文伏笔或关键词。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  c7b254c23e9755d1:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 十句五定法
    line_start: 92
    line_end: 111
    content: '## 十句五定法


      两段各约五句是构思支架，不是固定句数。寒8讲义表把给定首句计入句 1/6，课堂另有给定首句下各列自写 1–5 的编号；秋16还说明四句也可。按用户约定，答卷不重抄给定首句，批改时只给自写句编号，不因句数或编号本身扣分。


      段首句由题面给出；下面是可检查的功能职责，不要求每题都有同一位置、同一类事故。


      先锁定 5 个功能位：


      1. 第一段自写开头：接住给定首句的状态、人物和任务。

      2. 第一段末尾：交代通向第二段给定首句所必需的过程；已衔接就不重复第二段正在发生的事。

      3. 第二段自写开头：接住第二段给定首句，推进实际行动或新状态。

      4. 结局附近：依原文解决核心冲突并交代结果。

      5. 收束处：回应关键线索或人物变化；感悟如有，须由情节推出。


      其余位置用于补足因果链和画面：


      - 其余位置按当前题目的因果过程补动作、心理、环境或互动；没有必要时不强造小波折。


      若学生使用自写十句框架，可依次把自写第 1、5、6、9、10 句对应上述五项功能；句数不同则按实际位置核职责。批改时查现稿是否缺必要桥接、冲突解决或主题回应，并给出具体补法；不要为了凑十句删掉合理内容，也不要把可省过渡当成必补句。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  5391fbc041ed3f90:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 人物和细节描写
    line_start: 112
    line_end: 120
    content: '## 人物和细节描写


      - 人物刻画先找关键人物，只写与主线有关的人。

      - 心理可直接写 think、feel、realize 等，也可用动作、情感或环境间接表现；间接描写必须让读者能看懂情绪来源。

      - 动作要符合人物能力并推动情节。可用原文出现过的动作或物件形成前后呼应。

      - 对话要简洁、口语自然、能解决信息或推动冲突；少用长篇直接引语，不要每句都用 said。

      - 外貌或神态只写能表现人物性格或当下状态的细节。

      - 情感线需有触发点和递进，可用“焦虑 → 希望 → 惊喜 → 感恩”这类链条，但必须按本题原文实际调整。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  adfb5204585068af:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 读后续写批改反馈话术
    line_start: 121
    line_end: 124
    content: '## 读后续写批改反馈话术


      话术要先帮助学生看见故事骨架，再指出情节和细节如何影响得分，最后才处理语法。表达要像老师带着学生顺故事，而不是用评分术语压学生。下面的句式是可替换的表达支架，必须结合本题原文、两段开头语和学生原句使用。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  360e306d3d73b96f:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 话术节奏
    line_start: 125
    line_end: 132
    content: '### 话术节奏


      1. 先复述学生已经搭成的故事链：说明第一段从哪里推进到哪里、第二段怎样收束、人物和核心事件是否仍在原文轨道上。

      2. 再点明主要失分点：优先讲原文衔接、人物人设、因果、段间桥接、冲突解决和主题闭环；不要先用零散语法错误掩盖框架问题。

      3. 用“为什么突兀—缺哪一步—怎样补”的方式修情节，不只说“逻辑不合理”。

      4. 对细节给定向建议：指出应在什么动作旁补哪一种心理、环境、神态或感官细节，每段控制 1–2 处。

      5. 框架成立后再集中纠错，最后给一项可重复训练和一个写后自查清单。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  96d2d454f0e5f45a:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 各环节可用话术
    line_start: 133
    line_end: 184
    content: '### 各环节可用话术


      **开场与故事闭环肯定**


      - “同学你好，咱们先看故事骨架。你第一段顺着___写到___，第二段又从___推进到___，前后形成了一个完整闭环，这一点做得不错。”

      - “你没有脱离原文的___和___，人物仍然是___，核心事件也围绕___展开，说明主线抓得比较准。”

      - “结尾用___回应了前文的___，情绪从___走向___，主题是由故事结果带出来的，这个方向可以保留。”


      肯定必须对应真实内容。故事没有闭环时，只肯定已经成立的局部，如段首衔接、人物一致或某个有效动作，不虚构完整性。


      **主要失分点与优先级**


      - “目前主要影响得分的地方在___。语言不是这篇文章最先要解决的问题，我们先把___补上，故事才能站得住。”

      - “你的基本事件已经写完，所以有基础情节分；但___还比较薄，限制了文章进入更高档次。”

      - “这篇文章的问题不是‘没有故事’，而是___写得太快／太突然。把中间的___补出来，情节会自然很多。”


      **原文衔接、人物和情节逻辑**


      - “这里需要回到原文。原文只告诉我们___，你却直接写到___，中间缺少___这个触发或行动，因此转折显得突然。”

      - “___这个行为和人物前文的___不太一致。除非先补___作为动机，否则建议改成更符合人物能力和性格的___。”

      - “从地点和距离看，___不太合理。结合原文的日常场景，改成___会更贴合，也不会让读者跳出故事。”

      - “不要只写结果‘___’，还要交代它是怎么发生的。可以补成‘先___，接着___，所以___’。”

      - “这一处突然增加了关键人物／事故，但原文没有铺垫，而且它没有帮助解决核心矛盾。删去支线，把篇幅留给___更有效。”


      **两段衔接与十句五定**


      - “第一段结尾必须把故事送到第二段开头。你现在停在___，而第二段一开始是___，中间缺少___这座桥。”

      - “你自写的开头已经接住段首的___；第一段末尾还需交代___，第二段的___才会自然发生。”

      - “第二段现在有___，但结局还没有真正解决原文的___；收束处也可回应___，别另起一个宽泛道理。”

      - “十句五定不是为了凑句数。你现有的___可以保留，只需要在___功能位补一句___。”


      **情感线与画面细节**


      - “你现在写了人物做了什么，但读者还看不到他当时的状态。可以在‘___’旁补一个___细节，例如___。”

      - “情绪从___直接跳到___，中间缺少触发点。先写___，再让情绪转为___，变化就有依据了。”

      - “这里不用堆很多形容词。选一个动作和一个环境／神态细节就够了，比如___，既有画面又能推动情节。”

      - “两段的氛围比较平，可以按‘___ → ___ → ___ → ___’推进情绪，但每一步都要由实际事件触发。”

      - “这句环境描写如果只写天气，会显得游离；让它同时反映人物的___或推动___，才值得保留。”


      **语言纠错与表达升级**


      - “故事框架理顺后，我们再看语言。原句‘___’中，___需要改为___，因为___。”

      - “这里的意思能看懂，先保留句子主干。把___改成___，时态／单复数／固定搭配就统一了。”

      - “这句想写___的画面，但‘___’搭配不自然，可以改成‘___’。修改后既准确，也更符合当时的情绪。”

      - “同一类错误出现了几次，写完重点自查三项：拼写和词形、时态统一、固定搭配。”


      **总结与训练引导**


      - “整体来看，你现在已经能把故事完整写完，也抓住了基础情节。下一步重点积累情绪描写和环境烘托的短句，每段有 1–2 处有效细节即可。”

      - “这次先练一个最关键的动作：用第二段开头反推第一段结尾。把___到___之间补成两步行动，再读一遍是否自然。”

      - “下次写前先画人物、事件和情感三条线；写完再查段首衔接、核心冲突是否解决、结尾是否回应原文。做到这三步，框架会稳定很多。”


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  7f766995677fdd63:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 话术使用禁忌
    line_start: 185
    line_end: 193
    content: '### 话术使用禁忌


      - 不只报“情节不合理、细节不足、衔接较弱”，必须指出具体位置、缺失环节和可执行补法。

      - 不把华丽词汇和高级句型当作首要建议。人物、因果或段首衔接没理顺时，不进入语言升级。

      - 不机械累计每处扣分，也不因没有凑满十句而扣分；先按整体融洽度、合理性、完整性和语言表现定档。

      - 不要求每句话都加心理、环境和神态，不鼓励为制造波折而增加无铺垫人物或事故。

      - 不用“你完全没读懂原文”等定性话语。可说“这次在___处与原文的___没有接上”，并告诉学生怎样回原文找证据。

      - 不空泛安慰。鼓励必须建立在学生已经完成的故事环节上，并以一个明确训练任务结束。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  60d2d16996c30d2f:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 26S 讲义新增内容
    line_start: 194
    line_end: 197
    content: '## 26S 讲义新增内容


      以下保留 26S 各课讲义的不同名称和版本。真实冲突并列看来源和题目，不能按课次先后自动覆盖。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  486a5ba8d06a5eb7:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 情节构思：PTSD 四步法
    line_start: 198
    line_end: 207
    content: '### 情节构思：PTSD 四步法


      寒8板书的 PTSD 为 P 目的、T 方式、S 苦难、D 结局；同课表格写 P 需求、T 方法、S 困难、D 结局。先据两段首句列已知与未知槽，再回原文核人物关系、目的、矛盾和沟通方式；未知处先留空，不凭口诀补故事。寒14简明槽位另写
      P 需求、T 波折、S 方法或解决方案、D 结局，T/S 职责不同。寒14另有标题“PTSD四步法”的本题分析表，列 Needs、Difficulties、Solutions、Denouement；四词不是
      PTSD 字母的英文展开。用时说明来源版本，不混成一套。


      寒8修书与寒14两篇现场已补槽位实施证据。先首句提出的问题只是待证候选，回文可以推翻人物身份、冲突或主题初猜；未知槽保持未知，不为了填表补故事。主题可兼有人与自我和人与社会侧重，不强迫二选一。两段规划补必要桥梁，已有衔接不重复；回扣关键线索不等于原文每个物件、背景或救援渠道都必须重写。第二段若出现新的实际触发，可以有新的焦虑，不把避免重复误写为禁止同类情绪。


      **四点串剧情（旧高二 PPT）**：原名独立登记，内容为 Purpose 需求、Twist 波折、Struggle 行动、Denouement 结果感悟。


      **PTSD（旧高二 PPT）**：同一旧版来源使用的另一名称，与“四点串剧情”有关联；不据此统一寒8或寒14定义。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  c982394b7e7a8b3e:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 解题四步骤
    line_start: 208
    line_end: 211
    content: '### 解题四步骤


      ①通读全文，掌握大意，理清 who、when、where、why、what、how 六要素 ②研读首句，构思情节，即 PTSD ③回扣原文，增加细节 ④修改润色，整洁誊写。润色可灵活使用无灵主语句、非谓语短语、独立主格结构、复合句、强调句。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  9f6e7874c0eef6ae:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 八个技巧（情节节奏模板）
    line_start: 212
    line_end: 215
    content: '### 八个技巧（情节节奏模板）


      ①情绪描写（恐惧、震惊、愤怒、绝望、悲伤、愧疚、高兴、兴奋、羞愧）②细节描写（面部细节、肢体动作、环境细节）③转折描写（个人努力或借助外界帮助，事情有了转折）④转机描写（似乎有了转机，抱有希望、感到欣慰）⑤失望描写（问题还没解决或出现新问题，跌宕起伏）⑥新法描写（突然有了一个想法，一句话说明，峰回路转）⑦结局描写（过了一段时间，事情有了最后的转折，向好的正能量发展）⑧总结描写（点明主题，呼应前文）。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  3251f3f539ab88d7:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 三条基本规律
    line_start: 216
    line_end: 219
    content: '### 三条基本规律


      ①和原文保持一致（衔接、连贯、语言风格一致）②保持曲转起伏，讲义原字为**节外生枝：制造冲突**③正能量原则。第②条另要求寻找文中矛盾、合理制造波折；与上文防止无根据支线的提醒并列，不把讲义词义改成凭空新增事故。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  ee46919f768fcf3f:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 三重匹配
    line_start: 220
    line_end: 225
    content: '### 三重匹配


      寒14原组合标题为“三重匹配+双重升华”，其中“三重匹配”核本材料情节、情感、风格与原文是否统一。标题称“三重”，后文另列主题锚定等四点，异文照留。不能把该题的“危机升级→转机→解除”当所有续写的固定剧情。


      寒14现场另以主题、情节、情感风格三块口述；与讲义拆分颗粒度不同，各自保留，不因口述没逐项展开双重升华就否认讲义定义。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  8df5f0f660b2453c:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 双重升华
    line_start: 226
    line_end: 229
    content: '### 双重升华


      寒14同一组合标题中的独立名称，指本材料结尾的主题与认知升华；不解释成两段各升华一次，也不设为所有续写的独立必写句。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  8816ae76b6da19d9:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 四步精准续写
    line_start: 230
    line_end: 233
    content: '### 四步精准续写


      寒14原题分析用审题定位→情节构思→语言表达→校验优化四步；“四步精准续写”为整理简称。该讲义的“情节节点法”、节点安排及 3/5/10/2 分钟分配均限此材料示范，不覆盖陌生题的情节或统一考试时间。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  637ac5c60b37baf7:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 黄金法则（内部记忆）
    line_start: 234
    line_end: 237
    content: '### 黄金法则（内部记忆）


      寒14本材料的总结口诀是原文为根、冲突为力、细节为魂、主题为光。按本题原文理解，不将“第一段强化危机、第二段解决危机”推广为每题固定安排。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  866388dfa1b014b3:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: gap 读法与首句规则
    line_start: 238
    line_end: 241
    content: '### gap 读法与首句规则


      先读两段首句，标出已明示的人物、状态、时地和任务，带着状态变化产生的问题回原文找线索。核首句人事物与续文的必要联系，不机械让每个名词或人物各占一句；必要因果过程须补，可省过渡不强加，衔接不重述下一段正在发生的事。原讲义写“任务都需要涉及”，口述机器转写有“人物”异文，两源保留。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  314387087cce4dda:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 动作链与动作面
    line_start: 242
    line_end: 253
    content: '### 动作链与动作面


      动作链：当前动作太笼统时，拆出真实相关的小动作，保持人物、时间顺序和因果，再按语境补状态；不能为凑动作数添加无根据的能力或情节。动作面在秋16原讲义中与动作链并列，是使动作饱满、生动、有画面感的描写思路概念；原名与身份已认定，没有单列组成公式，不自造“动作＋心理＋环境”算法。


      Skill 1：主语 + 动作 A + and + 动作 B（两个并列动词）。例：They jumped into the car and drove
      to the amusement park excitedly.


      Skill 2：主语 + 动作 A，动作 B + and + 动作 C（三个并列动词）。例：She dashed forward in a hurry,
      knelt down and held her son into her arms tightly.


      Skill 2已有原讲义定义及两项独立微练习证据，身份是局部三动作句式训练。“方法二用法总结”原栏目写使用3个并列的动词，同样按局部训练理解；不将其另立为整篇第二套算法，也不要求所有并列项都表示短暂、先后发生的动作。迁相关动作组织，不迁原例的跪下、手机等具体情节或范句搭配。


      “动作最多分解三个、名词最好两个”是该课练习配比，不是全体句子的语法上限或评分标准。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  65f20f86dc7c5210:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 五档升级路径（训练用）
    line_start: 254
    line_end: 265
    content: '### 五档升级路径（训练用）


      第一档到第二档，从无从下笔到能写完整：三要素锁定法（核心人物、核心矛盾、关键线索）；“段首句＋2 动作＋1 结局”框架；简单句扩展公式（基础句加时间、地点、方式状语，保底不低于
      120 词）；致命错误零容忍（时态统一、单复数正确、拒绝中式直译）。


      第二档到第三档，从能写完整到写顺写对：伏笔呼应法（每个人物行为对接原文伏笔）；因果逻辑链（因为 A、所以 B、最终 C）；进阶句式三选一（介词短语作状语、简单定语从句、宾语从句）；词汇精准替换法。


      第三档到第四档，从写顺写对到写好写全：三维细节添加法（每段至少两处动作、神态、环境细节）；实用高分句式包（非谓语动词、with 复合结构、宾语从句）；意合衔接替代法（关键词复现加代词指代，替代
      and/so/then 堆砌）；主题明确法。


      第四档到第五档，从写好写全到亮点突出：微转折设计法（在解决问题中加入一个拓展性转折）；质感词汇替换法（vintage、tarnished、honed 等场景化高级词）；多变句式组合（非谓语加定语从句加独立主格，每段不超过三处）；主题升华法。


      这些是秋16原讲义的分档改写训练，不与上文25分评分表拼成同一套官方逐项要求；句型数、动作数和替换词对均不能机械扣分。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  4b1d65a04c19b519:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 第五档作文标准与句子框架
    line_start: 266
    line_end: 271
    content: '### 第五档作文标准与句子框架


      词汇层面：精准化高级词汇替换基础词（clutch 替 grip、unshakable 替 great、tuck 替 put），搭配地道，加入细节限定词。句式层面：以复合句为核心，融合一到两种复杂结构，状语从句加非谓语或介词短语作伴随状语为高频组合。内容层面：多层细节描写（动作加场景加情感），传递明确情感，叙事符合现实。表达层面：流畅有感染力、无语法错误，避免中式直译。


      通用句子框架公式：场景状语 + 主句（动作加细节）+ 伴随状语（情感或动作延伸）。套用时注意：宾语修饰成分贴合语境，不为“高级”堆砌；非谓语动词的逻辑主语与主句主语一致；情感修饰词与场景匹配。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  625feff688a4d50a:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 肌肉句与骨架句
    line_start: 272
    line_end: 277
    content: '### 肌肉句与骨架句


      凡是冲突、重点扩写句都在**不定**的句子中展开，称为**肌肉句**，用来冲击高分；凡是**确定句**都是功能句，称为**骨架句**，确保文章逻辑一致、不偏题。不定句位的写法是“会啥写啥、言之成理”，写有把握的内容，展示背诵素材功力。


      **秀肌肉**是寒14展示已有词句素材的课堂黑话，前提是当前句位和情节容许展开；不另设整题程序，不以素材挤掉必要桥梁，不由比喻新增句数要求。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  27662f3285730b79:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 主题三大类的定义
    line_start: 278
    line_end: 281
    content: '### 主题三大类的定义


      人与自我是**自我突破**（“你”的问题及其解决方案）；人与社会是**互相帮助**（社会和谐、更好的彼此）；人与自然是**尊重生命**（和谐共处）。另有把第三类写作“人与环境”（自然灾害、意外事件、社会压力）的，含义相近。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  5f3815b7a4645e0d:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 十句五定法的功能表
    line_start: 282
    line_end: 285
    content: '### 十句五定法的功能表


      寒8讲义表：第一段句 1（给定首句）衔接提示，句 5 过渡；第二段句 6（给定首句）衔接提示，句 9 交代结局，句 10 点睛。课堂和本模块的自写编号另从学生写的句子起算；若按自写十句框架，则自写
      1/5/6/9/10 对应这些职责。其他位置补足因果链和画面；句数及位置可以随题目调整。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  fc2eb7086313fb80:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 素材与考点
    line_start: 286
    line_end: 291
    content: '### 素材与考点


      “卷面、字数、升华句”是课程考点提醒，不能据“采分点”把独立升华句列为官方硬扣分项。四类主题升华句是助人与善举、个人成长、亲情友情、历险脱困的素材分类；金句
      80 个、升华句 10 个、10 个句式结构加 100 个核心高分词是积累安排，不是单篇使用数量。暑16及春11说升华句不一定必须，秋16则要求隐形升华也要有；不同口径并列，实际反馈看情节是否自然回应题意。


      分数分层训练目标：115 分以下以客观题为主，作文抓写作框架加基础句式表达；115–130 分积累好词好句；目标 135 分以上要提升客观题速度，给作文留出时间。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  ae0dbc7cf4fb601b:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 五步成文法
    line_start: 292
    line_end: 295
    content: '### 五步成文法


      暑16的“读后续写五步成文法”列 Skim-through for Clues、Identify Conflict, Define Theme、Overall
      Conception, Material Extraction、Frame-building, Outline Refinement、Theme-elevation,
      Polishing and Perfecting。寒第10次讲义首部也用“五步成文法”名称，却列少读文章找线索、必用句型／模板、心情动作环境、结尾句、模板五项；同件后部解析又按跳读、冲突主题、整体构思、定词定句、润色组织。名称相同而列表不统一，来源各自保留；其中“必用”限原课列表，不扩成每题硬要求。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  578c5dd3258d2512:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 跳定思提润
    line_start: 296
    line_end: 299
    content: '### 跳定思提润


      10.4讲义的独立口诀；本模块上文已按跳、定、思、提、润逐步说明。读两个首句后带着待证问题回原文，不把初猜当事实；不把此口诀当成上述各版“五步成文法”的并列原名。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  330d7718cd30f5a1:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 读后续写五字原则
    line_start: 300
    line_end: 305
    content: '### 读后续写五字原则


      秋16讲义独立名称，功能与构思到润色相关；不改称其他五步流程的别名。


      寒第10次讲义另有“读后续写十大仿写句式”总标题及十类素材；名称已核，逐类陌生题现场适用边界未验，不当作每篇使用配额或独立解题算法。“矮胖圆”只作为字体训练参考，缺逐字定义，不作书写评分算法。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  e5ccef0dea97bb04:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 反向劫匪插葱
    line_start: 306
    line_end: 309
    content: '### 反向劫匪插葱


      寒8讲义在此名旁括注被动语态和无灵主语；寒14现场明确区别：已有一个简单句，再补相关修饰、扩写表达，用反向劫匪插葱；把两个简单句的信息拼成复杂表达，称两简一复从。保主干、语义和修饰归属，不按黑话逐字生造步骤，不借应用文同名版本统一组成。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  4c2cf34943f5bede:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 句子升华三部曲
    line_start: 310
    line_end: 313
    content: '### 句子升华三部曲


      寒14的单句训练原名：中文简化→简单英文翻译→优化升级。升级可按实际内容选句式、介词短语、非谓语、从句或更准确的词；基础表达准确时可不换词，修饰也可不加。它不是整篇主题升华，不是反向劫匪插葱的统一定义，不要求每句用完所有升级手段。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  52eee323a135cfc4:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 国庆续写的独立入口与提纲方案
    line_start: 314
    line_end: 327
    content: '### 国庆续写的独立入口与提纲方案


      **读后续写写作步骤**：原画四栏目为精读原文梳理3W1H→分析段首句搭框架→优化语言→检查修正。口头也称五步成文法，但本页和现场逐项为四块，不补造第五步；与旧先两首句再回原文的入口分来源保留。现场把常错检查前移至写前、写时避免，不据“不好改”禁止写后纠错。


      **3W1H**：本页Who人物、What事件断点、Where场景、How情感与态度。不补When、Why冒充本表成员；当前故事的实际时间和因果仍须核对。


      **关键词串联法**：草稿简记核心人物、动作、结果和每段概要，再记拟用句式与词汇，核能否接通原文和两段首句；不逐字誊完整英文草稿，不照搬例题剧情。


      国庆拔高续写的五项技巧分别保名：**找六大要素**，找原文支持的5W1H，不强求全找齐；**按时空理情节**，按实际时空变化串情节，不凭时间词造因果；**定情感基调**，以行为、语言和描写判断情绪，允许有依据的变化；**理人物关系**，复杂时画关系图，不按身份读心；**析矛盾冲突**，核目标与阻碍，围绕主线合理收束，不造事故凑冲突。


      **读后续写“七句成段”**是功能句位方案。第一段承接→反应发展→冲突→所思所说所做→推进→问题未解→接第二首句；第二段承接→发展→高潮→促解决→解决→人物反应→呼应或点题。第4讲现场明确复杂句可合并，常见每段4–5句，并压成“四句话版本”：承接发展、矛盾、解决行动、接下段，是否已解决按两首句限制。职责保留，不强制每篇十四句或第一段必须失败；末句可用动作含蓄点题。它不取代十句五定，也不与之拼成唯一句数流程。


      **读后续写“跳定思提润”五步解析与创作**是国庆原解析标题，依两首句观察与待证预判、冲突主题、全局构思素材、提纲语言、润色组织；与本模块旧口诀有职责关联，保各自来源，不把四栏目或七句方案静默改成同一版本。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  5e20d2f7b2a66be1:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 26S春 补充（人与自然专项）
    line_start: 328
    line_end: 359
    content: '### 26S春 补充（人与自然专项）


      **人与自然三分型**：①生存挑战——靠冷静应对和坚韧不拔成功脱险 ②自然观察与学习——通过对自然的观察增进理解与敬畏，推动科研或个人成长 ③生态保护与救援——在保护救援自然生命中展现责任感与同理心，最终保护生态或救下动物。


      **人与自然四步框架**：①问题解决前的负面情绪 ②解决过程 ③解决后的积极情绪 ④主题升华。三型均按这四层组织语料。


      **情绪词汇分级**：负面——悲伤痛苦 miserable，焦虑紧张 uneasy、panic-stricken，愤怒懊恼 annoyed、indignant，绝望无助
      desperate、overwhelmed，尴尬内疚 embarrassed、mortified，动态激起 a wave of sorrow、be overcome
      with grief。正面——淡定自信 poised，治愈温暖 gracious、sanguine，愉悦欣喜 exhilarated、ecstatic。


      **心情万能句式**：春11的情绪描写素材标签，视频明确用于该十句框架的非功能句位，按当前人物、动作和情绪换词，不能挤掉承接职责或因“万能”新增无据危险。


      **动作万能句式**：春11应对困境、整理思绪并寻求出路的表达素材，用于该框架非功能句位；限人物确在应对问题，按能力、时态与场景选用，不代替任意动作、不强制凑满五句。


      **环境万能句式**：春11可选环境表达素材。已有必要情节后有需要才补，按实际地点、时间、天气改词；该课说一般放在第一段或第二段第三句、不放结尾且不占开头功能句，限这组模板的位置建议，不是所有环境描写的禁令。视频森林题粘贴校园／走廊而未改是错配，不作适用证据。


      **成长升华句**：春11的成长主题结尾素材，按故事需要选用。


      **帮助升华句**：春11的帮助／互助主题结尾素材。原DOCX有完整表达，以互相尊重、真诚理解联系心与心为主干，再延展其精神纽带作用；限当前故事实际支持这些关系时选用，不把所有救助都改成互相理解。视频本课同名位置空白，老师明确说下课后补，故有原件成句证据，不声称视频已现场生成。


      **自然升华句**：春11对应环保或保护自然生命、资源的结尾素材。新增现场链是先选责任与同理心，再按本题改保护对象，说明人与自然联系，最后接生态平衡的意义；只在当前行动支持这些含义时用。不能把自然观察、寻亲回忆等自然场景一律归成环保救援，也不强行塞生态平衡。三类原例中有强调句，不推出所有题必须写独立升华句或只能用强调句。六个原名分别保留，前三表达描写、后三结尾，不合成六个整题算法。


      **素材套用练习**：春11有背熟句子→找相关对象并确定情绪→按当前情境使用的三步操作；“万能句式三步套用法”为旧整理名，完整课程原名未核。对象可以是自己，不预设反派，也不机械照搬不合语境的句子。


      **春11四条总纲**：该课侧重语言表达、功能句衔接和选用模板素材，提醒不要死扣无关细节；同时要求关键元素呼应。结尾不一定另写升华句，文章平淡时可按情节补主题回应。讲义中的模板位置及数量是该课训练安排，不作通用评分要求。


      **两种结局走向**：机缘巧合找到了（最合乎常理）；或还是没找到，但一定要有其他收获，如找回与父亲的回忆、决定持续努力。


      **原文有伏笔，续写必有呼应**：春11要求充分利用原文的重要元素，按当前故事和两段首句选择需要回应的伏笔；不要求全文每个物件都在续写中出现。寻找原文矛盾点，不能另造主线。


      **描写对象交替出现来推动情节发展**：春11原名指相关描写对象的转换服务情节；原文、回忆、当下不是所有题固定的交替序列。


      **与其他课的张力**：春11强调写作表达与关键元素呼应，寒14本材料强调原文为根；两种侧重保留，不按新课覆盖旧课，也不把春11讲成无需读懂原文。新增事件仍须有原文依据和因果铺垫。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  aea1b702a1cd36de:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 补充原名与版本入口
    line_start: 360
    line_end: 403
    content: '## 补充原名与版本入口


      以下是已核名称或职责的遗漏补记，按来源分别解释。来源标签不是新增方法名；训练材料不自动变为陌生题固定步骤。


      - 三化法：10.4续写讲义的原名线索提示，观察首尾段、段首句、强逻辑句以提取故事线索；本模块跳读中已有相应动作。与客观题阅读三化分板块，不移入阅读的重复词三项或主旨题入口，不只读谓语而丢掉必要信息。

      - 先读两个首句，带着猜测去读文章：原操作表述，按两首句的人物、状态、时地形成待证问题，再回原文补过程；猜测不当事实。

      - gap：寒14构思黑话，指两首句状态之间需交代的过程信息，没有已核字母展开。

      - 文章gap：原讲义表述，指上述过程空缺，不把任何差异都称冲突。

      - 找到gap：原操作称呼，找过程空缺并联同主旨回文，不另增整题方法。

      - gap读法：旧整理简称，原操作有证，完整名称未核为课程原名。

      - 所有名词必须提：旧整理省略限定的说法，原句实际限两个首句中的名词；按必要联系与任务衔接理解，不能扩成全文所有名词都要写。

      - 人物都需要设计：口述语义表述，思考首句人物的行动与关联；原画面另写任务，均保留，不强制所有人物出场。

      - 十句行文法：旧高二PPT归档的句位提纲原名，用句位安排需求、波折、行动、衔接和结局；与十句五定有关联但未证严格命名等同，不借此改寒8／寒14编号或强制十句。当前原PPT未复定位，只复用已验旧渲染。

      - 十句行全文：旧PPT页内原字，保留材料标题身份，不静默改名为十句行文法或十句五定法。

      - 不定的句子：寒14原职责表述，在可展开位置写冲突、细节与适用素材，对应本模块肌肉句说明，不能另开无关支线。

      - 标准三段式：旧整理总称，指简化中文、简单句翻译、优化升级三动作；不是已核反向口诀定义。

      - 四步完成“精准续写”：寒14本材料分析安排的原表述，具体动作见四步精准续写小节；不覆盖寒8四步骤或五步成文法。

      - 四个步骤：寒8原讲义流程，通读六要素→研读首句／PTSD→回扣细节→润色誊写，对应本模块解题四步骤；来源与寒14四步分开。

      - 读后续写基本规律及解题要领：寒8原栏目，三项内容见三条基本规律，不新增独立判断算法。

      - 三原则：上述三条的计数简称，不与三要素锁定法混用。

      - 人与环境：暑16原主题分类表述，含自然灾害、意外事件、社会压力，原课允许主题混合；与寒14人与自然有关联但不是无差异的同一分类。

      - 人与自然三类：春11专项分类称呼，三项内容见人与自然三分型，不改成PTSD展开。

      - 因果逻辑链搭建：秋16训练原名，按真实因为A→所以B→最终C梳理，与本模块因果逻辑链内容有关，不凭公式造因果。

      - 进阶句式3选1：秋16原训练名称，内容见进阶句式三选一，不作所有题句型配额。

      - 五档次升级版本（从基础到高阶）：秋16原材料总标题，五档升级路径为整理便称；单句训练与整篇分档不拼成官方评分表。

      - 金句80个：素材积累安排，不是单篇句数要求。

      - 升华10句：结尾素材积累安排，不要求每篇十句升华。

      - 10句式+100高分词：素材安排，数字不成为作文使用配额。

      - 三大话题模板：模板分类／教学安排，按当前故事选择；不能只背模板或借此共用两作文流程。

      - 环境句位置：春11该组模板的位置建议，见环境万能句式，不扩大为所有环境描写的绝对禁令。


      寒第10次讲义“读后续写十大仿写句式”的十类素材逐名保留如下，属于素材类别，不激活十套算法；完整陌生题逐类适用边界仍未验，也不以类别标题保证所有原例语法正确或都在句首。


      - 仿写句式一：无灵主语开头。

      - 仿写句式二：倒装句、强调句开头。

      - 仿写句式三：对话或独白开头。

      - 仿写句式四：介词短语开头。

      - 仿写句式五：独立主格/with复合结构开头。

      - 仿写句式六：形容词/副词开头。

      - 仿写句式七：环境描写开头。

      - 仿写句式八：非谓语动词开头。

      - 仿写句式九：动作链。

      - 仿写句式十：主题升华。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  8a92195b0de077f2:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 批改交付格式
    line_start: 404
    line_end: 419
    content: '## 批改交付格式


      不要展示题型判断过程。按以下顺序输出：


      书写属于条件项：只有看到原始手写稿且书写已经影响交际时，才在整体结论或重点语言修改中简要说明扣分依据；其余情况不单列“书写美观性”。


      1. 整体结论：给出分数区间或建议分数、所属档次及最关键证据；先肯定一项真实优点，再指出一个最优先改进点。

      2. 框架诊断：分别写原文衔接、人物人设、故事逻辑、情节走向、主旨立意；引用原文或段首句证据说明。

      3. 十句五定功能检查：看自写开头、第一段末、第二段自写开头、结局及收束是否完成相应职责；若学生采用自写十句框架，可对应自写 1/5/6/9/10 句，句数不同按实际位置说明。

      4. 情感与细节：画出情感变化，指出哪里缺触发、过渡、动作、心理、环境或神态细节。

      5. 细致语言修改：逐处给出原句、建议改法和原因，覆盖明确的语法及相关语言错误，先说明影响理解和反复出现的问题；同类错误可合并解释，但标清各处位置和改法。可选润色单独说明，不作为语法错误。

      6. 修改提纲：先给两段中文提纲，每句只写逻辑功能和核心事件。

      7. 修改稿：保留学生原意和可用句子，补齐桥接、冲突解决和点题，再升级语言；不得改变原文人物、关键事实或叙事视角。

      8. 方法练习：只选本次最需要的一项，如段首句反推、情感线补全、动作链、十句五定或中文英译对照训练；续写“富兰克林”原名未核。


      语气口语化、具体、鼓励式，但不能虚构优点，也不能用“高级句型”掩盖情节偏离或逻辑断层。

      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  d49944ab3441bc54:
    path: gaokao-writing/SKILL.md
    heading: 入口契约
    line_start: 1
    line_end: 13
    content: '---

      name: gaokao-writing

      description: 高考英语作文老师。应用文与读后续写的写作指导与批改，两套评分规范和反馈模板各自独立。用于应用文写作或批改、读后续写写作或批改、作文疑问解答。不处理语法填空、七选五、完形填空、阅读理解（见
      gaokao-english）。

      ---


      # 高考英语作文


      按开明致学课程的写法与评分规范带学生写作、批改作文。不自创同名方法，不把知识清单或整理标题当成固定步骤。


      课程原名按应用文、读后续写及来源版本分别使用，不合并同名的不同定义。口诀解释其实际操作，思路概念、局部训练、文体模板和表达素材按各自职责使用，不因有名称就升级为整题算法。来源差异、已核范围和勘误见
      [references/course-evidence.md](references/course-evidence.md)，追问出处或遇到版本冲突时读取。


      应用文与读后续写是两个独立模块，各自的评分、结构诊断和反馈格式不通用。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  01663392daf23939:
    path: gaokao-writing/SKILL.md
    heading: 只管写作与批改
    line_start: 14
    line_end: 21
    content: '## 只管写作与批改


      本技能只处理应用文和读后续写的写作指导与批改。学生拿来客观题（语法填空、七选五、完形填空、阅读理解），说明这里不处理，让他走 `gaokao-english`。


      不虚构学生原稿，不虚构批改分数。缺题目、原文、段首句或学生全文时，只处理现有信息能支持的部分，并明确哪些评分维度暂时无法判断，不臆测完整分数。


      学生的作文里没出现两段段首句是正常的，不算缺项，批改只看学生该写的那部分。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  af255d18e493d10d:
    path: gaokao-writing/SKILL.md
    heading: 交付形态：微信答疑消息
    line_start: 22
    line_end: 32
    content: '## 交付形态：微信答疑消息


      给学生的回复是**微信上回学生的消息**，不是一份排好的批改报告。


      - **要有活人感**。像老师坐在对面跟学生说话，不是系统在出评估单。语气自然，句子长短不一，该肯定就肯定，该直说就直说。

      - **不要那么齐整**。不排编号条目、不分点罗列、不加小标题、不套固定表格。该连着说的地方就连着说，不必每一点都单独起一行对齐。

      - 纯文本，对话里直接给。不用 Markdown 符号，不用引号括住原句，不排目录。

      - 不写成讲义或提纲，不加报告栏目、评分表样式的排版、箭头流程。


      排版不拘束，**内容不打折**：该指出的问题要指出，该给的原句、改法和理由要给全。活人感不等于糊弄。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  433b463c97fe38e9:
    path: gaokao-writing/SKILL.md
    heading: 批改顺序
    line_start: 33
    line_end: 40
    content: '## 批改顺序


      先整体框架，后细节语言。先判断是否完成任务、是否切题、结构是否成立，再处理语法、词汇、拼写和句式升级。


      先指出真实优点，再给出最影响得分的问题。每个问题都要落到原句、修改示例和可复用方法，避免只报错或整篇代写。


      批改要细致：上述几个问题是优先级概括，不是完整批改的数量上限。先按各自课程诊断写作思路、结构和可优化之处，再逐句检查语法及相关语言问题；明确错误应逐处指出并给出改法与原因。同类错误可合并解释规则，但要标清各处原句及修改。区分必须纠正的错误与可选择的表达优化，不把正确表达判错。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  443d998d7bf5b2d4:
    path: gaokao-writing/SKILL.md
    heading: 两个独立模块
    line_start: 41
    line_end: 50
    content: '## 两个独立模块


      - **应用文写作或批改**：必须读取 [references/application-writing-and-correction.md](references/application-writing-and-correction.md)，使用应用文五审法、15
      分五档评分、对应写作方法和应用文批改反馈话术。

      - **读后续写写作或批改**：必须读取 [references/continuation-writing-and-correction.md](references/continuation-writing-and-correction.md)，使用原文线索、十句五定法、25
      分五档评分、对应续写方法和读后续写批改反馈话术。


      两类作文只共用先整体后细节和鼓励式表达原则；不得合并评分表、批改清单、参考范文或改写结果，也不得把两类分数相加或换算。


      用户只要求写作时，不虚构学生原稿或批改分数；用户要求批改时，保留学生原意，先说明影响档次的核心问题，再改语言。


      学生只是问某个写作方法（比如十句五定法怎么用、五审法审什么）时，按对应模块里的说法答，用课程原名，不换成通用说法，也不顺手把整类作文讲一遍。

      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
