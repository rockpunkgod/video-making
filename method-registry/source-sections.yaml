    heading: 做题顺序的处理
    line_start: 23
    line_end: 28
    content: '## 做题顺序的处理


      课程录像里出现过强顺序（七选五课「永远先三一致后小词」「按文体固定入口」等），也有多处明确的「小心求证」；本索引按「与其他课程的无固定入口并列留档、不静默统一」处理，即不发布固定题序。


      本节曾按用户指定记录四条整篇顺序，其中“完形按原空号走两遍”现为历史，已由下文2026-10-12“完形作答顺序约束撤销”登记覆盖，不约束当前作答。七选五按容易突破的先做，阅读
      A、B 篇顺做、C、D 篇先主旨后细节后猜词，语法填空先做无提示词的空，仍保留原用户指定顺序。原课程强顺序与不同版本继续留档，不从本节历史恢复完形固定空号或遍数，也不借课程冲突回改其他题型当前顺序。


      '
