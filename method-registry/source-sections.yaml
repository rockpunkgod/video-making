  f9c747789c161779:
    path: gaokao-english/references/course-evidence.md
    heading: 完形语篇行文结构（课程内容）
    line_start: 113
    line_end: 118
    content: '### 完形语篇行文结构（课程内容）


      “完形语篇逻辑破译”见于课程系列标题；《【课上讲义】第7讲 完形语篇逻辑破译 （26S春）》正文标题为“第7讲 完形语篇逻辑破译：完形语篇的行文结构”，其他讲次另讲上下呼应、瞻前顾后，不能把系列名称注册为单个解题方法。其技巧说明明确把空分为语境词义、逻辑关系和固定搭配三类，要求先读首句和情感基调，再逐空结合上下文与逻辑线索，最后通读全文回查。词性相同不能直接排除，固定搭配不能脱离语境机械套用，单句通顺也不能替代全文逻辑。


      来源VIDEO_E9194BC1886F的52–78分钟996段本地ASR与7个原帧进一步解释首句框架后的局部核对：区分外在表现、实际遭遇与人物态度，还原指示表达和概括范围，再判断转折是在比较内容还是扩展方面；同方向候选仍核具体语义和程度，教师口头支持与画面未填状态分开。另一不同材料只接受123:00–125:57的清楚动作：按参与者和已述活动核动作先后，把人物问句、时间推进和最终决定合看以确定局部状态。新增一条MEDIUM，与旧证据共同说明问句或时间词不能单独定案；不收后续空全部排除，也不以待定邻空循环证明。两个材料均为局部逐空解释，不是两篇完整15空或全部语义验收。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  46072a2745cacb12:
    path: gaokao-english/references/course-evidence.md
    heading: 瞻前顾后法
    line_start: 119
    line_end: 144
    content: '### 瞻前顾后法


      继续补VIDEO_14912A4EFE59的120分钟至150分45秒课尾，两窗本地ASR与31张原帧局部对齐，本源连续转写覆盖已接齐。126:29–128:25展示候选表面均可通时继续读后文明示行为或评价，再回查空位，并区分当前被评价对象与另一主体的感受；133:55–134:35及135:07–135:21说明中文译义接近仍须核候选在当前句中的作用。新增两条MEDIUM补强已有后文回查、对象归属与句中功能解释，不增加方法名或固定步骤。第三篇15空及课尾回题记录齐备但不代表全部排除成立；教师主动保留的一处答案分歧、词义与情节转述疑点仍隔离，不用常识替教师改课。课尾跨题型口头补充无相应题面，仅待后续主课对齐；全方法音频验收未完成，也不是直接逐字听核。


      继续补VIDEO_14912A4EFE59的88至120分钟本地ASR与32张逐分钟原帧。90:00–92:42及104:00–104:23解释多个动作须按实际事件串联，候选不能额外补入未交代前提；102:57–103:35及104:26–104:52说明连接关系还须核事件各自的发生时间，不忽略明确间隔。112:23–115:15及115:55–117:04从附近情绪返回完整问答，解释动作须对应实际提问，暂留后由明确回答回查。三条MEDIUM只解释既有方法，不发布原题词对、手势与否定问句的固定对应，也不新增课程名称或固定步数。第二篇15空记录齐备但若干词义和排除疑点未闭合，第三篇至37空、36辨析未完；120分钟后及其他方法仍待核。原ASR保留，词面差异结合语境与清晰画面旁注，不冒称直接逐字听核或整篇验收。


      继续补同源“上”课56至88分钟本地ASR及32张逐分钟原画面。67:04–67:31答疑明确多个对应线索先全部标出、再逐项匹配候选，仅补已有双向核对，不推广线索必同向的强说法。73:00–75:09及81:20–83:37用完整否定、评价维度与转折解释熟悉搭配或初步情节理解为何不足。新增两条MEDIUM，具体词对、答案和课堂类比均留内部。首篇15空记录齐备但词义与结构疑点未解除；第二篇仅至21空且排除未完，88分钟后待接。转写差异结合语境以清晰画面旁注，原ASR保留；音频覆盖包含休息，不等于有效教学时长、直接逐字听核或全方法验收。


      2026-09-19补“上”课VIDEO_14912A4EFE59前56分钟本地ASR及关键原画面局部对齐。05:54–06:37补强方法名与双向找提示，06:48–07:38及18:23–20:54补名词呼应；32:51–33:11新增首句完整定主题的口述，并明确首句也可能设空，不将静态页重复显示当重复口述。08:32–11:28及28:26–30:06解释判出方向后仍须比较具体状态，可能伴随不等于正文支持；11:29–15:19核动词、对象与结果；21:05–23:31由后句同一状态回查前句；30:43–32:35及36:11–37:33说明同词性仍须满足语义功能，附近宽泛关联不足可扩大范围核明确呼应；42:25–44:18区分动作主体与另一人物感受并保留完整否定。上述六条MEDIUM只补强既有动作，不增加方法名、固定步数或原题词对。转写差异结合语境与清晰画面旁注，原ASR保留；词义与个别结构还原疑点隔离，首篇后两空及56分钟后仍待接，未作整篇或全方法音频验收。


      “完形填空之瞻前顾后法（上）”课程画面在多个稀疏抽样时间点重复显示完整技巧说明：不孤立看任何一个空，同时观察空前线索和空后提示，并结合上下文逻辑判断。画面还明确把首句作为主题、情感基调和叙事视角的入口；“下”课例题页再次写明“首句完整定主题”。名词“复现原则”保留为局部线索，只允许优先检查原词、同义词、近义词或同源词复现，不能把课程中的比例说法当作绝对规则。


      来源VIDEO_32D321E2D519的50至80分钟指定帧补核后文名词复现、前文对象的类别承接及评价句指代。名词联系要核对同一对象与事件连续性，评价词要核所指行为和结果；不能仅凭字面重复或积极色彩定案。两条MEDIUM证据来自同篇，不是独立样本。部分空位先讲后回看，不能按题号或答案出现先后虚构教师固定执行顺序；尚无连续音频复核。


      2026-09-19追加同源48至68分钟连续ASR与指定帧局部核对。口述支持词性引导线索而非直接定案，动词核参与者、方式与速度；暂缺依据可标记后置，先做已有独立依据的其他空再返回。后文名词复现和评价对象两条旧视觉证据获局部语音补充，仍不是整条或全方法验收；评价词比较须各有正文依据，不把个人感受当作结果。旧底稿一次标答时点误记已据原图更正。新证据MEDIUM，不发布原例词对、单题介词解释或中文类比捷径；窗口末词义答疑尚未完整。


      继续补同源68至88分钟ASR及70至88分钟指定帧，接完上述词义答疑，补名词类别承接与近义评价的口头依据。新增MEDIUM例题证据说明语境先确定要表达的内容，具体词义和惯用表达仍须核实，中文译义相近或表面褒贬不能替代语境辨析；逻辑空须核两侧实际关系，不凭反义词面定案。屏幕换题后仍有前题答疑，按语义归属记录；原始转写与画面词面差异保留旁注，不发布词对、答案及记忆类比。下一篇仅开头，仍非逐字直接听核或全方法验收。


      同源88至104分钟ASR与对应帧继续核下一例。89分49秒后的远处角色定位明确支持附近不足可后找、暂留回查；91分40秒至98分39秒通过候选所需动作与正文实际叙述比较，并提出语境改变就应重核，不能把原题词义比较变成固定禁用表。102分18秒至35秒说明形容词空可看修饰同一对象的定语从句，词性提示不限于同词性孤词。两条MEDIUM例题证据解释已有方法；修饰句内部仍含待填空时，不把它与前空互证当作独立依据。原10分钟规则页的口述仍待补，不以本段冒充该页原话。


      续核104至120分钟，同篇第三条MEDIUM证据解释连续动作须回题面核顺序与因果，候选属性须对应文本维度，不能把身份擅自等同于时长或用答案释义反证题面。119分39秒后再次明确动词逻辑还须与主语一致。原例动作链、词义强说法与记忆类比不进入运行层；个别空的独立依据仍不足、后续答疑仍待接，不能据已转写到篇末宣称整例或全方法已验收。


      同源课尾122分51秒至123分14秒回答首句是否联想情节，明确不需要联想，但要大概知道主题。新增MEDIUM证据仅补充首句框架的边界，不把教师随后对原例的主题预测变成普遍剧情脚本，也不宣称其撤回此前说法。120分钟至136分10.4秒已接续本地ASR并局部对齐关键画面；课首及其他来源仍待补，全方法未验收。


      补核同源0至48分钟ASR与0至48分钟每2分钟原图。05:26后的规则口述及07:01–07:22解释确认词性用于指引正文线索，6分钟板书相同选项随后变为8/10分钟相同词性，保留编辑顺序。09:56–14:08的名词例说明候选已知词义须落实到当前对象，不要求原词复现；16:00–19:48说明非谓语结构、介词短语可提供修饰内容，19:49–21:25示范根据句中关系判断词语作用。34:51–36:47先还原代词主体，再核愿望属于谁，不把他人愿望作为当前动作依据。三条新增MEDIUM证据只补强既有操作，不发布具体词义、词对或单题最短逻辑脚本；31:34后的答疑再次允许远处找提示，主题回查也不能补造后续事件。原10分钟规则页的局部口述缺口已补，本源已连续转写至136分10.4秒，但个别空的唯一排除依据和强词义范围未闭合，上课及其他材料仍待补，不等于全方法验收。


      '
