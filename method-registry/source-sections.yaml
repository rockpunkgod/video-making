  e3f636734c5727c3:
    path: gaokao-english/references/course-evidence.md
    heading: 七选五主语一致
    line_start: 89
    line_end: 96
    content: '### 七选五主语一致


      来源VIDEO_EBD3BA66DC83补核50–80分钟本地ASR与逐分钟31张原帧：55:05–63:47的分组问答说明入口由可观察依据决定，同项可保留主体、结构及逻辑多类线索，一致也可在候选与正文之间建立。73:44–76:59区分填小标题与利用已给标题限定段内话题，并明确标题相关后仍不知道能否选、必须回文核内容。两条MEDIUM只解释既有方法，纠正运行模块把结构固定为讲述开头的过强要求；具体词义、强词表、单题答案及教师漏纳后补组过程留底稿。覆盖包含课间休息，非直接逐字听核或全方法验收。


      “七选五满分法则之主语一致”课程在1至5分钟连续显示完整技巧说明：选项的主语或核心话题要与前后文一致；课程所称“主语”不限于语法主语，也包含和核心话题相关的指代内容。随后例题先标候选主体、祈使句省略的行动者和相关指代形成候选组，再回正文核当前主体与对象，最后比较动作、内容、结构和逻辑。共同主体只能支持早期判断，不能替代回文求证。


      来源 VIDEO_08DF3F074A2D 已接完0–131:19.39七窗本地ASR并实看132个主时点原帧。03:38–05:00口述补强规则定义；06:00–11:40先还原祈使句省略的行动者，再以宾语指代、动作和对象区分同主体候选；15:40–30:30继续核整组指代、做法和段落功能。37:30–82:00多例说明共同主体只完成分组，还须核问题到行动的推进、连接关系、例证所支持内容及具体动作。88:32–125:32完整五空实战显示候选仍多时可先留空，做其他空后再回当前内容；结论、对比或例证可能发生主体转换，不能见前句代词就直选同代词项。以上只进一步解释现有方法，不增加方法名；原题、答案、固定词对、数量阈值和固定步骤不随运行包发布。课程“永远先三一致后小词”及按文体固定入口等强顺序，与同课小心求证和其他课程无固定入口并列保留，不静默统一。本地ASR加原帧局部对齐非直接听核，完整媒体覆盖也不等于全部强说法获接受。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  ef003fa21873a03e:
    path: gaokao-english/references/course-evidence.md
    heading: 七选五时态一致
    line_start: 97
    line_end: 102
    content: '### 七选五时态一致


      两份同讲次课程文件在约10分钟画面中都明确把“时态一致”定义为选项时态与上下文时间线一致，并把适用范围限定在同一事件或同一主题的描述。约20分钟后的例题总结把时态一致列为“三一致”分组标准，同时另列小词和内容一致，证明它用于分组和排除而不能单独定案。两个来源内容高度一致，按重复发布处理，不当作独立证据重复抬高置信度。


      来源 VIDEO_EA1B17009E6B 已接完0–129:34.691七窗连续本地ASR并实看130个逐分钟偏移原帧。08:55–10:54补强“时态一致”的规则定义；11:03–32:20的短例先由时态形成候选组，再回正文时间点、主体和内容验证。32:30起的完整实战同样先识别候选真谓语并按时间关系分组，再回当前空位核局部时间线、主体和内容；41:20出现提前口头选择，随后仍继续比较竞争项，46:06再次明确选择并结束该空说明。该过程不证明所有排除均已严格展开，也不支持把未经验证的早期选择直接写成最终定案。32:30–65:30第一组完整五空实战还显示同为过去时仍需区分继续动作、所见评价、人物差异和指代对象，过去经历可转入一般感悟。78:20–111:20第二组完整实战进一步明确具体过去研究只是支持一般观点的例子；只有候选确属当前研究事件时才回到过去时，不能因段中出现过去时或最近动词就统管当前空。三条证据均来自同源，不重复抬高独立样本强度；原题、答案、固定词对、题面瑕疵和“缺某连接词就错”等单例解法不发布。强制先时态、无额外时间点必须同一时态等强说法保留原语境，不静默改写为绝对规则。本地ASR加原帧局部对齐非直接听核，完整媒体覆盖也不等于全部强说法获接受。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  2da19d47c8eb83f3:
    path: gaokao-english/references/course-evidence.md
    heading: 七选五褒贬一致
    line_start: 103
    line_end: 112
    content: '### 七选五褒贬一致


      课程明确要求选项与上下文保持褒贬色彩一致；遇到转折词时，先判断转折一侧的情感，再匹配另一侧的方向。该线索不能替代结构和内容核对。


      来源 VIDEO_0699C6064B18 已接入0–148:58.939八窗连续本地ASR，共4221段，并实看155个主时点及关键时点原帧。08:47–11:50补强规则口述与转折例；12:30–18:30第一例先由顺序提示、候选完整评价和否定形成早期范围，两个候选一度都只能接通后句；提前口头选择后，教师继续用全段反复对象区分，最后才以褒贬一致和主题一致收束。迁移时须说明当前接通哪一侧、还缺哪一侧或哪一对象验证，不能把早期口头选择包装成证据已经闭合。18:48–31:38第二例区分句子意义与表面否定形式，并以障碍、对象和连续转向复核内容；这里只确认课堂作答与主线推理局部音画对齐，不声称全部候选逐项穷尽排除。31:44–49:36第三例从改善方向继续核指代、当前困难、具体措施和后文支持；教师口头定案及理由链已核，但49:30画面仍未填字。49:36–53:13单空短例再说明同方向分组后仍须比较叙述主体与核心话题。53:13–60:00后续实战先完成时态、结构、主体、方向及连接提示分组；62:49–79:59完成第一空及长答疑，明确不能仅凭重复提示直接排除，结构、主语、时态等一致性都只用于优先查看和辅助判断，不能命中即选，仍须回空位两侧核指代、内容、动作顺序并以后文验证。87:00–98:30完成后四空课堂主线，进一步说明同一结构或主题只能形成竞争候选，相邻空仍须分别比较具体动作、说明或建议等句间功能与因果回接；即使候选使用情况只剩一项，也要用人物关系、动作后果及两侧内容正向验证。100:02–125:16后续实战又说明初次分组可随新发现的时间形式更新；两个候选在方向、转向和难易方面都成立时，继续用局部小标题限定的段内方面区分；数量与否定须放回完整能力断言，指示表达须还原先行内容并核后续推进；末空还要求候选同时承接空前处境并为后文指代与结果转化提供内容。125:10明确候选可以中性，不能强迫全部二分褒贬；143:42–145:52课后回查进一步澄清一项竞争候选只谈接触途径或便利性，并不承担当前情绪与内容推进。一处竞争只确认口头取舍倾向，另一处口头定案到课程尾部仍未见屏幕填字；完整音轨覆盖不消除这两个证据状态缺口。六条证据均属同一视频来源，不重复抬高独立样本强度；题内答案、候选字母、具体题材、固定词对和单题捷径不进入运行包。


      课程“转折前后褒贬色彩完全相反”及固定先扫选项、先三一致再褒贬再小词、连接词和因果必然同向等强说法已原样保存在证据区；前者与对应词课方面转换例的适用范围问题仍待核，不冒称教师已勘误。运行层只在明确的情感转向中使用方向比较，不将其扩大到全部转折，也不据单个连接词、句式或表面词形推断情感。本地ASR加原帧局部对齐非直接听核，连续音轨覆盖不等于全部语义判断获接受。


      来源VIDEO_EBD3BA66DC83的90至93分30秒以及97分16秒至97分58秒原声ASR，与92分35秒、93分05秒及94分钟画面局部对齐：同为积极方向仍须比较如何承接具体担忧、后文建议是否展开该回应；不能只靠另一空已占用候选解释当前空。口头作答与屏幕填答分开记录，置信度MEDIUM，未作直接听核或全方法音频验收；词语的暗转折标签不推广为无条件规则。


      '
