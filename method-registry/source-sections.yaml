    content: '### 主客一致


      阅读讲义第1页和来源 VIDEO_67C5AACBDE94 的7分钟、8分20秒复核画面给出课程名称及主观意愿/客观陈述、主动发出/被动接受两类检查。原索引把证据ID中的0700、0818按秒换算成11分40秒、13分38秒，与账本时间戳不一致，现按实际画面更正；不据证据ID猜测时间。


      同来源44:00–51:18本地ASR与原帧对齐，对照愿望与客观事实状态，并按题干限定区分教师认定的直接、间接结果；50:20后教师明确纠正此前相反板书，但其完整因果前提未由本批题面独立验证。54:50–61:45另一例先用肯否缩小候选，再核能力或意愿、具体动作和主体归属；另一主体的属性不能移接给当前对象，原文未提意愿也不能推出不愿。运行层据此解释既有完整谓语、被否定关系及主体核对，例题证据置信度MEDIUM。施受关系分支的详细例题仍待补核，不把本次两例覆盖当作全方法已复核；本地ASR加选定原帧不是直接逐字听核。


      '
