      找回 `04_evidence/evidence-ledger.yaml`、`04_evidence/conflicts.yaml`、`10_skill-design/method-registry.yaml`
      及旧原帧、WAV和ASR。此前“原蒸馏目录不可用”“未重新取得”反映当时状态，不能继续当作本轮终态；旧原MP4仍未找到。历史记录、找回原帧实看、新视频提取转写与直接逐字听核分别登记，找回文件不等于全课程重新验收。本包仍以本索引、题型模块及可追溯原件名、段号/页号为运行依据。


