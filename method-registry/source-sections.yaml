  7388610c2a759513:
    path: gaokao-english/references/course-evidence.md
    heading: 代词指代
    line_start: 145
    line_end: 152
    content: '### 代词指代


      来源 VIDEO_506197D7A2F4 的0分钟技巧页要求“代词先还原”；本轮0至22分钟本地ASR与对应画面局部核对，补明通常就近但可扩大范围、状态与目标须区分、可借后文倒推而非禁止后看。状态候选还要核对象、比较属性、范围与否定，不能仅匹配名词。4至9分42秒的词义例支持有限的指示解释分支：先判词性，再还原明确解释关系，最后核候选语义，不扩成全面猜词流程。保留教师跨题型类比的上下文，不按板书标签改变阅读路由。旧名词限定更正历史保留，规则页HIGH、两类例题MEDIUM；原始转写有误识别，不宣称直接逐字听核或全方法验收。


      补核同源22至30分钟，概念例支持从指示命名句回看被概括行为，继续还原行为句内部代词，核所问对象、动作及肯否。共同对象定位与指示还原是两种入口，不强制串行；表面未重复名词不等于没有对象承接。24、26、28及28分30秒画面对齐，证据MEDIUM。转写与清晰画面词面不一致时结合语境以画面为准，原稿保留；该窗口不是直接逐字听核，下一词义例仅开头。


      同源68分50秒至71分08秒的ASR与69、70、71分钟画面局部对齐，补明多个实体候选同数时，要按句中动作区分参与者角色再回填。这里只解释既有数与内容一致要求，不将本例特定关系排除推广为通则，未讲到的候选理由不补造。证据MEDIUM，非直接逐字听核。


      '
