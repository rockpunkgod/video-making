      P1有反义/同根复现；扫描PDF P2有大词/大小原则及主被动、主语、褒贬一致总结，寒假完形第3讲P5有形副褒贬；这些名称及扩展分支仍缺各自独立运行边界。后续新视频已补验收瞻前顾后内的形副褒贬辅助操作，见下节，不将这一局部完成误记为整体仍未激活，也不新增独立“完形褒贬一致法”。配平的慎用说明、最短逻辑和就近批注不补成方法。


