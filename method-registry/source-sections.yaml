  333d30ef0c107e0c:
    path: gaokao-writing/references/course-evidence.md
    heading: 勘误与证据上限
    line_start: 39
    line_end: 44
    content: '## 勘误与证据上限


      国庆资料每段150与题面总150冲突，按当前题面总字数；错配的Toby／Rochelle页面不串题，视频按正题讲不等于电子件已改；海豚时序与物件错误不迁规则。Kevin讲义缩略缺桥梁而视频补了找表过程，不继续判视频漏链；弟弟等仅一种写法，不设固定人物身份。春11森林题未改校园／走廊不作环境适配范例。原例错误搭配、恒等词对、分数保证、固定句数／句型配额不进入新题规则。


      黑话机器同音字形没有清楚原画时仅为线索，不注册新名；有名且已证概念不因无独立算法而删名。完整生成过程或代表不足如实标界，不把定义证据冒充多题实战验收。


      '
    commit: 70db6d6f0423bc8da95c591ca1feda883c2865b1
  198aff08a2e69548:
    path: gaokao-writing/references/course-evidence.md
    heading: 本次正式更新时追加核查
    line_start: 45
    line_end: 53
    content: '## 本次正式更新时追加核查


      补证另存 `skill-update/writing/`，不改旧阶段完成账。春11新增5640–6120、7740–8340，赠44新增1560–2040，合计1560秒原音机器稿均全文核读；追加原帧5940、8040、赠44
      1800已实看。


      - 自然升华句：春11 5651–5898完整串出主题、保护对象替换、人与自然关系、生态平衡；5940原帧有成句。其强口径“写环境永远和谐”等只按环保救援语境，不扩到全部自然题。

      - 帮助升华句：5940/8040原帧标题下空白，7849–7854、7902–7904、8061–8067等明确说课后再给。原课上DOCX `E:/开明致学/【课上讲义】第11讲
      读后续写（26S春）.docx.docx` XML正文与旧D07提取独立复核，paraId 56031C86下5A54F174有完整句，以mutual
      respect and sincere understanding为主干。原件句式存在，现场未生成不是继续无限找本课音窗的理由。

      - 富兰克林作文法、刻意训练：赠44 1736–1777、1837–1886、1931–2015明确命名及回忆→核对→熟读→重填→再核错的完整循环，作为该来源训练版本纳入，不与寒4五步静默统一。

      - 三思辨模型：重读国庆第1讲840–1100原机器稿，925–983明确三名、引入／主体分析／收束职责，986后转文体模板；复看PDF05实页5仅三道题面入口与模型列表，实页25是分组建议单句练习。赠44追加窗仍为首句填词与训练讲解，1800原帧虽有网课利弊建议全文，不冒称三种模型各有完整独立现场实施。

      - 五大话题／九大句型／九大句式：检索本轮完整提取、原机器稿及旧原件索引，并直接复核寒4原DOCX相关段；该件前部写八大、末部写九大，仅数量与组织提示，没有在该处给完整成员清单。本轮未证完整九项，不以常见句型凑足。扩展能力保持栏目身份与已证成员，未齐不影响已证具体技巧的使用。

      '
