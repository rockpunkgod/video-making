    content: '## 暂停使用


      读后续写 PPT 将 PTSD 定义为 Purpose、Twist、Struggle、Denouement。另一课程视频约 1 小时处将同一缩写对应为需求、方法、困难、解决并升华。当前无课程内明确勘误，冲突保持未解决。


      PPT 使用“十句行文法”，视频约 2 小时处使用“十句五定”。两套材料高度相关，但名称关系和部分句位仍缺足够口头证据，因此保持为相关变体，不声明互为别名。


