  7ec495478da54d72:
    path: gaokao-english/references/course-evidence.md
    heading: 做题顺序的处理
    line_start: 5
    line_end: 10
    content: '## 做题顺序的处理


      课程录像里出现过强顺序（七选五课「永远先三一致后小词」「按文体固定入口」等），也有多处明确的「小心求证」；本索引按「与其他课程的无固定入口并列留档、不静默统一」处理，即不发布固定题序。


      运行层现行的四条整篇顺序——七选五按容易突破的先做，阅读 A、B 篇顺做、C、D 篇先主旨后细节后猜词，完形按原空号走两遍，语法填空先做无提示词的空——**按用户指定执行**，与本索引的「不发布固定题序」并列留档，两者不互相推翻。核对录像时以本节上面那句记录为准，不回改运行层的顺序。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  75c52cd237e7480d:
    path: gaokao-english/references/course-evidence.md
    heading: 已激活
    line_start: 11
    line_end: 28
    content: '## 已激活


      来源VIDEO_6DD0BBEF4E90已接完80分钟至128:15.7媒体末尾，三窗690/715/266段本地ASR与49张实看原帧局部对齐。完美主义完整题新增两条MEDIUM：先区分全文大标题与局部小标题的管辖范围，全篇共同题头不能代替当前空筛选；同倾向近义候选还须比较对象、事件层级和概括范围，不能靠剩余项互换。104–107分钟动态字母与教师道歉按真实纠正记录，最终画面只留底稿；课尾强顺序、强褒贬和高考保证不通则。七窗音频连续覆盖0–128:15.7，130个时点已看，但不是直接听核或全部相关方法验收。


      来源VIDEO_6DD0BBEF4E90续核40–80分钟，两窗707/750段本地ASR与40张实看原帧局部对齐。餐具题补齐同词后核对象、评价及相反关系；智能家居例连续音频补实宽泛主题与本段方面、下一段转向，以及教师对候选支持不完美的保留意见。63:38–67:33新增MEDIUM说明：重复关键词还要服从候选整句的篇章功能，解释、原因或总结所需对象尚未引出时不能提前放入。74:30–79:55新增MEDIUM说明：难分空可暂存并先做证据更明确的关联空，返回时仍核当前空内容和未选项，不靠占项定案。66:45附近教师先报错、67:13后明确撤回，按真实纠正过程留档，不归ASR错误或补造答案。原题词对、答案和强说法不进运行包。新增40帧中35帧有实际PTS，5帧复用旧图仅按请求时点；非直接听核或全方法验收。


      来源VIDEO_6DD0BBEF4E90补核0–40分钟，两窗545/675段本地ASR与41张实看原帧局部对齐。27:19–28:08和39:29–39:44新增MEDIUM说明：it若为句内形式占位，应读取后面真正内容，不强找前文先行词。28:11–30:07、30:25–30:30及34:39–34:45新增MEDIUM说明：初筛暂放下不同于最终排除，优先组内容全不成立时回查先前候选及初筛依据；不恢复已被题面明确否定的候选。08:33同时查找与38:36标题内容先行补强入口可变，未增方法名或固定步数。前两例讲解答疑已接，第三例跨40分钟未完，未预报答案。原ASR保留，结合语境按清晰稳定同题画面旁注；强说法、明确口头限定及真实疑点分开留档，不发布原题词对。41帧按请求时点记录，复用清单不能证明实际PTS，不冒称精确PTS审计通过。非直接听核或全方法音频验收。


      来源VIDEO_8A6B414B9571续核90分钟至129:46.85视频尾，末窗实际音频止于129:46.835。本地ASR两窗702/691段与40张指定原帧局部对齐。111:35–117:17补一条MEDIUM：宽泛话题不能区分时继续核具体对象、性质限定和上下文关系；一空暂不决可先核关联空再返回，但仍需自身内容支持。118:15–120:15及125:07–125:26补一条MEDIUM：后者须还原实际成对对象及顺序，再回填后句核内容，不数名词或套固定词对。90分钟后上题收尾、补充题及课尾回顾已接齐，但词义混读、强说法与执行顺序差异仍留底稿，未视为全题语义无疑问。只解释既有方法，不发布原题词句答案；原ASR保留，结合语境按清晰稳定同题画面旁注。课尾明确区分阅读干扰项方法与七选五，不跨题型移植。不是直接逐字听核，全方法音频验收仍未完成。


      来源VIDEO_8A6B414B9571续核54–90分钟本地ASR与36张指定原帧。60:25–62:10及64:09–64:30补一条MEDIUM支持“排除项分析”：全篇完成后核未选项的内容承接与断言范围，无法说明排除依据则回查已填位置，不靠绝对词标签或补造理由。73:05–78:28补旧小标题证据，先辨并列表达是在同义重述还是列不同结果，再核整段覆盖，不数连接词定案。只解释已有方法，不新增独立方法；原题词句、答案、词义与执行顺序疑点留蒸馏底稿。转写结合语境按清晰稳定同题画面旁注，原稿保留；非直接听核，90分钟后举例解释及全方法验收仍待续。


      来源VIDEO_8A6B414B9571补核18–54分钟本地ASR与37张指定原帧。26:44–30:05补强结构规则的口头总结，33:06–35:06说明形式筛到一项仍须核内容。36:01–39:05把“半句话原则”放入结构一致，并以句中仍大写的I限定大小写线索；45:35–54:00展示时间提示回文核验、中性分组，以及唯一同倾向候选仍因内容不符而排除。新增两条MEDIUM只解释既有方法，不增加独立方法或把同篇多记录算独立样本。原题词句、字母及未解决的强说法留底稿，不发布不用看内容、转折必为正反或见时间词即定案的规则。原ASR保留，异文结合语境依清晰同题画面旁注；非直接听核，首篇实战尚有两空待接，全方法验收未完成。


      来源VIDEO_EBD3BA66DC83补齐0–8、16–17、22–29分钟后，本课原声提取与ASR连续覆盖0–129:27；仅表示提取完整，不是全课语义验收。24:37–27:56与25–28分钟原帧支持一条MEDIUM解释：同句多个逻辑提示共存时，回前后完整内容及评价方向判断，补充提示不保证沿原评价递进。只补逻辑关系法的条件说明，不建立标志优先级或沿用原题词对。早段词表口述有频率限定，保留各段精确语境，不当作必然规则。


      来源VIDEO_EBD3BA66DC83补核103分钟至129分27秒本地ASR，并与28张指定原帧局部对齐。113:40–116:40及122:41–123:07说明结构一致可在候选之间或候选与正文之间比较，段内可逐部分比较成对句式。116:41–121:39及121:44–122:18由正文时间线索回看候选，区分实际谓语时间与修饰性非谓语形式。新增两条MEDIUM只解释既有结构、时态方法，形式线索均须继续核内容；不发布原题词对、答案或仅凭过去时定案的强说法。原转写保留，题面异文按同题清晰画面结合语境旁注；课尾范围外问答不混入七选五，非直接逐字听核或全方法验收。


      '
