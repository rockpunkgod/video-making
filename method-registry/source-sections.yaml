    content: '### 语法与应用文的局部证据


      语法填空目前只保留非谓语动作先后、主谓一致和介词语义分类的课程规则，不宣称完整语法填空流程。应用文只保留演讲的引题—内容点—呼吁，以及通知的对象、事项、目的、时间地点和简洁结尾等局部结构，不扩展为所有应用文的统一模板。


      '
