  0fa2f5f4cd836d09:
    path: gaokao-grammar-fill/references/course-evidence.md
    heading: 26S春 系列（同批新入）
    line_start: 83
    line_end: 105
    content: '## 26S春 系列（同批新入）


      该批为主客一致、动静一致补齐了定义与词表，并为七选五新增两讲命名，另有非谓语与写作专项。


      - 第1讲 阅读（26S春），`0e571c2deb50`：正文标题是**主客一致**（文件名未标主题）。主观意愿对客观陈述、主动对被动两类陷阱，含词表。另注“没有技术就跳过”。

      - 第6讲 阅读（26S春），`c87bc445613c`：文件名写“主客观一致”，**正文标题与内容都是主语一致**，无一处讲主观意愿与客观陈述。含曲解代词指代对象、替换主体名词两条偷换机制；另有
      CD 篇两步思路与例题固定模板。文件名与内容不符，按正文归类。

      - 第9讲 阅读（26S春），`a2c967f62bb1`：正文标题是**动静一致**，含词表，并明确“动静一致判的是动词本身”。另含 The A of
      B 结构、“看到 mention 就是考主旨”、整卷四篇 28 分钟口径。

      - 第3讲 阅读时态一致（补充，26S春），`4a56a130f0d6`（原文件为旧 .doc，已转存 `_extracted` 下 .doc.txt）：**该件没有“时态一致”的方法说明**，全篇是一篇
      AI benchmark 阅读原文加 4 道题与选项旁注。若确需“时态一致”的方法内容，须回到原始课件或录课稿，本批取不到。

      - 第2讲 七选五（26S春），`6e8b56e5b115`：**总起句做题法**。总起句的概括性与引领性两特征、位置界定（段首或第一段段尾）、标志词清单。

      - 第4讲 七选五 逻辑判断（26S春），`e1e8110549a7`：**逻辑判断内容关联**。先逻辑缩范围、再内容锁定；干扰项两类问题；选项概括层级须与空格层级匹配；代词连词预判；Instead
      与 Instead of 的分工。

      - 第7讲 完形（26S春），`b1d3ceadab24`：题材与文体规律、考查方式三分类、熟词生义三步法、选项设计公平性、完形总流程、“大而空”的升华段、就近逻辑、固定搭配先立后破。

      - 第10讲 语法填空（26S春），`00247efaa8d9`：**非谓语动词专项**。填 doing 三原则、完成形式不能作定语、省 to 不定式作宾补的动词、非谓语完整形式清单、非谓语没有绝对时态、状语位三分口径、逻辑主语按成分定、独立主格、只接不定式与只接动名词的动词清单、含义随
      to do 与 doing 改变的动词。该件标题“非谓语动词做副词/形容词/名词”按正文举例应为状语/定语/主语宾语，属笔误。

      - 第11讲 读后续写（26S春），`cc6d7863e51f`：**人与自然专项**。三分型与四步框架、情绪词汇分级、三类万能句式的位置约束（只用于五句非功能句，环境句不能放结尾）、升华句三模板（强调句）、万能句式三步套用法、四条总纲、规定动作式伏笔清单、鸟的动作描写词表。

      - 第5讲 应用文（补充，26S春），`d8f92ef1b4aa`：演讲稿与发言稿类。三段话格式、套路结尾模板、要点—句型—词汇三联草稿表、基础范文到升级范文的三段式、具体升级手法。

      - 第12讲 考前押题密卷（一）（26S春），`9839a2453faf`：三份密卷中方法密度最高，含阅读 A 至 D 篇与七选五的解题技巧（极速定位逻辑、图表题逻辑、主旨定位法、mention
      题模板等）与四句“一句绝杀口诀”。**不含应用文或读后续写方法**。

      - 第13讲 考前押题密卷（二）（26S春），`f166c81d82c7`：无独立方法板块，只有逐题解析与旁注。

      - 第14讲 考前押题密卷（三）（26S春），`c542998dcc8a`：无独立方法板块，只有逐题解析与全文翻译。

      - 第6讲 完形课后作业（26S秋），`0bec78a70969`：全篇是 15 道完形题的逐题解析，**零新增，无方法段落**。

      - 第8讲 听力（26S春），`e5d8817729b3`：不在本技能范围。


      **结论**：三份考前押题密卷均不含应用文或读后续写方法；写作模块的本批来源只有第11讲（续写·人与自然）与第5讲补充（应用文·演讲稿类）两份。


      以上是关键方法及边界核对，不代表 78 份旧讲义或 61 份 26S 讲义每字或所有答案已无误审校。课件其他例题仍按原题取证。

      '
