    content: '## 2026-10-18阅读大词原则与大小原则的受限激活


      本次复用先前课程核查，不计新增音画或独立例题。原`E:/开明致学/【课上讲义】第7讲 阅读(26S暑假).pdf.pdf`第1–2页有独立说明；暑7源`READING_ALL_FB28C9E6DE7F`原音机器稿300.1–440.7秒解释语义包含及其与并列删除的联系。暑7
      noise例1050–1350秒支持包含比较，但课堂未完整展开impact，不把只见meaning即选迁为规则。寒9直播源`READING_ALL_9AA94AA41289`原音2830–2891秒另明确大小只比较候选差异，正文只支持小内容时选小；寒8源`85702242B3A3`180–780秒窗中，338秒提出求证、370–406秒核多个分面，支持较宽概括须回文验证。名称分别见本仓库`course-audits/2026-10-13/reading-terms.md`，定义与代表边界详本地`E:/新建文件夹/video-distillation-remaining-20261013/reading/SUMMER_METHOD_REVIEW.md`及`G:/gaokao-english-remaining-20261013/reading/COMPOSITE_METHOD_REVIEW.md`。


      本次只将真实包含竞争中的范围比较写入阅读运行模块：先关注确能涵盖具体候选的较宽概括，再按所问范围核正文；正文只支持具体方面则选对应小项。主旨、细节均可按实际竞争触发，不新增文体专属入口。大词原则、大小原则分别保留名称，与并列删除及完形同名方法分开；包含即选、无证猜大及99%必选等强口径继续不运行。赠04原例的猜选身份及旧有局部证据缺口继续保留，不用该猜选例代替本次定义和回文依据。


      '
