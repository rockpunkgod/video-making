      |读后续写写作步骤、3W1H、关键词串联法|模块国庆独立入口；CAMP_METHOD_DISTILLATION PDF02实页6–7、CAMP_REMAINING_VIDEO_REVIEW第3讲2400–3420、3540–3840。口称五步而画面四块，不造第五步；How为情感态度，不擅补When/Why。|

      |找六大要素、按时空理情节、定情感基调、理人物关系、析矛盾冲突|模块国庆五项分别保名；PDF03实页2，第4讲60–251；六要素不强求全齐。|

      |读后续写“七句成段”、读后续写“跳定思提润”五步解析与创作|模块新增不同提纲方案；PDF03实页2–3及第4讲253–740，550原帧有四句话版本；能合并，非十四句硬要求。|

      |PTSD、四点串剧情、十句五定、十句行文法／十句行全文|原模块分来源保留；batch3/writing/WRITING_BOUNDARY_REVIEW寒8
      6760/7035原帧为P目的/T方式/S苦难/D结局，寒14 6000原帧为P需求/T波折/S解决方案/D结局；编号按表与给定首句分别解释，不统一槽位和句数。|

      |反向劫匪插葱、两简一复从、句子升华三部曲|模块更新已核操作；寒14 1104–1159区别单句扩写和两句合并，3834–3990及4200原帧为简化中文→简单英译→升级；不能合并成一法。|

      |三重匹配、双重升华、黄金法则、四步完成“精准续写”|原模块保留各职责，补讲义与口述颗粒度差异；寒14 660–680、1167后及D06原件。根/力/魂/光是总结口诀，不是第五套强制流程。|

      |肌肉句、骨架句、不定的句子、秀肌肉|模块句位概念及黑话；寒14 3550–3565、6600原帧与D06。功能位保逻辑，可展开位用相容素材，不新增句数。|

      |动作链、动作面、Skill 1、Skill 2、方法二用法总结|模块动作段；batch4/writing/ACTION_TERMS_SCOPE中D04稳定paraId
      6645F9E0、0D0297D7、5E114AE5、4247B8D5及两组微例。动作面是思路概念，无独立公式不视为缺算法；Skill 2三动作局部训练定义与两微例已证。|

      |心情万能句式、动作万能句式、环境万能句式、成长升华句、帮助升华句、自然升华句|模块六名各自收紧入口；batch5/writing/SPRING12_NATURE_VIDEO_REVIEW，1842–1872、2145–2258、3480–3900、5160–5640及2258原帧。前三在非功能句位，后三结尾；环境可选且换时地天气，未改校园错配不迁规则。|

      |三条基本规律、四个步骤、五步成文法、读后续写五字原则、五档次升级版本、十大仿写句式、金句80个／升华10句／10句式+100高分词等|原模块已分训练、素材、栏目或流程版本保留，未因本轮新增重复造法；对应旧讲义证据及本轮writing与batch3–5分报告复用。|


      '
