      9.15讲义P25–26的首位呼应法原写法与用户首尾呼应法便称分别说明；暑9扫描PDF第4页／寒6 P127支持词义两项职责，秋15 P3–8支持负负得正的有限解释，其余诊断、观察框架、训练和材料名称按术语报告身份保留，不登记为独立算法。七选五10.27
      P21–22独立代词名称及已有对应词／主体子动作、其他现场用语按既验职责补入口，保留一般／一定口径差异，不新增第八法。完形复现与其他分支沿用本文件既有原件／音画索引，不把术语表中较新单例回链声明替代已验的受限状态。具体改动与未激活项目见本仓库`course-audits/2026-10-18/omission-review.md`。


      '
