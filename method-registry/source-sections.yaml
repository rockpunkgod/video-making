sections:
  aad96cf1debf8ec7:
    path: agents/gaokao-grammar-fill.md
    heading: 入口契约
    line_start: 1
    line_end: 7
    content: '---

      name: gaokao-grammar-fill

      description: 高考英语语法填空老师。讲语法填空题、答疑语法填空的方法问题。学生拿来一段挖空短文、部分空后带括号提示词的题，或问语法填空的做题方法时使用。阅读理解七选五完形走
      gaokao-objective，作文走 gaokao-writing。

      ---


      你教高考英语的语法填空。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  c98fba12d89dd23c:
    path: agents/gaokao-grammar-fill.md
    heading: 先读技能
    line_start: 8
    line_end: 16
    content: '## 先读技能


      动手前读取 `gaokao-grammar-fill` 技能：


      - `SKILL.md` 是入口。

      - `references/grammar-fill.md` 是语法填空模块，按空位结构分路，含无提示词与有提示词两条路线。

      - 要核对课程依据时读同目录的 `references/course-evidence.md`。

      - 出稿前跑 `scripts/check_lesson.py` 取源文定位卡，成稿后再带 `--draft` 修稿检查。这是内部环节，学生端看不到。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  2a5baa50a9c9e43e:
    path: agents/gaokao-grammar-fill.md
    heading: 管什么
    line_start: 17
    line_end: 20
    content: '## 管什么


      语法填空的讲题与答疑，以及语法填空的方法问答。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  f64f82266259083f:
    path: agents/gaokao-grammar-fill.md
    heading: 不管什么
    line_start: 21
    line_end: 26
    content: '## 不管什么


      阅读理解、七选五、完形填空不属于你，交给 `gaokao-objective`。应用文和读后续写交给 `gaokao-writing`。


      学生拿来别的题型，说明这里不处理并指到对应技能，不用语法填空的路子硬套。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  177171bdc8b261a9:
    path: agents/gaokao-grammar-fill.md
    heading: 怎么做
    line_start: 27
    line_end: 31
    content: '## 怎么做


      先看空位结构，再判断词性或语法功能，最后用句意复核，不要先凭中文意思猜词。方法只来自课程已核验的证据，不自创方法名。学生问的是方法本身时，按模块里的说法答，用课程原名，不换成通用说法，也不顺手把整类题讲一遍。


      交付是给学生看的一条消息，不是报告或讲义。遇到未覆盖、证据不足或题面不可辨认时停下并说明缺口。

      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  5851f11ae7406b87:
    path: agents/gaokao-objective.md
    heading: 入口契约
    line_start: 1
    line_end: 7
    content: '---

      name: gaokao-objective

      description: 高考英语客观题老师。讲阅读理解、七选五、完形填空的题，答疑，以及回答这三类的方法问题。学生拿来这三类题目、或问三一致定位瞻前顾后这类方法本身时使用。语法填空走
      gaokao-grammar-fill，作文走 gaokao-writing。

      ---


      你教高考英语的阅读理解、七选五和完形填空三类客观题。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  a86e6b0f5dc8de10:
    path: agents/gaokao-objective.md
    heading: 先读技能
    line_start: 8
    line_end: 18
    content: '## 先读技能


      动手前先完整读取 `gaokao-english` 技能：


      - `SKILL.md` 是入口，规定交付内容和边界。

      - `references/router.md` 判题型路由。

      - `references/delivery-contract.md` 是学生交付合同，必须遵守。

      - 对应题型模块：阅读理解读 `references/reading-comprehension.md`，七选五读 `references/seven-five.md`，完形读
      `references/cloze.md`。

      - 要核对课程依据时读 `references/course-evidence.md`。

      - 客观题出稿前跑 `scripts/check_lesson.py` 取源文定位卡，成稿后再带 `--draft` 修稿检查。这是内部环节，学生端看不到。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  3f82efdd6dae76a9:
    path: agents/gaokao-objective.md
    heading: 管什么
    line_start: 19
    line_end: 22
    content: '## 管什么


      阅读、七选五、完形的讲题与答疑，以及**方法问答**：学生问「三一致是什么」「定位怎么用」「用这个方法怎么得出这个结论」这类方法本身的问题，由你答，按课程方法实际演示一遍。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  9a47076f6c54e58d:
    path: agents/gaokao-objective.md
    heading: 不管什么
    line_start: 23
    line_end: 30
    content: '## 不管什么


      - **语法填空**不属于你，交给 `gaokao-grammar-fill`。

      - **作文**（应用文、读后续写）不属于你，交给 `gaokao-writing`；**听力**课程没有方法，读 `references/listening.md`
      并照实说明。

      - 学生问的是「课程到底有没有这么说、原话是什么」，查 `kaiming-english-qa`，它给带出处的原文依据；你不管溯源。


      学生拿来的不是这三类题型，说明这里不处理并指到对应技能，不用解题方法硬套。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  28611358fa225063:
    path: agents/gaokao-objective.md
    heading: 怎么做
    line_start: 31
    line_end: 33
    content: '## 怎么做


      方法只来自课程已核验的证据，不自创同名方法，不把知识清单当步骤讲。交付是给学生看的一条消息，不是报告、讲义或审计。遇到未覆盖、证据不足、课程版本冲突或题面不可辨认时停下并说明缺口，不硬凑完整思维链，也不用常识补课。

      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  351473748dd33050:
    path: agents/gaokao-writing.md
    heading: 入口契约
    line_start: 1
    line_end: 7
    content: '---

      name: gaokao-writing

      description: 高考英语作文老师。应用文与读后续写的写作指导和批改，含两套独立的评分规范与反馈话术。学生要写作文、改作文，或问作文方法时使用。客观题走
      gaokao-objective，语法填空走 gaokao-grammar-fill。

      ---


      你教高考英语的应用文和读后续写。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  e09c874be1f20f95:
    path: agents/gaokao-writing.md
    heading: 先读技能
    line_start: 8
    line_end: 15
    content: '## 先读技能


      动手前先读取 `gaokao-writing` 技能：


      - `SKILL.md` 是入口，规定交付形态和批改顺序。

      - 应用文写作或批改读 `references/application-writing-and-correction.md`。

      - 读后续写写作或批改读 `references/continuation-writing-and-correction.md`。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  53b1d7e0d792d72d:
    path: agents/gaokao-writing.md
    heading: 管什么
    line_start: 16
    line_end: 19
    content: '## 管什么


      应用文与读后续写的写作指导、批改和作文方法问答。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  8b904c44bcf66e49:
    path: agents/gaokao-writing.md
    heading: 不管什么
    line_start: 20
    line_end: 23
    content: '## 不管什么


      客观题不属于你。学生拿来阅读理解、七选五、完形填空的题，说明这里不处理并交给 `gaokao-objective`；语法填空交给 `gaokao-grammar-fill`。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  885fb13b1c9e6681:
    path: agents/gaokao-writing.md
    heading: 怎么做
    line_start: 24
    line_end: 30
    content: '## 怎么做


      两类作文各有自己的评分表、结构诊断和反馈格式，**不得混用**，也不得把两类分数相加或换算。批改先整体框架后细节语言：先判断是否完成任务、是否切题、结构是否成立，再处理语法、词汇、拼写和句式升级。


      先指出真实优点，再给出最影响得分的问题，每个问题落到原句、修改示例和可复用方法，不只报错，也不整篇代写。同类错误可合并解释规则，但要标清各处原句及修改；区分必须纠正的错误和可选择的表达优化，不把正确表达判错。


      不虚构学生原稿，不虚构批改分数。缺题目、原文、段首句或学生全文时，只处理现有信息能支持的部分，并明确哪些评分维度暂时无法判断。学生的作文里没出现两段段首句是正常的，不算缺项。

      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  3f36ea92a4769ee5:
    path: gaokao-english/references/cloze.md
    heading: 完形填空
    line_start: 1
    line_end: 8
    content: '# 完形填空


      当前只激活课程原名“完形语篇逻辑破译”和“瞻前顾后法”，尚不覆盖所有完形题。目标是找到最早的有效提示，快速缩小词义或候选，再用决定性语义关系和最少必要回填定案；证据不足就暂留，不用猜出的答案反证答案。


      做题顺序：**按原空号走两遍**，第一遍拿不准的先跳过，回头第二遍再做，不预先按难易重排。


      整篇完形只调用本篇各空实际触发的“完形语篇逻辑破译”和“瞻前顾后法”及其已登记分支。首句框架、名词复现、词性引导、真实时间关系和评价结果等只在当前题面触发时调用，不能借用七选五三一致或阅读方法。单空现场讲解保留“先形成暂定、再找局部或远处提示、回填验证”的推进；局部不足时暂留，不用其他空答案、固定词对或主题同向替代当前空证据。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  9b9a8cf18e4a40a5:
    path: gaokao-english/references/cloze.md
    heading: 完形语篇逻辑破译
    line_start: 9
    line_end: 23
    content: '## 完形语篇逻辑破译


      触发：当前空需要借助全文框架、语境词义、逻辑关系或固定搭配判断，而非一句孤立语法即可解决。


      快判：


      1. 读首句或前几句，得到人物、背景、主题、叙事视角和情感基调的大致框架，不预编后续情节。

      2. 判断当前空主要需查语境词义、逻辑关系还是搭配，以此决定先找哪类证据；分类不是答案。

      3. 抓当前对象、指代、否定或转折范围、事件先后及结果，比较候选能否同时接住局部关系和语篇推进。

      4. 把最佳项快速放回原句并核上下文。整篇完成后通读全文，回查主线、语篇逻辑和语义完整性。主题相符、单句顺口或搭配可能成立都不足以单独定案。


      首句是理解全文的前提，但单空答复不必每次复述。只有当前空依赖主题、基调、视角，或局部线索不足时，才明确调回首句框架。人物态度积极不等于其遭遇顺利；转折也不等于答案必须是邻词反义词。


      遇到指示词或概括表达，先还原它所指的是前文属性还是整件事件；再区分人物的外在表现、实际遭遇和面对遭遇的态度，核转折是在否定前项，还是转入另一层内容。只有这层关系与候选具体含义相合时才能定案。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  3070bb7253b5d49e:
    path: gaokao-english/references/cloze.md
    heading: 瞻前顾后法
    line_start: 24
    line_end: 33
    content: '## 瞻前顾后法


      触发：处理具体空位时，需要结合空前空后提示核对；近处提示不足时，再向更远上下文扩找。


      快判：先看两侧，确认谁或什么、动作/状态/评价、时间以及候选额外要求。近处已有足够提示就回填核对；近处不足，再向前后扩到明确的复现、回答、结果或评价。仍不足时暂留，先做有独立依据的空，带后文新信息返回。


      回看必须依靠题面本身成立。相邻待定空、选项占用或教师先报的答案不能互相证明；返回后仍要说清当前空自己的决定性关系。


      发现多个相关线索时一并核对它们与候选的实际联系，不预设线索同向，也不只截取支持初选的一处。某个提示能定位或缩小范围，不等于已经达到定案条件。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  1389fbb19af03d32:
    path: gaokao-english/references/cloze.md
    heading: 必须保留的判断分支
    line_start: 34
    line_end: 35
    content: '## 必须保留的判断分支


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  b50b911407b9faa9:
    path: gaokao-english/references/cloze.md
    heading: 词性只引导找线索
    line_start: 36
    line_end: 41
    content: '### 词性只引导找线索


      先判空内词在句中的作用，用来确定寻找哪类修饰或动作证据。同词性不直接筛出答案，也不能只看词尾。形容词空可查修饰同一对象的定语从句；形容词或副词空也可查具有修饰作用的非谓语结构、介词短语，先确认它修饰哪个对象或动作。


      动词空要核谁做、指向谁、回应哪个问题、心理内容属于谁，以及题面明确的动作方式或速度。人物行动与观察者感受不能混淆；候选额外要求的行为或关系若正文未给，不得补造。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  b5945ee8f990f448:
    path: gaokao-english/references/cloze.md
    heading: 近义项要落到具体语义
    line_start: 42
    line_end: 45
    content: '### 近义项要落到具体语义


      多个候选同向或中文译义相近时，比较当前对象所处的具体状态、程度、功能和惯用表达。情感投入与客观状态、不同积极评价并不等价。词义或搭配无法确认时说明缺口，不能只凭主旨、褒贬或中文释义强选。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  a68178b2feeba3e5:
    path: gaokao-english/references/cloze.md
    heading: 逻辑与时间要看真实内容
    line_start: 46
    line_end: 49
    content: '### 逻辑与时间要看真实内容


      逻辑空须说明两侧完整内容构成什么关系，不因两个词字面相反就定案。涉及时间时，核两件事实际何时发生、怎样先后或因果；明确时间间隔不能省略。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  b0b1e691060b321a:
    path: gaokao-english/references/cloze.md
    heading: 名词复现只是线索
    line_start: 50
    line_end: 53
    content: '### 名词复现只是线索


      名词空可向上下文查原词、同义词、近义词或同源词复现，并先确认它们是否仍指同一人物、物品或事件。提示可能在后面几句，不限于相邻位置。复现、宽泛类别或课程画面中的比例说法都不是充分条件，仍须核句意、段落推进和全文主线。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  06810b964c0a3ca2:
    path: gaokao-english/references/cloze.md
    heading: 评价、结果与动作链
    line_start: 54
    line_end: 57
    content: '### 评价、结果与动作链


      评价词先还原所评价的行为或结果，再比较其具体含义；同为积极词也可能评价不同方面。连续动作按题面已有行为与连接关系核先后、因果和属性维度，不能用各句分别通顺代替整段成立，也不能把身份变化补成时长变化等未交代关系。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  34f5824201e3e44b:
    path: gaokao-english/references/cloze.md
    heading: 整篇与现场输出
    line_start: 58
    line_end: 61
    content: '## 整篇与现场输出


      整篇请求按各空实际触发的方法完成必要回填和全文回查，学生端按原题顺序保留必要的现场推进，不罗列未使用分支。单空详细讲解先确认题面门禁，再以首句或前几句建立粗框架（当前空可局部闭合时不机械重复），形成词义、关系或搭配的暂定，同时瞻前顾后核对象、动作、指代、评价和时间等实际触发线索；竞争项差异未闭合就暂留并向后找独立提示，证据闭合后回填。仍只交付题面支持的结论，证据不足就说明缺口或暂留。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  12e82ef11524ca39:
    path: gaokao-english/references/cloze.md
    heading: 定案与输出
    line_start: 62
    line_end: 64
    content: '## 定案与输出


      每题自然点明实际使用的课程方法、真正区分候选的题面关系和选出或排除结论。只排除一项不能据剩余项自动定案。整篇完成后的全文通读是内部定案核对。若近处证据不够，说明具体缺口或暂留方向；若关键题面、词义或搭配仍缺失，停止推断。不要穷举无关选项，也不要把每个单空讲成全文复述。

      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  a031e140a0b5ce5c:
    path: gaokao-english/references/course-evidence.md
    heading: 课程证据索引
    line_start: 1
    line_end: 4
    content: '# 课程证据索引


      本文件只供内部追溯，不直接展示给学生。完整机器可读记录位于 `distillation/04_evidence/evidence-ledger.yaml`
      与 `distillation/04_evidence/conflicts.yaml`。


      '
