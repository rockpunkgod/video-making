  c827be84f7798683:
    path: gaokao-writing/references/application-writing-and-correction.md
    heading: 复习路径与分数锚定
    line_start: 162
    line_end: 169
    content: '### 复习路径与分数锚定


      **读-背-仿三步走**：读英文，熟读至背诵；背中文，背大致含义；仿写，走富兰克林写作法。


      **分数锚定策略**：基础模板用得稳、无亮点也无硬伤，大致落在中等分段（10 分）；在基础模板上用三种句子生成法生成高分表达，冲刺 15 分。


      **作文练习的顺序四阶段**：①写作模板（中文思路的记忆和简单英文的翻译）②八十个金句（基本句子和词汇素材的积累）③挑战高分（九大句型和高级词语）④冲击满分（两简一复从和句式重构）。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  e39a3629fdfb5284:
    path: gaokao-writing/references/application-writing-and-correction.md
    heading: 五审法的审核维度表
    line_start: 170
    line_end: 175
    content: '### 五审法的审核维度表


      审文体：明确体裁（书信、倡议、演讲、图表），确认匹配的模板框架。审对象：确定交际对象（朋友、老师、教授、公众），据此调整语气与称呼。审要点：逐一核对题目要求的内容，如建议信三条建议、邀请信的时间地点活动。审逻辑：检查是否符合模板框架（“现象—分析—建议”“问候—核心内容—祝福”），过渡词是否自然。审语言：核查时态一致、无重大语法错误，替换基础词汇提升质感。


      操作细节：圈出题目中的限定词，如“因病休假”要强调健康、“来自爱尔兰”可提及距离或时差。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  8cc4571377b8183a:
    path: gaokao-writing/references/application-writing-and-correction.md
    heading: 三种句子生成法的细化
    line_start: 176
    line_end: 183
    content: '### 三种句子生成法的细化


      基础句式锚定法：锚定核心主体，锁定动作或状态（含系表结构），嵌入场景细节（时间、地点）。讲义标注为“小学语文造句”。


      复杂句式模块法：动作拆分，一个动作一个模块；模块生成，用基础句式锚定法逐块生成；逻辑粘连，用从句、非谓语、连接词。流程是“两个简单句横纵向扩写”加“复从粘贴（从句、非谓语、介词短语）”加“反向劫匪插葱”。


      长句翻译重构法：语义解构（拆语义单元，识别核心信息与修饰信息）；语序重组（中文语序转为英文的“主体—动作—场景”）；细节校准（时态、词性、单复数）；风格统一（连接词、非谓语优化流畅度）。篇幅策略：110
      词左右用两简一复从，120 词以上用句式重构。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  27cf55e8f2cf7c93:
    path: gaokao-writing/references/application-writing-and-correction.md
    heading: 富兰克林写作法（五步）
    line_start: 184
    line_end: 187
    content: '### 富兰克林写作法（五步）


      ①把中文简化，去掉所有修饰成分 ②翻译成英文 ③对照范文 ④背诵缺失的素材 ⑤让 AI 帮忙升级单词和句型。实践形式是中英填空。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  4dde2ad49f107ae2:
    path: gaokao-writing/references/application-writing-and-correction.md
    heading: 反向劫匪插葱
    line_start: 188
    line_end: 191
    content: '### 反向劫匪插葱


      通用句式升级工具，三段式：简化，写出小学语文水平的简体中文；简单句翻译，直译；优化升级，依次处理升级句式、介词短语、非谓语、从句、高级替换词语。示例链条：“我请她喝了一杯咖啡”到“I
      treated her to a coffee.”再到“Desiring to convey my appreciation, I treated her
      to coffee in a serene corner, which turned the horrible moment into a cozy and
      memorable one.”


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  2e057c9f98c9de93:
    path: gaokao-writing/references/application-writing-and-correction.md
    heading: 三类高频书信的模板结构
    line_start: 192
    line_end: 197
    content: '### 三类高频书信的模板结构


      邀请信属求人型，建议信属帮人型，感谢信属传情型。每类都按“常用表达（发出邀请、活动安排及意义、望应邀盼回复等功能块）→ 黄金模板（基本模板加升级模板）→
      仿写实操（题材、人称时态语气、要点分段）”。


      建议信升级模板把三条建议分别用祈使句、定语从句、条件状语从句，一条建议一种句型。感谢信升级模板结构：感谢内容 → 背景 → 具体回忆 → 再次致谢 →
      祝愿。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  25ab2251aaba4712:
    path: gaokao-writing/references/application-writing-and-correction.md
    heading: 写人类（人物介绍）文体方法
    line_start: 198
    line_end: 213
    content: '### 写人类（人物介绍）文体方法


      核心要素四件套：基本身份（姓名、职业、国籍）→ 突出成就（主要贡献、典型事迹、荣誉）→ 个人品质（性格、精神品质）→ 社会影响（对他人或社会的积极意义）。


      结构：开头段概括引入（人物重要性加核心特质）；主体段按**时间轴**（早期经历、关键事件、当前成就）或按**品质加事例**（Trait 1 加 Example
      1，Trait 2 加 Example 2）分层展开；结尾段总结评价（精神传承或学习意义）。


      人称时态：第三人称客观视角；现有人物用一般现在时写成就、一般过去时写早年经历；历史人物用一般过去时。


      句式多样化三件套：定语从句、分词结构、强调句。


      典型错误：信息堆砌、主次颠倒（过度描写外貌忽略品质）、时态混乱（He is born in 1950）。要避免主观评价，把 I think he is
      the greatest 改成 He is widely recognized as...。中文姓名拼写要正确（Zhang Guimei，不是 Zhang
      Gui Mei）。


      备考：建立“人物档案库”，按科学家、运动员、文化名人分类整理中英双语素材；背诵万能评价句；做同一人物 50 词与 100 词的对比练习。临场快速列提纲，确定三个核心品质及对应事例；避免复杂生词，用准确代替华丽；结尾用名言或比喻升华。


      **人物介绍评分口诀（内部记忆，口播不念）**：身份成就需分明，事例品质紧相承，数据细节增可信，精神升华得高分。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  106f75b81b28e301:
    path: gaokao-writing/references/application-writing-and-correction.md
    heading: 投稿类的身份与时态定调
    line_start: 214
    line_end: 217
    content: '### 投稿类的身份与时态定调


      前三步骤：①审题判定文体为投稿 ②因文体是投稿，作者身份在正文中不必交代 ③因主体部分是介绍人物生平事迹，全文总体时态定为一般过去时，首尾两段用一般现在时。三段论：第一段列举并引出人物；第二段人物简介及事迹；第三段启示。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  1f36be2f364e0637:
    path: gaokao-writing/references/application-writing-and-correction.md
    heading: 活动类的三段式与散点技巧
    line_start: 218
    line_end: 231
    content: '### 活动类的三段式与散点技巧


      三段式：首段目的 → 中段活动具体内容 → 尾段邀请信（期待回复）或其他（活动意义）。


      检查顺序：审题和时态 → 三段式 → 逻辑词 → 段落内 → 三段话 → 词汇和句型升级 → 书面和检查语法。


      **逻辑补充句**：首段末尾加一句承上启下句，四种变体——Here are some details about this exciting event.
      / Here are the details of this meaningful event. / Here are some highlights
      of this event. / Here are some fascinating aspects of this event.


      出现多个时间务必使用 `What we anticipate most is...`。`not only...but also` 尽量使用，但只用一次。


      **语料标注约定**：蓝色为扩充语料库，熟读积累、不需要背；绿色为重点词汇或短语，必须背、必须使用。


      **好作文的检查点**：审题（是否偏题、信息点是否缺失）、格式、考点信息；句型和词汇的丰富度；句子不够丰富时用细节例子补充；卷面工整。卷面是**训练目标**，评分仍按书写评价边界执行，不因字体美观给分或扣分。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  fe11106b31ff1364:
    path: gaokao-writing/references/application-writing-and-correction.md
    heading: 写作误区与提分技巧
    line_start: 232
    line_end: 239
    content: '### 写作误区与提分技巧


      常见误区：结构混乱（混合段落）、要点遗漏、语言过度口语化（I miss you a lot! 应改具体化表达）。


      提分做法：审题精准（圈限定词）、细节填充（添加符合校园情境的事件）、文化礼仪（对外教用礼貌用语）、句式多样（复合句）、结尾技巧（暗示未来互动，如 Looking
      forward to your early return! 比 Good luck! 更具期待性）。


      范例改进法：把笼统句改具体——“Are you better now? We miss you.”改为“I hope your health has improved
      since your return to Ireland. It’s such a pity you couldn’t attend the recent
      cultural exchange day—your advice was greatly missed!”


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  e68392b5352c1bc7:
    path: gaokao-writing/references/application-writing-and-correction.md
    heading: 26S春 补充
    line_start: 240
    line_end: 253
    content: '### 26S春 补充


      **三段话格式**（针对已给标题或首尾句的演讲稿、发言稿）：①补全文章的中文剩余内容（除明确的考点信息），作背景 ②具体要点 ③套路结尾，最好有点升华。题目已给的标题、首句、尾句**保留格式抄原文**。


      **演讲稿套路结尾模板**：I would appreciate it if you could take my invitation/advice into
      consideration...，宾语与目的按题目主题替换。


      **要点—句型—词汇三联草稿表**：列名为写作要点、中文内容（草稿第 1 步）、采用句型（草稿第 3 步）、采用词汇（草稿第 2 步），草稿步序是**先中文、再词汇、后句型**。固定配对示例：演讲类开场问候用简单句加固定句式，趋势用时间状语从句，劣势用让步状语从句加表语从句，优势用并列句，结尾致谢用固定句式；发言稿类学会学习用原因状语从句，学会做人用非限制性定语从句，学会其他用举例句型，总结升华用强调句加固定句式；食物介绍类点明食物用定语从句，喜欢原因用并列句，制作步骤用倒装句加顺序连接词，结尾用简单句。


      **基础范文到升级范文的三段式**：优化原因固定四条，覆盖词汇替换、句式升级、逻辑衔接词、字数精简、立意升华五个维度。


      **具体升级手法**：not only...but also 倒装；形容词或分词作状语；as 引导倒装；first and foremost 与 last
      but not least 替换 first 和 last；精简冗余句、严格贴合字数；逻辑词 thus、more importantly。


      **制作步骤类写法**：First、Then、Finally 加祈使句动作链。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  24003f38b1c3222a:
    path: gaokao-writing/references/application-writing-and-correction.md
    heading: 批改交付格式
    line_start: 254
    line_end: 268
    content: '## 批改交付格式


      不要展示题型判断过程。按以下顺序输出：


      书写属于条件项：只有看到原始手写稿且书写已经影响交际时，才在整体结论或重点修改中简要说明降档依据；其余情况不单列“书写美观性”。


      1. 整体结论：给出分数区间或建议分数、所属档次及最关键证据；先肯定一项真实优点，再指出一个最优先改进点。

      2. 五审结果：分别写文体、对象、要点、逻辑、语言。要点用“已覆盖 / 不充分 / 遗漏 / 偏离”标记。

      3. 细致修改：逐处给出原句、建议改法和原因，覆盖明确的语法及相关语言错误；同类错误可合并解释，但保留各处位置与改法。另行说明可选表达优化，不把风格偏好当成语法错误。

      4. 结构优化：用简短提纲说明开头、主体、结尾怎样重排或补全。

      5. 修改稿：保留学生原意和能用的句子，先补任务与逻辑，再改语言；不得擅自加入改变任务的信息。

      6. 方法练习：从单句锚定、模块组篇、长句重构或富兰克林法中选一个最适合本次问题的练习。

      7. 配套素材：仅在有帮助时给 3–5 个可迁移表达或一个简短骨架，不用大段模板淹没反馈。


      语气口语化、具体、鼓励式，但不能虚构优点或淡化会影响分数的关键问题。

      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  596de3e74bdb9393:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 读后续写写作与批改
    line_start: 1
    line_end: 4
    content: '# 读后续写写作与批改


      本文件只用于读后续写，不能使用应用文的五审法、15 分档次或应用文模板。题型识别只做内部路由，交付稿不要复述“这是读后续写”或展示判断过程。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  7b4c299267a685c2:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 使用边界
    line_start: 5
    line_end: 12
    content: '## 使用边界


      - 写作指导至少需要原文和两段开头语；批改最好再有学生完整续写和清晰的书写图片或转写文本。

      - 学生的作文里没出现两段段首句是正常的，不用管。段首句由题面给出，答卷不必抄；不要因为作文里找不到开头语而当作缺失、扣分或提示补上。批改只看学生自己写的那部分，字数、句数、十句五定法的十个功能位都只算学生写的。这是本模块相对此前唯一的改动。

      - 缺少原文或任一段开头语时，只能校对现有语言，不能判断情节衔接、人物一致、主题或完整分数。

      - 书写和字数只按实际可见内容判断；无法辨认处标记“不确定”，不要脑补。

      - 评分依据是内容、语言表达和篇章结构。十句五定法是开明致学的构思与诊断工具，不是官方单独扣分项。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  d2dc77b78b7ce906:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 25 分评分规范
    line_start: 13
    line_end: 33
    content: '## 25 分评分规范


      先判断内容与原文的融洽度、情节合理性和完整性，再综合语言与衔接确定档次。按课程第五档制给出档次与分数区间。


      | 档次 | 分数 | 特征 | 判断要点 |

      |---|---:|---|---|

      | 第五档 | 21–25 | 亮点突出 | 情节有转折，语言有文采，主题有升华；细节丰富、句式多变，用词有质感，每段复杂句式不超过三处不堆砌 |

      | 第四档 | 16–20 | 写好写全 | 细节丰富、语言流畅、结构严谨；每段有动作神态环境三类细节，衔接用关键词复现与代词指代而非 and、so、then
      堆砌，结尾点明事件意义 |

      | 第三档 | 11–15 | 写顺写对 | 因果清晰、语言通顺、错误较少；人物行为对接原文伏笔，能用因果链推进，每段有一到两处进阶句式，词汇能作基础同义替换
      |

      | 第二档 | 6–10 | 能写完整 | 能写出完整故事，但逻辑有断层、表达生硬、错误较多；能圈出核心人物、核心矛盾、关键线索，每段按段首句加两个动作加一个结局搭建，保底字数不低于
      120 词 |

      | 第一档 | 0–5 | 无从下笔 | 内容离题、碎片化、字数不足；时态不统一、单复数出错、中式直译等致命错误多发 |


      学生答卷不写段首句是正常的，表中涉及开头语的衔接项只看学生写的部分跟题面开头语接不接得上，不因为答卷里没有开头语而扣分。


      附加规则：


      - 词数少于 120 时酌情扣分，通常建议控制在 150 词左右。

      - 拼写和标点按其对交际的影响处理；英式、美式拼写和词汇用法均可接受。

      - 书写差到影响交际时酌情扣分。只有看到原始书写时才能使用这一条。

      - 价值导向应积极，续写的高潮和结尾要顺承原文情节与语言风格。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  529088be97f3f185:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 书写评价边界
    line_start: 34
    line_end: 41
    content: '### 书写评价边界


      - 书写只评价“是否已经影响交际”，不单独评价美观程度，也不设置卷面美观分、字体分或书法式等级。

      - 只有提供清晰的原始手写作文图片时才评价书写；转写文本、键入文本或无法看清的图片不作判断。

      - “影响交际”是指部分单词、字母或信息无法可靠辨认，已经妨碍阅卷者理解故事；仅仅不够漂亮、个人不喜欢某种字体或一般性的书写差异，不构成扣分依据。

      - 确认影响交际时，依规范结合实际影响程度酌情扣分，并指出造成辨认困难的实际位置；不得预设固定扣分值。没有影响交际时，不因书写另行扣分。

      - 反馈只需简短说明，例如：“原稿中___处较难辨认，影响了这一处情节的理解；建议书写时优先保证字母和单词能够清楚区分。”不要输出额外的美观度评分或超出规范的书写训练量表。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  f1e81a5163eb6580:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 先框架后语言
    line_start: 42
    line_end: 55
    content: '## 先框架后语言


      批改须细致覆盖写作思路和语法两个层面。先依课程的原文线索、构思步骤和十句五定功能位检查学生的构思：矛盾怎样推进、人物为何行动、两段怎样接续、情绪如何变化、结局怎样解决冲突并回应主题。每个思路问题引用原文或段首句与学生原句，讲清缺少哪一步、为什么不合理以及怎样补写或调整；对合理但单薄的情节，给出具体细节优化位置和示例。随后逐句检查语法，包括句子主干、谓语与非谓语、时态语态、主谓一致、从句连接、人称指代、单复数、冠词、介词和词性，并检查搭配、拼写和标点。逐处给出原句、保留原意的改句及原因；同类错误可合并解释，但每处修改不能遗漏。重点概括不是纠错数量上限；区分确定错误与可选润色，不为了高级而改掉准确自然的表达。按总入口要求用纯文本自然段呈现。


      语言再漂亮，只要人物、冲突或段首句衔接错误，就先修框架。依次核查：


      1. 原文衔接：续写是否从原文末尾自然发生，是否利用原文已给事实和伏笔。

      2. 人物人设：人物身份、关系、性格、能力、认知和行为动机是否前后一致。

      3. 故事逻辑：时间、地点、因果、动作顺序、距离和物理条件是否合理；转折是否有铺垫。

      4. 情节走向：第一段能否自然通向第二段开头；第二段是否解决原文的核心矛盾并交代结果。

      5. 主旨立意：结局是否由情节自然推出，回应原文叙述意图，并落在人与自我、人与社会或人与自然的合适方向。


      不要鼓励节外生枝、突然增加关键人物、夸张复杂的事故、无铺垫的反转或为了标新立异而更换主题。正向结局也必须符合原文，不可强行大团圆。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  6c1ef222ac95b054:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 开明致学五步法：跳定思提润
    line_start: 56
    line_end: 57
    content: '## 开明致学五步法：跳定思提润


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  40089c4aea5930c9:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 一 跳：跳读文章，弄清线索
    line_start: 58
    line_end: 64
    content: '### 一 跳：跳读文章，弄清线索


      - 先看两段开头语，明确需要回原文寻找什么；再读原文，并回到段首句验证。

      - 用 5W1H 梳理人物、关系、时间、地点、事件和原因。

      - 优先读主人公相关句、人物谓语动词、原文首尾、每段首句，以及 so、but、however 等强逻辑句。

      - 记录叙事视角、时空线、情节线和各关键人物的情感线；人物关系复杂时画出关系和动作链。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  81f56745e0f0ef4f:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 二 定：确定冲突，锁定主题
    line_start: 65
    line_end: 70
    content: '### 二 定：确定冲突，锁定主题


      - 找显性冲突和隐性冲突，写清“谁因为什么遇到什么问题”。

      - 用“主人公 → 核心矛盾 → 解决方向 → 主旨”补全逻辑链。

      - 主题必须包含主要矛盾，可落在人与自我、人与社会或人与自然；结尾升华不能脱离故事。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  2f8f6bf8b2c518b4:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 三 思：整体构思，提取素材
    line_start: 71
    line_end: 77
    content: '### 三 思：整体构思，提取素材


      - 原文末尾、第一段开头和第二段开头共同限定第一段；第二段开头和主题共同限定第二段。

      - 第一段负责承上启下、推进或转折，并在末尾搭桥到第二段。

      - 第二段负责完成高潮、解决冲突、交代结果，再用动作或感悟自然点题。

      - 同时画出时间线和情感线。情绪应随事件变化，避免从绝望瞬间跳到狂喜。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  b7f00dc50a26467d:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 四 提：完成提纲，定词定句
    line_start: 78
    line_end: 83
    content: '### 四 提：完成提纲，定词定句


      - 先用中文列每段约 5 句的简明提纲，再选能推动情节的动作动词、准确的心情形容词和必要的环境词。

      - 每句话先确定逻辑功能，再决定句型。优先保证清楚、正确；高级结构只能服务情节。

      - 平时训练可用富兰克林法：先写中文 → 自行翻译 → 对照批改 → 记录缺失表达 → 挖空复现和仿写。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  d6a05f90dcbf2050:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 五 润：升华主题，润色修改
    line_start: 84
    line_end: 89
    content: '### 五 润：升华主题，润色修改


      - 补充动作、心理、神态、环境或简短对话，让故事有画面；每段选 1–2 处最有效的细节即可。

      - 检查上下文照应、段间过渡、时态、人物指代、主谓一致、名词单复数、词性、搭配、拼写和标点。

      - 最后检查升华是否由前面的解决结果自然推出，是否回应原文伏笔或关键词。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  de128566b475de5e:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 十句五定法
    line_start: 90
    line_end: 110
    content: '## 十句五定法


      默认把学生自写部分整理为两段、每段约 5 句，共约 10 句；题目已给的两段开头语不计入这 10 句。句数是构思支架，不因偏离句数本身扣分。


      段首句由题面给出，五定法照下面的功能位走。


      先锁定 5 个功能位：


      1. 第一段第 1 句：紧接第一段开头语，写人物的即时反应、心理或动作。

      2. 第一段第 5 句：完成必要动作，并自然过渡到第二段开头语。

      3. 第二段第 6 句：紧接第二段开头语，写人物到场、行动或新状态。

      4. 第二段第 9 句：紧贴原文，解决核心冲突并交代关键结果。

      5. 第二段第 10 句：回应原文细节或关键词，点明由故事自然得出的主题。


      其余 5 句用于补足因果链和画面：


      - 第一段第 2–4 句：行动 → 环境或心理细节 → 对应行动，逐步走向段末桥接。

      - 第二段第 7–8 句：在不另起主线的前提下制造并平息一个小波折，或补充解释和人物互动。


      批改时把学生现有句子映射到这些功能位，指出“缺桥接、缺解决、缺点题”等结构问题，再示范如何补句；不要为了凑十句删掉本来合理的内容。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  2be649e0f5a88344:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 人物和细节描写
    line_start: 111
    line_end: 119
    content: '## 人物和细节描写


      - 人物刻画先找关键人物，只写与主线有关的人。

      - 心理可直接写 think、feel、realize 等，也可用动作、情感或环境间接表现；间接描写必须让读者能看懂情绪来源。

      - 动作要符合人物能力并推动情节。可用原文出现过的动作或物件形成前后呼应。

      - 对话要简洁、口语自然、能解决信息或推动冲突；少用长篇直接引语，不要每句都用 said。

      - 外貌或神态只写能表现人物性格或当下状态的细节。

      - 情感线需有触发点和递进，可用“焦虑 → 希望 → 惊喜 → 感恩”这类链条，但必须按本题原文实际调整。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  225aabb48477b04e:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 读后续写批改反馈话术
    line_start: 120
    line_end: 123
    content: '## 读后续写批改反馈话术


      话术要先帮助学生看见故事骨架，再指出情节和细节如何影响得分，最后才处理语法。表达要像老师带着学生顺故事，而不是用评分术语压学生。下面的句式是可替换的表达支架，必须结合本题原文、两段开头语和学生原句使用。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  ba68cd2f986290f7:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 话术节奏
    line_start: 124
    line_end: 131
    content: '### 话术节奏


      1. 先复述学生已经搭成的故事链：说明第一段从哪里推进到哪里、第二段怎样收束、人物和核心事件是否仍在原文轨道上。

      2. 再点明主要失分点：优先讲原文衔接、人物人设、因果、段间桥接、冲突解决和主题闭环；不要先用零散语法错误掩盖框架问题。

      3. 用“为什么突兀—缺哪一步—怎样补”的方式修情节，不只说“逻辑不合理”。

      4. 对细节给定向建议：指出应在什么动作旁补哪一种心理、环境、神态或感官细节，每段控制 1–2 处。

      5. 框架成立后再集中纠错，最后给一项可重复训练和一个写后自查清单。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  8c87658d17064290:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 各环节可用话术
    line_start: 132
    line_end: 183
    content: '### 各环节可用话术


      **开场与故事闭环肯定**


      - “同学你好，咱们先看故事骨架。你第一段顺着___写到___，第二段又从___推进到___，前后形成了一个完整闭环，这一点做得不错。”

      - “你没有脱离原文的___和___，人物仍然是___，核心事件也围绕___展开，说明主线抓得比较准。”

      - “结尾用___回应了前文的___，情绪从___走向___，主题是由故事结果带出来的，这个方向可以保留。”


      肯定必须对应真实内容。故事没有闭环时，只肯定已经成立的局部，如段首衔接、人物一致或某个有效动作，不虚构完整性。


      **主要失分点与优先级**


      - “目前主要影响得分的地方在___。语言不是这篇文章最先要解决的问题，我们先把___补上，故事才能站得住。”

      - “你的基本事件已经写完，所以有基础情节分；但___还比较薄，限制了文章进入更高档次。”

      - “这篇文章的问题不是‘没有故事’，而是___写得太快／太突然。把中间的___补出来，情节会自然很多。”


      **原文衔接、人物和情节逻辑**


      - “这里需要回到原文。原文只告诉我们___，你却直接写到___，中间缺少___这个触发或行动，因此转折显得突然。”

      - “___这个行为和人物前文的___不太一致。除非先补___作为动机，否则建议改成更符合人物能力和性格的___。”

      - “从地点和距离看，___不太合理。结合原文的日常场景，改成___会更贴合，也不会让读者跳出故事。”

      - “不要只写结果‘___’，还要交代它是怎么发生的。可以补成‘先___，接着___，所以___’。”

      - “这一处突然增加了关键人物／事故，但原文没有铺垫，而且它没有帮助解决核心矛盾。删去支线，把篇幅留给___更有效。”


      **两段衔接与十句五定**


      - “第一段结尾必须把故事送到第二段开头。你现在停在___，而第二段一开始是___，中间缺少___这座桥。”

      - “第一段第 1 句已经接住了段首的___；第 5 句还要完成___，这样第二段的___才会自然发生。”

      - “第二段现在有___，但第 9 句还没有真正解决原文的___；第 10 句也要回应___，而不是另起一个宽泛道理。”

      - “十句五定不是为了凑句数。你现有的___可以保留，只需要在___功能位补一句___。”


      **情感线与画面细节**


      - “你现在写了人物做了什么，但读者还看不到他当时的状态。可以在‘___’旁补一个___细节，例如___。”

      - “情绪从___直接跳到___，中间缺少触发点。先写___，再让情绪转为___，变化就有依据了。”

      - “这里不用堆很多形容词。选一个动作和一个环境／神态细节就够了，比如___，既有画面又能推动情节。”

      - “两段的氛围比较平，可以按‘___ → ___ → ___ → ___’推进情绪，但每一步都要由实际事件触发。”

      - “这句环境描写如果只写天气，会显得游离；让它同时反映人物的___或推动___，才值得保留。”


      **语言纠错与表达升级**


      - “故事框架理顺后，我们再看语言。原句‘___’中，___需要改为___，因为___。”

      - “这里的意思能看懂，先保留句子主干。把___改成___，时态／单复数／固定搭配就统一了。”

      - “这句想写___的画面，但‘___’搭配不自然，可以改成‘___’。修改后既准确，也更符合当时的情绪。”

      - “同一类错误出现了几次，写完重点自查三项：拼写和词形、时态统一、固定搭配。”


      **总结与训练引导**


      - “整体来看，你现在已经能把故事完整写完，也抓住了基础情节。下一步重点积累情绪描写和环境烘托的短句，每段有 1–2 处有效细节即可。”

      - “这次先练一个最关键的动作：用第二段开头反推第一段结尾。把___到___之间补成两步行动，再读一遍是否自然。”

      - “下次写前先画人物、事件和情感三条线；写完再查段首衔接、核心冲突是否解决、结尾是否回应原文。做到这三步，框架会稳定很多。”


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
  91479aa1d7ad6180:
    path: gaokao-writing/references/continuation-writing-and-correction.md
    heading: 话术使用禁忌
    line_start: 184
    line_end: 192
    content: '### 话术使用禁忌


      - 不只报“情节不合理、细节不足、衔接较弱”，必须指出具体位置、缺失环节和可执行补法。

      - 不把华丽词汇和高级句型当作首要建议。人物、因果或段首衔接没理顺时，不进入语言升级。

      - 不机械累计每处扣分，也不因没有凑满十句而扣分；先按整体融洽度、合理性、完整性和语言表现定档。

      - 不要求每句话都加心理、环境和神态，不鼓励为制造波折而增加无铺垫人物或事故。

      - 不用“你完全没读懂原文”等定性话语。可说“这次在___处与原文的___没有接上”，并告诉学生怎样回原文找证据。

      - 不空泛安慰。鼓励必须建立在学生已经完成的故事环节上，并以一个明确训练任务结束。


      '
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
