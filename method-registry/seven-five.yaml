methods:
- method_id: F01
  brand_name: 选项三分
  source_name: 结构一致 + 主语一致 + 时态一致
  aliases:
  - 三一致初筛
  - 先分组再拼回去
  question_type: 七选五
  role: reducer
  primary_role: reducer
  secondary_roles: []
  output_type: reduce
  student_symptoms:
  - 七个选项感觉都能放，拿到每个空都从 A–G 凭语感试填。
  - 知道结构、主体或时态有用，却容易命中一项就直接定答案。
  trigger_cues:
  - 整篇七选五开头或单题开始，需要先识别选项间实际可见的结构、主角与真谓语时间差异。
  core_action: 在选项区按句型、实际主角、真谓语时间各标一次组并说清字母；无区分度如实标记，随后按突破口回正文。
  decision_rule: 只产出优先候选组；放回正文核对象、动作、两侧关系和段落任务，内容证据才定案。
  verification: 只产出优先候选组；放回正文核对象、动作、两侧关系和段落任务，内容证据才定案。 无区别不编组；发现漏纳、指代或谓语初筛错误可在当前比较纠正，不重演完整三分；不据组小、占用或剩一项选。
  stop_rule: 无区别不编组；发现漏纳、指代或谓语初筛错误可在当前比较纠正，不重演完整三分；不据组小、占用或剩一项选。
  common_wrong_instinct: 拿到一个空就在七个选项里凭语感试填，或看到同主语、同时态、同句型就直接选。
  failure_cases:
  - 拿到一个空就在七个选项里凭语感试填，或看到同主语、同时态、同句型就直接选。
  - 无区别不编组；发现漏纳、指代或谓语初筛错误可在当前比较纠正，不重演完整三分；不据组小、占用或剩一项选。
  counterexamples:
  - 两个选项都是祈使句且行动者相同，但一项针对的对象与本段任务不符；同组不等于同时成立。
  - 段中出现过去时事件，但当前空转向一般感悟；不能因最近动词是过去时就只留过去时组。
  transfer_pattern: 适用于任何七选五选项区的一次性初筛，不依赖文章题材。
  memory_line: 在选项区按句型、实际主角、真谓语时间各标一次组并说清字母；无区分度如实标记，随后按突破口回正文。
  anti_rule: 分组 ≠ 答案。
  visual_formula: "A–G 选项\n  ├─ 句型组\n  ├─ 主角组     → 优先候选\n  └─ 时间组\n             \
    \      ↓\n           拼回空前+空后\n                   ↓\n              内容才定案"
  challenge_prompt: 不填任何空，只把 A–G 按句型、主角和真谓语时间各分一次组，并说出哪一维没有区分度。
