levels:
  L1: 圈谓语和对应主体，划开修饰枝叶，但保留否定、条件、范围和比较
  L2: 化简后写主体—完整谓语—对象及必要限定；回原句核否定、条件、比较、转折和因果未丢，才得到语义骨架。
  L3: 枝叶中含改变结论的否定、条件、范围或比较时必须恢复；不能将目标当现状、多个动作当已证过程或转折后当答案。
  L4: 换长句仍先找谓语，再区分修饰与改变结论的限定，不迁移删除清单。
compact:
  line: 先圈谓语及对应主体，划分真实结构并保留答题相关修饰；阶段差异核当前与目标，持续差异直接核动作含义和必要上下文。
  boundary: 分结构不等于删修饰作答；不强制持续检查前先画时间线或比时长，不凭时态、持续词或转折位置定案；含义不明停该检查。
  10s: 长句读乱了？先圈谁和完整谓语，暂划修饰再恢复关键条件；拆句不等于删信息。
  30s: 长句读乱了？先圈这句一个可确认的完整谓语和对应主体，不先删所有修饰。例如，条件从句改变动作成立范围，拆完还得放回。否定、条件和范围不能删；含义不清不继续判项。
  90s: 长句读乱了？先圈谓语及对应主体，划分真实结构并保留答题相关修饰；阶段差异核当前与目标，持续差异直接核动作含义和必要上下文。这一步得到的是把当前关系或表达解释清楚，还要核完整题目。判断时，产出保留关键限制的核心关系解释；按题干取相关主旨、态度或结构观察，不要求局部题三问齐做。什么时候停，分结构不等于删修饰作答；不强制持续检查前先画时间线或比时长，不凭时态、持续词或转折位置定案；含义不明停该检查。反例示意，条件从句外观看似枝叶，但决定动作只在某条件下成立；删掉后变成无条件断言，必须恢复。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，不选答案，圈主干谓语和主体，划开修饰，再用另一种标记保留改变结论的限定。
