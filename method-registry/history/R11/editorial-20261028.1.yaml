method_id: R11
brand_name: 长句拆骨
source_name: 逻辑简化
aliases:
- 逻辑简化
question_type: 阅读理解
method_type: method
role: interpreter
primary_role: interpreter
secondary_roles: []
output_type: interpret
student_symptoms:
- 定位长句主干与枝叶混在一起
trigger_cues:
- 复杂句或关系妨碍看清所问主干，或候选确有同对象阶段/持续含义差异。
core_action: 先圈谓语及对应主体，划分真实结构并保留答题相关修饰；阶段差异核当前与目标，持续差异直接核动作含义和必要上下文。
decision_rule: 产出保留关键限制的核心关系解释；按题干取相关主旨、态度或结构观察，不要求局部题三问齐做。
verification: 产出保留关键限制的核心关系解释；按题干取相关主旨、态度或结构观察，不要求局部题三问齐做。 分结构不等于删修饰作答；不强制持续检查前先画时间线或比时长，不凭时态、持续词或转折位置定案；含义不明停该检查。
stop_rule: 分结构不等于删修饰作答；不强制持续检查前先画时间线或比时长，不凭时态、持续词或转折位置定案；含义不明停该检查。
common_wrong_instinct: 把所有修饰删光，主干看懂了就直接选，漏掉 only、not 或条件。
failure_cases:
- 把所有修饰删光，主干看懂了就直接选，漏掉 only、not 或条件。
- 分结构不等于删修饰作答；不强制持续检查前先画时间线或比时长，不凭时态、持续词或转折位置定案；含义不明停该检查。
counterexamples:
- 条件从句外观看似枝叶，但决定动作只在某条件下成立；删掉后变成无条件断言，必须恢复。
transfer_pattern: 换长句仍先找谓语，再区分修饰与改变结论的限定，不迁移删除清单。
memory_line: 先圈谓语及对应主体，划分真实结构并保留答题相关修饰；阶段差异核当前与目标，持续差异直接核动作含义和必要上下文。
anti_rule: 拆骨 ≠ 删掉限定。
visual_formula: "长句 → 主体｜完整谓语｜对象\n       + 否定/范围/条件/比较\n回原句复核 → 语义骨架\n骨架 ≠ 答案"
challenge_prompt: 不选答案，圈主干谓语和主体，划开修饰，再用另一种标记保留改变结论的限定。
