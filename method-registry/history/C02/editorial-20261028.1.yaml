compact:
  line: 圈两侧对象、动作、评价、时间及候选额外前提；近处够则回填，不够写缺口并向真实复现、回答、结果或评价扩。
  boundary: 仍不足就暂留，找到独立提示后返回，不强制原空号；相邻待定空、已占项或先报答案不互证。
  10s: 空前读通还犹豫？核两侧对象和动作，不足再扩读；猜出的邻空不能互证。
  30s: 空前读通还犹豫？先圈本空两侧谁在做什么；不足时写缺哪条联系再扩读。例如，两个待定空互相解释，不等于有独立文本证据。线索冲突或仍缺证据先暂留，不截取只支持初选的一句。
  90s: 空前读通还犹豫？圈两侧对象、动作、评价、时间及候选额外前提；近处够则回填，不够写缺口并向真实复现、回答、结果或评价扩。这一步得到的只是核验已有候选或稿件，不替代独立证据。判断时，产出线索与候选的实际联系和回填核验；多个线索一并核，不只截支持初选的一处。什么时候停，仍不足就暂留，找到独立提示后返回，不强制原空号；相邻待定空、已占项或先报答案不互证。反例示意，当前空和相邻空都未确定，却各自依赖对方猜出的含义；两空互相顺口不形成独立题面证据。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，先不填，圈本空前后各一条实际提示，写它们分别约束哪个对象或关系；没有就标缺口而不是借相邻答案。
