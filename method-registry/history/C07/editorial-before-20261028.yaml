student_symptoms:
- 名词空需要同一人物物件或事件线索
trigger_cues:
- 名词空有可确认原词、近义、同源复现或真实语义对照线索。
core_action: 圈相关表达及其内容，确认仍指同一人物、状态或事件；已知派生关系再核词义，必要时向后找并回填。
decision_rule: 只产出词汇呼应的对象线索；对照需同一语义维度，后续仍核句意、推进和主线。
verification: 只产出词汇呼应的对象线索；对照需同一语义维度，后续仍核句意、推进和主线。 未知词根不拆猜，共同后缀或形近不当同根；and不强定同向，复现、类别或次数不定案；同指或词义不明暂留。
stop_rule: 未知词根不拆猜，共同后缀或形近不当同根；and不强定同向，复现、类别或次数不定案；同指或词义不明暂留。
common_wrong_instinct: 某个名词重复就直接填它，不核是否还是同一对象或同一次事件。
failure_cases:
- 某个名词重复就直接填它，不核是否还是同一对象或同一次事件。
- 未知词根不拆猜，共同后缀或形近不当同根；and不强定同向，复现、类别或次数不定案；同指或词义不明暂留。
counterexamples:
- 两个地方用了同一个名词，但指不同事件或对象；重复词形不能证明本空需要该含义。
transfer_pattern: 换文仍证明同指后使用复现，不迁移上篇词对或固定比例说法。
memory_line: 圈相关表达及其内容，确认仍指同一人物、状态或事件；已知派生关系再核词义，必要时向后找并回填。
anti_rule: 复现 ≠ 本空答案。
visual_formula: "原词/近义/同源复现\n        ↓ 同一对象或事件？\n是 → 标线索位置（locate）→ 核句意/推进\n否/未知 →\
  \ 停止采用；不凭复现选"
challenge_prompt: 不填名词，只连出两处复现表达，分别标对象或事件；说清为什么是同一对象，而不只指出词一样。
