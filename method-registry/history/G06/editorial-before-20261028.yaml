compact:
  10s: 从句连接词不会？圈两侧谓语，划从句并标缺口；地点词不自动where，类型或缺口不清就停。
  30s: 空处连接分句时，先圈两侧谓语，判并列、从属或从句缺成分。结构示意：地点先行词的从句若缺宾语，不能只按地点选where。名词性从句还核语义；类型、缺口或搭配不明先停，不见完整句就填that。
  90s: 句间连接位置且可能是从句时，先确认：句间连接位置且可能是从句。第一刀：分别圈两侧谓语，核从句是否缺主语、宾语、表语或状语，再判连接功能。产物 decide：先划两侧分句与谓语，判连接类型；定语从句找先行词并标主宾定状缺口，名词性从句标承担成分及所缺内容，再核连接形式。
    停止：只知先行词是地点、时间或原因不能定where/when/why；从句类型、缺口或实际搭配不明就停。结构完整仍要核语义，不用发生/未发生一条口诀决定why/how。
    反例（关系示意，不是真题）：先行词表示地点，但从句缺的不是地点状语而是主语或宾语；不能仅凭地点名词选关系副词。 迁移：新从句仍先分范围、标成分缺口和联系，不迁移先行词词类到固定连接词。
    挑战：先不填连接词，分别圈两侧谓语，划从句范围，标它缺主语、宾语、定语、状语还是只缺语义联系。
