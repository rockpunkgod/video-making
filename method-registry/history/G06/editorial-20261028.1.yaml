core_action: 分别圈两侧谓语，核从句是否缺主语、宾语、表语或状语，再判连接功能
decision_rule: 先划两侧分句与谓语，判连接类型；定语从句找先行词并标主宾定状缺口，名词性从句标承担成分及所缺内容，再核连接形式。
verification: 分别圈两侧谓语，核从句是否缺主语、宾语、表语或状语，再判连接功能。先划两侧分句与谓语，判连接类型；定语从句找先行词并标主宾定状缺口，名词性从句标承担成分及所缺内容，再核连接形式。
  只知先行词是地点、时间或原因不能定where/when/why；从句类型、缺口或实际搭配不明就停。结构完整仍要核语义，不用发生/未发生一条口诀决定why/how。
stop_rule: 只知先行词是地点、时间或原因不能定where/when/why；从句类型、缺口或实际搭配不明就停。结构完整仍要核语义，不用发生/未发生一条口诀决定why/how。
common_wrong_instinct: 先行词是地点就填where，觉得从句结构完整就机械填that。
failure_cases:
- 先行词是地点就填where，觉得从句结构完整就机械填that。
- 只知先行词是地点、时间或原因不能定where/when/why；从句类型、缺口或实际搭配不明就停。结构完整仍要核语义，不用发生/未发生一条口诀决定why/how。
counterexamples:
- 先行词表示地点，但从句缺的不是地点状语而是主语或宾语；不能仅凭地点名词选关系副词。
transfer_pattern: 新从句仍先分范围、标成分缺口和联系，不迁移先行词词类到固定连接词。
memory_line: 分别圈两侧谓语，核从句是否缺主语、宾语、表语或状语，再判连接功能
anti_rule: 地点先行词 ≠ 必填where。
visual_formula: '两侧谓语 → 分句/连接类型

  定语：先行词 + 主/宾/定/状缺口

  名词性：承担成分 + 结构/语义缺口

  → 连接词决定；类型不清 → 停'
challenge_prompt: 先不填连接词，分别圈两侧谓语，划从句范围，标它缺主语、宾语、定语、状语还是只缺语义联系。
