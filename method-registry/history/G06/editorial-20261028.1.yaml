compact:
  10s: 从句词不会选？划分句、标缺口，再核连接作用；地点词不自动配where。
  30s: 从句词不会选？先圈空两侧已确认的谓语，再划分句，不见地点名词就填where。例如，地点名词后的从句若缺宾语，不能只因地点就用where。类型、缺口或语义不清先停，不见完整句就填that。
  90s: 从句词不会选？分别圈两侧谓语，核从句是否缺主语、宾语、表语或状语，再判连接功能这一步得到的只判断当前证据能支持或排除什么，不能由剩余项自动定案。判断时，先划两侧分句与谓语，判连接类型；定语从句找先行词并标主宾定状缺口，名词性从句标承担成分及所缺内容，再核连接形式。什么时候停，只知先行词是地点、时间或原因不能定where/when/why；从句类型、缺口或实际搭配不明就停。结构完整仍要核语义，不用发生/未发生一条口诀决定why/how。反例示意，先行词表示地点，但从句缺的不是地点状语而是主语或宾语；不能仅凭地点名词选关系副词。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，先不填连接词，分别圈两侧谓语，划从句范围，标它缺主语、宾语、定语、状语还是只缺语义联系。
