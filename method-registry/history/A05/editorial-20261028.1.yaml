- 中文长句信息和修饰混杂
trigger_cues:
- 中文信息与修饰混杂，需要重构英文表达而非按整篇词数选法。
core_action: 拆核心与修饰信息，按主体→核心动作→场景重组，再校时态、词性、单复数和衔接风格。
decision_rule: 产出保留原义、对象与限制的句子；按信息复杂度与表达能力选用，不由110/120整篇词数触发。
verification: 产出保留原义、对象与限制的句子；按信息复杂度与表达能力选用，不由110/120整篇词数触发。 核心不清先停重排；否定、时间、数量、条件不能当枝叶删；不宣称缺连续口述或新完整例的分支已全面验收。
stop_rule: 核心不清先停重排；否定、时间、数量、条件不能当枝叶删；不宣称缺连续口述或新完整例的分支已全面验收。
common_wrong_instinct: 照中文词序逐词翻译，或简化时把关键限制也删了。
failure_cases:
- 照中文词序逐词翻译，或简化时把关键限制也删了。
- 核心不清先停重排；否定、时间、数量、条件不能当枝叶删；不宣称缺连续口述或新完整例的分支已全面验收。
counterexamples:
- 句首的条件看着像修饰，却决定动作何时成立，重组不能删除；主客体对调后语法通顺也不是正确翻译。此为关系示意，不是真题。
transfer_pattern: 换中文内容仍先拆信息，再保限定地重排和校准。
memory_line: 拆核心与修饰信息，按主体→核心动作→场景重组，再校时态、词性、单复数和衔接风格。
anti_rule: 换语序 ≠ 换意思。
visual_formula: '中文信息 → 核心 / 修饰

  主体 → 核心动作 → 场景

  → 校形式 + 核原义'
challenge_prompt: 先不译长句，只标必须保留的核心与限定，再写英文主干的信息顺序。
