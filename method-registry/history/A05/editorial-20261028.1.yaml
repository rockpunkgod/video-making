levels:
  L1: 拆核心与修饰，按主体→动作→场景重组，再校时态词性单复数与风格
  L2: 区分必须传达的核心信息与修饰，先重组主体—核心动作—场景，再校准时态、词性、单复数和风格；保留原义与限定才成立。
  L3: 核心与修饰还分不清先停重排；否定、时间、数量或条件不能当枝叶丢掉。改写改变身份、动作或因果时退回原意。
  L4: 换中文内容仍先拆信息，再保限定地重排和校准。
compact:
  line: 拆核心与修饰信息，按主体→核心动作→场景重组，再校时态、词性、单复数和衔接风格。
  boundary: 核心不清先停重排；否定、时间、数量、条件不能当枝叶删；不宣称缺连续口述或新完整例的分支已全面验收。
  10s: 中文信息挤成一团？先分核心和限定再重排；语序能改，原义和条件不能丢。
  30s: 中文信息挤成一团？先用中文写清这句最重要的谁做什么，否定、条件和数量另作保留标记。例如，句首条件决定动作何时成立，重组不能把它删掉。核心没清楚先停，按信息难度而非整篇词数选法。
  90s: 中文信息挤成一团？拆核心与修饰信息，按主体→核心动作→场景重组，再校时态、词性、单复数和衔接风格。这一步得到的是把当前关系或表达解释清楚，还要核完整题目。判断时，产出保留原义、对象与限制的句子；按信息复杂度与表达能力选用，不由110/120整篇词数触发。什么时候停，核心不清先停重排；否定、时间、数量、条件不能当枝叶删；不宣称缺连续口述或新完整例的分支已全面验收。反例示意，句首的条件看着像修饰，却决定动作何时成立，重组不能删除；主客体对调后语法通顺也不是正确翻译。此为关系示意，不是真题。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，先不译长句，只标必须保留的核心与限定，再写英文主干的信息顺序。
