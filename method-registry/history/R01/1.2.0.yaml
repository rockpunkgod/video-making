levels:
  L1: 识别候选中明显新增的词语或人物。
  L2: 识别新增的原因、目的或用途。
  L3: 识别范围、程度、时间和确定性的变化。
  L4: 区分无依据扩写与有事实、数量或上下文支持的间接推断。
compact:
  line: 原文 A，选项 A+B，只查 B。
  boundary: 这句只是检查动作，必须回文判定 B 是否有直接或间接依据。
  10s: 两项都像原文？把多说的那项拆成A+B，只查B；无直接或间接依据才排。
  30s: 前半句能对上，后半句却多了目的、范围或时间？先圈原文已支持的A，再圈新增B。比如只说参加，却多说为了获奖，就回文查获奖目的。B有合理文本支持就停止排除；没原词不等于没依据。
  90s: 候选核心与原文对应，却可能新增人物、目的、时间、范围、因果或确定程度时，先圈A与B，只为B找直接陈述或必要上下文的间接支持。确认无支持或矛盾才排该项，排一项不证明剩余项正确。反例：原文事实与数量关系已支持概括，候选没逐字复述也不能排。换题仍先对齐核心，再核新增限制。挑战：先不选，只圈候选多说了什么，并标去哪里查。
full:
  summary: 把候选拆成原文已有内容 A 加新增内容 B。 只核 B 是否存在直接或间接文本依据；B 无依据才排除。
  source_boundary: 共同核心A未确认时不强拆；B有直接或间接支持时停止排除，不能因没原词判错；排除后仍核保留项。
  boundaries:
  - 共同核心A未确认时不强拆；B有直接或间接支持时停止排除，不能因没原词判错；排除后仍核保留项。
  - 候选虽未逐字出现，但原文事实或数量关系已对 B 构成充分间接支持，不得以加戏排除。
  - 候选含绝对词，但原文的确给出全称或必然关系，绝对词本身不构成错误。
  section_ids:
  - c9223f461c362df8
