method_id: R01
brand_name: 选项加戏
source_name: 过度推测
aliases:
- A+B检查
- 查新增
question_type: 阅读理解
role: decider
primary_role: decider
secondary_roles: []
output_type: decide
student_symptoms:
- 两个选项都像原文，找到定位句仍无法区分。
- 选项前半句能对上，但整项是否成立拿不准。
trigger_cues:
- 候选核心与原文对应，但又多出参与者、目的、用途、时间、范围、因果或确定程度。
- 原文是部分、多数、可能或具体行为，候选把它扩大为全部、必然或特定目的。
core_action: 把候选拆成原文已有内容 A 加新增内容 B。
decision_rule: 只核 B 是否存在直接或间接文本依据；B 无依据才排除。
verification:
- 回到定位句和必要上下文，标出 A 的对应。
- 单独列出 B 改变的对象、关系、范围、时间或强度。
- 搜索直接陈述或由事实、数量与上下文构成的间接支持。
- 排除后仍对保留项做正向核对，不以剩一项代替证明。
stop_rule: 没逐字出现，不等于没有依据。
common_wrong_instinct: 看到 A 正确，就默认 A+B 整项正确。
failure_cases:
- 候选与原文没有可确认的共同核心 A，不应强行拆分。
- 题干本身要求合理推断时，仍需按题干范围判定间接支持。
- 方法只排除一个加戏项时，不能自动证明其他项。
counterexamples:
- 候选虽未逐字出现，但原文事实或数量关系已对 B 构成充分间接支持，不得以加戏排除。
- 候选含绝对词，但原文的确给出全称或必然关系，绝对词本身不构成错误。
transfer_pattern: 适用于不同题材中的目的、因果、参与者、时间、范围、程度和确定性扩写检查。
memory_line: 原文 A，选项 A+B，只查 B。
anti_rule: 绝对词 ≠ 必错。
visual_formula: "原文：A\n     ↓\n候选：A + B\n           ↑\n        只查这里"
challenge_prompt: 先不要选答案，只找出哪个选项比原文多说了一部分，并指出多出的内容。
