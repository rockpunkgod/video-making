can_follow:
- 跳读定位
- 同源替换
- R09
usually_before:
- 正向验证
usually_after:
- 定位与必要上下文核对
conflicts_with: []
cannot_replace:
- 定位
- 主旨建模
- 保留项正向验证
levels:
  L1: 识别候选中明显新增的词语或人物。
  L2: 识别新增的原因、目的或用途。
  L3: 识别范围、程度、时间和确定性的变化。
  L4: 区分无依据扩写与有事实、数量或上下文支持的间接推断。
compact:
  line: 原文 A，选项 A+B，只查 B。
  boundary: 这句只是检查动作，必须回文判定 B 是否有直接或间接依据。
full:
  summary: 保留候选与原文的共同核心，仅对新增断言求证；只有无直接也无间接支持时才排除。
  boundaries:
  - 不做原词匹配
  - 不把绝对词机械判错
  - 不由排除一项推出剩余项正确
cases:
  canonical: cases/R01/canonical/case.yaml
  counterexample: cases/R01/counterexamples/case.yaml
  boundary: cases/R01/boundary/case.yaml
  transfer: cases/R01/transfer/case.yaml
four_step_card:
  start: 两个选项都像原文，其中一个比原文多说一截。
  first_cut: 把该选项圈成原文已有 A 和新增 B。
  judge: 只回文核 B；无直接也无间接依据才排除。
  stop: B 有合理文本支持时，不得以没原词为由继续排除。
practicality_gate:
  status: design_complete_empirical_pending
  trigger: 可从候选相对原文多出的参与者、目的、范围、时间、因果或确定性识别，不依赖答案。
  action: 圈出候选共同核心 A，下划新增 B，只对 B 回文求证。
  output: decide；对当前加戏候选作有依据排除或保留，不自动定其他项。
  stop: 找到 B 的直接或间接支持，或无法分出稳定 A 时停止。
  transfer: A+B 拆分可迁移到任何题材的断言扩写检查。
  efficiency: 把整项反复比较缩成只查 B，减少比较维度和犹豫。
  misuse_cost: high；把没原词当无依据会直接误排正确项，因此 Trigger 必须有明确 B，Stop 必须核间接支持。
