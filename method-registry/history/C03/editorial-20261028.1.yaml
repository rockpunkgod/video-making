method_id: C03
brand_name: 首句定调
source_name: 首句建立粗框架（语篇行文结构的子动作）
aliases:
- 首句建立粗框架（语篇行文结构的子动作）
question_type: 完形填空
method_type: sub_action
role: interpreter
primary_role: interpreter
secondary_roles: []
output_type: interpret
student_symptoms:
- 当前空依赖人物背景或全文基调
trigger_cues:
- 需要先建立粗框架，或当前空确实依赖主题、基调、视角或局部线索不足。
core_action: 从首句或前几句标人物、背景、主题、视角与暂定基调，再核当前空实际需要的对象和关系。
decision_rule: 产出粗框架而非答案；首句提供理解前提，单空已局部闭合不必每次复述。
verification: 产出粗框架而非答案；首句提供理解前提，单空已局部闭合不必每次复述。 首句未给的信息不预编；积极态度不等于遭遇顺利，外在表现、遭遇与态度不混同；不报课程系列为方法。
stop_rule: 首句未给的信息不预编；积极态度不等于遭遇顺利，外在表现、遭遇与态度不混同；不报课程系列为方法。
common_wrong_instinct: 首句看出积极主题，就默认人物之后一切顺利、所有空都选积极词。
failure_cases:
- 首句看出积极主题，就默认人物之后一切顺利、所有空都选积极词。
- 首句未给的信息不预编；积极态度不等于遭遇顺利，外在表现、遭遇与态度不混同；不报课程系列为方法。
counterexamples:
- 首句显示人物乐观，后文却交代遭遇困难；不能把态度直接改成客观处境。
transfer_pattern: 新故事仍从已给首句记录框架，分开态度与遭遇，不迁移上一题情节。
memory_line: 从首句或前几句标人物、背景、主题、视角与暂定基调，再核当前空实际需要的对象和关系。
anti_rule: 积极态度 ≠ 顺利遭遇。
visual_formula: "首句/前几句 → 人物｜背景｜主题｜视角｜基调\n          ↓ 暂定粗框架（interpret）\n当前空依赖？→ 调回核\n\
  局部已闭合？→ 不重复；不预编故事"
challenge_prompt: 先不做任何空，只用首句写人物、背景和暂定基调；未给的情节明确写未知。
