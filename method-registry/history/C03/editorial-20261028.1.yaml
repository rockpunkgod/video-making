levels:
  L1: 从首句记录人物、背景、主题、视角和暂定基调，不据此预编后续情节
  L2: 从首句或前几句写人物、背景、主题、视角和暂定基调；产出粗框架，只在当前空确实依赖这些内容或局部不足时回用。
  L3: 首句没有的信息不能预编；人物态度、外在表现和实际遭遇须分开。当前空能局部闭合就不机械复述首句，框架不选词。
  L4: 新故事仍从已给首句记录框架，分开态度与遭遇，不迁移上一题情节。
compact:
  line: 从首句或前几句标人物、背景、主题、视角与暂定基调，再核当前空实际需要的对象和关系。
  boundary: 首句未给的信息不预编；积极态度不等于遭遇顺利，外在表现、遭遇与态度不混同；不报课程系列为方法。
  10s: 开头读完没方向？先记人物和背景形成粗框架；不能据基调猜后续情节。
  30s: 开头读完没方向？先读首句或前几句，写现在明确知道的人物与背景，不猜后续剧情。例如，首句乐观，后文仍可能出现困难。首句没说的不编；局部已闭合不必每空重讲首句。
  90s: 开头读完没方向？从首句或前几句标人物、背景、主题、视角与暂定基调，再核当前空实际需要的对象和关系。这一步得到的是把当前关系或表达解释清楚，还要核完整题目。判断时，产出粗框架而非答案；首句提供理解前提，单空已局部闭合不必每次复述。什么时候停，首句未给的信息不预编；积极态度不等于遭遇顺利，外在表现、遭遇与态度不混同；不报课程系列为方法。反例示意，首句显示人物乐观，后文却交代遭遇困难；不能把态度直接改成客观处境。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，先不做任何空，只用首句写人物、背景和暂定基调；未给的情节明确写未知。
