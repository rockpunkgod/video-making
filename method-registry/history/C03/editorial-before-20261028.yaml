  L2: 从首句或前几句写人物、背景、主题、视角和暂定基调；产出粗框架，只在当前空确实依赖这些内容或局部不足时回用。
  L3: 首句没有的信息不能预编；人物态度、外在表现和实际遭遇须分开。当前空能局部闭合就不机械复述首句，框架不选词。
