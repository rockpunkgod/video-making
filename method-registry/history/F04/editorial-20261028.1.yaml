levels:
  L1: 标每项谓语及时间词，按真实事件时间分组，不用分词词尾代替时态
  L2: 只用真实谓语或明确时间线形成暂定字母组，回正文核当前事件阶段；同组继续比主体、动作、指代和两侧内容，不能以时态定案。
  L3: 非谓语词尾不能分时态；没有真实时间差异就停筛。正文有经历、常态或感悟切换时按局部时间核，不强求全篇表面一致，也不重复三分。
  L4: 陌生题仍找真谓语与局部事件时间，不迁移表面词尾或整篇统一时态的假设。
compact:
  line: 开头圈真谓语与时间词并说字母组，回文确认局部事件阶段，再在同组比主体、动作、指代、评价与两侧内容。
  boundary: 非谓语词尾不分时态；无差异停止该维筛选；经历与感悟可切换，初筛错误可更正但不重演；不只比较异组后就选。
  10s: 想按过去时筛答案？先圈真谓语，再核当前事件时间；词尾相同不算同阶段。
  30s: 想按过去时筛答案？先圈一个真正承担时间的谓语，不按所有-ed或-ing词尾分组。例如，过去经历后接一般感悟，不能只留过去式候选。分词不承担句子时态；无差异如实记，不凭同组定案。
  90s: 想按过去时筛答案？开头圈真谓语与时间词并说字母组，回文确认局部事件阶段，再在同组比主体、动作、指代、评价与两侧内容。这一步得到的只是缩小接下来要核的范围，不直接得答案。判断时，只产出当前时间相关候选；时间状语可作回查阶段的线索，不能以同组时间直接定案。什么时候停，非谓语词尾不分时态；无差异停止该维筛选；经历与感悟可切换，初筛错误可更正但不重演；不只比较异组后就选。反例示意，选项中-ed形式是分词修饰，不承担句子时态；不能据其词尾排除当前事件的候选。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，先不填，圈每项真正承担时态的谓语；不是谓语的-ed或-ing划开，再按实际事件时间落字母组。
