question_type: 七选五
method_type: sub_action
role: reducer
primary_role: reducer
secondary_roles: []
output_type: reduce
student_symptoms:
- 选项存在真实时间差异
trigger_cues:
- 候选的真谓语或实际时间关系有可观察分组差异。
core_action: 开头圈真谓语与时间词并说字母组，回文确认局部事件阶段，再在同组比主体、动作、指代、评价与两侧内容。
decision_rule: 只产出当前时间相关候选；时间状语可作回查阶段的线索，不能以同组时间直接定案。
verification: 只产出当前时间相关候选；时间状语可作回查阶段的线索，不能以同组时间直接定案。 非谓语词尾不分时态；无差异停止该维筛选；经历与感悟可切换，初筛错误可更正但不重演；不只比较异组后就选。
stop_rule: 非谓语词尾不分时态；无差异停止该维筛选；经历与感悟可切换，初筛错误可更正但不重演；不只比较异组后就选。
common_wrong_instinct: 看见-ed就分进过去组，或认定全篇所有空都应同一时态。
failure_cases:
- 看见-ed就分进过去组，或认定全篇所有空都应同一时态。
- 非谓语词尾不分时态；无差异停止该维筛选；经历与感悟可切换，初筛错误可更正但不重演；不只比较异组后就选。
counterexamples:
- 选项中-ed形式是分词修饰，不承担句子时态；不能据其词尾排除当前事件的候选。
transfer_pattern: 陌生题仍找真谓语与局部事件时间，不迁移表面词尾或整篇统一时态的假设。
memory_line: 开头圈真谓语与时间词并说字母组，回文确认局部事件阶段，再在同组比主体、动作、指代、评价与两侧内容。
anti_rule: 词尾-ed ≠ 谓语过去时。
visual_formula: '真谓语 + 时间线索 → 字母时间组

  回正文：当前事件阶段

  → 优先候选（reduce）

  分词词尾不分时态；同组核内容'
challenge_prompt: 先不填，圈每项真正承担时态的谓语；不是谓语的-ed或-ing划开，再按实际事件时间落字母组。
