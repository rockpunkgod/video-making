levels:
  L1: 标每项谓语及时间词，按真实事件时间分组，不用分词词尾代替时态
  L2: 只用真实谓语或明确时间线形成暂定字母组，回正文核当前事件阶段；同组继续比主体、动作、指代和两侧内容，不能以时态定案。
  L3: 非谓语词尾不能分时态；没有真实时间差异就停筛。正文有经历、常态或感悟切换时按局部时间核，不强求全篇表面一致，也不重复三分。
  L4: 陌生题仍找真谓语与局部事件时间，不迁移表面词尾或整篇统一时态的假设。
