  L2: 名词或名词短语能区别当前对象与其他对象时标对应区域，再核实际动作和阶段；结果仍只是出处。
  L3: 同一名词跨段或全篇重复、名词没有区分力时停止单词追踪，改用题干动作和限定；不能把出现次数当证据强度。
  L4: 陌生题仍检查名词是否有区分力，再配当前事件阶段，不迁移固定词对。
