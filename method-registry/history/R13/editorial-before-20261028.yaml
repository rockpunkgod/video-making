trigger_cues:
- 题干有能区分所问对象或区域的名词性线索，需要找出处。
core_action: 圈差异名词或名词短语，回文标候选区域，再配题干实际动作与限定，没原词时查可确认近义表达。
decision_rule: 只产出待核位置；一般名词定位不受暑4特定跳读前提一概限制，也不是顺藤摸瓜的别名。
verification: 只产出待核位置；一般名词定位不受暑4特定跳读前提一概限制，也不是顺藤摸瓜的别名。 同名跨段、名词无区分度或当前表达未确认就换动作线索或补证；不按次数、最近位置或同词定答案。
stop_rule: 同名跨段、名词无区分度或当前表达未确认就换动作线索或补证；不按次数、最近位置或同词定答案。
common_wrong_instinct: 一直追相同人名，却不核到底问的是哪次行动、哪个阶段。
failure_cases:
- 一直追相同人名，却不核到底问的是哪次行动、哪个阶段。
- 同名跨段、名词无区分度或当前表达未确认就换动作线索或补证；不按次数、最近位置或同词定答案。
counterexamples:
- 同一人物在变化前后多次出现，最近同名句说的却不是所问阶段；名词命中不支持该处答案。
transfer_pattern: 陌生题仍检查名词是否有区分力，再配当前事件阶段，不迁移固定词对。
memory_line: 圈差异名词或名词短语，回文标候选区域，再配题干实际动作与限定，没原词时查可确认近义表达。
anti_rule: 同一名词 ≠ 同一次事件。
visual_formula: "差异名词 → 多个出处？\n        ↓ 配动作/阶段\n待核区域（locate）\n同名 ≠ 同事件"
challenge_prompt: 先不选，圈一个有区分度的名词，列两个可能出处，标出各自事件阶段。
