stop_rule: 主体或动作不明先回要点，不编背景；基础不成立先修，不靠堆修饰升级，基础句式锚定不与另两种方法合并。
common_wrong_instinct: 中文想表达很多信息，开头就堆长句却没有明确谁做什么。
