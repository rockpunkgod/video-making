levels:
  L1: 先写主体，再写动作或状态，最后嵌入题面支持的场景细节
  L2: 主体、动作/状态、场景分别对应要点，基础句主干成立且细节有题面支持才保留；得到可继续组织的句子，不代表整篇任务已完成。
  L3: 主体或动作不确定先回要点，不能编背景补空；句子主干、搭配或时态不成立先修准确，不急着加修饰。
  L4: 换要点仍先定主体与动作或状态，场景内容随新任务变。
compact:
  line: 先写核心主体，再写动作或状态，最后加入题面支持且服务要点的时间地点等细节。
  boundary: 主体或动作不明先回要点，不编背景；基础不成立先修，不靠堆修饰升级，基础句式锚定不与另两种方法合并。
  10s: 想到了却写不成句？先写谁和做什么，再补必要细节；准确简单句先保留。
  30s: 想到了却写不成句？先写谁，再用会的词写一个准确动作或状态，细节随后补。例如，同一个要点先有完整主干，再加题面允许的时间地点。主体或动作不清先回要点，不编背景凑细节。
  90s: 想到了却写不成句？先写核心主体，再写动作或状态，最后加入题面支持且服务要点的时间地点等细节。这一步得到的是把当前关系或表达解释清楚，还要核完整题目。判断时，产出可继续组篇的准确基础句；主干、搭配、时态与题面要点对应，不代表整篇任务完成。什么时候停，主体或动作不明先回要点，不编背景；基础不成立先修，不靠堆修饰升级，基础句式锚定不与另两种方法合并。反例示意，题面只要求表达感谢，擅加对方实施了某项帮助会改事实；加再多时间地点也不能修复缺失谓语。此为条件示意，不是真题。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，先不升级句子，只写一个要点的主体、动作或状态，再指出准备加入的细节从哪里来。
