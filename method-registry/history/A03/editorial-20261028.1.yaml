counterexamples:
- 题面只要求表达感谢，擅加对方实施了某项帮助会改事实；加再多时间地点也不能修复缺失谓语。此为条件示意，不是真题。
transfer_pattern: 换要点仍先定主体与动作或状态，场景内容随新任务变。
memory_line: 先写核心主体，再写动作或状态，最后加入题面支持且服务要点的时间地点等细节。
anti_rule: 句子长 ≠ 句子成立。
visual_formula: '谁 → 做什么 / 什么状态 → 场景

  → 有主干的基础句'
challenge_prompt: 先不升级句子，只写一个要点的主体、动作或状态，再指出准备加入的细节从哪里来。
