student_symptoms:
- 题面给出评价或结果可核当前行为
trigger_cues:
- 题面给出评价或结果可核当前行为
core_action: 先还原结果所评价的具体行为，再核候选是否有真实题面联系，不能由猜定空互证
decision_rule: 先圈已给结果或评价，写它实际评价的行为，再核候选具体状态/动作与该行为的联系；输出评价或结果的核验，不用猜定空位当原因。
verification: 先还原结果所评价的具体行为，再核候选是否有真实题面联系，不能由猜定空互证。先圈已给结果或评价，写它实际评价的行为，再核候选具体状态/动作与该行为的联系；输出评价或结果的核验，不用猜定空位当原因。
  结果所评价对象不清、连接关系无题面依据或仅同为积极词时暂留；相邻待定空不能互证，结果也不能补造题面未给的行为。
stop_rule: 结果所评价对象不清、连接关系无题面依据或仅同为积极词时暂留；相邻待定空不能互证，结果也不能补造题面未给的行为。
common_wrong_instinct: 看到好结果就选任意积极行为词，或者用猜出的另一个空建立因果。
failure_cases:
- 看到好结果就选任意积极行为词，或者用猜出的另一个空建立因果。
- 结果所评价对象不清、连接关系无题面依据或仅同为积极词时暂留；相邻待定空不能互证，结果也不能补造题面未给的行为。
counterexamples:
- 两个积极词评价不同方面，结果只评价其中一项具体行为；同向评价不能把两词视为可互换。
transfer_pattern: 新题仍先还原评价对象，再核独立联系，不迁移好结果必配积极词的口令。
memory_line: 先还原结果所评价的具体行为，再核候选是否有真实题面联系，不能由猜定空互证
anti_rule: 好结果 ≠ 任意积极词。
visual_formula: "已给评价/结果 → 评价哪项行为？\n                ↓ 当前候选具体含义\n独立联系有据 → 核验（verify）\n\
  对象不清/猜空互证 → 暂留"
challenge_prompt: 先不填，只圈已给评价或结果，连到它实际评价的行为，指出候选必须满足的具体联系。
