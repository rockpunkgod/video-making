compact:
  10s: 想从好结果倒推？先写它评价哪项行为，再核候选联系；不是积极词都能填。
  30s: 想从好结果倒推？先圈题面已给的结果或评价，写它评价的究竟是哪项行为。例如，两个积极词评价不同方面，结果只支持其中一类。评价对象或桥接不清先停，不用猜定空作证据。
  90s: 想从好结果倒推？先还原结果所评价的具体行为，再核候选是否有真实题面联系，不能由猜定空互证这一步得到的只是核验已有候选或稿件，不替代独立证据。判断时，先圈已给结果或评价，写它实际评价的行为，再核候选具体状态/动作与该行为的联系；输出评价或结果的核验，不用猜定空位当原因。什么时候停，结果所评价对象不清、连接关系无题面依据或仅同为积极词时暂留；相邻待定空不能互证，结果也不能补造题面未给的行为。反例示意，两个积极词评价不同方面，结果只评价其中一项具体行为；同向评价不能把两词视为可互换。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，先不填，只圈已给评价或结果，连到它实际评价的行为，指出候选必须满足的具体联系。
