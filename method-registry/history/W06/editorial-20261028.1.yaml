trigger_cues:
- 续写不知从哪里下笔，需要从原文抓核心人物、矛盾与关键线索。
core_action: 给这三项各圈真实原文位置，写谁因何受阻、哪条线索约束后续。
decision_rule: 产出构思入口；三要素是分档训练中的取证动作，不自动证明解决情节。
verification: 产出构思入口；三要素是分档训练中的取证动作，不自动证明解决情节。 原文找不到就留缺口，不编主角或事故补齐三点；不把段首句加动作加结局的练习比例当全体写作配额。
stop_rule: 原文找不到就留缺口，不编主角或事故补齐三点；不把段首句加动作加结局的练习比例当全体写作配额。
common_wrong_instinct: 不知下笔就调用熟悉故事，把原文的主人公和困难替换掉。
failure_cases:
- 不知下笔就调用熟悉故事，把原文的主人公和困难替换掉。
- 原文找不到就留缺口，不编主角或事故补齐三点；不把段首句加动作加结局的练习比例当全体写作配额。
counterexamples:
- 圈到某物件不等于它一定能解除冲突，仍须写出作用条件；原文次要人物也不能仅因方便就换成核心主角。此为条件示意，不是真题。
transfer_pattern: 换故事仍从本篇圈三点，不移植旧故事角色。
memory_line: 给这三项各圈真实原文位置，写谁因何受阻、哪条线索约束后续。
anti_rule: 三点定位 ≠ 结局成立。
visual_formula: "原文 → 核心人物\n     → 核心矛盾\n     → 关键线索\n→ 构思入口，不是结局"
challenge_prompt: 先不写续文，只圈核心人物、矛盾和线索，分别用一处原文说明。
