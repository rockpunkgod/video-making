levels:
  L1: 圈核心人物、核心矛盾和关键线索，不额外造主角或无铺垫事故
  L2: 给核心人物、核心矛盾、关键线索各圈原文位置，写成谁因何受阻、哪条线索能约束后续；仅得到构思入口。
  L3: 三点未从原文找到先停编写；线索不能自动证明解决动作，新主角或无铺垫事故不能补成第三点。
  L4: 换故事仍从本篇圈三点，不移植旧故事角色。
compact:
  line: 给这三项各圈真实原文位置，写谁因何受阻、哪条线索约束后续。
  boundary: 原文找不到就留缺口，不编主角或事故补齐三点；不把段首句加动作加结局的练习比例当全体写作配额。
  10s: 续写不知抓什么？圈核心人物、矛盾和关键线索，只标出处；线索不是解决方案。
  30s: 续写不知抓什么？先圈原文核心人物，再圈谁因什么受阻，不明线索先空着。例如，圈到一个物件，还要核它凭什么能帮助解决问题。找不到就留缺口，不编主角或事故补三点。
  90s: 续写不知抓什么？给这三项各圈真实原文位置，写谁因何受阻、哪条线索约束后续。这一步得到的只是标出接下来要查的位置，不直接得答案。判断时，产出构思入口；三要素是分档训练中的取证动作，不自动证明解决情节。什么时候停，原文找不到就留缺口，不编主角或事故补齐三点；不把段首句加动作加结局的练习比例当全体写作配额。反例示意，圈到某物件不等于它一定能解除冲突，仍须写出作用条件；原文次要人物也不能仅因方便就换成核心主角。此为条件示意，不是真题。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，先不写续文，只圈核心人物、矛盾和线索，分别用一处原文说明。
