student_symptoms:
- 题干问全文或指定段主旨
trigger_cues:
- 题干问全文或段落主要内容、中心论点、主题或主要讨论对象。
core_action: 先圈所问全文/段落范围，扫候选共同对象并去同求异，带不同判断回该范围核贯穿内容及覆盖。
decision_rule: 产出对象—完整判断框架供候选核查；选项倒推和妖项助攻只是待验预期，正文实际内容才支持概括。
verification: 产出对象—完整判断框架供候选核查；选项倒推和妖项助攻只是待验预期，正文实际内容才支持概括。 局部事实、泛推理或人物品质不套主旨；不并为中心思想；共同词、较宽范围、动态词形或剩余项不定案，段意清楚不机械压全文。
stop_rule: 局部事实、泛推理或人物品质不套主旨；不并为中心思想；共同词、较宽范围、动态词形或剩余项不定案，段意清楚不机械压全文。
common_wrong_instinct: 不分问段落还是全文，看到选项都有同一个名词就选最抽象或范围最大的项。
failure_cases:
- 不分问段落还是全文，看到选项都有同一个名词就选最抽象或范围最大的项。
- 局部事实、泛推理或人物品质不套主旨；不并为中心思想；共同词、较宽范围、动态词形或剩余项不定案，段意清楚不机械压全文。
counterexamples:
- 题干只问一段主要内容，候选概括全文但没有概括该段任务；不能因更广或更抽象而保留为该段主旨。
transfer_pattern: 换文章仍先确定所问范围，再提取对象与不同判断，不固定首尾阅读清单。
memory_line: 先圈所问全文/段落范围，扫候选共同对象并去同求异，带不同判断回该范围核贯穿内容及覆盖。
anti_rule: 主题词 ≠ 完整主题。
visual_formula: "题干范围：全文 / 指定段\n共同对象 + 不同判断\n      ↓ 回该范围核贯穿内容\n对象—判断框架（不是答案）"
challenge_prompt: 不选答案，圈题干问全文还是单段，再划掉候选共同对象，仅写各项剩下的不同判断。
