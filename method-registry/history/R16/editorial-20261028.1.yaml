levels:
  L1: 先圈全文/段落范围，再写对象与核心判断，回各关键段检查覆盖
  L2: 先确认全文/单段任务范围，去掉候选共同对象后比较不同判断，在该范围核贯穿内容，产出对象—判断框架供后续候选核验。
  L3: 段落主题已清时不机械压全文；局部事实、一般推断或人物品质题不直接套主旨。共同词、抽象程度和首尾结构不独立证明概括。
  L4: 换文章仍先确定所问范围，再提取对象与不同判断，不固定首尾阅读清单。
compact:
  line: 先圈所问全文/段落范围，扫候选共同对象并去同求异，带不同判断回该范围核贯穿内容及覆盖。
  boundary: 局部事实、泛推理或人物品质不套主旨；不并为中心思想；共同词、较宽范围、动态词形或剩余项不定案，段意清楚不机械压全文。
  10s: 主旨选项都谈同一件事？先圈所问范围，再比各项不同判断；共同话题不等于主旨。
  30s: 主旨选项都谈同一件事？先圈题干问全文还是一段，再标候选都谈的对象与不同判断。例如，题干问一段，全文概括再广也未必概括了这一段。先分全文与段落，不凭词频、范围更大或剩一项选。
  90s: 主旨选项都谈同一件事？先圈所问全文/段落范围，扫候选共同对象并去同求异，带不同判断回该范围核贯穿内容及覆盖。这一步得到的是一份待核的框架或计划，不是答案或分数。判断时，产出对象—完整判断框架供候选核查；选项倒推和妖项助攻只是待验预期，正文实际内容才支持概括。什么时候停，局部事实、泛推理或人物品质不套主旨；不并为中心思想；共同词、较宽范围、动态词形或剩余项不定案，段意清楚不机械压全文。反例示意，题干只问一段主要内容，候选概括全文但没有概括该段任务；不能因更广或更抽象而保留为该段主旨。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，不选答案，圈题干问全文还是单段，再划掉候选共同对象，仅写各项剩下的不同判断。
