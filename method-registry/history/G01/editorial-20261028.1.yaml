levels:
  L1: 只区分有提示词与无提示词。
  L2: 无提示词进入限定、介词、指代、连接、句间逻辑节点。
  L3: 有提示词时依空位判名、形、副、代、数、动，不被原词性牵引。
  L4: 确认需要动词后，稳定进入谓语/非谓语并完成各自核对。
compact:
  line: 先问有没有提示词，再问这个位置要什么；确认要动词才分谓语和非谓语。
  boundary: 决策树负责选对分支，具体答案仍须在分支节点中用句法、搭配和句意定案。
  10s: 看到空先别变词。标有无提示，再圈位置需要什么；这里只定路线，不填答案。
  30s: 看到空先别变词。先只标本空有没有括号提示词，再在未填句圈决定它功能的词，不开始变形。没有提示词去功能词路线；有提示词先判位置需要什么，确认要动词才分谓语与非谓语。例如，environmental
    ___ (protect)要核名词中心，不能见protect就走动词路线。功能不明先补完整句；到节点后改用具体规则。
  90s: 看到空先别变词。圈出空后的括号提示词（若有），再圈空前后支配或修饰词，在未填句上标明空位成分；确认需要动词才分谓语/非谓语。这一步得到的只是下一知识节点；到节点后用具体句法、搭配和句意求证，不是词形答案。判断时，无提示词进功能词路线；有提示词先确定需要的词性/成分；只在已确认需要动词形式时才进谓语/非谓语分支。什么时候停，空位功能或必要句子未确认时先停；到达知识节点即停止总路线，改用节点句法、搭配与句意核验，不把路由当答案。反例示意，`environmental
    ___ (protect)` 的提示词是动词，但空位需要被形容词修饰的名词中心，应走名词节点而非非谓语节点。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，先不填词，只判断这个空有无提示词、在句中需要什么成分或词性，并说出下一个决策树节点。
