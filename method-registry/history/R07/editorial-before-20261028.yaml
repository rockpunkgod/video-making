compact:
  10s: 并列细节分不清？框同层内容，写共同任务，再核题干范围；只问一项就拆组，并列不等于一起排。
  30s: 至少两项映射到原文同层内容时，先框组并写共同解释什么。关系示意：若题干只问用途之一，就拆组各查。and 不能证明同层，转折前也不自动删；本步只缩范围，剩余项还要自己有据。
  90s: 多个细节真实并列且题干允许归为一组时，先确认：多个细节真实并列且题干允许归为一组。第一刀：把同层并列项框成一组，核候选是否只截取组内局部。判断产物：先证明同层各项共同解释什么，再对题干对象、状态与范围逐项核；所问未限定组内单项时才作为组缩小候选。
    停止：and/also 只作入口；不同层级、状态阶段不同、题干只问一项时拆组。无不能回答所问的内容理由，不可共同排除。 反例（关系示意，不是真题）：两项确实并列，但题干只问其中一种用途；必须拆开核，不能因属于同组就同时保留或删除。
    迁移：更换题材仍用同层、共同任务、题干范围三项决定是否打包。 挑战：先不删选项，只框出真正同层的内容，写出它们共同解释什么，再标题干问整组还是其中一项。
