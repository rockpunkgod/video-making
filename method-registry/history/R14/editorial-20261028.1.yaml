method_id: R14
brand_name: 顺序锁区
source_name: 题文同序
aliases:
- 题文同序
question_type: 阅读理解
method_type: sub_action
role: locator
primary_role: locator
secondary_roles: []
output_type: locate
student_symptoms:
- 文章组织与题目顺序实际相符
trigger_cues:
- 已定位题的出处与实际文章推进同序，能帮助缩小当前搜索区间。
core_action: 标相邻已定位题的真实出处，暂估当前题可能区间，再以当前题对象和动作回文确认。
decision_rule: 只产出暂定搜索范围；题文同序是积极阅读的定位子动作，不合并为顺藤摸瓜。
verification: 只产出暂定搜索范围；题文同序是积极阅读的定位子动作，不合并为顺藤摸瓜。 插叙、回叙、跨段综合、共享出处或证据落区间外时取消限制；不切死一题一段，定位不等于已答对。
stop_rule: 插叙、回叙、跨段综合、共享出处或证据落区间外时取消限制；不切死一题一段，定位不等于已答对。
common_wrong_instinct: 认定每题只占一段，按题号把原文切死，区间外证据一律不看。
failure_cases:
- 认定每题只占一段，按题号把原文切死，区间外证据一律不看。
- 插叙、回叙、跨段综合、共享出处或证据落区间外时取消限制；不切死一题一段，定位不等于已答对。
counterexamples:
- 文章在中间回叙早先事件，当前题出处可能越过相邻题区域；必须取消机械锁区。
transfer_pattern: 不同叙事仍先检验实际顺序，仅迁移区间假设与解锁动作，不迁移段号。
memory_line: 标相邻已定位题的真实出处，暂估当前题可能区间，再以当前题对象和动作回文确认。
anti_rule: 题号顺序 ≠ 固定段号。
visual_formula: '相邻已定位出处 → 暂定搜索区间

  当前证据符合顺序？

  是 → 定位；否 → 取消区间

  区间 ≠ 答案'
challenge_prompt: 不做当前题，只用相邻已定位出处画暂定搜索区，再指出什么题面信号会让你取消它。
