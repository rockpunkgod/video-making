levels:
  L1: 标相邻已定位题的出处，作为当前题查找区间，发现倒叙或偏离就取消区间
  L2: 将相邻已核定位题的出处作为搜索假设，只在当前题证据落入且顺序确实相符时保留区间；不由区间推出答案。
  L3: 插叙、回叙、跨段综合、猜词共享出处或当前证据落区间外时取消顺序限制，回全篇定位；已定位不得等同已答对。
  L4: 不同叙事仍先检验实际顺序，仅迁移区间假设与解锁动作，不迁移段号。
compact:
  line: 标相邻已定位题的真实出处，暂估当前题可能区间，再以当前题对象和动作回文确认。
  boundary: 插叙、回叙、跨段综合、共享出处或证据落区间外时取消限制；不切死一题一段，定位不等于已答对。
  10s: 不知道去哪段找？借相邻题已确认出处暂估区间；找到区间还得核本题。
  30s: 不知道去哪段找？先在文章边标出一处相邻题已确认的出处，当前题区间仍只作暂估。例如，文章中间回叙，当前证据可能落在暂估区间之外。插叙、共享出处或区间外证据出现就取消锁区。
  90s: 不知道去哪段找？标相邻已定位题的真实出处，暂估当前题可能区间，再以当前题对象和动作回文确认。这一步得到的只是标出接下来要查的位置，不直接得答案。判断时，只产出暂定搜索范围；题文同序是积极阅读的定位子动作，不合并为顺藤摸瓜。什么时候停，插叙、回叙、跨段综合、共享出处或证据落区间外时取消限制；不切死一题一段，定位不等于已答对。反例示意，文章在中间回叙早先事件，当前题出处可能越过相邻题区域；必须取消机械锁区。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，不做当前题，只用相邻已定位出处画暂定搜索区，再指出什么题面信号会让你取消它。
