method_id: W10
brand_name: 无痕衔接
source_name: 五档升级路径（训练用）
aliases:
- 五档升级路径（训练用）
question_type: 读后续写
method_type: sub_action
role: interpreter
primary_role: interpreter
secondary_roles: []
output_type: interpret
student_symptoms:
- 连接词堆砌却对象衔接不清
trigger_cues:
- 相邻句对象与行动衔接不清，或机械堆连接词影响表达。
core_action: 圈共同对象和代词回指，回填所指并核动作接续；可用关键词复现或指代替代无用连接词。
decision_rule: 产出对象、动作与关系连贯的表达；必要因果、否定和转折须保留。
verification: 产出对象、动作与关系连贯的表达；必要因果、否定和转折须保留。 代词歧义先明确对象；同对象不证明有因果，删词会改关系就保留或换准确表达，不为无痕而删逻辑。
stop_rule: 代词歧义先明确对象；同对象不证明有因果，删词会改关系就保留或换准确表达，不为无痕而删逻辑。
common_wrong_instinct: 把and、so、then全删掉，再重复关键词就觉得文章自动连贯。
failure_cases:
- 把and、so、then全删掉，再重复关键词就觉得文章自动连贯。
- 代词歧义先明确对象；同对象不证明有因果，删词会改关系就保留或换准确表达，不为无痕而删逻辑。
counterexamples:
- 两个人都可作he的所指，代词会使接续更乱，应先明指；本来必要的转折也不能为无痕而删掉。此为关系示意，不是真题。
transfer_pattern: 换人物仍做共同对象—代词回填—动作关系三项核对。
memory_line: 圈共同对象和代词回指，回填所指并核动作接续；可用关键词复现或指代替代无用连接词。
anti_rule: 复现关键词 ≠ 关系成立。
visual_formula: '句1对象 ↔ 句2关键词 / 代词

  回填所指 → 核动作关系

  必要因果 / 转折保留'
challenge_prompt: 先不换连接词，只圈相邻句共同对象，把代词换回具体人物，检查是否有歧义。
