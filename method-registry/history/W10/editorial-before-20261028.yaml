  30s: 相邻句对象与行动衔接不清，或机械堆连接词影响表达。 圈共同对象和代词回指，回填所指并核动作接续；可用关键词复现或指代替代无用连接词。 代词歧义先明确对象；同对象不证明有因果，删词会改关系就保留或换准确表达，不为无痕而删逻辑。
  90s: 相邻句对象与行动衔接不清，或机械堆连接词影响表达。 手上先做：圈共同对象和代词回指，回填所指并核动作接续；可用关键词复现或指代替代无用连接词。 做完得到：产出对象、动作与关系连贯的表达；必要因果、否定和转折须保留。
