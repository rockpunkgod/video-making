levels:
  L1: 圈相邻句共同对象和代词回指，使用关键词复现，不删掉必要逻辑关系
  L2: 圈相邻句共同对象并回填代词所指，核对象、动作和关系接续；关键词复现/代词指代可替代机械连接词堆砌，但必要因果、转折不能删除。
  L3: 代词有歧义先明确对象；两句对象相同但动作无因果不宣称自然衔接。删连接词会改变逻辑时保留或换准确表达。
  L4: 换人物仍做共同对象—代词回填—动作关系三项核对。
