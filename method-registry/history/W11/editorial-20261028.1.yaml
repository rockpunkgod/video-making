levels:
  L1: 从原文矛盾找小障碍，写解决动作，不凭空新增关键人物事故
  L2: 从原文核心矛盾找一个合理小障碍，写触发条件和解决行动，核不改变主线与人物能力；小转折只扩展解决过程，不要求每篇必加。
  L3: 无原文矛盾轨道或必要铺垫先停设计；新关键人物、事故、超能力不能只为反转加入。框架未完整先解决框架，正向结果不等于强行大团圆。
  L4: 换题仍由新原文矛盾界定障碍和行动，不能移植万能事故。
compact:
  line: 从当前矛盾找合理小障碍，写触发条件与解决行动，再核人物能力和主线不变。
  boundary: 无铺垫或框架未完整先停；不加无据关键人物、超能力或事故，每篇不强制转折，正向不等于大团圆。
  10s: 觉得故事需要波折？先核有无铺垫；过程已合理完整，就不必硬加小障碍。
  30s: 觉得故事需要波折？先检查现有过程是否真的需要小波折；不需要就不加，不把制造冲突当必做。例如，原文没铺垫的关键救场者，不能因结局向好就加入。基础框架未完整先停，波折不是每篇必写。
  90s: 觉得故事需要波折？从当前矛盾找合理小障碍，写触发条件与解决行动，再核人物能力和主线不变。这一步得到的是把当前关系或表达解释清楚，还要核完整题目。判断时，产出受原文约束的过程扩展；节外生枝原字与合理波折要求并存，不解释为凭空添事故。什么时候停，无铺垫或框架未完整先停；不加无据关键人物、超能力或事故，每篇不强制转折，正向不等于大团圆。反例示意，原文没有铺垫，突然出现关键救场人物，即使结局正向也不成立；现有解决过程合理完整时不必硬造波折。此为条件示意，不是真题。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，先不写波折，只列原文哪一矛盾允许哪一个小障碍，及原有人物如何解决。
