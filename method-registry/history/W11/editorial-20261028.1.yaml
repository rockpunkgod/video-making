question_type: 读后续写
method_type: sub_action
role: interpreter
primary_role: interpreter
secondary_roles: []
output_type: interpret
student_symptoms:
- 解决过程可以加入有铺垫波折
trigger_cues:
- 原文核心矛盾已有轨道，解决过程确实适合加入有铺垫小波折。
core_action: 从当前矛盾找合理小障碍，写触发条件与解决行动，再核人物能力和主线不变。
decision_rule: 产出受原文约束的过程扩展；节外生枝原字与合理波折要求并存，不解释为凭空添事故。
verification: 产出受原文约束的过程扩展；节外生枝原字与合理波折要求并存，不解释为凭空添事故。 无铺垫或框架未完整先停；不加无据关键人物、超能力或事故，每篇不强制转折，正向不等于大团圆。
stop_rule: 无铺垫或框架未完整先停；不加无据关键人物、超能力或事故，每篇不强制转折，正向不等于大团圆。
common_wrong_instinct: 故事平就突然安排事故或救场者，认为有转折才高分。
failure_cases:
- 故事平就突然安排事故或救场者，认为有转折才高分。
- 无铺垫或框架未完整先停；不加无据关键人物、超能力或事故，每篇不强制转折，正向不等于大团圆。
counterexamples:
- 原文没有铺垫，突然出现关键救场人物，即使结局正向也不成立；现有解决过程合理完整时不必硬造波折。此为条件示意，不是真题。
transfer_pattern: 换题仍由新原文矛盾界定障碍和行动，不能移植万能事故。
memory_line: 从当前矛盾找合理小障碍，写触发条件与解决行动，再核人物能力和主线不变。
anti_rule: 有反转 ≠ 有依据。
visual_formula: '原文矛盾 → 有条件的小障碍

  → 原有人物合理行动 → 主线结果

  无铺垫 → 不加'
challenge_prompt: 先不写波折，只列原文哪一矛盾允许哪一个小障碍，及原有人物如何解决。
