core_action: 在本题内先圈比较候选，尤其多个比较项时优先回文找真实关系，再对齐双方、属性、方向、程度、范围、阶段与条件。
decision_rule: 同一维度的等值改写可通过；确有属性、对象、阶段或强度偷换才排，产物是当前比较项核对。
verification: 同一维度的等值改写可通过；确有属性、对象、阶段或强度偷换才排，产物是当前比较项核对。 未找到同比较词只是未定位，不等于证伪；最高级不自动错，后来状态不补成先前性质；题内优先不改整篇题序。
stop_rule: 未找到同比较词只是未定位，不等于证伪；最高级不自动错，后来状态不补成先前性质；题内优先不改整篇题序。
common_wrong_instinct: 看到 more 或 most 就判错，或者拿后来表现去证明先前性质。
failure_cases:
- 看到 more 或 most 就判错，或者拿后来表现去证明先前性质。
- 未找到同比较词只是未定位，不等于证伪；最高级不自动错，后来状态不补成先前性质；题内优先不改整篇题序。
counterexamples:
- 候选用了最高级，原文却明确在同一范围、同一条件下支持最高程度；不能因为 most 就排除。
transfer_pattern: 不同材料均保留比较的双方、属性、阶段和条件，不能只迁移比较词。
memory_line: 在本题内先圈比较候选，尤其多个比较项时优先回文找真实关系，再对齐双方、属性、方向、程度、范围、阶段与条件。
anti_rule: 更好 ≠ 最好。
visual_formula: "双方 × 属性 × 方向 × 程度\n         × 范围 × 时间 × 条件\n同维有据 → 保留；已证偷换 → 排除\n\
  未定位 → 暂留"
challenge_prompt: 先不选，填出原文与候选的比较双方、属性、范围和时间，指出哪格有证据、哪格仍未定位。
