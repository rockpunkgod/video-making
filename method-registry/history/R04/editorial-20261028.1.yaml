levels:
  L1: 列出比较双方、属性、方向、程度、范围、时间与条件，逐格回文核对
  L2: 双方、比较属性、方向、程度、范围、时间和条件均有同维度原文支持才保留该比较断言；已证偷换则排除，尚未定位则暂留。
