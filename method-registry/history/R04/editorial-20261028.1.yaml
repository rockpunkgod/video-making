compact:
  line: 在本题内先圈比较候选，尤其多个比较项时优先回文找真实关系，再对齐双方、属性、方向、程度、范围、阶段与条件。
  boundary: 未找到同比较词只是未定位，不等于证伪；最高级不自动错，后来状态不补成先前性质；题内优先不改整篇题序。
  10s: 比较项总看混？先写谁跟谁比哪一点，再核方向和范围；最高级不自动错。
  30s: 比较项总看混？先圈比较词，在旁边写清谁跟谁、比哪一点；其余限定随后核。例如，同一对象比速度，不能换成比价格。未定位不算证伪；最高级有充分支持就不能排。
  90s: 比较项总看混？在本题内先圈比较候选，尤其多个比较项时优先回文找真实关系，再对齐双方、属性、方向、程度、范围、阶段与条件。这一步得到的只判断当前证据能支持或排除什么，不能由剩余项自动定案。判断时，同一维度的等值改写可通过；确有属性、对象、阶段或强度偷换才排，产物是当前比较项核对。什么时候停，未找到同比较词只是未定位，不等于证伪；最高级不自动错，后来状态不补成先前性质；题内优先不改整篇题序。反例示意，候选用了最高级，原文却明确在同一范围、同一条件下支持最高程度；不能因为
    most 就排除。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，先不选，填出原文与候选的比较双方、属性、范围和时间，指出哪格有证据、哪格仍未定位。
full:
  summary: 在本题内先圈比较候选，尤其多个比较项时优先回文找真实关系，再对齐双方、属性、方向、程度、范围、阶段与条件。 同一维度的等值改写可通过；确有属性、对象、阶段或强度偷换才排，产物是当前比较项核对。
  source_boundary: 未找到同比较词只是未定位，不等于证伪；最高级不自动错，后来状态不补成先前性质；题内优先不改整篇题序。
  boundaries:
