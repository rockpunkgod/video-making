decision_rule: 圈表示数量还是顺序的证据，连同限定词和名词单复数判基数、序数、倍数或分数表达；各项一致才定数词形式。
verification: 圈数量/次序线索，按节点规则处理基数、序数或词形。圈表示数量还是顺序的证据，连同限定词和名词单复数判基数、序数、倍数或分数表达；各项一致才定数词形式。
  只看到一个数字提示不能确定功能；排序线索和数量所指不清就停，不把中文数字或冠词单独当序数证明。
stop_rule: 只看到一个数字提示不能确定功能；排序线索和数量所指不清就停，不把中文数字或冠词单独当序数证明。
common_wrong_instinct: 提示是数字就照原样填，或看到the就直接变序数，不核是在数多少还是排第几。
failure_cases:
