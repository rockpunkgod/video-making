counterexamples:
- 同一数字可表达数量或次序，所需形式不同；提示数字自身不能证明序数路线。
transfer_pattern: 换数字仍先判位置功能和所指数量，不迁移原数字到固定序数形式。
memory_line: 圈数量/次序线索，按节点规则处理基数、序数或词形
anti_rule: 数字相同 ≠ 数词功能相同。
