student_symptoms:
- 故事结局需要回应主题
trigger_cues:
- 结局需要核是否自然回应原文关键细节、核心矛盾或人物变化。
core_action: 把解决结果对应回原文关键线索，指出行动或感悟怎样带出本题主题。
decision_rule: 产出主题回应核验；素材分类与积累数量不作每篇必写的独立升华句。
verification: 产出主题回应核验；素材分类与积累数量不作每篇必写的独立升华句。 核心矛盾未解先停喊道理；抽象主题不能换成本题内容就撤回，没独立升华句不自动降档或判重大缺失。
stop_rule: 核心矛盾未解先停喊道理；抽象主题不能换成本题内容就撤回，没独立升华句不自动降档或判重大缺失。
common_wrong_instinct: 结尾写一句宽泛正能量道理，就默认已经点题。
failure_cases:
- 结尾写一句宽泛正能量道理，就默认已经点题。
- 核心矛盾未解先停喊道理；抽象主题不能换成本题内容就撤回，没独立升华句不自动降档或判重大缺失。
counterexamples:
- 结尾喊互助却正文没有帮助行动，不能靠口号完成主题；故事结果已自然表达成长，不必再塞独立升华句。此为关系示意，不是真题。
transfer_pattern: 换故事仍从新矛盾的结果取主题，而不是换题套同一句道理。
memory_line: 把解决结果对应回原文关键线索，指出行动或感悟怎样带出本题主题。
anti_rule: 有道理 ≠ 回扣原文。
visual_formula: '原文矛盾 / 关键细节 ↔ 解决结果

  → 本题自然主题

  动作 / 感悟均可，独立升华非必须'
challenge_prompt: 先不写升华句，只连原文一处关键细节与结局结果，说明这一结果表达什么主题。
