levels:
  L1: 圈原文关键细节与解决结果，让结尾回扣它们；独立升华句不是必须项
  L2: 把结局结果对应回原文关键细节与核心矛盾，注明结果怎样带出主题；主题可由动作或感悟自然呈现，不要求独立升华句。
  L3: 核心矛盾未解决先停喊道理；主题与原文不符或抽象词不能换成本题内容时不保留。缺原文无法完整核回扣，没独立升华句不判重大缺失。
