compact:
  line: 把解决结果对应回原文关键线索，指出行动或感悟怎样带出本题主题。
  boundary: 核心矛盾未解先停喊道理；抽象主题不能换成本题内容就撤回，没独立升华句不自动降档或判重大缺失。
  10s: 结尾只会喊道理？先把解决结果连回原文矛盾；故事能回应就不硬加升华句。
  30s: 结尾只会喊道理？先圈结局解决了什么，再连回原文核心矛盾，不先背升华句。例如，结局行动已呈现成长，不必另塞一句泛泛感悟。核心矛盾未解先修情节，不用口号代替结果。
  90s: 结尾只会喊道理？把解决结果对应回原文关键线索，指出行动或感悟怎样带出本题主题。这一步得到的只是核验已有候选或稿件，不替代独立证据。判断时，产出主题回应核验；素材分类与积累数量不作每篇必写的独立升华句。什么时候停，核心矛盾未解先停喊道理；抽象主题不能换成本题内容就撤回，没独立升华句不自动降档或判重大缺失。反例示意，结尾喊互助却正文没有帮助行动，不能靠口号完成主题；故事结果已自然表达成长，不必再塞独立升华句。此为关系示意，不是真题。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，先不写升华句，只连原文一处关键细节与结局结果，说明这一结果表达什么主题。
