levels:
  L1: 标确定功能位为骨架，其余位置按因果与画面扩写，不把句数当评分扣分项
  L2: 先标接首句、桥接、解决、回扣等确定功能为骨架，其他位置只补必要因果和有效画面；得到扩写分工，不给不定句无限创作权。
  L3: 骨架任务未接通先补功能，不先堆肌肉；非功能位也受原文人物事实与因果限制，不能会什么背什么。句数不是独立扣分项。
  L4: 换稿仍先功能分工再有界扩写，句位随实际内容映射。
compact:
  line: 标接首句、必要桥接、解决与收束等实际功能为骨架，其余位置按本题因果与画面需要选写有把握内容。
  boundary: 骨架未接通先补功能；非功能位也受原文约束，不会什么就硬背什么，不因句数或句位本身扣分。
  10s: 不知哪句该扩写？先保衔接和解决的骨架，再选有依据的细节；肌肉句也不能乱编。
  30s: 不知哪句该扩写？先在提纲标一处必要桥接为骨架，剩余扩写仍受原文约束。例如，非功能位突然加新事故，同样会破坏原文约束。骨架未接通先补功能，不按固定句数分好坏。
  90s: 不知哪句该扩写？标接首句、必要桥接、解决与收束等实际功能为骨架，其余位置按本题因果与画面需要选写有把握内容。这一步得到的是一份待核的框架或计划，不是答案或分数。判断时，产出骨架与扩写分工；采用十句时可对应功能位，但不是所有题固定句数。什么时候停，骨架未接通先补功能；非功能位也受原文约束，不会什么就硬背什么，不因句数或句位本身扣分。反例示意，非功能位置写无铺垫新事件仍不成立；骨架功能句本身包含准确必要细节，也不因不是肌肉位而删掉。此为分类示意，不是真题。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，先不改语言，把现有内容标为骨架功能或扩写内容，并指出一个缺失功能。
full:
  summary: 标接首句、必要桥接、解决与收束等实际功能为骨架，其余位置按本题因果与画面需要选写有把握内容。 产出骨架与扩写分工；采用十句时可对应功能位，但不是所有题固定句数。
  source_boundary: 骨架未接通先补功能；非功能位也受原文约束，不会什么就硬背什么，不因句数或句位本身扣分。
  boundaries:
