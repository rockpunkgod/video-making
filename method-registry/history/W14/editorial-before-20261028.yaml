question_type: 读后续写
method_type: category
role: framework
primary_role: framework
secondary_roles: []
output_type: interpret
student_symptoms:
- 功能提纲与扩写位置需要区分
trigger_cues:
- 功能提纲已确定，需要分清哪里保证衔接、哪里适合扩写。
core_action: 标接首句、必要桥接、解决与收束等实际功能为骨架，其余位置按本题因果与画面需要选写有把握内容。
decision_rule: 产出骨架与扩写分工；采用十句时可对应功能位，但不是所有题固定句数。
verification: 产出骨架与扩写分工；采用十句时可对应功能位，但不是所有题固定句数。 骨架未接通先补功能；非功能位也受原文约束，不会什么就硬背什么，不因句数或句位本身扣分。
stop_rule: 骨架未接通先补功能；非功能位也受原文约束，不会什么就硬背什么，不因句数或句位本身扣分。
common_wrong_instinct: 以为不定句可以自由发挥，把背过的精彩句硬填进去。
failure_cases:
- 以为不定句可以自由发挥，把背过的精彩句硬填进去。
- 骨架未接通先补功能；非功能位也受原文约束，不会什么就硬背什么，不因句数或句位本身扣分。
counterexamples:
- 非功能位置写无铺垫新事件仍不成立；骨架功能句本身包含准确必要细节，也不因不是肌肉位而删掉。此为分类示意，不是真题。
transfer_pattern: 换稿仍先功能分工再有界扩写，句位随实际内容映射。
memory_line: 标接首句、必要桥接、解决与收束等实际功能为骨架，其余位置按本题因果与画面需要选写有把握内容。
anti_rule: 不定句 ≠ 无约束。
visual_formula: '骨架：接续 / 桥接 / 解决 / 回扣

  肌肉：补因果 / 有效画面

  两层共同受原文约束'
challenge_prompt: 先不改语言，把现有内容标为骨架功能或扩写内容，并指出一个缺失功能。
