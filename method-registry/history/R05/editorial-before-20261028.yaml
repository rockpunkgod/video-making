question_type: 阅读理解
method_type: method
role: decider
primary_role: decider
secondary_roles: []
output_type: decide
student_symptoms:
- 两个有依据的候选可能属于同一因果链
trigger_cues:
- 至少两个候选各有依据且原文支持同一因果链，题干方向允许比较因与果。
core_action: 先圈题干所问现象或具体环节；问原因就找与它相连的原因，否则画已证原因→中间结果→最终结果并对齐所问节点。
decision_rule: 只按题干核当前节点的直接作用；未明确问因时一般优先核结果是否承载所问核心信息，不是见链选最后。
verification: 只按题干核当前节点的直接作用；未明确问因时一般优先核结果是否承载所问核心信息，不是见链选最后。 共同对象、先后或并列不足以启动；链或各候选缺依据即停；不把后续结果移作前一环节目的，不由排一项定另一项。
stop_rule: 共同对象、先后或并列不足以启动；链或各候选缺依据即停；不把后续结果移作前一环节目的，不由排一项定另一项。
common_wrong_instinct: 看见两件事先后发生就补成因果，再把最后发生的事情当答案。
failure_cases:
- 看见两件事先后发生就补成因果，再把最后发生的事情当答案。
- 共同对象、先后或并列不足以启动；链或各候选缺依据即停；不把后续结果移作前一环节目的，不由排一项定另一项。
counterexamples:
- 两项分别说同链原因和结果，但题干明确问 why；应核所问现象的原因，不能沿链去选最后结果。
transfer_pattern: 题材变了仍先圈问因/问果，再证明同链箭头，不迁移选最后一项的习惯。
memory_line: 先圈题干所问现象或具体环节；问原因就找与它相连的原因，否则画已证原因→中间结果→最终结果并对齐所问节点。
anti_rule: 最后发生 ≠ 应选结果。
visual_formula: '题干问什么？

  原因题 → 现象 ← 有据原因

  非原因题 → 有据原因 → 有据结果

  结果仍须回答题干；先后 ≠ 因果'
challenge_prompt: 不选答案，先圈题干方向，再给两个候选之间的因果箭头找原文依据；没有依据就划掉箭头。
