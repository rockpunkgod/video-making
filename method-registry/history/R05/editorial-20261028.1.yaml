levels:
  L1: 先圈题干问原因还是结果，再写出原文支持的原因→结果，比较候选落点
  L2: 先服从题干方向；问原因就查所问现象相连的原因。未问因时只优先核同链结果是否回答核心事件或影响，不因处于末端自动选。
  L3: 候选未各自得到支持、因果桥无原文证据、只是先后或并列时停止；问 why/reason/cause 时停止套选果偏好。
  L4: 题材变了仍先圈问因/问果，再证明同链箭头，不迁移选最后一项的习惯。
compact:
  line: 先圈题干所问现象或具体环节；问原因就找与它相连的原因，否则画已证原因→中间结果→最终结果并对齐所问节点。
  boundary: 共同对象、先后或并列不足以启动；链或各候选缺依据即停；不把后续结果移作前一环节目的，不由排一项定另一项。
  10s: 原因结果选反？先圈题干问哪一环，再核同一因果链；不是总选最后结果。
  30s: 原因结果选反？先圈题干究竟问原因、结果还是某个环节，不急着画完整链。例如，题干问为什么，不能把最后发生的结果当原因。两项或链条缺依据就停，先后不证明因果。
  90s: 原因结果选反？先圈题干所问现象或具体环节；问原因就找与它相连的原因，否则画已证原因→中间结果→最终结果并对齐所问节点。这一步得到的只判断当前证据能支持或排除什么，不能由剩余项自动定案。判断时，只按题干核当前节点的直接作用；未明确问因时一般优先核结果是否承载所问核心信息，不是见链选最后。什么时候停，共同对象、先后或并列不足以启动；链或各候选缺依据即停；不把后续结果移作前一环节目的，不由排一项定另一项。反例示意，两项分别说同链原因和结果，但题干明确问
    why；应核所问现象的原因，不能沿链去选最后结果。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，不选答案，先圈题干方向，再给两个候选之间的因果箭头找原文依据；没有依据就划掉箭头。
