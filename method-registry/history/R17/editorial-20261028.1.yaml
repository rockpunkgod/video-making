levels:
  L1: 明确缺哪种关系，只向前后扩读到能补清它的句子，再核主体和动作
  L2: 扩读句必须补清当前缺少的原因、结果、指代或转折，并能说明如何改变主体—动作断言的核验；输出补证结果。
  L3: 定位句已闭合就不扩读；前后固定一句仍不足就按缺口继续找，关键内容未展示或仍不能闭合时暂留，不补造关系。
  L4: 换题材仍先命名证据缺口，再扩到能闭合的句子，不固化前后句数。
compact:
  line: 先写清缺哪条关系，只向必要前后文扩读到能补清它的位置，再回完整断言核主体、动作和限制。
  boundary: 定位句已闭合即停扩读；固定邻一句仍不足就按缺口继续，材料不足或关系不明则暂留，不编依据。
  10s: 定位句还说不清？先写缺哪个问题，只为它扩读；补到关系再回原断言核。
  30s: 定位句还说不清？先写出定位句还没回答的一个问题，再为这个缺口扩读。例如，邻句虽然提同一人，却没解释所问原因，不算补上证据。已有证据够用就停扩读；材料仍缺就暂留，不编联系。
  90s: 定位句还说不清？先写清缺哪条关系，只向必要前后文扩读到能补清它的位置，再回完整断言核主体、动作和限制。这一步得到的只是核验已有候选或稿件，不替代独立证据。判断时，产出补到的文本联系与仍存缺口；这是内部补证动作，不借左顾右盼或完形瞻前顾后的原名扩大范围。什么时候停，定位句已闭合即停扩读；固定邻一句仍不足就按缺口继续，材料不足或关系不明则暂留，不编依据。反例示意，多读到的邻句与所问原因无关；即使对象重复，也没有补清缺口，不能据此完成核验。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，先不选，写出定位句缺哪种关系，再圈一处新增证据，说清它补上的是哪条联系。
