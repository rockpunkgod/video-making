method_id: R17
brand_name: 前后补证
source_name: 定位后必要上下文核对（内部动作说明）
aliases:
- 定位后必要上下文核对（内部动作说明）
question_type: 阅读理解
method_type: verification_rule
role: verifier
primary_role: verifier
secondary_roles: []
output_type: verify
student_symptoms:
- 定位句缺原因、指代或转折关系
trigger_cues:
- 当前定位句缺决定本题的原因、结果、指代、转折或限定关系。
core_action: 先写清缺哪条关系，只向必要前后文扩读到能补清它的位置，再回完整断言核主体、动作和限制。
decision_rule: 产出补到的文本联系与仍存缺口；这是内部补证动作，不借左顾右盼或完形瞻前顾后的原名扩大范围。
verification: 产出补到的文本联系与仍存缺口；这是内部补证动作，不借左顾右盼或完形瞻前顾后的原名扩大范围。 定位句已闭合即停扩读；固定邻一句仍不足就按缺口继续，材料不足或关系不明则暂留，不编依据。
stop_rule: 定位句已闭合即停扩读；固定邻一句仍不足就按缺口继续，材料不足或关系不明则暂留，不编依据。
common_wrong_instinct: 随便多读前后一句就认为证据齐了，或把附近任何同词句都当支持。
failure_cases:
- 随便多读前后一句就认为证据齐了，或把附近任何同词句都当支持。
- 定位句已闭合即停扩读；固定邻一句仍不足就按缺口继续，材料不足或关系不明则暂留，不编依据。
counterexamples:
- 多读到的邻句与所问原因无关；即使对象重复，也没有补清缺口，不能据此完成核验。
transfer_pattern: 换题材仍先命名证据缺口，再扩到能闭合的句子，不固化前后句数。
memory_line: 先写清缺哪条关系，只向必要前后文扩读到能补清它的位置，再回完整断言核主体、动作和限制。
anti_rule: 多读一句 ≠ 补证完成。
visual_formula: "定位句 → 缺什么关系？\n原因 / 结果 / 指代 / 转折\n      ↓ 只为该缺口扩读\n回原断言核验；未闭合 → 暂留"
challenge_prompt: 先不选，写出定位句缺哪种关系，再圈一处新增证据，说清它补上的是哪条联系。
