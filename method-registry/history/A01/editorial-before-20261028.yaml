compact:
  10s: 作文读着顺却不知道缺什么？把题面要求逐条对到原稿，先列任务缺口再查语言；五检不等于五项扣分。
  30s: 作文看着顺也先别升级词。把文体、对象、要点、逻辑、语言列五栏，给每条评价标题面或原句位置。例如邀请目的写了，时间地点没写，先补安排。没有题目就停在语言校对，不宣称要点齐全。
  90s: 应用文题面要点或稿件任务不清时，先确认：应用文题面要点或稿件任务不清。第一刀：按文体、对象、要点、逻辑、语言逐栏记录题面与原稿证据，先任务后语言。产物
    interpret：五栏逐项对照题面与原稿：标出已覆盖、不充分、遗漏或偏离，先圈影响交际任务的缺口，再列确定的语言问题；得到修改清单，不直接得到分数。 停止：无题目只能校对可见语言和大致结构；无全文不做全篇诊断。书写只看清晰原稿是否影响交际，五检项目不是逐项扣分表。
    反例（关系示意，不是真题）：语言漂亮但题面核心要点遗漏，不能因高级词多判任务完成；只有转写文本时也不能诊断原稿书写。此为条件示意，不是真题。 迁移：换文体仍做题面要求—原稿位置配对，具体格式和目的随题目变化。
    挑战：先不打分、不改全文，给每个题面要点找一个原稿位置；找不到的标遗漏。
