  beginner_support:
    first_micro_action: 先圈题目一个明确要求，在原稿旁标写到了还是没写到，再展开五检。
    prerequisite: 先读清写给谁、要完成哪件事。基础句先做到谁、做什么或是什么清楚；准确简单句可以保留。
    if_stuck: 保留准确简单句和已覆盖要点；不强加复杂句、AI或高级词，不据训练配额扣分。
    example: 邀请目的写了，时间地点没交代，要先补活动安排。
    example_scope: 关系/结构示意，非完整试题，不计真题或已验案例。
    micro_action_is_not_completion: 完成第一小步不等于完整方法成功；继续完成四步卡的判断与停止核验。
