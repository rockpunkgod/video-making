compact:
  10s: 作文读着顺却怕漏点？把题面要求逐条对回原稿，先补任务；五检不是扣分表。
  30s: 作文读着顺却怕漏点？先圈题目一个明确要求，在原稿旁标写到了还是没写到，再展开五检。例如，邀请目的写了，时间地点没交代，要先补活动安排。无题目只校语言，无全文不做整篇诊断。
  90s: 作文读着顺却怕漏点？按文体、对象、要点、逻辑、语言逐栏记录题面与原稿证据，先任务后语言这一步得到的是一份待核的框架或计划，不是答案或分数。判断时，五栏逐项对照题面与原稿：标出已覆盖、不充分、遗漏或偏离，先圈影响交际任务的缺口，再列确定的语言问题；得到修改清单，不直接得到分数。什么时候停，无题目只能校对可见语言和大致结构；无全文不做全篇诊断。书写只看清晰原稿是否影响交际，五检项目不是逐项扣分表。反例示意，语言漂亮但题面核心要点遗漏，不能因高级词多判任务完成；只有转写文本时也不能诊断原稿书写。此为条件示意，不是真题。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，先不打分、不改全文，给每个题面要点找一个原稿位置；找不到的标遗漏。
