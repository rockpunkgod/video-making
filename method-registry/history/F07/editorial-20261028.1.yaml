core_action: 写出两侧完整内容，指出实际关系，再核候选连接后是否成立
decision_rule: 把两侧完整内容写成关系方向，回填核转折、因果、递进、例证或措施的实际联系；两侧与段落任务共同成立才通过这一项核验。
verification: 写出两侧完整内容，指出实际关系，再核候选连接后是否成立。把两侧完整内容写成关系方向，回填核转折、因果、递进、例证或措施的实际联系；两侧与段落任务共同成立才通过这一项核验。
  仅连接词同类、只接前句却冲突后句或措施时点错误时不能通过；否定只做某事不是完全禁止，例子也必须真的支持观点。
stop_rule: 仅连接词同类、只接前句却冲突后句或措施时点错误时不能通过；否定只做某事不是完全禁止，例子也必须真的支持观点。
common_wrong_instinct: 一看到however就找反义词，一看到因果词就选像原因的项，不读两侧完整内容。
failure_cases:
- 一看到however就找反义词，一看到因果词就选像原因的项，不读两侧完整内容。
- 仅连接词同类、只接前句却冲突后句或措施时点错误时不能通过；否定只做某事不是完全禁止，例子也必须真的支持观点。
counterexamples:
- 候选能接前句的问题，却提出事后补救，而空位要求事前准备；措施主题相同也不能通过时间关系核验。
transfer_pattern: 新题仍用两侧完整命题证明箭头，不把连接词或负面词机械对应成答案。
memory_line: 写出两侧完整内容，指出实际关系，再核候选连接后是否成立
anti_rule: 同连接词 ≠ 同关系成立。
visual_formula: "空前完整内容 → 关系方向 → 空后完整内容\n           ↑ 回填候选\n核两侧 + 行动时点 + 段落任务\n→ 关系核验（verify）"
challenge_prompt: 先不填，写空前和空后各说什么，再画一条有方向的关系箭头；给箭头指出内容依据而非只抄连接词。
