  30s: 连接词看懂仍犹豫？先用一句中文各写空前和空后在说什么，再标真实关系。例如，事后补救不能代替空位所需的事前准备。前后任一侧冲突就停；不能只凭连接词定关系。
  90s: 连接词看懂仍犹豫？写出两侧完整内容，指出实际关系，再核候选连接后是否成立这一步得到的只是核验已有候选或稿件，不替代独立证据。判断时，把两侧完整内容写成关系方向，回填核转折、因果、递进、例证或措施的实际联系；两侧与段落任务共同成立才通过这一项核验。什么时候停，仅连接词同类、只接前句却冲突后句或措施时点错误时不能通过；否定只做某事不是完全禁止，例子也必须真的支持观点。反例示意，候选能接前句的问题，却提出事后补救，而空位要求事前准备；措施主题相同也不能通过时间关系核验。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，先不填，写空前和空后各说什么，再画一条有方向的关系箭头；给箭头指出内容依据而非只抄连接词。
