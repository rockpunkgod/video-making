anti_rule: 同连接词 ≠ 同关系成立。
visual_formula: "空前完整内容 → 关系方向 → 空后完整内容\n           ↑ 回填候选\n核两侧 + 行动时点 + 段落任务\n→ 关系核验（verify）"
challenge_prompt: 先不填，写空前和空后各说什么，再画一条有方向的关系箭头；给箭头指出内容依据而非只抄连接词。
