compact:
  10s: 连接词让你犹豫？写两侧完整内容和关系方向，再核行动时点；只接前句或同连接词，不能通过。
  30s: 转折、因果、例证或措施关系可见时，写两侧完整内容，再标实际方向并回填。关系示意：事后补救不能冒充事前准备。只接前句、与后句冲突就停；没有显式连接词也能核内容，但不能补造关系。
  90s: 空前后显示转折、因果、解释等关系时，先确认：空前后显示转折、因果、解释等关系。第一刀：写出两侧完整内容，指出实际关系，再核候选连接后是否成立。产物 verify：把两侧完整内容写成关系方向，回填核转折、因果、递进、例证或措施的实际联系；两侧与段落任务共同成立才通过这一项核验。
    停止：仅连接词同类、只接前句却冲突后句或措施时点错误时不能通过；否定只做某事不是完全禁止，例子也必须真的支持观点。 反例（关系示意，不是真题）：候选能接前句的问题，却提出事后补救，而空位要求事前准备；措施主题相同也不能通过时间关系核验。
    迁移：新题仍用两侧完整命题证明箭头，不把连接词或负面词机械对应成答案。 挑战：先不填，写空前和空后各说什么，再画一条有方向的关系箭头；给箭头指出内容依据而非只抄连接词。
