core_action: 圈中心名词、单复数和已有修饰，回语境核特指泛指再定冠词
decision_rule: 确认名词中心、可数性和单复数，再核特指泛指、读音及具体结构；仅在冠词位置和所指关系均有据时确定a/an/the或相应零冠词结构。
verification: 圈中心名词、单复数和已有修饰，回语境核特指泛指再定冠词。确认名词中心、可数性和单复数，再核特指泛指、读音及具体结构；仅在冠词位置和所指关系均有据时确定a/an/the或相应零冠词结构。
  已有其他限定、中心名词未确认或所指是否唯一不清时停；of修饰或定语从句不能自动证明the，a/an按读音而非字母。
stop_rule: 已有其他限定、中心名词未确认或所指是否唯一不清时停；of修饰或定语从句不能自动证明the，a/an按读音而非字母。
common_wrong_instinct: 名词后有of或定语从句就一律填the，元音字母开头就填an。
failure_cases:
- 名词后有of或定语从句就一律填the，元音字母开头就填an。
- 已有其他限定、中心名词未确认或所指是否唯一不清时停；of修饰或定语从句不能自动证明the，a/an按读音而非字母。
counterexamples:
- 名词有后置修饰，却仍在泛指某一个；不能单靠后面的修饰认定所指唯一。
transfer_pattern: 换题仍先核名词形态和所指，不迁移后置修饰必特指的口诀。
memory_line: 圈中心名词、单复数和已有修饰，回语境核特指泛指再定冠词
anti_rule: 有后置修饰 ≠ 必填the。
visual_formula: '名词中心 → 可数？单/复？已有限定？

  ↓ 所指：特指 / 泛指

  ↓ a/an核读音；the核具体所指

  → 冠词决定（decide）'
challenge_prompt: 先不填冠词，圈中心名词，标可数性、单复数及特指/泛指的题面证据。
