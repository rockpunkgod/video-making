compact:
  10s: 冠词犹豫？圈名词中心，核数和所指；有后置修饰不自动填the。
  30s: 冠词犹豫？先圈空后名词中心和已有限定；未确认冠词位置就不选冠词。例如，后接of不等于所指唯一，仍须核特指泛指。已有其他限定或所指不清先停，a/an看读音。
  90s: 冠词犹豫？圈中心名词、单复数和已有修饰，回语境核特指泛指再定冠词这一步得到的只判断当前证据能支持或排除什么，不能由剩余项自动定案。判断时，确认名词中心、可数性和单复数，再核特指泛指、读音及具体结构；仅在冠词位置和所指关系均有据时确定a/an/the或相应零冠词结构。什么时候停，已有其他限定、中心名词未确认或所指是否唯一不清时停；of修饰或定语从句不能自动证明the，a/an按读音而非字母。反例示意，名词有后置修饰，却仍在泛指某一个；不能单靠后面的修饰认定所指唯一。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，先不填冠词，圈中心名词，标可数性、单复数及特指/泛指的题面证据。
