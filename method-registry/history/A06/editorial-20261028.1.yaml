levels:
  L1: 先简化中文自行译，再对照范文记录缺失表达；背诵复现后在同结构仿写
  L2: 先独立翻译简化中文，再对照范文圈缺失或不准的表达，记录、背诵、挖空复现并同结构仿写；产物是可复练差异，不是范文唯一答案。
  L3: 适用于课后训练，不是考场先看答案；已准确且自然的异写不判错。范文或AI升级改变意思、搭配未核时不背不照抄。
  L4: 换范文仍先独立产出再对照，仿写换内容而保留已经核准的结构。
compact:
  line: 中文必要时先简化，再独立英译、对照范文、记录并背诵缺失词或句式；第五步AI升级可选。
  boundary: 范文或AI改变任务、意思或搭配未核就不背不抄；挖空法另列，不塞入寒4五步或改称六步。
  10s: 总背范文却不会用？先自己译一句再对照，只记表达缺口；准确异写不用改错。
  30s: 总背范文却不会用？先独立译一句会表达的中文，再对照；准确异写保留，不强制AI升级。例如，自译和范文用词不同但意思搭配都对，可以保留。范文或AI改了意思就不抄，AI升级可选。
  90s: 总背范文却不会用？中文必要时先简化，再独立英译、对照范文、记录并背诵缺失词或句式；第五步AI升级可选。这一步得到的是一份待核的框架或计划，不是答案或分数。判断时，产出自己的表达缺口与已核素材；准确异写可保留，AI建议须保原意且搭配成立。什么时候停，范文或AI改变任务、意思或搭配未核就不背不抄；挖空法另列，不塞入寒4五步或改称六步。反例示意，自译与范文用词不同但意思、搭配都成立，不应仅因不一致改成错误；AI写得复杂但偏离中文任务，也不能作为升级素材。此为条件示意，不是真题。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，遮住范文，先译一个简化中文句；揭开后只圈自己缺失的素材，不把所有异写都改错。
