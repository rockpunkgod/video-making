method_id: A06
brand_name: 对照仿写
source_name: 富兰克林写作法（寒4五步）
aliases:
- 富兰克林写作法（寒4五步）
question_type: 应用文
method_type: framework
role: framework
primary_role: framework
secondary_roles: []
output_type: interpret
student_symptoms:
- 课后需积累准确可迁移表达
trigger_cues:
- 课后要独立调用表达，原中文与对照范文可用。
core_action: 中文必要时先简化，再独立英译、对照范文、记录并背诵缺失词或句式；第五步AI升级可选。
decision_rule: 产出自己的表达缺口与已核素材；准确异写可保留，AI建议须保原意且搭配成立。
verification: 产出自己的表达缺口与已核素材；准确异写可保留，AI建议须保原意且搭配成立。 范文或AI改变任务、意思或搭配未核就不背不抄；挖空法另列，不塞入寒4五步或改称六步。
stop_rule: 范文或AI改变任务、意思或搭配未核就不背不抄；挖空法另列，不塞入寒4五步或改称六步。
common_wrong_instinct: 先看范文再照写，觉得记住了却不能自己生成。
failure_cases:
- 先看范文再照写，觉得记住了却不能自己生成。
- 范文或AI改变任务、意思或搭配未核就不背不抄；挖空法另列，不塞入寒4五步或改称六步。
counterexamples:
- 自译与范文用词不同但意思、搭配都成立，不应仅因不一致改成错误；AI写得复杂但偏离中文任务，也不能作为升级素材。此为条件示意，不是真题。
transfer_pattern: 换范文仍先独立产出再对照，只记录已核准表达；仿写和挖空可另练，不改寒4五步定义。
memory_line: 先自己译，对照后记缺口；AI升级可选。
anti_rule: 看懂范文 ≠ 能独立复现。
visual_formula: '必要时简化中文 → 独立英译

  → 对照范文 → 记背缺失表达

  → 可选AI升级（核原义与搭配）

  挖空法：另列，不塞进五步'
challenge_prompt: 遮住范文，先译一个简化中文句；揭开后只圈自己缺失的素材，不把所有异写都改错。
