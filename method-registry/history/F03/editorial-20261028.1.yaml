levels:
  L1: 圈选项主语与指代对象，按实际主体分组，正文发生话题转换时重新核对
  L2: 按语法主语、核心话题、指代对象或祈使句省略行动者形成暂定字母组，再回正文确认当前对象；产物是优先候选，不是答案。
  L3: 同主角仍需比谁对什么做什么；正文话题切换要核当前候选，不重新机械三分。指代未还原、共享行动者但对象不同就停主体筛选。
  L4: 换题仍圈实际主体和核心话题，再核当前对象；不把代词字面相同当同指。
compact:
  line: 开头圈主体与指代并展示暂定字母组，回文确认当前主体对象，再在同组比完整动作及段落推进。
  boundary: 同主角但对象不同继续比；新证据改变话题或发现漏纳、指代初筛错误时更正，不重演分组；归属不明暂留。
  10s: 都说同一人却拿不准？先分主角，再核具体对象与动作；同主角不等于能填。
  30s: 都说同一人却拿不准？先圈选项在谈谁；含代词的先留待正文确认，不把语法主语当唯一话题。例如，省略的你都是父母，处理的却是不同问题。代词所指不明暂留；可更正初筛，不重复整套分组。
  90s: 都说同一人却拿不准？开头圈主体与指代并展示暂定字母组，回文确认当前主体对象，再在同组比完整动作及段落推进。这一步得到的只是缩小接下来要核的范围，不直接得答案。判断时，产出主体相关候选；宾语代词也可承接话题，共同主角只缩范围，不代替内容闭环。什么时候停，同主角但对象不同继续比；新证据改变话题或发现漏纳、指代初筛错误时更正，不重演分组；归属不明暂留。反例示意，两项祈使句共享省略行动者，却分别处理不同物件；不能因为主角相同就任填一项。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，不填空，只圈各选项的主角或指代对象，按主体落字母组；再说同组还差哪项内容证据。
full:
  summary: 开头圈主体与指代并展示暂定字母组，回文确认当前主体对象，再在同组比完整动作及段落推进。 产出主体相关候选；宾语代词也可承接话题，共同主角只缩范围，不代替内容闭环。
  source_boundary: 同主角但对象不同继续比；新证据改变话题或发现漏纳、指代初筛错误时更正，不重演分组；归属不明暂留。
  boundaries:
  - 同主角但对象不同继续比；新证据改变话题或发现漏纳、指代初筛错误时更正，不重演分组；归属不明暂留。
  - 两项祈使句共享省略行动者，却分别处理不同物件；不能因为主角相同就任填一项。
  section_ids:
  - 4b7e8e63d5d6c442
  beginner_support:
    first_micro_action: 先圈选项在谈谁；含代词的先留待正文确认，不把语法主语当唯一话题。
    prerequisite: 先分清一句是否说完整，再找句中实际谈谁。真谓语就是承担本句时间的动词；-ed或-ing词尾本身不能证明它是谓语。
    if_stuck: 先记录暂定分组或一侧真实内容；关系不清回正文或暂留，不靠占用、组小或剩余定案。
    example: 省略的你都是父母，处理的却是不同问题。
    example_scope: 关系/结构示意，非完整试题，不计真题或已验案例。
    micro_action_is_not_completion: 完成第一小步不等于完整方法成功；继续完成四步卡的判断与停止核验。
    short_stop: 代词所指不明暂留；可更正初筛，不重复整套分组。
