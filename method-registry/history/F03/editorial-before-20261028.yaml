method_id: F03
brand_name: 主角分组
source_name: 主语一致
aliases:
- 主语一致
question_type: 七选五
method_type: sub_action
role: reducer
primary_role: reducer
secondary_roles: []
output_type: reduce
student_symptoms:
- 选项谈论的主体或代词不同
trigger_cues:
- 候选的语法主语、核心话题、指代或祈使句行动者可形成相关组。
core_action: 开头圈主体与指代并展示暂定字母组，回文确认当前主体对象，再在同组比完整动作及段落推进。
decision_rule: 产出主体相关候选；宾语代词也可承接话题，共同主角只缩范围，不代替内容闭环。
verification: 产出主体相关候选；宾语代词也可承接话题，共同主角只缩范围，不代替内容闭环。 同主角但对象不同继续比；新证据改变话题或发现漏纳、指代初筛错误时更正，不重演分组；归属不明暂留。
stop_rule: 同主角但对象不同继续比；新证据改变话题或发现漏纳、指代初筛错误时更正，不重演分组；归属不明暂留。
common_wrong_instinct: 以为选项都说you就是一样的建议，忽略行动对象和段落推进。
failure_cases:
- 以为选项都说you就是一样的建议，忽略行动对象和段落推进。
- 同主角但对象不同继续比；新证据改变话题或发现漏纳、指代初筛错误时更正，不重演分组；归属不明暂留。
counterexamples:
- 两项祈使句共享省略行动者，却分别处理不同物件；不能因为主角相同就任填一项。
transfer_pattern: 换题仍圈实际主体和核心话题，再核当前对象；不把代词字面相同当同指。
memory_line: 开头圈主体与指代并展示暂定字母组，回文确认当前主体对象，再在同组比完整动作及段落推进。
anti_rule: 同主角 ≠ 同动作。
visual_formula: '选项主角/核心话题 → 字母组

  回正文：当前主角 + 对象

  → 优先候选（reduce）

  同组仍比动作与段落推进'
challenge_prompt: 不填空，只圈各选项的主角或指代对象，按主体落字母组；再说同组还差哪项内容证据。
