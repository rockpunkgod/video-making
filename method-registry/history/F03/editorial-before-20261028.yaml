levels:
  L1: 圈选项主语与指代对象，按实际主体分组，正文发生话题转换时重新核对
  L2: 按语法主语、核心话题、指代对象或祈使句省略行动者形成暂定字母组，再回正文确认当前对象；产物是优先候选，不是答案。
  L3: 同主角仍需比谁对什么做什么；正文话题切换要核当前候选，不重新机械三分。指代未还原、共享行动者但对象不同就停主体筛选。
  L4: 换题仍圈实际主体和核心话题，再核当前对象；不把代词字面相同当同指。
