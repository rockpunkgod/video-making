question_type: 七选五
method_type: verification_rule
role: verifier
primary_role: verifier
secondary_roles: []
output_type: verify
student_symptoms:
- 整篇初填后需要回查
trigger_cues:
- 整篇初填完成，需要回填并按课程排除项分析核对未选候选。
core_action: 逐空回填核对象、动作、两侧功能与段落任务，再核未选项的内容承接和断言范围，疑似对应已填位置则返回。
decision_rule: 产出已填关系的核验和待回查位置；不要求学生逐项重演全部分组与无关排除过程。
verification: 产出已填关系的核验和待回查位置；不要求学生逐项重演全部分组与无关排除过程。 内容仍多项成立或缺关键关系就暂留；占用与剩余不作本空依据，已证伪项不无据恢复。
stop_rule: 内容仍多项成立或缺关键关系就暂留；占用与剩余不作本空依据，已证伪项不无据恢复。
common_wrong_instinct: 初填完后只看选项是否各用一次，把剩下或被占用当作当前空的证明。
failure_cases:
- 初填完后只看选项是否各用一次，把剩下或被占用当作当前空的证明。
- 内容仍多项成立或缺关键关系就暂留；占用与剩余不作本空依据，已证伪项不无据恢复。
counterexamples:
- 某候选已填另一空，但那一空尚未独立闭合；不能用它已被占用来排除当前空，而应回查两个位置。
transfer_pattern: 新卷仍逐空证明内容闭合，再核未选项与已填位置，不迁移字母占用链。
memory_line: 逐空回填核对象、动作、两侧功能与段落任务，再核未选项的内容承接和断言范围，疑似对应已填位置则返回。
anti_rule: 已占用 ≠ 本空排除证据。
visual_formula: "逐空回填 → 两侧 + 段落任务\n未选项 → 可能对应哪个已填位置？\n          ↓ 返回重核\n核验闭合；仍竞争 →\
  \ 暂留"
challenge_prompt: 不换答案，任选一个已填空，标它两侧的决定性关系；再给一个未选项指出最可能回查的位置与缺口。
