levels:
  L1: 逐空回填，核主体、动作、对象、上下句关系及段落任务，不以占用或剩余定案
  L2: 将初填项逐空放回，核主体、动作、对象、两侧功能与段落任务，再查未选项是否可能对应已填位置；输出已填关系的核验，不由占用定案。
  L3: 当前空仍有多个内容成立项或关键关系缺失时停止确认并暂留；发现其他项可能对应已填空就返回该处重核，不能无据恢复已证伪项。
  L4: 新卷仍逐空证明内容闭合，再核未选项与已填位置，不迁移字母占用链。
compact:
  line: 逐空回填核对象、动作、两侧功能与段落任务，再核未选项的内容承接和断言范围，疑似对应已填位置则返回。
  boundary: 内容仍多项成立或缺关键关系就暂留；占用与剩余不作本空依据，已证伪项不无据恢复。
  10s: 填完仍不放心？逐空回填，再查未选项的内容；选项已用不证明当前位置错。
  30s: 填完仍不放心？先挑一处仍犹豫的已填空回填核内容，再完成其他空与未选项回查。例如，某项填在别处但那处尚未核实，仍要回查两个位置。内容仍多项成立就暂留，不能拿占用或剩余作证据。
  90s: 填完仍不放心？逐空回填核对象、动作、两侧功能与段落任务，再核未选项的内容承接和断言范围，疑似对应已填位置则返回。这一步得到的只是核验已有候选或稿件，不替代独立证据。判断时，产出已填关系的核验和待回查位置；不要求学生逐项重演全部分组与无关排除过程。什么时候停，内容仍多项成立或缺关键关系就暂留；占用与剩余不作本空依据，已证伪项不无据恢复。反例示意，某候选已填另一空，但那一空尚未独立闭合；不能用它已被占用来排除当前空，而应回查两个位置。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，不换答案，任选一个已填空，标它两侧的决定性关系；再给一个未选项指出最可能回查的位置与缺口。
full:
