levels:
  L1: 逐空回填，核主体、动作、对象、上下句关系及段落任务，不以占用或剩余定案
  L2: 将初填项逐空放回，核主体、动作、对象、两侧功能与段落任务，再查未选项是否可能对应已填位置；输出已填关系的核验，不由占用定案。
  L3: 当前空仍有多个内容成立项或关键关系缺失时停止确认并暂留；发现其他项可能对应已填空就返回该处重核，不能无据恢复已证伪项。
  L4: 新卷仍逐空证明内容闭合，再核未选项与已填位置，不迁移字母占用链。
