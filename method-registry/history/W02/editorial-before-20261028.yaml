method_id: W02
brand_name: 十句五锚
source_name: 十句五定法
aliases:
- 十句五定法
question_type: 读后续写
method_type: framework
role: framework
primary_role: framework
secondary_roles: []
output_type: interpret
student_symptoms:
- 需要搭两段功能提纲或诊断桥接
trigger_cues:
- 原文和两段开头语齐全；未动笔需要搭两段提纲，或已有自写内容需要查功能衔接。
core_action: 未动笔先在两段首句下列中文提纲，标接第一首句、必要段间桥、接第二首句、解决冲突、回应五处；已有稿则在现稿标这些功能。自写十句才对应1/5/6/9/10。
decision_rule: 产出五处功能提纲或现稿的功能缺口；逐处标原文或段首句依据，有依据保留，缺依据留待证；不按编号评分，不凭五格写满宣布故事成立。
verification: 逐处回原文和两首句核拟写或现有内容是否接续、解决核心冲突并回应关键线索；规划不是已完成作文，功能检查不是评分。
stop_rule: 缺原文或任一首句就停完整衔接判断；拟写无依据先留空。已有稿按真实位置核功能，不凑十句；已衔接不补可省过渡或重述第二首句，给定首句不必重抄，独立升华句非必需。
common_wrong_instinct: 只记十句模板，觉得第九句有结果就代表核心矛盾已经解决。
failure_cases:
- 只记十句模板，觉得第九句有结果就代表核心矛盾已经解决。
- 把拟写提纲当成学生已经写出的内容，据此虚构缺句、纠错或分数。
- 缺原文或任一首句就停完整衔接判断；拟写无依据先留空，现稿不凑十句，已衔接不强补桥或独立升华。
counterexamples:
- 十一句但桥接、解决、回应均成立，不因多一句扣分；第九句只交代次要事件而核心矛盾未解，不能按句位宣布完成。此为功能示意，不是真题。
transfer_pattern: 换剧情仍核五项功能，句数和具体动作随故事调整。
memory_line: 先锚五处，十句可选；提纲不等于成稿。
anti_rule: 十句齐 ≠ 功能齐。
visual_formula: '原文 + 两首句

  未写 → 中文提纲；已写 → 现稿位置

  接首句 / 必要桥 / 接第二首句 / 解决 / 回应

  采用十句 → 可映射1/5/6/9/10

  句数不同 → 仍查功能，不凑数

  无依据 → 留空；给定首句不必重抄'
challenge_prompt: 先不写全文，在实际提纲上标五个功能位置；若选十句框架，再对应1/5/6/9/10，指出哪座桥确实必要。
