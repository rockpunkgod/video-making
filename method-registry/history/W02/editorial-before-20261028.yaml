levels:
  L1: 未写先列中文提纲，已写标现稿五处功能；只在采用自写十句时对应1/5/6/9/10，不算给定首句。
  L2: 先核接句、必要段间桥、第二段接续、冲突解决、主题回应五处功能；只有选自写十句框架时才参考1/5/6/9/10，句数不同按实际功能映射，不以句数判分。
  L3: 给定首句不计学生十句，未抄首句正常；实际不是十句时按功能映射，不为凑数删合理内容。缺原文或首句不判完整衔接，独立升华句非必需。
  L4: 换剧情仍核五项功能，句数和具体动作随故事调整。
compact:
  line: 未写先列中文提纲，已写标现稿五处功能；自写十句才对应1/5/6/9/10。
  boundary: 缺原文或任一首句就停完整衔接判断；无依据先留空，不凑十句，不强补桥或独立升华，不要求重抄首句。
  10s: 原文、两首句齐却不会接？先列接句、必要桥、接续、结局、回应五格提纲；有据才填，无据先空。
  30s: 原文和两首句都有，却不知道两段怎么接？未写先列中文提纲，标接句、必要桥、接续、结局、回应五处，逐处找原文或首句依据。示意：第二首句已写推门，提纲已把人送到门前，就不另补到门口。缺材料或依据先停，不凑十句。
  90s: 原文和两段首句齐全，未动笔需要提纲或已有稿需要查衔接时，先锚五处。未写就在首句下列中文提纲，已写则标现稿实际位置：接第一首句、必要段间桥、接第二首句、解决原文核心冲突、回应关键线索。逐处圈原文或首句依据，有依据保留，缺依据留待证；产物只是功能提纲或功能缺口，不是完整作文或分数。缺原文或任一首句就停完整衔接判断。自写十句时才对应1/5/6/9/10，句数不同不凑数，给定首句不必重抄，已衔接不强补桥，独立升华句非必需。
    反例（边界示意，非真题）：十一句但桥接、解决、回应均成立，不因多一句扣分；第九句只交代次要事件而核心矛盾未解，不能按句位宣布完成。此为功能示意，不是真题。
    挑战：先不写全文，在实际提纲上标五个功能位置；若选十句框架，再对应1/5/6/9/10，指出哪座桥确实必要。
