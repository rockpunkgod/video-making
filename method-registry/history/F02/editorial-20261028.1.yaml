compact:
  10s: 句型像就想填？先按完整句、半句等分组；结构都能接就回正文比内容。
  30s: 句型像就想填？先圈一个候选的完整句式，给同式选项记字母，不填空。例如，两个都是祈使句，动作对象却不同。大小写仅辅助；同句型不证明内容接通。
  90s: 句型像就想填？一次圈出完整句/半句/疑问/祈使等真实结构并分组，再回正文核内容这一步得到的只是缩小接下来要核的范围，不直接得答案。判断时，按空位真实结构角色给选项字母归组：完整句、半句、小标题或其他实际句式；组只决定优先核谁，必须回正文核对象、动作与段落任务。什么时候停，没有可观察句型差异就标无区分度；两项结构都能接时停止结构筛选，不凭大小写、句首修饰或同句型定案。反例示意，两项都是祈使句，但对不同对象给出不同动作；结构相同不能区分本空内容。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，先不填空，只把A–G按真实完整句型归组并标字母；没区别的维度写无区分度。
