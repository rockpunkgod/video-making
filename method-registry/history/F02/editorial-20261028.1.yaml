core_action: 一次圈出完整句/半句/疑问/祈使等真实结构并分组，再回正文核内容
decision_rule: 按空位真实结构角色给选项字母归组：完整句、半句、小标题或其他实际句式；组只决定优先核谁，必须回正文核对象、动作与段落任务。
verification: 一次圈出完整句/半句/疑问/祈使等真实结构并分组，再回正文核内容。按空位真实结构角色给选项字母归组：完整句、半句、小标题或其他实际句式；组只决定优先核谁，必须回正文核对象、动作与段落任务。
  没有可观察句型差异就标无区分度；两项结构都能接时停止结构筛选，不凭大小写、句首修饰或同句型定案。
stop_rule: 没有可观察句型差异就标无区分度；两项结构都能接时停止结构筛选，不凭大小写、句首修饰或同句型定案。
common_wrong_instinct: 看到大写就当完整句，看到祈使形式或同句式就直接选。
failure_cases:
- 看到大写就当完整句，看到祈使形式或同句式就直接选。
- 没有可观察句型差异就标无区分度；两项结构都能接时停止结构筛选，不凭大小写、句首修饰或同句型定案。
counterexamples:
- 两项都是祈使句，但对不同对象给出不同动作；结构相同不能区分本空内容。
transfer_pattern: 陌生题仍按真实句式和空位角色分组，不沿用上题字母或大小写口诀。
memory_line: 一次圈出完整句/半句/疑问/祈使等真实结构并分组，再回正文核内容
anti_rule: 同句型 ≠ 同内容。
visual_formula: '空位结构角色 → 选项字母分组

  完整句 / 半句 / 小标题 / 实际句式

  → 优先候选（reduce）

  回正文核内容；无差异 → 停筛'
challenge_prompt: 先不填空，只把A–G按真实完整句型归组并标字母；没区别的维度写无区分度。
