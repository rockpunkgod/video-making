trigger_cues:
- 原文及两段首句齐备，需要按一个明确来源版本整理已知与未知情节槽。
core_action: 先注明版本：寒8板书P目的/T方式/S苦难/D结局；同课表格P需求/T方法/S困难/D结局；逐槽填首句已知与原文约束。
decision_rule: 产出该版本的已知/未知情节槽；寒14需求/波折/方案/结局及其分析表另留，旧高二PPT也不混用。
verification: 产出该版本的已知/未知情节槽；寒14需求/波折/方案/结局及其分析表另留，旧高二PPT也不混用。 未注明版本先停；未知槽留空，不凭口诀补事故或救场者；Needs/Difficulties/Solutions/Denouement不是PTSD英文展开。
stop_rule: 未注明版本先停；未知槽留空，不凭口诀补事故或救场者；Needs/Difficulties/Solutions/Denouement不是PTSD英文展开。
common_wrong_instinct: 四格写满就以为剧情有逻辑，困难和行动其实是互相编出来的。
failure_cases:
- 四格写满就以为剧情有逻辑，困难和行动其实是互相编出来的。
- 未注明版本先停；未知槽留空，不凭口诀补事故或救场者；Needs/Difficulties/Solutions/Denouement不是PTSD英文展开。
counterexamples:
- 把寒8的T方式与寒14的T波折当同一职责，或把分析表四个英文词当PTSD展开，都不能混用；填满也不证明情节有依据。
transfer_pattern: 换故事仍选清来源版本，再由新原文和两首句约束本版槽位，不迁移旧题困难或解决者。
memory_line: 先说用哪版，再填已知，未知先留空。
anti_rule: 格子满 ≠ 情节真。
visual_formula: '先选来源版本（不混定义）

  寒8板书：目的 | 方式 | 苦难 | 结局

  同课表格：需求 | 方法 | 困难 | 结局

  寒14、旧PPT：各自另列

  每格↔首句/原文；未知→留空'
challenge_prompt: 先注明一个来源版本，不写故事；逐槽标两首句已知与原文约束，未知处留空，并指出另一版哪两个槽不能混用。
