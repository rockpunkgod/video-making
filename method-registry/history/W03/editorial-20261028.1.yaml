cannot_replace:
- 完整题面验证
levels:
  L1: 只选需求→困难→行动→结局这一套四格，每格填原文约束，不混用另一版字母定义
  L2: 只用需求/目标—困难—行动/方法—结果四格，每格写本题具体内容并核原文与首句限制；空格暴露待补因果，不自动生成新困难。
  L3: 两版PTSD字母定义不可混用；缺原文约束先停，未铺垫的困难或解决者不能靠填表成立。结果应顺承故事，独立升华句不强制。
  L4: 换主人公仍用同一四格，具体目标和障碍由新文约束。
compact:
  line: 先注明版本：寒8板书P目的/T方式/S苦难/D结局；同课表格P需求/T方法/S困难/D结局；逐槽填首句已知与原文约束。
  boundary: 未注明版本先停；未知槽留空，不凭口诀补事故或救场者；Needs/Difficulties/Solutions/Denouement不是PTSD英文展开。
  10s: 剧情整理不清？按本次固定四格填已知、留未知；四格只是约束，不是现成故事。
  30s: 剧情整理不清？按教师为本次固定的目的、方式、困难、结局四格，先圈原文已经明示的一格，未知的留空。例如，原文说明想参加一项活动，没说明如何参加，目的格可填，方式格先留空。教师先定版本；无依据先空着，不凭口诀编事故。
  90s: 剧情整理不清？按教师为本次固定的目的、方式、困难、结局四格，先圈原文已经明示的一格，未知的留空。这一步得到的是一份待核的框架或计划，不是答案或分数。判断时，把原文或首句已经说明的目的、方式、困难、结局写进对应格；没说明的标未知，不把四格写满当成故事成立。什么时候停，本次用哪四格尚未给清就先确认；找不到依据先留空，不编事故或救场者。反例示意，为了把困难格填满而编一个事故，虽然格子齐了，却没有原文依据，不能据此推进故事。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，先不写故事。按本次已固定的四格，把两首句已知与原文约束填进去，未知处留空；给已填的一格指出原文依据。
