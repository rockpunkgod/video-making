    first_micro_action: 按教师为本次固定的目的、方式、困难、结局四格，先圈原文已经明示的一格，未知的留空。
    prerequisite: 先备齐原文与两段首句，分清原文已发生与自己准备写的内容；可以先用中文标功能，不急着写复杂英文。
    if_stuck: 先保留有依据的中文功能提纲或准确简单句；缺口留空，不能用事故、超能力或独立升华填补。
    example: 原文说明想参加一项活动，没说明如何参加，目的格可填，方式格先留空。
    example_scope: 关系/结构示意，非完整试题，不计真题或已验案例。
    micro_action_is_not_completion: 完成第一小步不等于完整方法成功；继续完成四步卡的判断与停止核验。
    short_stop: 教师先定版本；无依据先空着，不凭口诀编事故。
    legacy_entry_note: 教师层先固定寒8板书这一来源版本。其他PTSD版本仍留在完整源契约，不能混槽；学生不必先比较课次才能练本次动作。
