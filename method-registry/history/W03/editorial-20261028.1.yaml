      judge: 把原文或首句已经说明的目的、方式、困难、结局写进对应格；没说明的标未知，不把四格写满当成故事成立。
      stop: 本次用哪四格尚未给清就先确认；找不到依据先留空，不编事故或救场者。
    student_visual_formula: '本次四格：目的 | 方式 | 困难 | 结局

      原文/首句已说明 → 填入并标出处

      未说明 → 留空待证

      四格填满 ≠ 情节成立'
    student_counterexamples:
    - 为把困难格填满而编事故，四格虽然齐全，却没有原文依据，不能据此推进故事。
