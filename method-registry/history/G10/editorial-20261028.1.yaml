compact:
  10s: 形副和等级看乱？先圈修饰谁，再核真实比较；不按人或物机械选-ed/-ing。
  30s: 形副和等级看乱？先圈它修饰谁或作谁的表语，比较等级随后按实际证据核。例如，修饰名词也可能用另一个名词，不能一律改形容词。无等级差异不造比较级，状态与搭配不明先核。
