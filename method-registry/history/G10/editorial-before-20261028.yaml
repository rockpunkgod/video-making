    停止：修饰名词不能忽略名词作定语的分支；没有等级差异不强造比较级，-ing/-ed形容词须按对象和状态而非人/物标签机械分。 反例（关系示意，不是真题）：对象虽是事物也可能处于某种被动或感受状态；不能只按人/物标签选择-ed/-ing形容词。
