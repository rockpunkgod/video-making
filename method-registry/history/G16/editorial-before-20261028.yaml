core_action: 圈非谓语的逻辑主语，再核谁执行或承受动作，不只看最近名词
decision_rule: 先标非谓语作定语、状语还是宾补，再按本句成分圈所修饰名词、主句主体或前面宾语，核谁执行/承受动作；输出逻辑主语核验。
verification: 圈非谓语的逻辑主语，再核谁执行或承受动作，不只看最近名词。先标非谓语作定语、状语还是宾补，再按本句成分圈所修饰名词、主句主体或前面宾语，核谁执行/承受动作；输出逻辑主语核验。
  最近名词不独立证明动作主人；状语非谓语与主句主体不一致时停，检查是否有明确独立结构，不能补造未出现的主人。
stop_rule: 最近名词不独立证明动作主人；状语非谓语与主句主体不一致时停，检查是否有明确独立结构，不能补造未出现的主人。
