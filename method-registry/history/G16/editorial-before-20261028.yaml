  30s: 非谓语归属不明时，先标成分：定语回所修饰名词，状语回主句主体，宾补回前面宾语，再核主被动。结构示意：最近名词可能只是修饰枝叶。归属冲突就停查是否有独立结构，不能自己补主人。
