core_action: 圈非谓语的逻辑主语，再核谁执行或承受动作，不只看最近名词
decision_rule: 先标非谓语作定语、状语还是宾补，再按本句成分圈所修饰名词、主句主体或前面宾语，核谁执行/承受动作；输出逻辑主语核验。
verification: 圈非谓语的逻辑主语，再核谁执行或承受动作，不只看最近名词。先标非谓语作定语、状语还是宾补，再按本句成分圈所修饰名词、主句主体或前面宾语，核谁执行/承受动作；输出逻辑主语核验。
  最近名词不独立证明动作主人；状语非谓语与主句主体不一致时停，检查是否有明确独立结构，不能补造未出现的主人。
stop_rule: 最近名词不独立证明动作主人；状语非谓语与主句主体不一致时停，检查是否有明确独立结构，不能补造未出现的主人。
common_wrong_instinct: 把离非谓语最近的名词当主人，主动被动也跟着猜。
failure_cases:
- 把离非谓语最近的名词当主人，主动被动也跟着猜。
- 最近名词不独立证明动作主人；状语非谓语与主句主体不一致时停，检查是否有明确独立结构，不能补造未出现的主人。
counterexamples:
- 非谓语作状语，旁边的名词不是主句主体；不能仅按距离指定主人，必须回结构核归属。
transfer_pattern: 新句仍先判成分再配动作主人，不迁移最近对象或固定主语位置。
memory_line: 圈非谓语的逻辑主语，再核谁执行或承受动作，不只看最近名词
anti_rule: 最近名词 ≠ 动作主人。
visual_formula: '非谓语成分：定语 / 状语 / 宾补

  ↓ 所修饰名词 / 主句主体 / 前面宾语

  ↓ 谁执行？谁承受？

  → 动作主人核验（verify）

  归属不明 → 停'
challenge_prompt: 先不变非谓语，标它作何成分，圈逻辑主语并用箭头标谁执行或承受动作。
