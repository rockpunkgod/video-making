compact:
  10s: 动作主人找不准？先标非谓语作什么成分，再圈谁执行或承受；最近名词不是证明。
  30s: 动作主人找不准？先标非谓语修饰哪一成分，再圈对应动作主人，不只找最近名词。例如，作状语的非谓语，主人不一定是旁边修饰短语中的名词。归属冲突先查独立结构，不自己补一个主人。
  90s: 动作主人找不准？圈非谓语的逻辑主语，再核谁执行或承受动作，不只看最近名词这一步得到的只是核验已有候选或稿件，不替代独立证据。判断时，先标非谓语作定语、状语还是宾补，再按本句成分圈所修饰名词、主句主体或前面宾语，核谁执行/承受动作；输出逻辑主语核验。什么时候停，最近名词不独立证明动作主人；状语非谓语与主句主体不一致时停，检查是否有明确独立结构，不能补造未出现的主人。反例示意，非谓语作状语，旁边的名词不是主句主体；不能仅按距离指定主人，必须回结构核归属。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，先不变非谓语，标它作何成分，圈逻辑主语并用箭头标谁执行或承受动作。
