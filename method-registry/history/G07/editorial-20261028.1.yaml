compact:
  10s: 两句之间不会填？写两侧意思，再核关系、词类和标点；逗号不决定词。
  30s: 两句之间不会填？先确认两侧句子各自是否完整，再各写一句大意。例如，都译作转折，连接词与连接副词在句中功能仍不同。句子成分不完整先回从句判断，不能只凭中文转折选词。
  90s: 两句之间不会填？写两侧完整意思，标实际转折/因果/并列等关系，不由单个提示词定案这一步得到的只判断当前证据能支持或排除什么，不能由剩余项自动定案。判断时，写前后两个完整命题，标实际转折、补充或因果，再同时核连接功能、语法与标点；各项相符才确定逻辑词。什么时候停，标点或中文转折不能独立定词；句子成分未完整先回从句节点。However等功能须按本句说明，不能把所有逻辑词称为并列连词。反例示意，同样表达转折的候选在本句词类与连接功能不同；不能只看翻译同义忽略句法。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，先不填，写两侧各说什么，标实际关系，并说明空是句间衔接还是从句连接位置。
