core_action: 写两侧完整意思，标实际转折/因果/并列等关系，不由单个提示词定案
decision_rule: 写前后两个完整命题，标实际转折、补充或因果，再同时核连接功能、语法与标点；各项相符才确定逻辑词。
verification: 写两侧完整意思，标实际转折/因果/并列等关系，不由单个提示词定案。写前后两个完整命题，标实际转折、补充或因果，再同时核连接功能、语法与标点；各项相符才确定逻辑词。
  标点或中文转折不能独立定词；句子成分未完整先回从句节点。However等功能须按本句说明，不能把所有逻辑词称为并列连词。
stop_rule: 标点或中文转折不能独立定词；句子成分未完整先回从句节点。However等功能须按本句说明，不能把所有逻辑词称为并列连词。
common_wrong_instinct: 看见逗号或中文但是就直接写however，并把它叫连词。
failure_cases:
