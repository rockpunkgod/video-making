  beginner_support:
    first_micro_action: 先确认两侧句子各自是否完整，再各写一句大意。
    prerequisite: 先把空保留不填，圈本句动作和对应的人或物。主语是谁或什么，谓语是这句的完整动作或状态；分不清先核完整句。
    if_stuck: 先标有无提示和空位所在结构；成分/词义不清停在节点前，不从答案倒贴功能。
    example: 都译作转折，连接词与连接副词在句中功能仍不同。
    example_scope: 关系/结构示意，非完整试题，不计真题或已验案例。
    micro_action_is_not_completion: 完成第一小步不等于完整方法成功；继续完成四步卡的判断与停止核验。
    short_stop: 句子成分不完整先回从句判断，不能只凭中文转折选词。
