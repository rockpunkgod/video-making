memory_line: 写两侧完整意思，标实际转折/因果/并列等关系，不由单个提示词定案
anti_rule: 标点 ≠ 逻辑词答案。
visual_formula: '前句完整意思 ↔ 后句完整意思

  ↓ 实际关系 + 连接功能 + 标点

  → 逻辑词（decide）

  结构不全 → 返回从句节点'
challenge_prompt: 先不填，写两侧各说什么，标实际关系，并说明空是句间衔接还是从句连接位置。
