question_type: 读后续写
method_type: method
role: locator
primary_role: locator
secondary_roles: []
output_type: locate
student_symptoms:
- 两段开头语对人物或行动有约束
trigger_cues:
- 两段首句的状态、人物或任务留下需要回原文取证的缺口。
core_action: 圈首句已明示的人事物、状态、时地和任务，带状态变化的问题回原文，再标段间确有必要的过程。
decision_rule: 产出取证位置和待补缺口；核首句元素与续文的实际必要联系，不让每个人物或名词固定占一句。
verification: 产出取证位置和待补缺口；核首句元素与续文的实际必要联系，不让每个人物或名词固定占一句。 缺首句或前提不足停完整反推；可省过渡不强加，已衔接不重述下一段进行中事件，不凭名词补唯一剧情。
stop_rule: 缺首句或前提不足停完整反推；可省过渡不强加，已衔接不重述下一段进行中事件，不凭名词补唯一剧情。
common_wrong_instinct: 看见首句名词就想写到它，却没查这个人为什么会这样行动。
failure_cases:
- 看见首句名词就想写到它，却没查这个人为什么会这样行动。
- 缺首句或前提不足停完整反推；可省过渡不强加，已衔接不重述下一段进行中事件，不凭名词补唯一剧情。
counterexamples:
- 首句说人物已到场，只限制上一段须合理通往到场，不证明必须发生某次事故；重复提及名词也不等于相关任务已完成。此为条件示意，不是真题。
transfer_pattern: 换首句仍取人物任务约束并回文定位，桥接内容随新状态变。
memory_line: 圈首句已明示的人事物、状态、时地和任务，带状态变化的问题回原文，再标段间确有必要的过程。
anti_rule: 首句约束 ≠ 唯一剧情。
visual_formula: '两首句：人物 / 状态动作 / 任务

  ↓ 回原文找约束

  原文末尾 → 首句1 … 段末 → 首句2'
challenge_prompt: 先别编情节，只圈两首句名词和任务，再写第一段末必须达到的状态。
