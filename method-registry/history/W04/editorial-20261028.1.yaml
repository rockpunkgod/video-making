levels:
  L1: 圈开头语的名词和任务，回文找人物与矛盾，再反推段间需要补的动作
  L2: 圈两首句的名词、状态动作与任务，回原文找相应人物矛盾，再写原文末尾到第一首句、第一段末到第二首句的待补环节；产物是取证位置和缺口。
  L3: 首句只给约束，不证明唯一剧情；回文找不到任务前提或人物动机就暂留，不凭名词造事件。缺任一首句不能做完整段间反推。
  L4: 换首句仍取人物任务约束并回文定位，桥接内容随新状态变。
compact:
  line: 圈首句已明示的人事物、状态、时地和任务，带状态变化的问题回原文，再标段间确有必要的过程。
  boundary: 缺首句或前提不足停完整反推；可省过渡不强加，已衔接不重述下一段进行中事件，不凭名词补唯一剧情。
  10s: 第一段不知写到哪？圈第二首句的已知状态，回文找必要过程；缺口不等于随意编。
  30s: 第一段不知写到哪？先圈第二段首句已有状态，问第一段必须交代什么才能到这里。例如，第二首句人已到场，只限定此前需合理走到到场。能自然衔接就不强补过程，不让每个名词各占一句。
  90s: 第一段不知写到哪？圈首句已明示的人事物、状态、时地和任务，带状态变化的问题回原文，再标段间确有必要的过程。这一步得到的只是标出接下来要查的位置，不直接得答案。判断时，产出取证位置和待补缺口；核首句元素与续文的实际必要联系，不让每个人物或名词固定占一句。什么时候停，缺首句或前提不足停完整反推；可省过渡不强加，已衔接不重述下一段进行中事件，不凭名词补唯一剧情。反例示意，首句说人物已到场，只限制上一段须合理通往到场，不证明必须发生某次事故；重复提及名词也不等于相关任务已完成。此为条件示意，不是真题。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，先别编情节，只圈两首句名词和任务，再写第一段末必须达到的状态。
full:
  summary: 圈首句已明示的人事物、状态、时地和任务，带状态变化的问题回原文，再标段间确有必要的过程。 产出取证位置和待补缺口；核首句元素与续文的实际必要联系，不让每个人物或名词固定占一句。
  source_boundary: 缺首句或前提不足停完整反推；可省过渡不强加，已衔接不重述下一段进行中事件，不凭名词补唯一剧情。
  boundaries:
  - 缺首句或前提不足停完整反推；可省过渡不强加，已衔接不重述下一段进行中事件，不凭名词补唯一剧情。
  - 首句说人物已到场，只限制上一段须合理通往到场，不证明必须发生某次事故；重复提及名词也不等于相关任务已完成。此为条件示意，不是真题。
  section_ids:
  - 637ac5c60b37baf7
