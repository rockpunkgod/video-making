question_type: 完形填空
method_type: sub_action
role: locator
primary_role: locator
secondary_roles: []
output_type: locate
student_symptoms:
- 空内词的句法作用能指向线索类型
trigger_cues:
- 空内词的句法作用能指向当前需要的修饰或动作线索。
core_action: 标空内作用并圈实际修饰同一对象或动作的结构；动词空核谁做、指向谁及真实施受归属。
decision_rule: 只产出可查线索位置；同词性、形式或后缀不定答案，观察者感受不能移作人物行动。
verification: 只产出可查线索位置；同词性、形式或后缀不定答案，观察者感受不能移作人物行动。 修饰对象、逻辑主语或具体词义未确认先停该定位结论；不凭职业惯例、心理猜测补候选所需前提。
stop_rule: 修饰对象、逻辑主语或具体词义未确认先停该定位结论；不凭职业惯例、心理猜测补候选所需前提。
common_wrong_instinct: 选项都是形容词，就直接按褒贬挑一个，不找它实际描写的对象。
failure_cases:
- 选项都是形容词，就直接按褒贬挑一个，不找它实际描写的对象。
- 修饰对象、逻辑主语或具体词义未确认先停该定位结论；不凭职业惯例、心理猜测补候选所需前提。
counterexamples:
- 两个候选词性相同，却分别描述情感投入和客观状态；词性分类不能替代当前对象的具体语义。
transfer_pattern: 换句子仍先标作用和被修饰对象，再找相应证据，不迁移词尾或词性口诀。
memory_line: 标空内作用并圈实际修饰同一对象或动作的结构；动词空核谁做、指向谁及真实施受归属。
anti_rule: 词性相同 ≠ 语境词义相同。
visual_formula: '空内句法作用 → 查哪类提示？

  修饰对象/动作 ← 从句/非谓语/介词短语

  → 线索位置（locate）

  同词性不选答案'
challenge_prompt: 先不选，把空在句中修饰或支配的对象圈出来，再标一处修饰同一对象的潜在线索。
