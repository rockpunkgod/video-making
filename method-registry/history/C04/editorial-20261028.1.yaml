levels:
  L1: 标空内作用，再圈修饰同一对象或动作的结构，不凭词性定案
  L2: 先标空内词的句法作用，再圈修饰同一对象或动作的从句、非谓语或介词短语；产物是可查线索位置，同词性不筛出答案。
  L3: 只看词尾或词性仍无法确认所修饰对象时停止定位结论；动词空要另核谁做、指向谁、回应什么，不能把观察者感受当人物行动。
  L4: 换句子仍先标作用和被修饰对象，再找相应证据，不迁移词尾或词性口诀。
compact:
  line: 标空内作用并圈实际修饰同一对象或动作的结构；动词空核谁做、指向谁及真实施受归属。
  boundary: 修饰对象、逻辑主语或具体词义未确认先停该定位结论；不凭职业惯例、心理猜测补候选所需前提。
  10s: 不知找哪类提示？先看空修饰谁或谁在行动，再找同一对象的线索；词性不定答案。
  30s: 不知找哪类提示？先标空中词修饰哪个对象或承担哪个动作，再找相关提示。例如，同为形容词，一个写情感，一个写客观状态。修饰对象、动作归属或具体词义不明先停。
  90s: 不知找哪类提示？标空内作用并圈实际修饰同一对象或动作的结构；动词空核谁做、指向谁及真实施受归属。这一步得到的只是标出接下来要查的位置，不直接得答案。判断时，只产出可查线索位置；同词性、形式或后缀不定答案，观察者感受不能移作人物行动。什么时候停，修饰对象、逻辑主语或具体词义未确认先停该定位结论；不凭职业惯例、心理猜测补候选所需前提。反例示意，两个候选词性相同，却分别描述情感投入和客观状态；词性分类不能替代当前对象的具体语义。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，先不选，把空在句中修饰或支配的对象圈出来，再标一处修饰同一对象的潜在线索。
