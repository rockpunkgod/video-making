levels:
  L1: 圈题干有区分力的对象或标签，回文找对应句，再读完整断言
  L2: 候选位置必须对应题干对象与所问范围，读出完整断言；输出待核证据位置，不输出正确选项。
  L3: 同数字、同词或最近位置只提供入口；价格人数日期若为条件需另算或比较。区块不足则扩证，不能假设一题一段。
  L4: 新文章按所问对象选标签，不固化上一题的人名数字，也不限定为某一种文体。
compact:
  line: 圈实际题干所问对象和范围，以当前有区分力的专名、数字或其他标志标候选区域。
  boundary: 暑4版本前提不成立，不借一般定位放宽；标签无区分度或位置不闭合就换线索或扩证，不假设一题一段。
  10s: 找不到出处？圈题干对象与有区别的标志，只标待查位置；定位不是答案。
  30s: 找不到出处？先圈题干一个有区分度的对象标志；一般定位与暑4特定版本的条件分别核。例如，同一个数字出现在不同人的事件里，命中还要核对象。特定跳读版须满足自身前提，不把同词或一题一段当证据。
  90s: 找不到出处？圈实际题干所问对象和范围，以当前有区分力的专名、数字或其他标志标候选区域。这一步得到的只是标出接下来要查的位置，不直接得答案。判断时，产出待核位置；再交给完整对象、动作与限定核验，定位不报答案。什么时候停，暑4版本前提不成立，不借一般定位放宽；标签无区分度或位置不闭合就换线索或扩证，不假设一题一段。反例示意，题干与原文出现同一数字，但该数属于不同对象或时间；命中数字不能证明位置对应，更不能选。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，先不回答题目，只圈题干定位线索，标原文候选区域，再指出该处对应的是哪个对象。
full:
  summary: 圈实际题干所问对象和范围，以当前有区分力的专名、数字或其他标志标候选区域。 产出待核位置；再交给完整对象、动作与限定核验，定位不报答案。
  source_boundary: 暑4版本前提不成立，不借一般定位放宽；标签无区分度或位置不闭合就换线索或扩证，不假设一题一段。
  boundaries:
  - 暑4版本前提不成立，不借一般定位放宽；标签无区分度或位置不闭合就换线索或扩证，不假设一题一段。
  - 题干与原文出现同一数字，但该数属于不同对象或时间；命中数字不能证明位置对应，更不能选。
  section_ids:
  - 688367aeb67f68ad
  beginner_support:
    first_micro_action: 先圈题干一个有区分度的对象标志；一般定位与暑4特定版本的条件分别核。
    prerequisite: 先读清题干所问对象，能说明当前这句谁做什么；挡住判断的词不认识，先标出求助，不用词面相似代替句意。
    if_stuck: 先停在已确认的词句位置；读不清决定性词义或核心关系时标缺口，不排选项。
    example: 同一个数字出现在不同人的事件里，命中还要核对象。
    example_scope: 关系/结构示意，非完整试题，不计真题或已验案例。
    micro_action_is_not_completion: 完成第一小步不等于完整方法成功；继续完成四步卡的判断与停止核验。
    short_stop: 特定跳读版须满足自身前提，不把同词或一题一段当证据。
  presentation_revision: 2026-10-28.1
