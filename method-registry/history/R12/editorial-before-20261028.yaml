student_symptoms:
- 找不到与题干对象对应的证据句
trigger_cues:
- 需要由题面找对应段落、事件或信息区；暑4跳读版本还需主题明确且多个题目有主旨限定。
core_action: 圈实际题干所问对象和范围，以当前有区分力的专名、数字或其他标志标候选区域。
decision_rule: 产出待核位置；再交给完整对象、动作与限定核验，定位不报答案。
verification: 产出待核位置；再交给完整对象、动作与限定核验，定位不报答案。 暑4版本前提不成立，不借一般定位放宽；标签无区分度或位置不闭合就换线索或扩证，不假设一题一段。
stop_rule: 暑4版本前提不成立，不借一般定位放宽；标签无区分度或位置不闭合就换线索或扩证，不假设一题一段。
common_wrong_instinct: 找到同词或相同数字就报答案，把查到位置误认为结论已经成立。
failure_cases:
- 找到同词或相同数字就报答案，把查到位置误认为结论已经成立。
- 暑4版本前提不成立，不借一般定位放宽；标签无区分度或位置不闭合就换线索或扩证，不假设一题一段。
counterexamples:
- 题干与原文出现同一数字，但该数属于不同对象或时间；命中数字不能证明位置对应，更不能选。
transfer_pattern: 新文章按所问对象选标签，不固化上一题的人名数字，也不限定为某一种文体。
memory_line: 圈实际题干所问对象和范围，以当前有区分力的专名、数字或其他标志标候选区域。
anti_rule: 定位 ≠ 定案。
visual_formula: "题干：对象 + 所问范围\n        ↓ 有区分力标签\n原文对应区 → 完整断言\n产物：位置；不是答案"
challenge_prompt: 先不回答题目，只圈题干定位线索，标原文候选区域，再指出该处对应的是哪个对象。
