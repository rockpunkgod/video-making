decision_rule: 整篇完成后列每空实际考点，疑似重复只触发返回各空核独立句法、语义和搭配；输出复查信号，不推翻已充分支持的答案。
verification: 列每空实际考点，发现重复只触发回查，不能推翻该空独立句法语义证据。整篇完成后列每空实际考点，疑似重复只触发返回各空核独立句法、语义和搭配；输出复查信号，不推翻已充分支持的答案。
  一般不重复不是禁止重复；未核当前空独立证据前不得改词，不能为了凑分布把两个已成立结构拆成不同考点。
stop_rule: 一般不重复不是禁止重复；未核当前空独立证据前不得改词，不能为了凑分布把两个已成立结构拆成不同考点。
common_wrong_instinct: 认为某考点已经用过，所以另一空即使有证据也一定不能同考点。
failure_cases:
- 认为某考点已经用过，所以另一空即使有证据也一定不能同考点。
- 一般不重复不是禁止重复；未核当前空独立证据前不得改词，不能为了凑分布把两个已成立结构拆成不同考点。
counterexamples:
- 两个空的独立结构均支持相同考点；分布经验不能凭空否定其中一个。
transfer_pattern: 换语篇仍让分布提示服从每空独立证据，不迁移考点只能出现一次的约束。
memory_line: 列每空实际考点，发现重复只触发回查，不能推翻该空独立句法语义证据
anti_rule: 考点重复 ≠ 答案错误。
visual_formula: '全篇每空实际考点 → 有重复？

  有 → 返回各空核独立证据

  无 → 继续其他核验

  产物：复查信号（verify），不是改答案'
challenge_prompt: 不改任何词，只给全篇各空写实际考点，圈疑似重复，并指定要回查的独立结构证据。
