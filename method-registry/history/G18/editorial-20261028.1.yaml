compact:
  10s: 做完发现考点重复？只圈出并回查各空证据；一般不重复不等于禁止重复。
  30s: 做完发现考点重复？全篇完成后只圈疑似重复考点，返回本空查结构，不直接改词。例如，两个空都获独立结构支持，不能为凑分布改一个。重复只触发核验，不能推翻本句充分证据。
  90s: 做完发现考点重复？列每空实际考点，发现重复只触发回查，不能推翻该空独立句法语义证据这一步得到的只是核验已有候选或稿件，不替代独立证据。判断时，整篇完成后列每空实际考点，疑似重复只触发返回各空核独立句法、语义和搭配；输出复查信号，不推翻已充分支持的答案。什么时候停，一般不重复不是禁止重复；未核当前空独立证据前不得改词，不能为了凑分布把两个已成立结构拆成不同考点。反例示意，两个空的独立结构均支持相同考点；分布经验不能凭空否定其中一个。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，不改任何词，只给全篇各空写实际考点，圈疑似重复，并指定要回查的独立结构证据。
