levels:
  L1: 先圈限定和全部要点，搭文体骨架，再依原六步造句、组篇、升级和复核
  L2: 六步留下可见产物：限定/要点表→文体提纲→正确基础句→内容模块→有用的升级→要点和语言复核；未完成前项先补前项，不用模板替代任务。
  L3: 题目或交际对象不清先补信息；基础句或内容未成立时停止升级。模板不合语境不得照抄，完成六步不保证分数。
  L4: 换题材保留六个动作，提纲、内容与语气服从新题目的限定。
