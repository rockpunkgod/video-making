core_action: 圈题面限定与全部要点，搭合适文体骨架，写准确单句再按真实关系组篇、升级和复核。
decision_rule: 产出有要点和复核记录的成稿计划；六步是通用梳理框架，不冒充独立课程原名算法。
verification: 产出有要点和复核记录的成稿计划；六步是通用梳理框架，不冒充独立课程原名算法。 题目或对象不清先补材料；基础内容未成立先修，不照抄不合语境模板，不保证分数。
stop_rule: 题目或对象不清先补材料；基础内容未成立先修，不照抄不合语境模板，不保证分数。
common_wrong_instinct: 背好模板就直接填词，不核题目身份、要点和目的。
failure_cases:
- 背好模板就直接填词，不核题目身份、要点和目的。
- 题目或对象不清先补材料；基础内容未成立先修，不照抄不合语境模板，不保证分数。
counterexamples:
- 模板有邀请结束语而题目要求感谢，句型再熟也不应照搬；正确简单句已达意时不必强塞复杂结构。此为条件示意，不是真题。
transfer_pattern: 换题材保留六个动作，提纲、内容与语气服从新题目的限定。
