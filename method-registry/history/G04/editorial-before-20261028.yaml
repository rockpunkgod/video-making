core_action: 标空位作主语/宾语/限定/反身功能，回指实际对象再用节点规则
decision_rule: 先还原所指，再标空作主语、宾语、限定、独立名词成分或反身功能，核人称数格与实际搭配；缺成分和所指均闭合才定形式。
verification: 标空位作主语/宾语/限定/反身功能，回指实际对象再用节点规则。先还原所指，再标空作主语、宾语、限定、独立名词成分或反身功能，核人称数格与实际搭配；缺成分和所指均闭合才定形式。
  代词所指或省略内容不清先停回指；介词后不必然宾格，it可能是形式主/宾语，反身需动作回到主体或具体结构支持。
stop_rule: 代词所指或省略内容不清先停回指；介词后不必然宾格，it可能是形式主/宾语，反身需动作回到主体或具体结构支持。
common_wrong_instinct: 介词后一律填宾格，看见重复代词就改反身，空后名词被省略也没看出来。
failure_cases:
- 介词后一律填宾格，看见重复代词就改反身，空后名词被省略也没看出来。
- 代词所指或省略内容不清先停回指；介词后不必然宾格，it可能是形式主/宾语，反身需动作回到主体或具体结构支持。
counterexamples:
- 课程in ___ (I)省略memory，需要独立物主mine；不能只因in就在该处填me。
transfer_pattern: 新句仍回指并确认成分和省略，不迁移介词对应某格的固定口令。
memory_line: 标空位作主语/宾语/限定/反身功能，回指实际对象再用节点规则
anti_rule: 介词后 ≠ 一律宾格。
visual_formula: '所指 → 空位功能

  名词前所属 / 独立名词成分 / 宾语 / 反身

  ↓ 人称 + 数 + 格 + 省略/搭配

  → 代词形式（decide）'
challenge_prompt: 先不变提示代词，只圈所指对象，标空后有没有名词及是否存在省略，再写空位功能。
