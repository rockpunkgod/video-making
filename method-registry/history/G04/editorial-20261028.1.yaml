compact:
  10s: 代词怎么变？先找指谁，再标这个位置的作用；介词后不一律宾格。
  30s: 代词怎么变？先圈代词实际指谁或什么，再看这个位置要它承担什么成分。例如，名词省略时可能需要独立物主形式，不能只按前面的介词选。所指或省略不清就停，形式it不硬找实体所指。
  90s: 代词怎么变？标空位作主语/宾语/限定/反身功能，回指实际对象再用节点规则这一步得到的只判断当前证据能支持或排除什么，不能由剩余项自动定案。判断时，先还原所指，再标空作主语、宾语、限定、独立名词成分或反身功能，核人称数格与实际搭配；缺成分和所指均闭合才定形式。什么时候停，代词所指或省略内容不清先停回指；介词后不必然宾格，it可能是形式主/宾语，反身需动作回到主体或具体结构支持。反例示意，课程in
    ___ (I)省略memory，需要独立物主mine；不能只因in就在该处填me。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，先不变提示代词，只圈所指对象，标空后有没有名词及是否存在省略，再写空位功能。
