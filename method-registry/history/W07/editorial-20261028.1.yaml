method_id: W07
brand_name: 伏笔回扣
source_name: 五档升级路径（训练用）
aliases:
- 五档升级路径（训练用）
question_type: 读后续写
method_type: sub_action
role: verifier
primary_role: verifier
secondary_roles: []
output_type: verify
student_symptoms:
- 人物行为或物件需要兑现原文线索
trigger_cues:
- 拟写关键行为或结果需要核是否回应原文的重要线索。
core_action: 将关键行为、物件结果与原文重要伏笔连线，写清动机、用途或后果，标未兑现的重要联系。
decision_rule: 产出伏笔回应核验；按当前故事与两首句选择必要元素，不要求每个物件都出现。
verification: 产出伏笔回应核验；按当前故事与两首句选择必要元素，不要求每个物件都出现。 只有同词而无真实联系就停确认；不为了兑现添无铺垫能力、事故或人物，缺原文不证明回扣。
stop_rule: 只有同词而无真实联系就停确认；不为了兑现添无铺垫能力、事故或人物，缺原文不证明回扣。
common_wrong_instinct: 复用原文一个名词就觉得已经呼应，行为和伏笔的作用其实没接上。
failure_cases:
- 复用原文一个名词就觉得已经呼应，行为和伏笔的作用其实没接上。
- 只有同词而无真实联系就停确认；不为了兑现添无铺垫能力、事故或人物，缺原文不证明回扣。
counterexamples:
- 原文物件在结尾再次提名却没影响行动或结果，不等于用途兑现；无关背景描写也不应强塞进主线。此为关系示意，不是真题。
transfer_pattern: 换原文仍逐对核关键线索和结果的实际作用。
memory_line: 将关键行为、物件结果与原文重要伏笔连线，写清动机、用途或后果，标未兑现的重要联系。
anti_rule: 同物出现 ≠ 伏笔兑现。
visual_formula: '原文关键伏笔 ↔ 行为 / 物件结果

  核动机 / 用途 / 后果

  只有同词 → 仍待核'
challenge_prompt: 不改全文，只给一个关键行为连到原文伏笔，说明这条线索怎样影响动作或结果。
