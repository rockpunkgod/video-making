cannot_replace:
- 完整题面验证
levels:
  L1: 把关键行为与原文伏笔逐对连线，找悬空线索，不强行用无关细节
  L2: 把拟写的关键行为/物件结果与原文伏笔逐对连线，说明对应动机、用途或后果；悬空的重要线索标待兑现，无关细节不强塞。
  L3: 对应只找到同词却说不清因果或用途时停止核验；不能为了兑现添加无铺垫能力或事件。缺原文无法证明回扣。
  L4: 换原文仍逐对核关键线索和结果的实际作用。
compact:
  line: 将关键行为、物件结果与原文重要伏笔连线，写清动机、用途或后果，标未兑现的重要联系。
  boundary: 只有同词而无真实联系就停确认；不为了兑现添无铺垫能力、事故或人物，缺原文不证明回扣。
  10s: 想让前后呼应？把关键行为连回一条原文线索，说明作用；重复同词不算回扣。
  30s: 想让前后呼应？先圈续写中一项关键行动，连到原文一条真正支持它的线索。例如，物件结尾再出现，却没影响行为或结果，不等于兑现用途。不用每个物件，不为回扣添无据能力或人物。
  90s: 想让前后呼应？将关键行为、物件结果与原文重要伏笔连线，写清动机、用途或后果，标未兑现的重要联系。这一步得到的只是核验已有候选或稿件，不替代独立证据。判断时，产出伏笔回应核验；按当前故事与两首句选择必要元素，不要求每个物件都出现。什么时候停，只有同词而无真实联系就停确认；不为了兑现添无铺垫能力、事故或人物，缺原文不证明回扣。反例示意，原文物件在结尾再次提名却没影响行动或结果，不等于用途兑现；无关背景描写也不应强塞进主线。此为关系示意，不是真题。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，不改全文，只给一个关键行为连到原文伏笔，说明这条线索怎样影响动作或结果。
full:
  summary: 将关键行为、物件结果与原文重要伏笔连线，写清动机、用途或后果，标未兑现的重要联系。 产出伏笔回应核验；按当前故事与两首句选择必要元素，不要求每个物件都出现。
  source_boundary: 只有同词而无真实联系就停确认；不为了兑现添无铺垫能力、事故或人物，缺原文不证明回扣。
  boundaries:
  - 只有同词而无真实联系就停确认；不为了兑现添无铺垫能力、事故或人物，缺原文不证明回扣。
  - 原文物件在结尾再次提名却没影响行动或结果，不等于用途兑现；无关背景描写也不应强塞进主线。此为关系示意，不是真题。
  section_ids:
  - 0601c0f1de7a4b8f
  - 6570e8d5c4fff00d
  - a9f982dcfec817d9
  beginner_support:
    first_micro_action: 先圈续写中一项关键行动，连到原文一条真正支持它的线索。
    prerequisite: 先备齐原文与两段首句，分清原文已发生与自己准备写的内容；可以先用中文标功能，不急着写复杂英文。
    if_stuck: 先保留有依据的中文功能提纲或准确简单句；缺口留空，不能用事故、超能力或独立升华填补。
    example: 物件结尾再出现，却没影响行为或结果，不等于兑现用途。
    example_scope: 关系/结构示意，非完整试题，不计真题或已验案例。
    micro_action_is_not_completion: 完成第一小步不等于完整方法成功；继续完成四步卡的判断与停止核验。
    short_stop: 不用每个物件，不为回扣添无据能力或人物。
  presentation_revision: 2026-10-28.1
