levels:
  L1: 把关键行为与原文伏笔逐对连线，找悬空线索，不强行用无关细节
  L2: 把拟写的关键行为/物件结果与原文伏笔逐对连线，说明对应动机、用途或后果；悬空的重要线索标待兑现，无关细节不强塞。
  L3: 对应只找到同词却说不清因果或用途时停止核验；不能为了兑现添加无铺垫能力或事件。缺原文无法证明回扣。
  L4: 换原文仍逐对核关键线索和结果的实际作用。
