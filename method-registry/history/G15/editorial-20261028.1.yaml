compact:
  10s: 非谓语只会猜词尾？依次核作用、谁做和相对时间；逗号不决定doing。
  30s: 非谓语只会猜词尾？确认非谓语后，先标它在本句的作用或已知固定结构，另外两轴随后核。随后核逻辑主语与主被动，再以谓语为参照核先后；三轴不省略。例如，有逗号仍可能需不同非谓语形式，要核句法和主被动。一轴不明先停，相对时间不套绝对现在或过去。
  90s: 非谓语只会猜词尾？标句法作用、逻辑主语与动作的主被动、同谓语的先后关系，再选择形式这一步得到的只判断当前证据能支持或排除什么，不能由剩余项自动定案。判断时，非谓语位置先定作用或固定结构，再核逻辑主语与主被动，最后以本句谓语为参照核先后；三轴互相支持后选合法形式并回填。什么时候停，介词、逗号或一个词尾不能替三轴；逻辑主语或搭配不明就停。形式表示相对关系，不套绝对现在/过去，也不将课程简化清单当无条件判据。反例示意，有逗号仍须核主被动与句法作用；只凭逗号无法决定doing、done或目的不定式路线。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，先不选形式，给空写三栏：句法作用、谁发出/承受动作、相对谓语的时间；缺哪栏就标缺口。
