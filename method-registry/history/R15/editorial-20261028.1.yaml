levels:
  L1: 圈题干动词，配回主体和对象，与定位句的完整谓语比较
  L2: 题干动词必须与原文同一主体、对象、状态阶段及完整谓语对应；输出动作关系，仍需核限定与整项回答。
  L3: 只命中动词而主体或对象不同，或动作词义尚不明时停止关系等同；定位句缺原因指代时转补证。
  L4: 更换材料仍将动词配回主体、对象和阶段，不迁移上题动词含义。
compact:
  line: 圈题干动词及对应主体对象，并排配回定位句的完整谓语，保留否定、阶段、范围和条件。
  boundary: 主体、对象或动词含义未确认不判等同；缺指代、因果或阶段联系就补必要上下文，不把一致当整项正解。
  10s: 动词一样却选不准？并排核谁对谁做什么，保留否定和条件；同动作词不等于同关系。
  30s: 动词一样却选不准？先把题干完整动作和原文动作并排写，连谁做、对谁做一起保留。例如，都写帮助，但帮助者与被帮助者可能互换。主体、对象或动作义不明先补证，关系一致不代表整项正确。
  90s: 动词一样却选不准？圈题干动词及对应主体对象，并排配回定位句的完整谓语，保留否定、阶段、范围和条件。这一步得到的是把当前关系或表达解释清楚，还要核完整题目。判断时，只产出对象—动作关系解释；动作词相同仍须核施受和限制，动词定逻辑不与顺藤摸瓜合并。什么时候停，主体、对象或动词含义未确认不判等同；缺指代、因果或阶段联系就补必要上下文，不把一致当整项正解。反例示意，原文和候选动词相同，动作发出者与承受者却互换；不能因为动词一致就判关系等同。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，先不选，把题干和定位句各写成谁—完整动作—对谁，圈出角色或阶段差异。
