trigger_cues:
- 同一对象对应多个动作或关系，需要核题干所问究竟是哪一项。
core_action: 圈题干动词及对应主体对象，并排配回定位句的完整谓语，保留否定、阶段、范围和条件。
decision_rule: 只产出对象—动作关系解释；动作词相同仍须核施受和限制，动词定逻辑不与顺藤摸瓜合并。
verification: 只产出对象—动作关系解释；动作词相同仍须核施受和限制，动词定逻辑不与顺藤摸瓜合并。 主体、对象或动词含义未确认不判等同；缺指代、因果或阶段联系就补必要上下文，不把一致当整项正解。
stop_rule: 主体、对象或动词含义未确认不判等同；缺指代、因果或阶段联系就补必要上下文，不把一致当整项正解。
common_wrong_instinct: 同名对象找到了，就不再核做了什么；或看见相同动词又忽略动作指向谁。
failure_cases:
- 同名对象找到了，就不再核做了什么；或看见相同动词又忽略动作指向谁。
- 主体、对象或动词含义未确认不判等同；缺指代、因果或阶段联系就补必要上下文，不把一致当整项正解。
counterexamples:
- 原文和候选动词相同，动作发出者与承受者却互换；不能因为动词一致就判关系等同。
transfer_pattern: 更换材料仍将动词配回主体、对象和阶段，不迁移上题动词含义。
memory_line: 圈题干动词及对应主体对象，并排配回定位句的完整谓语，保留否定、阶段、范围和条件。
anti_rule: 同动词 ≠ 同关系。
visual_formula: "题干：谁 → 完整动作 → 对谁\n原文：谁 → 完整动作 → 对谁\n      + 阶段/限定\n逐槽比较 → 动作关系"
challenge_prompt: 先不选，把题干和定位句各写成谁—完整动作—对谁，圈出角色或阶段差异。
