levels:
  L1: 识别明显的动作发出者和承受者。
  L2: 区分愿望与已发生事实。
  L3: 区分能力、意愿、看法和实际结果。
  L4: 处理省略主体、代词、被动和多参与者的间接关系。
compact:
  line: 并排圈主体与完整谓语；按本题差异核谁对谁做什么，或希望/事实、能力/意愿，不强制三格串行。
  boundary: 没有可比差异就不用；题干已明示共同对象时不因候选省略主体排除，不能据剩余项定案。
  10s: 词都认识还分不清？圈谁和完整动作，只核本题换了哪处；一致不等于答案。
  30s: 词都认识还分不清？先并排圈两句的谁和完整动作，连希望、能够、已经一起圈，暂不要求画三格。例如，希望帮助不等于已经帮助，要把希望一起圈。无偷换停本法；共同主体省略不算偷换。
  90s: 词都认识还分不清？并排圈主体与完整谓语；按本题差异核谁对谁做什么，或希望/事实、能力/意愿，不强制三格串行。这一步得到的只判断当前证据能支持或排除什么，不能由剩余项自动定案。判断时，只有确认主体、施受或谓语状态被无依据偷换才排除；一致只通过这一核查。什么时候停，没有可比差异就不用；题干已明示共同对象时不因候选省略主体排除，不能据剩余项定案。反例示意，主体未在候选里重复，但题干已明示共同对象；不能仅因候选没重复主体就判错。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，先不选，指出本题是主体、施受、愿望/事实还是能力/意愿差异，再圈具体被换的一处。
full:
  summary: 并排圈主体与完整谓语；按本题差异核谁对谁做什么，或希望/事实、能力/意愿，不强制三格串行。 只有确认主体、施受或谓语状态被无依据偷换才排除；一致只通过这一核查。
  source_boundary: 没有可比差异就不用；题干已明示共同对象时不因候选省略主体排除，不能据剩余项定案。
  boundaries:
