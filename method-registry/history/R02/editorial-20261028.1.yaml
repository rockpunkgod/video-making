method_id: R02
brand_name: 谁干的陷阱
source_name: 主客一致
aliases:
- 三槽位核对
- 谁做什么对谁
question_type: 阅读理解
role: decider
primary_role: decider
secondary_roles: []
output_type: decide
student_symptoms:
- 原文和选项关键词一样，但关系总判错。
- 容易把愿望当事实、把能力当意愿，或把动作发出者和承受者调换。
trigger_cues:
- 原文和候选在主体、施受、愿望/事实或能力/意愿上有可比差异。
core_action: 并排圈主体与完整谓语；按本题差异核谁对谁做什么，或希望/事实、能力/意愿，不强制三格串行。
decision_rule: 只有确认主体、施受或谓语状态被无依据偷换才排除；一致只通过这一核查。
verification: 只有确认主体、施受或谓语状态被无依据偷换才排除；一致只通过这一核查。 没有可比差异就不用；题干已明示共同对象时不因候选省略主体排除，不能据剩余项定案。
stop_rule: 没有可比差异就不用；题干已明示共同对象时不因候选省略主体排除，不能据剩余项定案。
common_wrong_instinct: 只看人名和动词出现过，不核谁发出、谁承受以及动作是否已发生。
failure_cases:
- 只看人名和动词出现过，不核谁发出、谁承受以及动作是否已发生。
- 没有可比差异就不用；题干已明示共同对象时不因候选省略主体排除，不能据剩余项定案。
counterexamples:
- 主体未在候选里重复，但题干已明示共同对象；不能仅因候选没重复主体就判错。
- 原文确实说某主体具有能力且表达意愿，两者同时成立，不得为了应用方法强行二分。
transfer_pattern: 适用于人物观点、机构措施、研究发现、主动/被动和多参与者事件。
memory_line: 圈谁与完整谓语，只核当前偷换处。
anti_rule: 同词 ≠ 同关系。
visual_formula: '原文 ↔ 候选：主体 + 完整谓语

  只核本题差异

  谁→动作→谁 / 希望≠事实 / 能力≠意愿

  证实偷换→排；一致→仅过本项'
challenge_prompt: 先不选，指出本题是主体、施受、愿望/事实还是能力/意愿差异，再圈具体被换的一处。
