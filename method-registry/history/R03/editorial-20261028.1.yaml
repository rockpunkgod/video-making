cannot_replace:
- 完整题面验证
levels:
  L1: 并排圈出原文与选项的对象、动作和限定词，逐格核语义是否相同
  L2: 逐格核同一对象、完整动作、否定、条件及范围是否等值；只得到语义对应关系，不能以同词或近义词直接选。
  L3: 词义不能确认、对象不同或定位句不足以闭合时停止替换，向必要上下文求证；对应词数量不证明答案。
  L4: 换成新题材也核同一对象、完整动作和限定，不沿用上一题词对。
compact:
  line: 先圈所问对象、动作与限制定位段落，再用有区分度的候选名词或动作找句；并排核完整动词关系与形副范围。
  boundary: 仅结构相似不启动；同词、近义词命中不直接选；词义或所在句不闭合就补必要上下文，保留否定条件。
  10s: 换了词就认不出？并排核同一对象与完整意思；同词或近义命中还不能选。
  30s: 换了词就认不出？先把候选中一个有区别的表达和原文对应表达并排抄下，保留否定。例如，都是支持，一个指能力，一个指意愿，意思仍不同。词义或条件不清先补证，不凭对应词数量定案。
  90s: 换了词就认不出？先圈所问对象、动作与限制定位段落，再用有区分度的候选名词或动作找句；并排核完整动词关系与形副范围。这一步得到的是把当前关系或表达解释清楚，还要核完整题目。判断时，产出能否等值替换的语义核对；共同对象已明示时直接比完整判断，不按对应词数量定案。什么时候停，仅结构相似不启动；同词、近义词命中不直接选；词义或所在句不闭合就补必要上下文，保留否定条件。反例示意，两句用了同根词，但一处是能力、一处是意愿；词形相近不支持完整断言等值。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，先别选，只并排写出原文和候选的对象、完整动作、否定或范围，圈出不等值的一格。
full:
  summary: 先圈所问对象、动作与限制定位段落，再用有区分度的候选名词或动作找句；并排核完整动词关系与形副范围。 产出能否等值替换的语义核对；共同对象已明示时直接比完整判断，不按对应词数量定案。
  source_boundary: 仅结构相似不启动；同词、近义词命中不直接选；词义或所在句不闭合就补必要上下文，保留否定条件。
  boundaries:
  - 仅结构相似不启动；同词、近义词命中不直接选；词义或所在句不闭合就补必要上下文，保留否定条件。
  - 两句用了同根词，但一处是能力、一处是意愿；词形相近不支持完整断言等值。
  section_ids:
  - b1e4f5435d11268b
  beginner_support:
    first_micro_action: 先把候选中一个有区别的表达和原文对应表达并排抄下，保留否定。
    prerequisite: 先读清题干所问对象，能说明当前这句谁做什么；挡住判断的词不认识，先标出求助，不用词面相似代替句意。
    if_stuck: 先停在已确认的词句位置；读不清决定性词义或核心关系时标缺口，不排选项。
    example: 都是支持，一个指能力，一个指意愿，意思仍不同。
    example_scope: 关系/结构示意，非完整试题，不计真题或已验案例。
    micro_action_is_not_completion: 完成第一小步不等于完整方法成功；继续完成四步卡的判断与停止核验。
    short_stop: 词义或条件不清先补证，不凭对应词数量定案。
