method_id: R03
brand_name: 换词不换义
source_name: 同源替换
aliases:
- 同源替换
question_type: 阅读理解
method_type: method
role: interpreter
primary_role: interpreter
secondary_roles: []
output_type: interpret
student_symptoms:
- 选项换了表达，需要核同一断言
trigger_cues:
- 题干、候选与原文有可核同义、反义或同根表达，需要核同一断言。
core_action: 先圈所问对象、动作与限制定位段落，再用有区分度的候选名词或动作找句；并排核完整动词关系与形副范围。
decision_rule: 产出能否等值替换的语义核对；共同对象已明示时直接比完整判断，不按对应词数量定案。
verification: 产出能否等值替换的语义核对；共同对象已明示时直接比完整判断，不按对应词数量定案。 仅结构相似不启动；同词、近义词命中不直接选；词义或所在句不闭合就补必要上下文，保留否定条件。
stop_rule: 仅结构相似不启动；同词、近义词命中不直接选；词义或所在句不闭合就补必要上下文，保留否定条件。
common_wrong_instinct: 看到几个相同词或近义词，就跳过动作和限定，直接认为整项相同。
failure_cases:
- 看到几个相同词或近义词，就跳过动作和限定，直接认为整项相同。
- 仅结构相似不启动；同词、近义词命中不直接选；词义或所在句不闭合就补必要上下文，保留否定条件。
counterexamples:
- 两句用了同根词，但一处是能力、一处是意愿；词形相近不支持完整断言等值。
transfer_pattern: 换成新题材也核同一对象、完整动作和限定，不沿用上一题词对。
memory_line: 先圈所问对象、动作与限制定位段落，再用有区分度的候选名词或动作找句；并排核完整动词关系与形副范围。
anti_rule: 换词 ≠ 换成正确答案。
visual_formula: '原文：[对象｜完整动作｜限定]

  候选：[对象｜完整动作｜限定]

  逐格对齐 → 语义对应（不是答案）'
challenge_prompt: 先别选，只并排写出原文和候选的对象、完整动作、否定或范围，圈出不等值的一格。
