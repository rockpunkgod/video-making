  ↓ 主被动关系

  ↓ 复合时态的参照点

  + 真主语的数

  → 谓语形式；参照不明 → 停'
challenge_prompt: 先不变动词，只圈时间线索、主语和动作关系，再写复合时态的参照事件；没有参照就标缺口。
