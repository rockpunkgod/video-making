compact:
  10s: 谓语形式犹豫？核时间、主被动与参照，再查真主语；时间词不独立定案。
  30s: 谓语形式犹豫？确认谓语后，先圈明确时间和事件参照；语态、一致随后核，三项不省。例如，since或by只提供线索，仍须核事件参照和真实语态。角色或时间参照不明先停，不用有be无be口诀选形。
  90s: 谓语形式犹豫？圈明确时间、上下文事件先后和句内语态，再与真主语核数这一步得到的只判断当前证据能支持或排除什么，不能由剩余项自动定案。判断时，谓语位置按课程时态判定三步法核时间线索、主被动、复合时态参照，并与真正主语核数；时间、语态和一致共同支持后定谓语形式。什么时候停，单个since/by等只提示，不免上下文参照核对；主语角色、状态性分词或时间参照不明就停，不执行有be/无be快速二分口诀。反例示意，过去分词可表示状态，看到be不能跳过句法作用与动作关系，直接按一次被动动作解释。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，先不变动词，只圈时间线索、主语和动作关系，再写复合时态的参照事件；没有参照就标缺口。
