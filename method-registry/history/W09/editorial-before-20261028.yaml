levels:
  L1: 在推进主线的位置选动作、神态、环境中有用的细节，不每句堆三类
  L2: 在推动主线的动作旁选有用的动作、神态或环境细节，注明它显示何种状态或影响哪一步；每段选择少量有效位置，不要求每句三类齐备。
  L3: 人物因果或衔接未成立先修框架；细节只为凑字数且不服务主线时停止添加。采用26S春人与自然万能句式时另遵非功能位限制，环境模板不放结尾，不能泛化成所有描写的绝对位置规则。
  L4: 新故事仍先找动作旁的有效位置，细节必须服务新场景与状态。
