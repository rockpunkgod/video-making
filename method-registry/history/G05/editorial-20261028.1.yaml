compact:
  10s: 介词总凭感觉？圈动作和后面中心词，核搭配与关系；未知搭配先停。
  30s: 介词总凭感觉？先圈空后中心内容及支配它的动作；搭配不认识就标未知。例如，增加了多少与增加到多少，关系不同，by和to不能混用。对象多不自动among，中文意思不能唯一决定介词。
  90s: 介词总凭感觉？圈介词后的中心词及所属动作，核场景关系或固定搭配，陌生搭配不猜这一步得到的只判断当前证据能支持或排除什么，不能由剩余项自动定案。判断时，圈介词后的中心内容及所属动作，先核已知搭配，再核时空、工具方式或实际关系；具体结构和句意支持后才选介词。什么时候停，搭配未知或场景关系不能确认时暂停；多于两个对象不自动among，数量增加了与增加到须分开，不能把宽泛方向口诀作唯一依据。反例示意，对象多于两个但题面逐一明确相互关系，可需between路线；只数对象不能选介词。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，先不填介词，圈它后面的中心词与支配动作，写题面要表达哪种关系，而不是只数对象。
