visual_formula: '动作/搭配 + 介词后中心词

  ↓ 时间 / 空间 / 工具 / 实际关系

  increase：差量by / 终点to

  → 有据介词（decide）；搭配未知 → 停'
challenge_prompt: 先不填介词，圈它后面的中心词与支配动作，写题面要表达哪种关系，而不是只数对象。
