compact:
  10s: 介词总凭感觉？圈动作和后面的中心词，先查搭配再判场景关系；对象多不自动among，未知搭配停。
  30s: 确定需要介词后，圈支配动作与后面中心内容，核搭配和时空工具关系。关系示意：increase by是差量，to是达到量。多于两者也需看是否逐一关系；搭配或场景不明就停，别用单词清单直接填。
  90s: 空位已判需要介词时，先确认：空位已判需要介词。第一刀：圈介词后的中心词及所属动作，核场景关系或固定搭配，陌生搭配不猜。产物 decide：圈介词后的中心内容及所属动作，先核已知搭配，再核时空、工具方式或实际关系；具体结构和句意支持后才选介词。
    停止：搭配未知或场景关系不能确认时暂停；多于两个对象不自动among，数量增加了与增加到须分开，不能把宽泛方向口诀作唯一依据。 反例（关系示意，不是真题）：对象多于两个但题面逐一明确相互关系，可需between路线；只数对象不能选介词。
    迁移：换场景仍核支配结构与实际联系，不迁移人数或中文词的唯一对应。 挑战：先不填介词，圈它后面的中心词与支配动作，写题面要表达哪种关系，而不是只数对象。
