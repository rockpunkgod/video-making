levels:
  L1: 列候选先行词，把每个换回原句，核数、动作角色和完整语义
  L2: 把候选先行内容逐个换回原句，核数、谓语角色、否定、程度和状态；输出可回填成立的指代关系，不由最近名词直接定案。
  L3: 同数候选仍需比角色；状态不能压成单个名词。附近不足就扩大上下文；没有明确指示解释关系时不进入词义推断分支。
  L4: 新文章仍回填候选对象或完整状态，并核同一动作角色，不依赖距离口诀。
