method_id: R10
brand_name: 代词回填
source_name: 代词指代
aliases:
- 代词指代
question_type: 阅读理解
method_type: method
role: interpreter
primary_role: interpreter
secondary_roles: []
output_type: interpret
student_symptoms:
- 代词使对象或动作归属不清
trigger_cues:
- 所问指代或决定答案的前提，需要还原实体、状态、事件或命名概念。
core_action: 圈指代及所在完整谓语；实体先列可比对象并回填，状态写谁处于什么状态，概念回看它概括的行为并还原内部代词。
decision_rule: 产出有动作角色与限定支持的所指解释；有限词义分支须有明确指示解释，先核词性再比具体含义。
verification: 产出有动作角色与限定支持的所指解释；有限词义分支须有明确指示解释，先核词性再比具体含义。 最近名词、同数或同词性不定案；状态不缩成名词，结果不冒充原状态；附近不足按缺口扩，解释关系不明停词义分支。
stop_rule: 最近名词、同数或同词性不定案；状态不缩成名词，结果不冒充原状态；附近不足按缺口扩，解释关系不明停词义分支。
common_wrong_instinct: 把最近名词直接当指代对象，或把期望结果当成需要改变的原状态。
failure_cases:
- 把最近名词直接当指代对象，或把期望结果当成需要改变的原状态。
- 最近名词、同数或同词性不定案；状态不缩成名词，结果不冒充原状态；附近不足按缺口扩，解释关系不明停词义分支。
counterexamples:
- 两个候选数都匹配，其中只有较远对象符合谓语动作；最近和数一致都不能单独决定。
transfer_pattern: 新文章仍回填候选对象或完整状态，并核同一动作角色，不依赖距离口诀。
memory_line: 圈指代及所在完整谓语；实体先列可比对象并回填，状态写谁处于什么状态，概念回看它概括的行为并还原内部代词。
anti_rule: 最近名词 ≠ 指代对象。
visual_formula: "代词 → 候选对象/完整状态\n             ↓ 换回原句\n数 + 动作角色 + 否定/程度\n→ 指代解释；不足\
  \ → 扩证"
challenge_prompt: 先不选，选两个可能所指内容换回原句，分别指出哪处动作角色或状态能成立。
