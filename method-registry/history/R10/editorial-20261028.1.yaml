levels:
  L1: 列候选先行词，把每个换回原句，核数、动作角色和完整语义
  L2: 把候选先行内容逐个换回原句，核数、谓语角色、否定、程度和状态；输出可回填成立的指代关系，不由最近名词直接定案。
  L3: 同数候选仍需比角色；状态不能压成单个名词。附近不足就扩大上下文；没有明确指示解释关系时不进入词义推断分支。
  L4: 新文章仍回填候选对象或完整状态，并核同一动作角色，不依赖距离口诀。
compact:
  line: 圈指代及所在完整谓语；实体先列可比对象并回填，状态写谁处于什么状态，概念回看它概括的行为并还原内部代词。
  boundary: 最近名词、同数或同词性不定案；状态不缩成名词，结果不冒充原状态；附近不足按缺口扩，解释关系不明停词义分支。
  10s: 代词指谁拿不准？把可能所指换回完整句核角色；最近的名词不一定对。
  30s: 代词指谁拿不准？先圈当前必须还原的代词，把可能所指写在旁边，代回完整句核角色。例如，两个名词都合单复数，只有一个能做句中动作。数一致不够；所指可能是一件事或状态，不硬找最近名词。
  90s: 代词指谁拿不准？圈指代及所在完整谓语；实体先列可比对象并回填，状态写谁处于什么状态，概念回看它概括的行为并还原内部代词。这一步得到的是把当前关系或表达解释清楚，还要核完整题目。判断时，产出有动作角色与限定支持的所指解释；有限词义分支须有明确指示解释，先核词性再比具体含义。什么时候停，最近名词、同数或同词性不定案；状态不缩成名词，结果不冒充原状态；附近不足按缺口扩，解释关系不明停词义分支。反例示意，两个候选数都匹配，其中只有较远对象符合谓语动作；最近和数一致都不能单独决定。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，先不选，选两个可能所指内容换回原句，分别指出哪处动作角色或状态能成立。
full:
  summary: 圈指代及所在完整谓语；实体先列可比对象并回填，状态写谁处于什么状态，概念回看它概括的行为并还原内部代词。 产出有动作角色与限定支持的所指解释；有限词义分支须有明确指示解释，先核词性再比具体含义。
  source_boundary: 最近名词、同数或同词性不定案；状态不缩成名词，结果不冒充原状态；附近不足按缺口扩，解释关系不明停词义分支。
  boundaries:
