levels:
  L1: 圈笼统动词或形容词，用符合场景与搭配的具体词替换，生词搭配不明就停
  L2: 圈笼统但意思已成立的词，明确本场景动作/状态，再选语义力度、对象和搭配匹配的具体词；回填后原义与语法不变才保留。
  L3: 基础意思或句法未准确先修，不先换词；替换词搭配、力度或适用对象不明就停并保留准确常用词，不从词表盲抄。
  L4: 换场景仍先核动作力度、对象和搭配，不背单向替换关系。
