core_action: 圈笼统词，写清此处实际动作或状态，再选对象、力度与搭配匹配的词并回填。
decision_rule: 产出保原义、搭配自然的替换；场景化高级词是素材，不按原示范固定词对迁移。
verification: 产出保原义、搭配自然的替换；场景化高级词是素材，不按原示范固定词对迁移。 基础未准确先修，生词的力度或搭配不明保留准确常用词；不从词表盲抄或按替换数量评分。
stop_rule: 基础未准确先修，生词的力度或搭配不明保留准确常用词；不从词表盲抄或按替换数量评分。
common_wrong_instinct: 看到高级替换表就把所有基础词换成更难的词。
failure_cases:
- 看到高级替换表就把所有基础词换成更难的词。
- 基础未准确先修，生词的力度或搭配不明保留准确常用词；不从词表盲抄或按替换数量评分。
counterexamples:
- 词表里的clutch表达特定握持状态，不是所有grip都必须替换；替换让动作力度或情绪与场景不符时应退回。此为词义条件示意，不是真题。
transfer_pattern: 换场景仍先核动作力度、对象和搭配，不背单向替换关系。
memory_line: 圈笼统词，写清此处实际动作或状态，再选对象、力度与搭配匹配的词并回填。
anti_rule: 更生僻 ≠ 更精准。
visual_formula: '成立的基础表达 → 场景 / 对象 / 力度

  → 候选具体词 → 核搭配与原义

  不明 → 保留准确常用词'
challenge_prompt: 先不换整句，只圈一个笼统词，写出要表达的具体动作和力度，再说明候选为何匹配。
