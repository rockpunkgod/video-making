  10s: 半句空怕接错？先把候选拼成一句，再核对象与意思；语法接通不等于内容成立。
  30s: 半句空怕接错？先把一个候选接回未完成的半句，圈合成句的主体和谓语。例如，两项都补成完整句，一项却换了动作对象。大小写或句长不定案；都能补句就停结构筛选。
  90s: 半句空怕接错？把候选接到现有半句，标主语谓语与连接位置，再检验完整语义这一步得到的是把当前关系或表达解释清楚，还要核完整题目。判断时，先把候选与空前未完成结构接成一句，标主语、谓语和连接位置，再核完整语义；产物是拼接后的句法解释，不是仅凭结构定案。什么时候停，结构都可补全时必须比对象、动作和段落任务；不能凭大小写或半句长度选。接成句却与前后内容冲突时停止初判。反例示意，两个候选都补成完整句，但一个把动作对象换了；半句结构成立不能替代语义与段落核验。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，先不选，把候选接到现有半句，圈合成句的主语和谓语，再指出连接词连接哪两部分。
