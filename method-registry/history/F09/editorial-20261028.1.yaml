core_action: 把候选接到现有半句，标主语谓语与连接位置，再检验完整语义
decision_rule: 先把候选与空前未完成结构接成一句，标主语、谓语和连接位置，再核完整语义；产物是拼接后的句法解释，不是仅凭结构定案。
verification: 把候选接到现有半句，标主语谓语与连接位置，再检验完整语义。先把候选与空前未完成结构接成一句，标主语、谓语和连接位置，再核完整语义；产物是拼接后的句法解释，不是仅凭结构定案。
  结构都可补全时必须比对象、动作和段落任务；不能凭大小写或半句长度选。接成句却与前后内容冲突时停止初判。
stop_rule: 结构都可补全时必须比对象、动作和段落任务；不能凭大小写或半句长度选。接成句却与前后内容冲突时停止初判。
common_wrong_instinct: 看到小写开头就认为只能放在半句空，或者只要拼起来语法通就选。
failure_cases:
- 看到小写开头就认为只能放在半句空，或者只要拼起来语法通就选。
- 结构都可补全时必须比对象、动作和段落任务；不能凭大小写或半句长度选。接成句却与前后内容冲突时停止初判。
counterexamples:
- 两个候选都补成完整句，但一个把动作对象换了；半句结构成立不能替代语义与段落核验。
transfer_pattern: 换半句题仍先合句再标结构与意思，不迁移候选首字母或句长。
memory_line: 把候选接到现有半句，标主语谓语与连接位置，再检验完整语义
anti_rule: 接成一句 ≠ 内容成立。
visual_formula: "空前未完成结构 + 候选半句\n            ↓ 标主体/谓语/连接\n完整句结构 + 完整意思\n→ 拼接解释（interpret）；再核段落"
challenge_prompt: 先不选，把候选接到现有半句，圈合成句的主语和谓语，再指出连接词连接哪两部分。
