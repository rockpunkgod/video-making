levels:
  L1: 只识别明显完整句、半句、小标题或祈使句。
  L2: 加入语法主语、核心话题、代词与省略行动者分组。
  L3: 识别真谓语和局部时间线，不被非谓语词形误导。
  L4: 在三维重叠或无区分度时，正确转入主体、动作、对象、前后关系和段落任务。
compact:
  line: 在选项区按句型、实际主角、真谓语时间各标一次组并说清字母；无区分度如实标记，随后按突破口回正文。
  boundary: 无区别不编组；发现漏纳、指代或谓语初筛错误可在当前比较纠正，不重演完整三分；不据组小、占用或剩一项选。
  10s: 七项乱试？句型、主角、时间各查一次再回文；无区别也记录，分组不定案。
  30s: 七项乱试？先在A-G旁标完整句、半句或祈使等真实句型，先不填空。接着核主角和真谓语时间，三维各一次，无区别也标无区分度；分完回正文。例如，两个祈使句都对父母说，却可能建议完全不同的事。无区别不编组；新证据可纠错，不重演三分或靠占用选。
  90s: 七项乱试？在选项区按句型、实际主角、真谓语时间各标一次组并说清字母；无区分度如实标记，随后按突破口回正文。这一步得到的只是缩小接下来要核的范围，不直接得答案。判断时，只产出优先候选组；放回正文核对象、动作、两侧关系和段落任务，内容证据才定案。什么时候停，无区别不编组；发现漏纳、指代或谓语初筛错误可在当前比较纠正，不重演完整三分；不据组小、占用或剩一项选。反例示意，两个选项都是祈使句且行动者相同，但一项针对的对象与本段任务不符；同组不等于同时成立。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，不填任何空，按句型、主角和真谓语时间的实际差异各分一次A–G，并说清字母；若某一维没有区别，就说明无区分度，不编组。
