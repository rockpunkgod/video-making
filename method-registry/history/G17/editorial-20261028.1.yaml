compact:
  10s: 长句找不出空位？先圈主干和空在哪，再恢复关键结构；暂划不是删除。
  30s: 长句找不出空位？先标空到底在主句还是某个从句或短语内，再暂划其他修饰。例如，空实际在从句里，删掉从句就看不出空位功能。主干不足先恢复相关从句，不先填后倒贴成分。
  90s: 长句找不出空位？圈主干谓语和对应主语，暂划介词短语、非谓语、插入语和从句，再恢复决定空位的修饰、否定与条件这一步得到的是把当前关系或表达解释清楚，还要核完整题目。判断时，圈主干谓语与对应主体，暂划介词短语、非谓语、插入和从句，再恢复决定空位的修饰、否定与条件；产出未填句成分骨架。什么时候停，只暂划不永久删；空可能就在从句或短语内，必须恢复其分句边界。主干不足判空功能时停，不从填后词形倒贴成分。反例示意，空位实际在被暂划的从句中；只看主句无法判它成分，须恢复从句与连接。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，先不填，圈未填句主干和空位，划分句范围，再恢复一处决定空位功能的修饰或连接。
