compact:
  10s: 长句找不出空位？圈主干和空在哪，暂划修饰再恢复关键结构；空在从句就不能删，先判成分。
  30s: 长句修饰挡住空位时，圈主干谓语和主体，暂划枝叶并标空实际在哪个分句。结构示意：空在从句中，必须恢复该从句与连接。保留否定、条件及支配；骨架不足就停，不先填后倒贴成分。
  90s: 长句修饰妨碍识别空位成分时，先确认：长句修饰妨碍识别空位成分。第一刀：圈主干谓语和对应主语，暂划介词短语、非谓语、插入语和从句，再恢复决定空位的修饰、否定与条件。产物
    interpret：圈主干谓语与对应主体，暂划介词短语、非谓语、插入和从句，再恢复决定空位的修饰、否定与条件；产出未填句成分骨架。 停止：只暂划不永久删；空可能就在从句或短语内，必须恢复其分句边界。主干不足判空功能时停，不从填后词形倒贴成分。
    反例（关系示意，不是真题）：空位实际在被暂划的从句中；只看主句无法判它成分，须恢复从句与连接。 迁移：换长句仍在未填句划主干和空位范围，不迁移删除清单或填后句法。
    挑战：先不填，圈未填句主干和空位，划分句范围，再恢复一处决定空位功能的修饰或连接。
