core_action: 圈主干谓语和对应主语，暂划介词短语、非谓语、插入语和从句，再恢复决定空位的修饰、否定与条件
decision_rule: 圈主干谓语与对应主体，暂划介词短语、非谓语、插入和从句，再恢复决定空位的修饰、否定与条件；产出未填句成分骨架。
verification: 圈主干谓语和对应主语，暂划介词短语、非谓语、插入语和从句，再恢复决定空位的修饰、否定与条件。圈主干谓语与对应主体，暂划介词短语、非谓语、插入和从句，再恢复决定空位的修饰、否定与条件；产出未填句成分骨架。
  只暂划不永久删；空可能就在从句或短语内，必须恢复其分句边界。主干不足判空功能时停，不从填后词形倒贴成分。
stop_rule: 只暂划不永久删；空可能就在从句或短语内，必须恢复其分句边界。主干不足判空功能时停，不从填后词形倒贴成分。
common_wrong_instinct: 把从句划掉后直接给空贴主句成分，或者先填答案再解释原来空位。
failure_cases:
- 把从句划掉后直接给空贴主句成分，或者先填答案再解释原来空位。
