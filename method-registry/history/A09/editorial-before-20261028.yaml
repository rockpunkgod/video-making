core_action: 先按15分五档三维定档，逐条引用题面和原稿证据，缺材料不完整给分
decision_rule: 只在题目、全文与相关可见材料充分时，引用内容组织、词汇语法、篇章结构证据先定15分档，再档内定分；词数附加按源规范处理，不机械累计方法扣分。
verification: 先按15分五档三维定档，逐条引用题面和原稿证据，缺材料不完整给分。只在题目、全文与相关可见材料充分时，引用内容组织、词汇语法、篇章结构证据先定15分档，再档内定分；词数附加按源规范处理，不机械累计方法扣分。
  无题目或缺全文不给完整分数；仅转写文本不评书写。书写只有清晰原稿且确实影响交际才按源规范降档，不因美观降档；训练模板、五检和高级词不是独立扣分项。
stop_rule: 无题目或缺全文不给完整分数；仅转写文本不评书写。书写只有清晰原稿且确实影响交际才按源规范降档，不因美观降档；训练模板、五检和高级词不是独立扣分项。
common_wrong_instinct: 拿语法错的个数或字体好看程度直接累计作文分数。
failure_cases:
- 拿语法错的个数或字体好看程度直接累计作文分数。
- 无题目或缺全文不给完整分数；仅转写文本不评书写。书写只有清晰原稿且确实影响交际才按源规范降档，不因美观降档；训练模板、五检和高级词不是独立扣分项。
counterexamples:
- 转写稿能读清不代表原书写影响交际；反过来只有字体不漂亮也不能降档。没有题目时无法证明任务覆盖。此为条件示意，不是真题。
transfer_pattern: 每篇稿都先核材料再三维定档，具体分数只依该篇全文证据和对应15分规范。
memory_line: 先按15分五档三维定档，逐条引用题面和原稿证据，缺材料不完整给分
anti_rule: 诊断项目 ≠ 独立扣分项。
visual_formula: '题目 + 全文 → 三维证据

  → 先定15分档 → 档内分数

