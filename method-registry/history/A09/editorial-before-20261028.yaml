compact:
  10s: 要批改先核材料：题目和全文齐不齐？用内容、语言、结构证据先定15分档，不靠错误计数或字体美观打分。
  30s: 给应用文分数前先确认题目与全文，再引用三维实际证据定档、档内定分，词数按源附加规则。例：只有转写文本不能判断书写，字体不美也不是降档理由。缺题目或全文就停在有限反馈，方法名称不产生独立扣分。
  90s: 题目与学生全文可见且请求批改时，先确认：题目与学生全文可见且请求批改。第一刀：先按15分五档三维定档，逐条引用题面和原稿证据，缺材料不完整给分。产物
    verify：只在题目、全文与相关可见材料充分时，引用内容组织、词汇语法、篇章结构证据先定15分档，再档内定分；词数附加按源规范处理，不机械累计方法扣分。
    停止：无题目或缺全文不给完整分数；仅转写文本不评书写。书写只有清晰原稿且确实影响交际才按源规范降档，不因美观降档；训练模板、五检和高级词不是独立扣分项。 反例（关系示意，不是真题）：转写稿能读清不代表原书写影响交际；反过来只有字体不漂亮也不能降档。没有题目时无法证明任务覆盖。此为条件示意，不是真题。
    迁移：每篇稿都先核材料再三维定档，具体分数只依该篇全文证据和对应15分规范。 挑战：先不报分，列出能看到和缺少的评分材料，再给内容、语言、结构各找一条原稿依据。
