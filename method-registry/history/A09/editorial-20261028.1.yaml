counterexamples:
- 转写稿能读清不代表原书写影响交际；反过来只有字体不漂亮也不能降档。没有题目时无法证明任务覆盖。此为条件示意，不是真题。
transfer_pattern: 每篇稿都先核材料再三维定档，具体分数只依该篇全文证据和对应15分规范。
memory_line: 先按15分五档三维定档，逐条引用题面和原稿证据，缺材料不完整给分
anti_rule: 诊断项目 ≠ 独立扣分项。
visual_formula: '题目 + 全文 → 三维证据

  → 先定15分档 → 档内分数

  词数按规范 / 书写须原稿影响交际'
challenge_prompt: 先不报分，列出能看到和缺少的评分材料，再给内容、语言、结构各找一条原稿依据。
