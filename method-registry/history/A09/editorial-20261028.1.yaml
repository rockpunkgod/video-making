compact:
  10s: 想给作文打分？先核题目和全文，再按内容语言结构定档；不按错误数或字体美观算分。
  30s: 想给作文打分？先确认题目和全文是否齐；没材料不作完整评分，学生先自查任务覆盖。例如，只有转写文本时，不能判断原书写是否影响交际。缺题目或全文不给完整分，限对应15分规范。
  90s: 想给作文打分？先按15分五档三维定档，逐条引用题面和原稿证据，缺材料不完整给分这一步得到的只是核验已有候选或稿件，不替代独立证据。判断时，只在题目、全文与相关可见材料充分时，引用内容组织、词汇语法、篇章结构证据先定15分档，再档内定分；词数附加按源规范处理，不机械累计方法扣分。什么时候停，无题目或缺全文不给完整分数；仅转写文本不评书写。书写只有清晰原稿且确实影响交际才按源规范降档，不因美观降档；训练模板、五检和高级词不是独立扣分项。反例示意，转写稿能读清不代表原书写影响交际；反过来只有字体不漂亮也不能降档。没有题目时无法证明任务覆盖。此为条件示意，不是真题。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，先不报分，列出能看到和缺少的评分材料，再给内容、语言、结构各找一条原稿依据。
