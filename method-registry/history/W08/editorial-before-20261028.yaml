question_type: 读后续写
method_type: sub_action
role: interpreter
primary_role: interpreter
secondary_roles: []
output_type: interpret
student_symptoms:
- 事件跳跃缺因果桥梁
trigger_cues:
- 事件跳跃，需要补清本题实际人物动机与行动结果的因果桥。
core_action: 写因为A→行动B→结果C，为每条边标原文条件或合理铺垫，逐条说明怎样促成下一步。
decision_rule: 产出可核因果链；先后不自动等于因果，拟写发展须受人物能力和原文事实约束。
verification: 产出可核因果链；先后不自动等于因果，拟写发展须受人物能力和原文事实约束。 边上只有猜测互证或物理条件不成立就停推进，先补合理动机/行动，不靠再添结果证明前一步。
stop_rule: 边上只有猜测互证或物理条件不成立就停推进，先补合理动机/行动，不靠再添结果证明前一步。
common_wrong_instinct: 用了because和so就觉得有逻辑，前因其实解释不了动作。
failure_cases:
- 用了because和so就觉得有逻辑，前因其实解释不了动作。
- 边上只有猜测互证或物理条件不成立就停推进，先补合理动机/行动，不靠再添结果证明前一步。
counterexamples:
- 两件事接着发生，但前事没有促使人物行动，不能靠连接词变成因果；写了结果也不能反过来证明行动有条件。此为关系示意，不是真题。
transfer_pattern: 换事件仍查动机—行动—后果两条边，而不套旧剧情。
memory_line: 写因为A→行动B→结果C，为每条边标原文条件或合理铺垫，逐条说明怎样促成下一步。
anti_rule: 先后发生 ≠ 因果成立。
visual_formula: '因为 A → 行动 B → 结果 C

  每条边：原因 / 条件 / 如何发生

  无支撑 → 停在该边'
challenge_prompt: 先不润色，写出A、B、C，再逐条回答为什么A导致B、怎样B带来C。
