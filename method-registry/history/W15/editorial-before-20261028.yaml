levels:
  L1: 只按25分续写档次核原文融洽、语言与结构；不抄首句正常，书写只在实见影响交际时评
  L2: 原文、两首句和学生自写全文齐全时，用融洽度、情节合理完整、语言和结构的实际证据先定25分档，再档内定分；十句功能用于诊断，不独立计扣分。
  L3: 缺原文或任一首句只能校语言，不评完整剧情或分数；不抄首句正常，给定首句不计学生字数句数。仅清晰原手写且影响交际才评书写，独立升华句和恰好十句都不是必须项。
  L4: 每篇续写都用自身原文首句和自写稿三端证据，不套应用文15分标准。
