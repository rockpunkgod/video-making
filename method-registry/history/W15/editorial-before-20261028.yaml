question_type: 读后续写
method_type: internal_rule
role: verifier
primary_role: verifier
secondary_roles: []
output_type: verify
student_symptoms:
- 原文首句和学生续写齐全且请求评分
trigger_cues:
- 原文、两段首句和完整自写续文齐备，且请求评分。
core_action: 按25分档次逐项引用原文与自写稿证据，先核融洽、情节和完整性，再核语言与衔接。
decision_rule: 产出有证据的档次建议；训练的动作数、句型数、十句位置和独立升华句不作硬扣分项。
verification: 产出有证据的档次建议；训练的动作数、句型数、十句位置和独立升华句不作硬扣分项。 缺必要材料不报完整分；不抄给定首句正常；仅原手写可见且影响交际才按规范处理书写，不伪造固定扣分。
stop_rule: 缺必要材料不报完整分；不抄给定首句正常；仅原手写可见且影响交际才按规范处理书写，不伪造固定扣分。
common_wrong_instinct: 按有没有抄首句、凑满十句、写独立升华句来机械扣分。
failure_cases:
- 按有没有抄首句、凑满十句、写独立升华句来机械扣分。
- 缺必要材料不报完整分；不抄给定首句正常；仅原手写可见且影响交际才按规范处理书写，不伪造固定扣分。
counterexamples:
- 学生没抄题面首句但自写内容自然接续，不能判缺失；少独立升华句而主题已由结果呈现，也不自动降档。转写稿无法判断原稿书写。此为条件示意，不是真题。
transfer_pattern: 每篇续写都用自身原文首句和自写稿三端证据，不套应用文15分标准。
memory_line: 按25分档次逐项引用原文与自写稿证据，先核融洽、情节和完整性，再核语言与衔接。
anti_rule: 功能支架 ≠ 独立扣分表。
visual_formula: '原文 + 两首句 + 自写全文

  → 融洽 / 合理完整 / 语言 / 结构证据

  → 25分定档；方法不逐项扣分'
challenge_prompt: 先不报分，列出原文、两首句和自写全文是否齐全，再给一项剧情诊断标两端证据。
