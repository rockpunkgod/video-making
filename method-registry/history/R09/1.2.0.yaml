method_id: R09
brand_name: 三步压文
source_name: 三化法
aliases:
- 对象-判断-结构
- 全文压缩
question_type: 阅读理解
role: framework
primary_role: framework
secondary_roles: []
output_type: interpret
student_symptoms:
- 长文读完只记得零散事实，说不出全文在完成什么任务。
- 主旨题只会数重复词或抄段首句，无法形成完整主题判断。
trigger_cues:
- 主要段落齐备，需要全文主题、态度、结构、标题或长文框架。
core_action: 先读实际题干及相关选项；共同/重复概念仅作假设；再化简有效首尾，最后读中间段首及必要回答或段尾。
decision_rule: 回全文验证对象、核心判断、结构任务三格，产出全文骨架卡，不直接定答案。
verification: 回全文验证对象、核心判断、结构任务三格，产出全文骨架卡，不直接定答案。 局部题或缺主要段落不启动；重复线索缺失只跳过该观察；三格无正文支持则暂留，不编相关题目。
stop_rule: 局部题或缺主要段落不启动；重复线索缺失只跳过该观察；三格无正文支持则暂留，不编相关题目。
common_wrong_instinct: 找到重复词或首尾句就停，没有压出作者对对象的核心判断和全文任务。
failure_cases:
- 找到重复词或首尾句就停，没有压出作者对对象的核心判断和全文任务。
- 局部题或缺主要段落不启动；重复线索缺失只跳过该观察；三格无正文支持则暂留，不编相关题目。
counterexamples:
- 某词全文高频，但它只是背景对象，未表达核心判断；仅凭词频不能定主旨。
- 首段只引入背景，真正判断在后文展开；不能把首段话题直接当全文任务。
transfer_pattern: 可在说明、议论、对比、变化和问题—解决类长文中重复执行对象—判断—结构压缩。
memory_line: 先按题面取证，再压出对象、判断、结构。
anti_rule: 段首 ≠ 中心句。
visual_formula: '题面实际题干 + 相关选项

  → 可用共同概念（假设，可跳过）

  → 有效首尾 → 中间段首及必要展开

  → 全文核验

  骨架卡：对象 | 核心判断 | 结构任务'
challenge_prompt: 先标第一眼应读的实际题干与相关选项，再填对象、核心判断和结构任务三格，逐格指出正文证据。
