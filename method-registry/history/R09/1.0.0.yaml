method_id: R09
brand_name: 三步压文
source_name: 三化法
aliases:
- 对象-判断-结构
- 全文压缩
question_type: 阅读理解
role: framework
primary_role: framework
secondary_roles: []
output_type: interpret
student_symptoms:
- 长文读完只记得零散事实，说不出全文在完成什么任务。
- 主旨题只会数重复词或抄段首句，无法形成完整主题判断。
trigger_cues:
- 主要段落齐备，任务是全文主题、态度、主体结构、最佳标题或长文框架。
- 候选相关但需要先弄清文章始终围绕谁/什么、作什么判断以及如何展开。
core_action: 依次压出对象、核心判断和全文结构任务。
decision_rule: 只有对象+核心判断+全文任务同时得到全文取证，才形成可供主旨判断的框架。
verification:
- 先从题干与主旨选项提出待验假设。
- 用有效首尾段、中间段首句及必要展开取证；重复词只是可选入口。
- 压对象：全文主要一直围绕谁或什么问题。
- 压判断：作者主要在说它怎样、为什么或发生什么变化。
- 压结构：判定解释、对比、问题—答案、变化、论证或分类等实际全文任务。
- 回全文检查没有丢失否定、范围、条件、态度和关系。
stop_rule: 词频高，不等于主题完整。
common_wrong_instinct: 找到重复词或首尾句就停，没有压出作者对对象的核心判断和全文任务。
failure_cases:
- 局部事实、明确单段题或主要段落缺失时不启动全文框架。
- 段首是背景或设问时，必须继续看段尾、回答与展开，不能把入口当阅读上限。
counterexamples:
- 某词全文高频，但它只是背景对象，未表达核心判断；仅凭词频不能定主旨。
- 首段只引入背景，真正判断在后文展开；不能把首段话题直接当全文任务。
transfer_pattern: 可在说明、议论、对比、变化和问题—解决类长文中重复执行对象—判断—结构压缩。
memory_line: 压对象，压判断，压结构。
anti_rule: 段首 ≠ 中心句。
visual_formula: "全文\n  ↓ 压对象：围绕谁/什么\n  ↓ 压判断：它怎样/为什么/如何变\n  ↓ 压结构：文章在完成什么任务\n主旨框架\
  \ = 对象 + 核心判断 + 全文任务"
challenge_prompt: 不看选项细节，分别用一个短语写出文章对象、作者的核心判断和全文结构任务。
