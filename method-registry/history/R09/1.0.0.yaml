can_follow:
- 题干与主旨选项假设
usually_before:
- R06
- mainly题与主旨大意
usually_after:
- 对全文任务的识别
conflicts_with: []
cannot_replace:
- R06
- 候选完整断言核对
- 局部细节方法
levels:
  L1: 只压出全文主要对象。
  L2: 在对象上加入作者的核心判断。
  L3: 识别解释、对比、问题—答案、变化、论证或分类结构。
  L4: 处理背景首段、设问段首、无重复词与多层全文任务。
compact:
  line: 对象+核心判断+全文任务，三层压成一句。
  boundary: 首尾段、段首句和重复词都只是取证入口，不是单独答案。
full:
  summary: 品牌层将学生输出重组为对象、判断、结构三层；课程原三化法的首尾段、段首句、重复词全部保留为取证入口。
  source_boundary: 课程证据明确三类观察不是机械固定三步；本卡的三步是产出格式工程化，不改写课程原名含义。
  boundaries:
  - 重复词可缺省
  - 首尾段与段首句不是阅读上限
  - 主要段落缺失时停止
cases:
  canonical: cases/R09/canonical/case.yaml
  counterexample: cases/R09/counterexamples/case.yaml
  boundary: cases/R09/boundary/case.yaml
  transfer: cases/R09/transfer/case.yaml
four_step_card:
  start: 主要段落齐全，但读完长文只剩零散事实，说不出全文任务。
  first_cut: 在纸上填三格：对象、核心判断、全文结构任务。
  judge: 三格都能由首尾、段首及必要展开回文证明，才产出全文骨架卡。
  stop: 局部题、主要段落缺失或三格无法回文验证时停止。
practicality_gate:
  status: design_complete_empirical_pending
  trigger: 由全文主题、态度、结构、标题或长文框架任务触发。
  action: 填写对象/核心判断/结构任务三格；用首尾、段首、重复概念与必要展开回查每格。
  output: interpret；唯一产物是全文骨架卡，不直接选答案。
  stop: 三格中任一格只来自词频或单句而无全文支持，或材料不完整时停止。
  transfer: 全文骨架卡可迁移到解释、对比、问题—答案、变化、论证与分类文。
  efficiency: 将整篇细节压缩为三格外部记忆，降低工作记忆负担；主要价值是结构理解，不预设一定提速。
  misuse_cost: high；把取证入口当固定三步或直接答案会丢失全文判断。
