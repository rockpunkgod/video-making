trigger_cues:
- 候选与正文有可确认词语、指代或整句内容呼应，而非只是同一主题。
core_action: 圈呼应表达并写它承接哪个对象、事件或整句内容，回填两侧；需要时由空后代词反查候选提供的前提。
decision_rule: 产出实际呼应的核验；同词多项局部接通时比空前条件、空后结果与全段任务，不数重词定案。
verification: 产出实际呼应的核验；同词多项局部接通时比空前条件、空后结果与全段任务，不数重词定案。 无明确呼应不命名本法；形式it不强找名词，latter要有真实成对对象；前提未引出不提前放，段界连下段起句核。
stop_rule: 无明确呼应不命名本法；形式it不强找名词，latter要有真实成对对象；前提未引出不提前放，段界连下段起句核。
common_wrong_instinct: 每找到一个重复词就增加信心，却没有说明它到底承接谁或哪件事。
failure_cases:
- 每找到一个重复词就增加信心，却没有说明它到底承接谁或哪件事。
- 无明确呼应不命名本法；形式it不强找名词，latter要有真实成对对象；前提未引出不提前放，段界连下段起句核。
counterexamples:
- 两个候选都重复同一个主题词，但其中一项的动作不能承接空前条件；重词再多也不证明闭环。
transfer_pattern: 换文章仍核同指或同义的实际对象及前后联系，不迁移固定对应词对。
memory_line: 圈呼应表达并写它承接哪个对象、事件或整句内容，回填两侧；需要时由空后代词反查候选提供的前提。
anti_rule: 重复词 ≠ 内容接通。
visual_formula: "呼应词 → 哪个对象/事件/整件事？\n         ↓ 放回两侧\n空前条件 + 候选完整断言 + 空后结果\n→ 呼应核验（verify）；同词不定案"
challenge_prompt: 不选答案，只连一对呼应表达，写明它们对应哪个对象或事件，再标还需核的前后联系。
