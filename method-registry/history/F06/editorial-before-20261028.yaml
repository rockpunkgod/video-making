levels:
  L1: 圈两边对应对象与动作，标同指或同义关系，再回填核上下句和段落任务
  L2: 圈明确复现、近义或指代，写清连接的对象、事件或整句内容，再回填核空前条件、空后结果和段落任务；输出呼应核验，不靠重词数量定案。
  L3: 只是同主题或翻译通却没有明确呼应时不命名本法；同词多项都能接时比完整断言。形式it、概括名词或latter必须按实际内容还原，不能强找最近名词。
  L4: 换文章仍核同指或同义的实际对象及前后联系，不迁移固定对应词对。
