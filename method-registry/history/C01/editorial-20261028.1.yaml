core_action: 标空位角色，圈最近对象/动作提示；最近不足才向真实复现、回答、结果或评价扩读，再回填核具体语义与联系。
decision_rule: 产出当前空的线索路径，标已补清和仍缺的关系；内部框架不独立定案。
verification: 产出当前空的线索路径，标已补清和仍缺的关系；内部框架不独立定案。 当前空的决定性词义或关系仍不明就暂留；找到独立提示再返回，不强制原空号、两遍或三遍。
stop_rule: 当前空的决定性词义或关系仍不明就暂留；找到独立提示再返回，不强制原空号、两遍或三遍。
common_wrong_instinct: 先按故事主题猜一个词，再拿后面的猜测或积极基调给它补证。
failure_cases:
- 先按故事主题猜一个词，再拿后面的猜测或积极基调给它补证。
