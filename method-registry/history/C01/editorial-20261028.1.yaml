counterexamples:
- 人物态度积极，但实际遭遇不顺利；不能用积极基调选描述顺利遭遇的词。
transfer_pattern: 换题材仍先标空位角色、圈最近提示、按缺口扩证并回填，不迁移上篇主题或词对。
memory_line: 标空位角色，圈最近对象/动作提示；最近不足才向真实复现、回答、结果或评价扩读，再回填核具体语义与联系。
anti_rule: 主题相符 ≠ 当前空有据。
visual_formula: '当前空：词义 / 关系 / 搭配？

  ↓ 最近对象/动作提示

  不足 → 复现 / 回答 / 结果 / 评价

  ↓ 回填核具体词义与两侧联系

  产物：线索路径（interpret）；框架不定案'
challenge_prompt: 先不选词，只标当前空角色，圈最近线索；不足时画扩证方向，再写回填要核的那条联系。
