compact:
  line: 标空位角色，圈最近对象/动作提示；最近不足才向真实复现、回答、结果或评价扩读，再回填核具体语义与联系。
  boundary: 当前空的决定性词义或关系仍不明就暂留；找到独立提示再返回，不强制原空号、两遍或三遍。
  10s: 完形不知道查哪儿？先标空的作用、圈近处提示，不足再扩读；线索路径不是答案。
  30s: 完形不知道查哪儿？先标这个空要补动作、状态还是对象，再圈最近一句能提供的提示。例如，人物态度乐观，不代表实际遭遇顺利。词义或关系没闭合先留空，找到独立提示再返回。
  90s: 完形不知道查哪儿？标空位角色，圈最近对象/动作提示；最近不足才向真实复现、回答、结果或评价扩读，再回填核具体语义与联系。这一步得到的是一份待核的框架或计划，不是答案或分数。判断时，产出当前空的线索路径，标已补清和仍缺的关系；内部框架不独立定案。什么时候停，当前空的决定性词义或关系仍不明就暂留；找到独立提示再返回，不强制原空号、两遍或三遍。反例示意，人物态度积极，但实际遭遇不顺利；不能用积极基调选描述顺利遭遇的词。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，先不选词，只标当前空角色，圈最近线索；不足时画扩证方向，再写回填要核的那条联系。
