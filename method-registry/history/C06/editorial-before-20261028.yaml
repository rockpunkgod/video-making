compact:
  10s: 时间关系绕晕？写两件事何时发生和已给间隔，只还原时间线；先后不等于因果，未给时长别补。
  30s: 空位依赖先后或时间间隔时，列两件事的发生阶段，把明确间隔保留下来。关系示意：身份变了，不代表经历时长变了。先后与因果分开核；未给时间写未知，本步只还原关系，不凭连续动作选。
  90s: 空位依赖事件先后或时间间隔时，先确认：空位依赖事件先后或时间间隔。第一刀：写两件事发生时间及间隔，再标先后或因果，不省略题面时间条件。产物 interpret：写两件事各自何时发生、明确间隔及先后，再独立核是否存在因果；产出真实时间线，不能以连续发生补造原因或时长变化。
    停止：事件时间或间隔未给就标未知；先后不证明因果，身份或状态改变不证明时长改变。额外时间要求无据时停止初判。 反例（关系示意，不是真题）：题面只给身份变化，没有交代时长变了；不能把身份差异补成经历时长差异。
    迁移：新材料仍列事件阶段和明确间隔，不迁移同一时间词的固定答案或补出的时长。 挑战：先不选，标两件事发生的时间和间隔；未说明的填未知，再区分哪条箭头只有先后、哪条真有因果依据。
