core_action: 写两件事发生时间及间隔，再标先后或因果，不省略题面时间条件
decision_rule: 写两件事各自何时发生、明确间隔及先后，再独立核是否存在因果；产出真实时间线，不能以连续发生补造原因或时长变化。
verification: 写两件事发生时间及间隔，再标先后或因果，不省略题面时间条件。写两件事各自何时发生、明确间隔及先后，再独立核是否存在因果；产出真实时间线，不能以连续发生补造原因或时长变化。
  事件时间或间隔未给就标未知；先后不证明因果，身份或状态改变不证明时长改变。额外时间要求无据时停止初判。
stop_rule: 事件时间或间隔未给就标未知；先后不证明因果，身份或状态改变不证明时长改变。额外时间要求无据时停止初判。
common_wrong_instinct: 看到事件接着发生，就默认前者导致后者；或把身份变化理解成经历时间更长。
failure_cases:
- 看到事件接着发生，就默认前者导致后者；或把身份变化理解成经历时间更长。
- 事件时间或间隔未给就标未知；先后不证明因果，身份或状态改变不证明时长改变。额外时间要求无据时停止初判。
counterexamples:
- 题面只给身份变化，没有交代时长变了；不能把身份差异补成经历时长差异。
transfer_pattern: 新材料仍列事件阶段和明确间隔，不迁移同一时间词的固定答案或补出的时长。
memory_line: 写两件事发生时间及间隔，再标先后或因果，不省略题面时间条件
anti_rule: 先后 ≠ 因果。
visual_formula: "事件A：时间/阶段\n      ↓ 已给间隔？\n事件B：时间/阶段\n→ 时间线（interpret）\n因果需另有据；未知间隔不补"
challenge_prompt: 先不选，标两件事发生的时间和间隔；未说明的填未知，再区分哪条箭头只有先后、哪条真有因果依据。
