compact:
  10s: 时间关系绕晕？写两件事何时发生和已给间隔；先后不等于因果。
  30s: 时间关系绕晕？先圈两件事各自的时间词，未给间隔就写未知。例如，身份变化并不能证明经历时长变化。没给时间就标未知，不补时长或原因。
  90s: 时间关系绕晕？写两件事发生时间及间隔，再标先后或因果，不省略题面时间条件这一步得到的是把当前关系或表达解释清楚，还要核完整题目。判断时，写两件事各自何时发生、明确间隔及先后，再独立核是否存在因果；产出真实时间线，不能以连续发生补造原因或时长变化。什么时候停，事件时间或间隔未给就标未知；先后不证明因果，身份或状态改变不证明时长改变。额外时间要求无据时停止初判。反例示意，题面只给身份变化，没有交代时长变了；不能把身份差异补成经历时长差异。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，先不选，标两件事发生的时间和间隔；未说明的填未知，再区分哪条箭头只有先后、哪条真有因果依据。
