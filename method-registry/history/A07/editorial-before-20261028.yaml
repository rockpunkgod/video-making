levels:
  L1: 先简化中文、译正确简单句，再加入服务真实逻辑的修饰或从句，搭配不明停升级
  L2: 先简化中文并译成准确简单句，再逐层添加实际服务语义的介词短语、非谓语、从句或自然替换；每层回拆主干，原义和搭配未变才保留。
  L3: 基础句不成立先修基础；升级引入原任务没有的事件、感受或因果时停止。动作主体、搭配或句法不明则撤回该层，不追求层层加满。
  L4: 新题仍按准确底座—单层添加—回拆核验，积木内容只服务新任务。
