student_symptoms:
- 基础句准确且需要自然升级
trigger_cues:
- 基础句准确，已有相关简单句需要按真实逻辑粘连。
core_action: 并排写出相关简单句，标共同主体和实际关系，再选合适从句、非谓语或介词短语拼接。
decision_rule: 合成句须保原信息、主体、关系和句法；口诀只是记忆称呼，不规定拆字步骤或固定先后。
verification: 合成句须保原信息、主体、关系和句法；口诀只是记忆称呼，不规定拆字步骤或固定先后。 主体、语义关系或搭配不成立退回独立句；不靠110/120整篇词数选法，不借续写同名定义。
stop_rule: 主体、语义关系或搭配不成立退回独立句；不靠110/120整篇词数选法，不借续写同名定义。
common_wrong_instinct: 把所有句型积木都塞进去，句子看着高级就认为更好。
failure_cases:
- 把所有句型积木都塞进去，句子看着高级就认为更好。
- 主体、语义关系或搭配不成立退回独立句；不靠110/120整篇词数选法，不借续写同名定义。
counterexamples:
- 源示范的咖啡场景和情绪只对该示范成立，不能复制到无此背景的题目；一个准确简单句也不必每层升级。此为边界示意，不是真题。
transfer_pattern: 换题仍从当前准确句与真实关系选择粘连，不固定层层升级、词数门槛或口诀顺序。
memory_line: 把相关简单句按真实关系粘起来。
anti_rule: 加修饰 ≠ 加质量。
visual_formula: '相关正确简单句

  → 标主体 + 真实关系

  → 从句 / 非谓语 / 介词短语（按需选）

  → 核原义与句法，不拆口诀排步骤'
challenge_prompt: 先并排写两句准确简单句，只标真实关系，再选一种合适粘连方式并说明主体是否保持。
