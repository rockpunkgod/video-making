question_type: 读后续写
method_type: method
role: interpreter
primary_role: interpreter
secondary_roles: []
output_type: interpret
student_symptoms:
- 核心行动需要具体连贯描写
trigger_cues:
- 主线已有成立行动，但该行动太笼统而需要具体连贯描写。
core_action: 圈已有核心行动，拆真实相连的小动作，标人物、先后和因果，再补合语境状态。
decision_rule: 产出受原文约束的动作链；两动作/三动作是微型示范，不是全体句子上限或评分配额。
verification: 产出受原文约束的动作链；两动作/三动作是微型示范，不是全体句子上限或评分配额。 没有成立行动不拆；人物能力、物理条件或因果不成立则撤回；动作面独立定义未核，不补成动作加心理加环境。
stop_rule: 没有成立行动不拆；人物能力、物理条件或因果不成立则撤回；动作面独立定义未核，不补成动作加心理加环境。
common_wrong_instinct: 动作越多越有画面，把同一小事拆得很长还加不可能的动作。
failure_cases:
- 动作越多越有画面，把同一小事拆得很长还加不可能的动作。
- 没有成立行动不拆；人物能力、物理条件或因果不成立则撤回；动作面独立定义未核，不补成动作加心理加环境。
counterexamples:
- 某个人物身体能力受限，不能因为动作链模板有奔跑就照搬；一个动作已足够推进情节，也不必凑到三个。此为条件示意，不是真题。
transfer_pattern: 换行动仍核主体能力与先后，再决定需要几步而非固定三步。
memory_line: 拆出必要小动作，不凑三个、不补能力。
anti_rule: 动作多 ≠ 行动合理。
visual_formula: '已有成立行动

  → 所需相连小动作（不凑数）

  → 核人物能力 / 先后 / 因果 / 状态

  动作面：独立定义待核'
challenge_prompt: 先不堆修饰，把一个已有行动拆成所需小动作，为每步标主体、先后和依据；若不需拆就说明理由。
