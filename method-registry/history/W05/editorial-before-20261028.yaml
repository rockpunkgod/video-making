levels:
  L1: 把已有行动拆最多三个合理小动作，再加与场景相符的方式，不改变人物能力
  L2: 把已有核心行动拆成至多三个合理小动作，核同一主体、动作先后、人物能力，再选场景匹配的方式；产物是连贯行动描写。
  L3: 没有成立的核心行动先回情节，不用拆链发明事件；不机械凑三个动作。主体、物理条件或先后冲突时退回原动作。
  L4: 换行动仍核主体能力与先后，再决定需要几步而非固定三步。
