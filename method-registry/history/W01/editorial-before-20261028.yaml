levels:
  L1: 先读两段开头语找约束，再记录原文人物矛盾与时空，依跳定思提润推进
  L2: 五步各留下产物：首句约束与原文线索→人物矛盾和主题链→两段事件/情感线→每句功能提纲→回填衔接与语言复核；只得到可写的框架，不证明唯一剧情或分数。
  L3: 缺原文或任一开头语先停构思，只校现有语言；人物、关键事实或段间接续不成立先修框架。润色不得靠无铺垫的新事件，独立升华句不是必须项。
  L4: 换故事仍先读两首句取约束，再以新原文的人物矛盾搭两段功能。
