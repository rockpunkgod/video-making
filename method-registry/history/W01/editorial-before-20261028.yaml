question_type: 读后续写
method_type: framework
role: framework
primary_role: framework
secondary_roles: []
output_type: interpret
student_symptoms:
- 原文与两段开头语齐全，需要构思
trigger_cues:
- 原文与两段开头语齐备，需要构思受原文约束的续写框架。
core_action: 先读两首句提出待证问题，再回原文找人物矛盾与时空；依跳定思提润留下线索、冲突主题、构思、功能提纲与润色检查。
decision_rule: 产出可写框架；润检查结局怎样回应伏笔或关键词，感悟如有须由情节推出，不证明唯一剧情或分数。
verification: 产出可写框架；润检查结局怎样回应伏笔或关键词，感悟如有须由情节推出，不证明唯一剧情或分数。 缺必要材料只校现有语言；人物、事实或衔接不成立先修，不能借独立升华句补框架，也不混同各版五步成文原名。
stop_rule: 缺必要材料只校现有语言；人物、事实或衔接不成立先修，不能借独立升华句补框架，也不混同各版五步成文原名。
common_wrong_instinct: 看见首句就凭素材编故事，写完才找原文给它背书。
failure_cases:
- 看见首句就凭素材编故事，写完才找原文给它背书。
- 缺必要材料只校现有语言；人物、事实或衔接不成立先修，不能借独立升华句补框架，也不混同各版五步成文原名。
counterexamples:
- 同样是正向结局，若改变原文人物能力或突然增加救场人物，五步框架也不能使它成立；一个合理结局不因没独立升华句而判缺失。此为条件示意，不是真题。
transfer_pattern: 换故事仍先读两首句取约束，再以新原文的人物矛盾搭两段功能。
memory_line: 先读两首句提出待证问题，再回原文找人物矛盾与时空；依跳定思提润留下线索、冲突主题、构思、功能提纲与润色检查。
anti_rule: 先有故事 ≠ 有原文依据。
visual_formula: '首句约束 → 原文人物/矛盾

  → 两段事件与情感线 → 功能提纲

  → 衔接 + 语言复核'
challenge_prompt: 先不写全文，只从两首句列约束，再给人物、矛盾和两段任务各标一处原文依据。
