compact:
  10s: 主谓一致拿不准？划开修饰圈真主语；最近名词不一定是中心，本步不定时态。
  30s: 主谓一致拿不准？先划开主语旁的修饰，圈真正的主语中心，不默认最近名词。例如，主语旁有复数修饰，也不能忽略真正的单数中心。特殊数量或集合结构须另核，不能只按距离选主语。
  90s: 主谓一致拿不准？划开插入和修饰，圈真正主语中心词，核谓语一致，保留否定条件这一步得到的只是核验已有候选或稿件，不替代独立证据。判断时，划开插入和修饰后圈主语中心，并核并列/伴随结构或从句的实际一致对象；输出主谓一致核验，不自行定时态或最终词形。什么时候停，最近名词不一定主语，集合或数量结构须回完整节点；状态性过去分词与被动动作需另核，不能执行有be/无be口诀。反例示意，主谓之间有复数修饰名词，但真正主语中心为单数；不能由最近复数名词改谓语数。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，先不填谓语，划开主谓之间修饰，圈真主语中心，标它与谓语的一致关系。
