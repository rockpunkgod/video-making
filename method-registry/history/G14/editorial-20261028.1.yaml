core_action: 划开插入和修饰，圈真正主语中心词，核谓语一致，保留否定条件
decision_rule: 划开插入和修饰后圈主语中心，并核并列/伴随结构或从句的实际一致对象；输出主谓一致核验，不自行定时态或最终词形。
verification: 划开插入和修饰，圈真正主语中心词，核谓语一致，保留否定条件。划开插入和修饰后圈主语中心，并核并列/伴随结构或从句的实际一致对象；输出主谓一致核验，不自行定时态或最终词形。
  最近名词不一定主语，集合或数量结构须回完整节点；状态性过去分词与被动动作需另核，不能执行有be/无be口诀。
stop_rule: 最近名词不一定主语，集合或数量结构须回完整节点；状态性过去分词与被动动作需另核，不能执行有be/无be口诀。
common_wrong_instinct: 用离动词最近的名词定单复数，忽略真正主语与伴随结构。
failure_cases:
- 用离动词最近的名词定单复数，忽略真正主语与伴随结构。
- 最近名词不一定主语，集合或数量结构须回完整节点；状态性过去分词与被动动作需另核，不能执行有be/无be口诀。
counterexamples:
- 主谓之间有复数修饰名词，但真正主语中心为单数；不能由最近复数名词改谓语数。
transfer_pattern: 换句仍找中心及真实连接结构，不迁移最近名词的数或特殊结构无条件口诀。
memory_line: 划开插入和修饰，圈真正主语中心词，核谓语一致，保留否定条件
anti_rule: 最近名词 ≠ 真主语。
visual_formula: "主体中心 [修饰/插入] 谓语\n     ↑ 圈真主语\n核并列/伴随/从句一致对象\n→ 一致核验（verify）；不定时态"
