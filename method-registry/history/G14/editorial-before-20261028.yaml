compact:
  10s: 主谓一致拿不准？划开修饰圈真主语，再核结构一致；最近名词不算主语，本步不定时态。
  30s: 主谓被修饰隔开时，划开插入与短语，圈真主语中心，再核并列、伴随或从句一致对象。结构示意：旁边复数修饰不改变单数中心。中心或特殊结构不明就停；只核一致，不以be口诀定语态或最终形。
  90s: 主谓间有修饰造成数判断混乱时，先确认：主谓间有修饰造成数判断混乱。第一刀：划开插入和修饰，圈真正主语中心词，核谓语一致，保留否定条件。产物 verify：划开插入和修饰后圈主语中心，并核并列/伴随结构或从句的实际一致对象；输出主谓一致核验，不自行定时态或最终词形。
    停止：最近名词不一定主语，集合或数量结构须回完整节点；状态性过去分词与被动动作需另核，不能执行有be/无be口诀。 反例（关系示意，不是真题）：主谓之间有复数修饰名词，但真正主语中心为单数；不能由最近复数名词改谓语数。
    迁移：换句仍找中心及真实连接结构，不迁移最近名词的数或特殊结构无条件口诀。 挑战：先不填谓语，划开主谓之间修饰，圈真主语中心，标它与谓语的一致关系。
