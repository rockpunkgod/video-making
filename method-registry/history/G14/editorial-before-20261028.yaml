counterexamples:
- 主谓之间有复数修饰名词，但真正主语中心为单数；不能由最近复数名词改谓语数。
transfer_pattern: 换句仍找中心及真实连接结构，不迁移最近名词的数或特殊结构无条件口诀。
memory_line: 划开插入和修饰，圈真正主语中心词，核谓语一致，保留否定条件
