- 全文取证
- 错误关系检查
levels:
  L1: 识别明显只覆盖一段的候选。
  L2: 把全文压成 2–4 个核心块并比较覆盖。
  L3: 区分缺块、扩大范围和换属性。
  L4: 在覆盖齐全时继续核对对比、因果、变化等块间关系。
compact:
  line: 全文先拼 A+B+C，主旨要不缺块也不换关系。
  boundary: 拼图只用于全文主旨、目的或标题任务，不用于明确细节题。
full:
  summary: 用开头、结尾和各段首句验证核心组合，再比较候选的覆盖与完整判断。
  boundaries:
  - 重复词不定案
  - 范围大不定案
  - 包含其他候选不定案
  - 指出以偏概全时必须说明遗漏块
cases:
  canonical: cases/R06/canonical/case.yaml
  counterexample: cases/R06/counterexamples/case.yaml
  boundary: cases/R06/boundary/case.yaml
  transfer: cases/R06/transfer/case.yaml
four_step_card:
  start: 全文主旨、目的或标题题中，多个选项都相关却一直二选一。
  first_cut: 先写出全文 2–4 个不可缺核心块 A+B+C。
  judge: 对照候选是否缺块、多块或把块间关系换错。
  stop: 明确细节题、单段题或主要段落不全时停止。
practicality_gate:
  status: design_complete_empirical_pending
  trigger: 只由全文主旨、写作目的或最佳标题任务触发。
  action: 从开头、结尾和各段主要任务提取 2–4 块，再给候选标缺块/多块/错关系。
  output: decide；用覆盖与关系排除主旨干扰项。
  stop: 题干范围不是全文，或无法建立可验核心块时停止。
  transfer: 核心块覆盖+块间关系可迁移到不同文体的全文概括。
  efficiency: 把多个抽象选项转成少量核心块对照，减少反复回文和范围犹豫。
  misuse_cost: high；核心块提错会系统性误判，因此必须先由全文取证而不是从候选倒推。
