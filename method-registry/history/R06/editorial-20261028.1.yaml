levels:
  L1: 识别明显只覆盖一段的候选。
  L2: 对照所问范围已核实的核心对象与关系，比较候选的完整覆盖，不固定块数。
  L3: 区分缺块、扩大范围和换属性。
  L4: 在覆盖齐全时继续核对对比、因果、变化等块间关系。
compact:
  line: 把候选拆成谈什么与作什么判断，对照所问范围的已证核心关系，指出具体遗漏。
  boundary: 没有已证核心关系先停；省略、近义或上位概念能覆盖时，不能因没原词判缺失。
  10s: 主旨项相关却不全？对照已核核心指出遗漏；近义或概括能覆盖就别排。
  30s: 主旨项相关却不全？先在已核实框架旁写候选谈谁、说了什么；核心还没核实先不排项。例如，全文重点是问题及解决，候选只说问题，要核它是否漏掉解决关系。核心未核好先停；不是缺原词就缺内容。
  90s: 主旨项相关却不全？把候选拆成谈什么与作什么判断，对照所问范围的已证核心关系，指出具体遗漏。这一步得到的只判断当前证据能支持或排除什么，不能由剩余项自动定案。判断时，确认遗漏所问核心内容才排该项；诊断标签不负责生成全文框架，也不独立完成整题。什么时候停，没有已证核心关系先停；省略、近义或上位概念能覆盖时，不能因没原词判缺失。反例示意，候选用省略、近义或上位概念准确覆盖所问核心，没重复每个原词也不能判缺失。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，先不选，只指出候选疑似遗漏什么，并标能证明它是所问核心的文本位置。
full:
  summary: 把候选拆成谈什么与作什么判断，对照所问范围的已证核心关系，指出具体遗漏。 确认遗漏所问核心内容才排该项；诊断标签不负责生成全文框架，也不独立完成整题。
  source_boundary: 没有已证核心关系先停；省略、近义或上位概念能覆盖时，不能因没原词判缺失。
  boundaries:
  - 没有已证核心关系先停；省略、近义或上位概念能覆盖时，不能因没原词判缺失。
  - 候选用省略、近义或上位概念准确覆盖所问核心，没重复每个原词也不能判缺失。
  section_ids:
  - 208c9f4b0e5b95f6
  beginner_support:
    first_micro_action: 先在已核实框架旁写候选谈谁、说了什么；核心还没核实先不排项。
    prerequisite: 先读清题干所问对象，能说明当前这句谁做什么；挡住判断的词不认识，先标出求助，不用词面相似代替句意。
    if_stuck: 先停在已确认的词句位置；读不清决定性词义或核心关系时标缺口，不排选项。
    example: 全文重点是问题及解决，候选只说问题，要核它是否漏掉解决关系。
    example_scope: 关系/结构示意，非完整试题，不计真题或已验案例。
    micro_action_is_not_completion: 完成第一小步不等于完整方法成功；继续完成四步卡的判断与停止核验。
    short_stop: 核心未核好先停；不是缺原词就缺内容。
  presentation_revision: 2026-10-28.1
