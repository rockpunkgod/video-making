method_id: R06
brand_name: 主旨缺块
source_name: 主旨缺失（判项诊断用语）
aliases:
- 主旨缺失（判项诊断用语）
question_type: 阅读理解
role: decider
primary_role: decider
secondary_roles: []
output_type: decide
student_symptoms:
- 主旨题总在两个相关选项之间摇摆。
- 容易选范围最大、词频最高或只概括一部分的选项。
trigger_cues:
- 主旨、标题或目的候选疑似遗漏已经核实的核心对象、动作或关系。
core_action: 把候选拆成谈什么与作什么判断，对照所问范围的已证核心关系，指出具体遗漏。
decision_rule: 确认遗漏所问核心内容才排该项；诊断标签不负责生成全文框架，也不独立完成整题。
verification: 确认遗漏所问核心内容才排该项；诊断标签不负责生成全文框架，也不独立完成整题。 没有已证核心关系先停；省略、近义或上位概念能覆盖时，不能因没原词判缺失。
stop_rule: 没有已证核心关系先停；省略、近义或上位概念能覆盖时，不能因没原词判缺失。
common_wrong_instinct: 把抽象、范围大、包含其他选项或出现段数多当作正确主旨。
failure_cases:
- 把抽象、范围大、包含其他选项或出现段数多当作正确主旨。
- 没有已证核心关系先停；省略、近义或上位概念能覆盖时，不能因没原词判缺失。
counterexamples:
- 候选用省略、近义或上位概念准确覆盖所问核心，没重复每个原词也不能判缺失。
transfer_pattern: 换全文或段落概括任务，仍先核所问范围的实际核心，再诊断具体遗漏，不固定块数。
memory_line: 核心先有证据，才说这项缺什么。
anti_rule: 范围最大 ≠ 主旨。
visual_formula: '已证所问核心：对象 + 关系

  候选：谈什么 + 判断什么

  确认遗漏核心 → 排该项

  近义/省略已覆盖 → 不判缺失'
challenge_prompt: 先不选，只指出候选疑似遗漏什么，并标能证明它是所问核心的文本位置。
