method_id: R08
brand_name: 例子只作证
source_name: 例子非答案
aliases:
- 例子非答案
question_type: 阅读理解
method_type: method
role: interpreter
primary_role: interpreter
secondary_roles: []
output_type: interpret
student_symptoms:
- 题干问例子的作用而不是例子细节
trigger_cues:
- 题干问例子作用，或主旨/观点候选只复述例中细节而未概括其支持观点。
core_action: 圈例子及必要前后观点，分别写例中发生什么与它支持哪种判断，再核候选声称的作用或覆盖。
decision_rule: 产出例子—观点支持关系；只复述局部通常不足回答作用或主旨，抽象项也须有真实支持。
verification: 产出例子—观点支持关系；只复述局部通常不足回答作用或主旨，抽象项也须有真实支持。 直接考例中事实不用本法排细节；作用新增无依据则撤回，段首段尾和主题词只作入口，不机械见细节必排。
stop_rule: 直接考例中事实不用本法排细节；作用新增无依据则撤回，段首段尾和主题词只作入口，不机械见细节必排。
common_wrong_instinct: 看到人名数字就选复述细节，或反过来无条件选最抽象的说法。
failure_cases:
- 看到人名数字就选复述细节，或反过来无条件选最抽象的说法。
- 直接考例中事实不用本法排细节；作用新增无依据则撤回，段首段尾和主题词只作入口，不机械见细节必排。
counterexamples:
- 题干直接问研究中发生了什么，细节本身就是所问；不能用例子非答案把有据细节排掉。
transfer_pattern: 人物、数字、引用与研究都用事实—支持观点两栏，不迁移具体例子结论。
memory_line: 圈例子及必要前后观点，分别写例中发生什么与它支持哪种判断，再核候选声称的作用或覆盖。
anti_rule: 更抽象 ≠ 举例作用正确。
visual_formula: "题干：问事实？→ 核事实\n      问作用？↓\n例中发生什么 + 前后观点\n→ 例子支持哪句（核方向）"
challenge_prompt: 先别选，写两栏：例中发生什么、作者用它支持哪句；给第二栏标前后取证位置。
