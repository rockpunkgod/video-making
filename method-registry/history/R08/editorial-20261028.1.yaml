levels:
  L1: 圈例子前后被支持的观点，再用例子内容检验它实际支持哪句
  L2: 分开例中事实与举例作用，按例中动作和前后评价核候选所称原因、后果、危害或重要性；产出被例子支持的观点。
  L3: 直接问例中事实时不启动作用排除；候选更抽象却没有前后观点与例中动作支持时停止初判，不能补造作者用途。
  L4: 人物、数字、引用与研究都用事实—支持观点两栏，不迁移具体例子结论。
compact:
  line: 圈例子及必要前后观点，分别写例中发生什么与它支持哪种判断，再核候选声称的作用或覆盖。
  boundary: 直接考例中事实不用本法排细节；作用新增无依据则撤回，段首段尾和主题词只作入口，不机械见细节必排。
  10s: 例子题卡住？先分例中事实和举例作用，再找它支持的观点；不见细节就排。
  30s: 例子题卡住？先圈题干问的是例中事实还是举例作用；事实题不按例子规则排细节。例如，问实验发生什么，细节本身可能就是所问。直接问例中事实时不用本法排细节。
  90s: 例子题卡住？圈例子及必要前后观点，分别写例中发生什么与它支持哪种判断，再核候选声称的作用或覆盖。这一步得到的是把当前关系或表达解释清楚，还要核完整题目。判断时，产出例子—观点支持关系；只复述局部通常不足回答作用或主旨，抽象项也须有真实支持。什么时候停，直接考例中事实不用本法排细节；作用新增无依据则撤回，段首段尾和主题词只作入口，不机械见细节必排。反例示意，题干直接问研究中发生了什么，细节本身就是所问；不能用例子非答案把有据细节排掉。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，先别选，写两栏：例中发生什么、作者用它支持哪句；给第二栏标前后取证位置。
