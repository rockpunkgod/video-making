levels:
  L1: 圈题目文体对象目的，调用对应骨架，不把文体模板算独立原创规则
  L2: 圈文体、对象与交际目的，再让开头、主体、结尾各承担对应任务；邀请/建议/感谢/通知/演讲/报道的骨架只组织题面内容，不新增义务。
  L3: 题面格式、已给首尾或目的另有要求时服从题面，不硬套三段或称呼；骨架不是原创品牌判据，也不能以句型齐全判内容完成。
  L4: 文体变时更换段落任务，但始终由对象、目的和具体要点决定内容。
compact:
  line: 圈题面文体、对象、目的及明示格式，让各段承担实际要点功能，再选择相应文体骨架。
  boundary: 题面已给标题首尾或特殊格式就按要求保留，不硬套段数；示范句型不作每篇配额，骨架齐不等于要点完成。
  10s: 文体格式拿不准？先圈写给谁和写作目的，再安排段落任务；骨架不是要点。
  30s: 文体格式拿不准？先圈题面文体和写给谁，再把一个要点分配给相应段落。例如，感谢和邀请的结尾任务不同，不能照搬同一模板。题面给了特殊格式先遵守，不强套段数或句型。
  90s: 文体格式拿不准？圈题面文体、对象、目的及明示格式，让各段承担实际要点功能，再选择相应文体骨架。这一步得到的是一份待核的框架或计划，不是答案或分数。判断时，产出服务题面内容的结构计划；人物介绍等细化依题目取用，三件套四件套等整理便称不冒充独立原名。什么时候停，题面已给标题首尾或特殊格式就按要求保留，不硬套段数；示范句型不作每篇配额，骨架齐不等于要点完成。反例示意，有邀请结尾的模板不适合只需感谢的任务；题目已给开场时不应再重写一个改变格式的开头。此为条件示意，不是真题。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，不写套话，只圈文体对象目的，再给三部分各写一个任务标签。
