trigger_cues:
- 应用文题面需要安排文体、对象与交际目的相符的内容骨架。
core_action: 圈题面文体、对象、目的及明示格式，让各段承担实际要点功能，再选择相应文体骨架。
decision_rule: 产出服务题面内容的结构计划；人物介绍等细化依题目取用，三件套四件套等整理便称不冒充独立原名。
verification: 产出服务题面内容的结构计划；人物介绍等细化依题目取用，三件套四件套等整理便称不冒充独立原名。 题面已给标题首尾或特殊格式就按要求保留，不硬套段数；示范句型不作每篇配额，骨架齐不等于要点完成。
stop_rule: 题面已给标题首尾或特殊格式就按要求保留，不硬套段数；示范句型不作每篇配额，骨架齐不等于要点完成。
common_wrong_instinct: 看到某文体就抄整段模板，忘记核对任务和读者。
failure_cases:
- 看到某文体就抄整段模板，忘记核对任务和读者。
- 题面已给标题首尾或特殊格式就按要求保留，不硬套段数；示范句型不作每篇配额，骨架齐不等于要点完成。
counterexamples:
- 有邀请结尾的模板不适合只需感谢的任务；题目已给开场时不应再重写一个改变格式的开头。此为条件示意，不是真题。
transfer_pattern: 文体变时更换段落任务，但始终由对象、目的和具体要点决定内容。
memory_line: 圈题面文体、对象、目的及明示格式，让各段承担实际要点功能，再选择相应文体骨架。
anti_rule: 模板对路 ≠ 要点齐全。
visual_formula: '文体 + 对象 + 目的

  → 开头任务 / 主体任务 / 结尾任务

  → 逐项安放题面内容'
challenge_prompt: 不写套话，只圈文体对象目的，再给三部分各写一个任务标签。
