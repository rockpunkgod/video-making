  L2: 辨认当前训练缺口，按模板基础→句子素材→自然句型升级→句式重构选择一个可复练任务，读/背/仿记录实际完成产物；分数锚定只作课程训练参考。
  L3: 这是课后训练规划，不是当场答案或个体得分预测；基础翻译、任务覆盖未稳不跳到复杂升级，不因背完金句承诺10分或15分。
  L4: 不同薄弱点仍用当前产出定缺口和下一步，不用模板数量替代能力证据。
