core_action: 依据现有稿件或练习，标任务骨架、基础翻译、素材调用或自然升级的缺口，选择一个对应阶段的复练动作。
decision_rule: 产出下一次具体训练计划；读背仿与分数锚定只作原课程训练参考，不是现场答案或个体得分保证。
verification: 产出下一次具体训练计划；读背仿与分数锚定只作原课程训练参考，不是现场答案或个体得分保证。 没有现稿不精确承诺档次；基础未稳不跳华丽结构，金句积累数量不作单篇使用数，110/120不当整篇词数策略。
stop_rule: 没有现稿不精确承诺档次；基础未稳不跳华丽结构，金句积累数量不作单篇使用数，110/120不当整篇词数策略。
common_wrong_instinct: 把背模板、背金句的完成数量当成稳定得分保证。
failure_cases:
- 把背模板、背金句的完成数量当成稳定得分保证。
- 没有现稿不精确承诺档次；基础未稳不跳华丽结构，金句积累数量不作单篇使用数，110/120不当整篇词数策略。
counterexamples:
- 背熟升级素材但基础句和任务要点还错，不应直接进入满分训练，也不能据背诵量判真实作文档次。此为条件示意，不是真题。
transfer_pattern: 不同薄弱点仍用当前产出定缺口和下一步，不用模板数量替代能力证据。
memory_line: 依据现有稿件或练习，标任务骨架、基础翻译、素材调用或自然升级的缺口，选择一个对应阶段的复练动作。
anti_rule: 完成训练量 ≠ 保证分数。
visual_formula: '训练缺口 → 当前阶段

  模板 / 素材 / 自然升级 / 重构

  → 一个复练任务，不预测分数'
challenge_prompt: 先不报目标分，只用一条自己的产出说明当前缺口，再选一个读、背或仿写任务。
