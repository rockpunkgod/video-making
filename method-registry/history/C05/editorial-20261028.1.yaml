counterexamples:
- 两个积极评价词，一个指情感投入、一个指客观状态；当前题面只支持其中一类，不能因同为积极词混用。
transfer_pattern: 换题材仍逐项写具体含义与使用条件，不沿用近义词中文标签或同向主题。
memory_line: 并列写出各项具体状态、程度或功能，回原文对象核差异，词义未知就停
