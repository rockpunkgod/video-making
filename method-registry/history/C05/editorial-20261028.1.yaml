  30s: 近义项总犹豫？先写两个近义项在这里各自要求的具体意思，不确定词义先留缺口。例如，情感投入不等于客观状态，两种积极评价也可能不同。词义或搭配不明先留缺口，不凭主旨强选。
  90s: 近义项总犹豫？并列写出各项具体状态、程度或功能，回原文对象核差异，词义未知就停这一步得到的是把当前关系或表达解释清楚，还要核完整题目。判断时，并列写出各候选具体状态、程度、功能或惯用要求，再核当前对象实际处境；输出候选词义差异，不把中文近义或褒贬同向当等值。什么时候停，词义或搭配不能确认时说明缺口并暂停，不能凭主旨或中文翻译强选；情感投入与客观状态要分开。反例示意，两个积极评价词，一个指情感投入、一个指客观状态；当前题面只支持其中一类，不能因同为积极词混用。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，不选答案，只把两个近义项的具体差异写出来，再圈原文能约束该差异的对象或状态。
