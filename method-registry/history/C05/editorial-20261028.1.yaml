core_action: 并列写出各项具体状态、程度或功能，回原文对象核差异，词义未知就停
decision_rule: 并列写出各候选具体状态、程度、功能或惯用要求，再核当前对象实际处境；输出候选词义差异，不把中文近义或褒贬同向当等值。
verification: 并列写出各项具体状态、程度或功能，回原文对象核差异，词义未知就停。并列写出各候选具体状态、程度、功能或惯用要求，再核当前对象实际处境；输出候选词义差异，不把中文近义或褒贬同向当等值。
  词义或搭配不能确认时说明缺口并暂停，不能凭主旨或中文翻译强选；情感投入与客观状态要分开。
stop_rule: 词义或搭配不能确认时说明缺口并暂停，不能凭主旨或中文翻译强选；情感投入与客观状态要分开。
common_wrong_instinct: 几个词中文都译得差不多，就选最贴主题或最积极的一个。
