  90s: 已有续写稿，需要依据真实缺口安排下一次训练。 手上先做：按现稿先核完整和因果，再选细节衔接、合理转折或精准表达中的一项复练。 做完得到：产出可执行训练任务；秋16分档训练与25分整体评分分别使用，不拼成官方逐项配额。
