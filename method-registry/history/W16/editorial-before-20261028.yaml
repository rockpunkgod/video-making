student_symptoms:
- 课后需确定下一档训练缺口
trigger_cues:
- 已有续写稿，需要依据真实缺口安排下一次训练。
core_action: 按现稿先核完整和因果，再选细节衔接、合理转折或精准表达中的一项复练。
decision_rule: 产出可执行训练任务；秋16分档训练与25分整体评分分别使用，不拼成官方逐项配额。
verification: 产出可执行训练任务；秋16分档训练与25分整体评分分别使用，不拼成官方逐项配额。 缺现稿不精确诊断或承诺升档；基础未稳不跳华丽升级，不机械增加动作、复杂句、转折或独立升华句。
stop_rule: 缺现稿不精确诊断或承诺升档；基础未稳不跳华丽升级，不机械增加动作、复杂句、转折或独立升华句。
common_wrong_instinct: 把某一高分句型练完，就觉得作文已经升了一档。
failure_cases:
- 把某一高分句型练完，就觉得作文已经升了一档。
- 缺现稿不精确诊断或承诺升档；基础未稳不跳华丽升级，不机械增加动作、复杂句、转折或独立升华句。
counterexamples:
- 高阶句式写得熟但段间缺桥，仍应先练桥接而非更多句式；合理无反转的文章也不必为训练表硬加事故。此为训练示意，不是真题。
transfer_pattern: 换学生稿仍用该稿证据选缺口，不按背诵数量假定能力。
memory_line: 按现稿先核完整和因果，再选细节衔接、合理转折或精准表达中的一项复练。
anti_rule: 练完句型 ≠ 档次升级。
visual_formula: '现稿证据 → 当前缺口

  完整 → 因果准确 → 有效细节衔接

  → 自然表达升级（不是得分预测）'
challenge_prompt: 先不定分数目标，指出当前稿一处缺口，选一个下次可以重复的动作。
