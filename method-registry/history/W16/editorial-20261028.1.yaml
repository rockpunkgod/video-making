levels:
  L1: 按现稿证据选对应升级动作，不把训练模板直接当官方独立扣分项
  L2: 按现稿实际缺口选下一项训练：先完整、再因果准确、再有效细节衔接、再自然转折与精准表达；产物是一个可复练动作，不是个体档次升级承诺。
  L3: 训练路径不代替25分定档，缺当前稿不能精确诊断；基础逻辑语言未稳不跳到华丽表达。每项练习都受原文约束，不机械追加转折或升华。
  L4: 换学生稿仍用该稿证据选缺口，不按背诵数量假定能力。
compact:
  line: 按现稿先核完整和因果，再选细节衔接、合理转折或精准表达中的一项复练。
  boundary: 缺现稿不精确诊断或承诺升档；基础未稳不跳华丽升级，不机械增加动作、复杂句、转折或独立升华句。
  10s: 续写练不动？先看现稿是否完整顺因果，只选一处改；高阶句型不是第一步。
  30s: 续写练不动？先从现稿核故事是否完整，只选一个下一次训练动作，不先练华丽结构。例如，段间还缺桥，就先练桥接，不先增加更多句式。基础未稳不跳升级，不强加转折、动作或升华配额。
  90s: 续写练不动？按现稿先核完整和因果，再选细节衔接、合理转折或精准表达中的一项复练。这一步得到的是一份待核的框架或计划，不是答案或分数。判断时，产出可执行训练任务；秋16分档训练与25分整体评分分别使用，不拼成官方逐项配额。什么时候停，缺现稿不精确诊断或承诺升档；基础未稳不跳华丽升级，不机械增加动作、复杂句、转折或独立升华句。反例示意，高阶句式写得熟但段间缺桥，仍应先练桥接而非更多句式；合理无反转的文章也不必为训练表硬加事故。此为训练示意，不是真题。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，先不定分数目标，指出当前稿一处缺口，选一个下次可以重复的动作。
full:
  summary: 按现稿先核完整和因果，再选细节衔接、合理转折或精准表达中的一项复练。 产出可执行训练任务；秋16分档训练与25分整体评分分别使用，不拼成官方逐项配额。
  source_boundary: 缺现稿不精确诊断或承诺升档；基础未稳不跳华丽升级，不机械增加动作、复杂句、转折或独立升华句。
  boundaries:
  - 缺现稿不精确诊断或承诺升档；基础未稳不跳华丽升级，不机械增加动作、复杂句、转折或独立升华句。
  - 高阶句式写得熟但段间缺桥，仍应先练桥接而非更多句式；合理无反转的文章也不必为训练表硬加事故。此为训练示意，不是真题。
  section_ids:
  - 0601c0f1de7a4b8f
  - 7b4c299267a685c2
  beginner_support:
    first_micro_action: 先从现稿核故事是否完整，只选一个下一次训练动作，不先练华丽结构。
    prerequisite: 先备齐原文与两段首句，分清原文已发生与自己准备写的内容；可以先用中文标功能，不急着写复杂英文。
    if_stuck: 先保留有依据的中文功能提纲或准确简单句；缺口留空，不能用事故、超能力或独立升华填补。
    example: 段间还缺桥，就先练桥接，不先增加更多句式。
    example_scope: 关系/结构示意，非完整试题，不计真题或已验案例。
    micro_action_is_not_completion: 完成第一小步不等于完整方法成功；继续完成四步卡的判断与停止核验。
    short_stop: 基础未稳不跳升级，不强加转折、动作或升华配额。
  presentation_revision: 2026-10-28.1
