method_id: A04
brand_name: 句块拼接
source_name: 复杂句式模块法
aliases:
- 复杂句式模块法
question_type: 应用文
method_type: method
role: interpreter
primary_role: interpreter
secondary_roles: []
output_type: interpret
student_symptoms:
- 多个动作要合成复杂句
trigger_cues:
- 已有准确主干及相关动作，需要按真实逻辑合成复杂表达。
core_action: 各动作先独立写成正确简单句，标实际关系，再选合适从句、非谓语、连接词或介词短语粘连。
decision_rule: 产出主干、指代与原关系不变的复杂句块；两简一复从是原课扩句练习，不是整篇句数或从句配额。
verification: 产出主干、指代与原关系不变的复杂句块；两简一复从是原课扩句练习，不是整篇句数或从句配额。 基础句或关系未成立不合并；动作主体或依附错误退回独立句，不为复杂度强拼或把训练配比作语法上限。
stop_rule: 基础句或关系未成立不合并；动作主体或依附错误退回独立句，不为复杂度强拼或把训练配比作语法上限。
common_wrong_instinct: 只要两句能加一个连接词，就默认复杂句更高级。
failure_cases:
- 只要两句能加一个连接词，就默认复杂句更高级。
- 基础句或关系未成立不合并；动作主体或依附错误退回独立句，不为复杂度强拼或把训练配比作语法上限。
counterexamples:
- 两个动作发生在不同主体上，不能随便用省略主体的非谓语串到同一主句；本来无因果的两项也不能靠because造因果。此为关系示意，不是真题。
transfer_pattern: 不同题材都先拆动作、核主体，再按实际关系拼接。
memory_line: 各动作先独立写成正确简单句，标实际关系，再选合适从句、非谓语、连接词或介词短语粘连。
anti_rule: 拼得长 ≠ 接得对。
visual_formula: '动作1 → 正确简单句

  动作2 → 正确简单句

  真实关系 + 合法连接 → 句块'
challenge_prompt: 先不合句，把要写的内容拆成动作模块；给每块写主体，再标两块的实际关系。
