levels:
  L1: 每个动作先写正确简单句，再按真实关系用从句、非谓语或连接词粘连
  L2: 每个模块先独立成句，再标实际并列、因果、条件或修饰关系；连接后主干和指代不变才保留，得到逻辑成立的句块。
  L3: 基础句未正确先修句；逻辑关系不明不合并。非谓语的动作主体或从句依附不成立，退回独立句，不为复杂度强拼。
  L4: 不同题材都先拆动作、核主体，再按实际关系拼接。
compact:
  line: 各动作先独立写成正确简单句，标实际关系，再选合适从句、非谓语、连接词或介词短语粘连。
  boundary: 基础句或关系未成立不合并；动作主体或依附错误退回独立句，不为复杂度强拼或把训练配比作语法上限。
  10s: 想合长句？先各写正确简单句，再核真实关系；合不稳就保留独立句。
  30s: 想合长句？先把两件相关的事分别写成准确简单句；不会合并先保留原句。例如，两个动作主体不同，不能随便省略主体接成非谓语。基础句或关系不成立不合并，不凑从句数量。
  90s: 想合长句？各动作先独立写成正确简单句，标实际关系，再选合适从句、非谓语、连接词或介词短语粘连。这一步得到的是把当前关系或表达解释清楚，还要核完整题目。判断时，产出主干、指代与原关系不变的复杂句块；两简一复从是原课扩句练习，不是整篇句数或从句配额。什么时候停，基础句或关系未成立不合并；动作主体或依附错误退回独立句，不为复杂度强拼或把训练配比作语法上限。反例示意，两个动作发生在不同主体上，不能随便用省略主体的非谓语串到同一主句；本来无因果的两项也不能靠because造因果。此为关系示意，不是真题。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，先不合句，把要写的内容拆成动作模块；给每块写主体，再标两块的实际关系。
