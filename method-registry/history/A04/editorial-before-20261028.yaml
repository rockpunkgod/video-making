levels:
  L1: 每个动作先写正确简单句，再按真实关系用从句、非谓语或连接词粘连
  L2: 每个模块先独立成句，再标实际并列、因果、条件或修饰关系；连接后主干和指代不变才保留，得到逻辑成立的句块。
  L3: 基础句未正确先修句；逻辑关系不明不合并。非谓语的动作主体或从句依附不成立，退回独立句，不为复杂度强拼。
  L4: 不同题材都先拆动作、核主体，再按实际关系拼接。
