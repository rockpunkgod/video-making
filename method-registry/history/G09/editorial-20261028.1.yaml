core_action: 圈限定、数量和所有关系，核派生、单复数或所有格，不见提示动词就进动词路线
decision_rule: 在名词性位置核派生名词/动名词的具体结构，再按限定、数量、谓语和句意核单复数或所属；名词中心和搭配相符后定形。
verification: 圈限定、数量和所有关系，核派生、单复数或所有格，不见提示动词就进动词路线。在名词性位置核派生名词/动名词的具体结构，再按限定、数量、谓语和句意核单复数或所属；名词中心和搭配相符后定形。
  名词性功能不排除所有doing；介词后不一律派生名词，也不一律doing。名词修饰另一名词可能仍保留名词，结构搭配未核就停。
stop_rule: 名词性功能不排除所有doing；介词后不一律派生名词，也不一律doing。名词修饰另一名词可能仍保留名词，结构搭配未核就停。
common_wrong_instinct: 只说这里要名词就排所有doing，或见修饰名词就改成形容词。
failure_cases:
- 只说这里要名词就排所有doing，或见修饰名词就改成形容词。
- 名词性功能不排除所有doing；介词后不一律派生名词，也不一律doing。名词修饰另一名词可能仍保留名词，结构搭配未核就停。
counterexamples:
- 课程After spending...说明介词后可有动名词；不能把所有介词后提示动词都派生成名词。
transfer_pattern: 新名词空仍核实际结构、数与所属，不迁移介词后唯一词形的假设。
memory_line: 圈限定、数量和所有关系，核派生、单复数或所有格，不见提示动词就进动词路线
anti_rule: 名词性位置 ≠ 只能派生名词。
visual_formula: '名词性位置 → 具体结构/搭配

  派生名词 / 动名词 / 名词定语

  ↓ 数量 + 限定 + 所属

  → 名词形式（decide）'
challenge_prompt: 先不填，在空旁画名词中心或动名词结构，标限定、数量和所属线索，指出排另一形式所缺的结构依据。
