schema_version: 1.0.0
name: method-card
description: 高考英语品牌方法卡的最小完整约定。
required_fields:
  - method_id
  - brand_name
  - source_name
  - aliases
  - question_type
  - role
  - primary_role
  - secondary_roles
  - output_type
  - student_symptoms
  - trigger_cues
  - core_action
  - decision_rule
  - verification
  - stop_rule
  - common_wrong_instinct
  - failure_cases
  - counterexamples
  - transfer_pattern
  - memory_line
  - anti_rule
  - visual_formula
  - challenge_prompt
  - source_references
  - can_follow
  - usually_before
  - usually_after
  - conflicts_with
  - cannot_replace
  - levels
  - compact
  - full
  - cases
  - four_step_card
  - practicality_gate
  - first_use_test
  - evaluation
  - usefulness_level
  - status
  - version
allowed_roles:
  - locator
  - interpreter
  - reducer
  - decider
  - verifier
  - framework
allowed_output_types:
  - locate
  - interpret
  - reduce
  - decide
  - verify
allowed_usefulness_levels:
  - Useful
  - Efficient
  - Signature
allowed_statuses:
  - draft
  - candidate
  - validated
  - stable
  - deprecated
case_types:
  - canonical
  - counterexample
  - boundary
  - transfer
status_gate:
  candidate: 结构完整，证据可追溯，但允许例题缺口。
  validated: 四类案例均有可核题面，且原回归与边界测试通过。
  stable: 在 validated 基础上经多题材迁移和版本回归，无待解证据冲突。
usefulness_gate:
  Useful: 有证据支持其能解决真实题面中的明确问题。
  Efficient: 在 Useful 基础上，盲测显示步骤、阅读范围、候选或犹豫至少一项明显下降。
  Signature: 同时通过正确、触发、执行、迁移、记忆、可视化和传播验收。
invariants:
  - compact 不得产生与 full 冲突的结论。
  - locator 和 reducer 不得将缩小范围写成直接定案。
  - 传播口令不得独立作为答案依据。
  - 每个 source_reference 必须同时固定仓库、提交、路径和章节。
  - 方法改动通过新 version 记录，不覆盖历史。
  - primary_role 必须与 role 相同，学生首次接触版只强调该职责。
  - validated 或 stable 必须通过 Practicality Gate 和 First-use Test。
  - Signature 必须有完整 Blind Evaluation 和 Baseline 对照，不得由内部自评产生。
