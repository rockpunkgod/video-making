[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gaokao-method-engine"
version = "0.2.0"
description = "Evidence-grounded Gaokao English method and question-analysis system"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7", "jsonschema>=4,<5", "Pillow>=12,<13"]

[project.optional-dependencies]
scratch-voice = ["edge-tts>=7.2.8,<8"]

[project.scripts]
answer-engine = "answer_engine.__main__:main"
video-os = "content_os.__main__:main"
ae-production = "ae_production.__main__:main"
creative-os = "creative_os.__main__:main"

[tool.setuptools.packages.find]
include = ["answer_engine*", "core*", "renderers*", "evaluation*", "scripts*", "content_os*", "video_contracts*", "ae_production*", "creative_os*"]
exclude = ["tests*"]
