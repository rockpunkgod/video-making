method_id: G01
case_type: counterexample
status: verified_course_example
objective: 防止把介词后需要名词性成分简化成一律派生名词。
source_item: 2021全国高考甲卷语法填空，课程讲义 PDF 第4页。
prompt_excerpt: After ___ (spend) some time looking at all the defensive equipment...
expected_action: 标有提示词；识别 After 后需要名词性成分；再核动名词结构可带宾语 some time。
expected_result: spending
pass_condition: 不用介词后只能名词的伪规则排除 doing。
