  - 候选与上下句有对象或词义复现
  core_action: 圈两边对应对象与动作，标同指或同义关系，再回填核上下句和段落任务
  decision_rule: 圈明确复现、近义或指代，写清连接的对象、事件或整句内容，再回填核空前条件、空后结果和段落任务；输出呼应核验，不靠重词数量定案。
  verification: 圈两边对应对象与动作，标同指或同义关系，再回填核上下句和段落任务。圈明确复现、近义或指代，写清连接的对象、事件或整句内容，再回填核空前条件、空后结果和段落任务；输出呼应核验，不靠重词数量定案。
    只是同主题或翻译通却没有明确呼应时不命名本法；同词多项都能接时比完整断言。形式it、概括名词或latter必须按实际内容还原，不能强找最近名词。
  stop_rule: 只是同主题或翻译通却没有明确呼应时不命名本法；同词多项都能接时比完整断言。形式it、概括名词或latter必须按实际内容还原，不能强找最近名词。
  common_wrong_instinct: 每找到一个重复词就增加信心，却没有说明它到底承接谁或哪件事。
  failure_cases:
  - 每找到一个重复词就增加信心，却没有说明它到底承接谁或哪件事。
  - 只是同主题或翻译通却没有明确呼应时不命名本法；同词多项都能接时比完整断言。形式it、概括名词或latter必须按实际内容还原，不能强找最近名词。
  counterexamples:
  - 两个候选都重复同一个主题词，但其中一项的动作不能承接空前条件；重词再多也不证明闭环。
  transfer_pattern: 换文章仍核同指或同义的实际对象及前后联系，不迁移固定对应词对。
  memory_line: 圈两边对应对象与动作，标同指或同义关系，再回填核上下句和段落任务
