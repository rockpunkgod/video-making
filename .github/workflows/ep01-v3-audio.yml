name: EP01 V3 audio isolated checks
on:
  push:
    branches: [ep01-v3-soft-sound-20261103]
    paths:
      - 'scripts/ep01_v3_soft_audio.py'
      - 'scripts/ep01_v3_run_windows.ps1'
      - 'tests/test_ep01_v3_natural_audio.py'
      - '.github/workflows/ep01-v3-audio.yml'
  workflow_dispatch:
jobs:
  v3-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile script
        run: python -m py_compile scripts/ep01_v3_soft_audio.py
      - name: V3 isolated tests (no video export)
        run: python -m unittest discover -s tests -p 'test_ep01_v3_natural_audio.py' -v
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/ep01_v3_run_windows.ps1).Path,
            [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
