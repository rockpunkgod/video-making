    beginner_support:
      first_micro_action: 先只标本空有没有括号提示词，再在未填句圈决定它功能的词，不开始变形。
      prerequisite: 先把空保留不填，圈本句动作和对应的人或物。主语是谁或什么，谓语是这句的完整动作或状态；分不清先核完整句。
      if_stuck: 先标有无提示和空位所在结构；成分/词义不清停在节点前，不从答案倒贴功能。
      example: environmental ___ (protect)要核名词中心，不能见protect就走动词路线。
      example_scope: 关系/结构示意，非完整试题，不计真题或已验案例。
      micro_action_is_not_completion: 完成第一小步不等于完整方法成功；继续完成四步卡的判断与停止核验。
      short_stop: 功能不明先补完整句；到节点后改用具体规则。
    presentation_revision: 2026-10-28.2
    source_update_note: 一看二思保原名；反身回查不靠人称重复；why/how不按是否发生定词；非谓语按成分定主人，完成不定式不一律禁作后置修饰，逗号不独自定doing。
