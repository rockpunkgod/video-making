  entry_copy: '看到括号里的词就立即变形时，先停。第一眼只问：这个空有没有提示词？没有，就看这个位置需要限定、介词、指代、连接还是句间逻辑。有，就先在未填句中判定该位置要名、形、副、代、数还是动。只有已确认这里需要动词形式，才再分谓语和非谓语。到达具体知识节点就停止总树，改用该节点的句法、搭配和句意判据。换任何新题，有无提示+空位功能都能重复。


    你可以直接说：这个空先判位置，别急着变词。'
  student_ready: true
