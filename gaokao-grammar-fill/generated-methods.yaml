methods:
- method_id: G01
  brand_name: 先判空位
  source_name: 语法填空总路线（操作整理，非课程原名）
  aliases:
  - 先判空再变词
  - 空位决策树
  question_type: 语法填空
  role: framework
  primary_role: framework
  secondary_roles: []
  output_type: reduce
  student_symptoms:
  - 看到括号里的词就立即开始变形，不知道变成哪类词。
  - 无提示词时把所有功能词一起猜，有提示词时又见动词就直接判谓语/非谓语。
  trigger_cues:
  - 任何语法填空空位开始处理时。
  - 空位旁有或没有括号提示词，且尚未确定该位置的句法成分/词性。
  core_action: 圈出空后的括号提示词（若有），再圈空前后支配或修饰词，在未填句上标明空位成分；确认需要动词才分谓语/非谓语。
  decision_rule: 无提示词进功能词路线；有提示词先确定需要的词性/成分；只在已确认需要动词形式时才进谓语/非谓语分支。
  verification: '以未填句为准，先划分分句、主干、空位和标点关系。

    无提示词：按空位需要检查限定（冠词）、介词、指代、连接或句间逻辑。

    有提示词：先判定名词、形容词、副词、代词、数词或动词位置，再处理派生或形态。

    需要动词形式：数已有谓语并看连接；谓语核时态、语态、主谓一致，非谓语核作用、逻辑主语、主被动与先后。

    填回原句，用句法、搭配与句意复核。'
  stop_rule: 提示词是什么词性，不等于答案就是什么词性。
  common_wrong_instinct: 看到括号里的词就立即变形，尤其看到动词就直接进谓语/非谓语。
  failure_cases:
  - 尚未划清分句和主干时，不能凭相邻词直接确定词性。
  - 介词后需要名词性成分，但名词与动名词仍要依结构、搭配和意思区分。
  - 决策树给出的是待核类别，不是免验证的最终词形。
  counterexamples:
  - '`environmental ___ (protect)` 的提示词是动词，但空位需要被形容词修饰的名词中心，应走名词节点而非非谓语节点。'
  - 介词后虽是名词性位置，但课程例 `After spending...` 说明 doing 可作名词性成分，不能见介词就一律派生名词。
  transfer_pattern: 每一个新语法填空都可先做有无提示词和空位功能两层判定，再进知识节点。
  memory_line: 先判空，再变词。
  anti_rule: 提示词词性 ≠ 答案词性。
  visual_formula: "空位\n  ↓ 有提示词？\n┌─ 无 → 限定 / 介词 / 指代 / 连接 / 句间逻辑\n└─ 有 → 这个位置需要什么？\n\
    \           名 / 形 / 副 / 代 / 数 / 动\n                                     ↓\n  \
    \                            确认要动词\n                                     ↓\n \
    \                               谓语 / 非谓语"
  challenge_prompt: 先不填词，只判断这个空有无提示词、在句中需要什么成分或词性，并说出下一个决策树节点。
  source_references:
  - repository: https://github.com/rockpunkgod/ANSWER.git
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
    path: gaokao-grammar-fill/references/grammar-fill.md
    heading: 总路线、无提示词、有提示词、需要动词形式
  - repository: https://github.com/rockpunkgod/ANSWER.git
    commit: b04ebc26d7fa096404111a0bb12f6c77cc8525b9
    path: gaokao-grammar-fill/references/course-evidence.md
    heading: 语法填空
  can_follow:
  - 意群划分
  - 劫匪插葱
  usually_before:
  - 各词性形态变化
  - 谓语与非谓语判定
  - 填回复核
  usually_after:
  - 未填句主干识别
  conflicts_with: []
  cannot_replace:
  - 具体语法节点判据
  - 搭配检查
  - 句意复核
  levels:
    L1: 只区分有提示词与无提示词。
    L2: 无提示词进入限定、介词、指代、连接、句间逻辑节点。
    L3: 有提示词时依空位判名、形、副、代、数、动，不被原词性牵引。
    L4: 确认需要动词后，稳定进入谓语/非谓语并完成各自核对。
  compact:
    line: 先问有没有提示词，再问这个位置要什么；确认要动词才分谓语和非谓语。
    boundary: 决策树负责选对分支，具体答案仍须在分支节点中用句法、搭配和句意定案。
    10s: 看到空先别变词。先问有没有提示词，再问这个位置要什么。确认要动词了，才分谓语和非谓语。
    30s: 有提示词时，先判空位要名、形、副、代、数还是动；无提示词时，先查限定、介词、指代、连接或句间逻辑。比如 `environmental ___ (protect)`
      里括号是动词，但空位要名词中心，所以走名词节点。刹车句：提示词词性不等于答案词性。
    90s: '这是一棵路由树，不是语法知识清单。先以未填句为准划清分句、主干、空位和标点。没有提示词，去功能词路线；有提示词，先判空位需要的词性或成分，然后才处理派生或形态。反例一：`environmental
      ___ (protect)` 的动词提示不会把空位变成动词位置，这里要的是名词 `protection`。反例二：介词后需要名词性成分，但课程例 `After
      spending...` 说明 doing 也能在这里工作，所以不能见介词就一律变派生名词。决策树只负责送你到正确节点，最后还要填回句子核对句法、搭配和句意。


      挑战：先不填词，只说这个空有没有提示词、需要什么功能或词性，以及下一步该进哪个节点。'
  full:
    summary: 将 grammar-fill.md 的冠词、代词、介词、连接、句间逻辑、名词、形副词、数词、谓语和非谓语规则挂到可观察的决策树节点，不再让学生先背平铺清单。
    decision_tree:
      prompt_word:
        false:
          node: function_word
          children:
            determiner: grammar-fill.md#冠词
            preposition: grammar-fill.md#介词
            reference: grammar-fill.md#代词
            connection: grammar-fill.md#连词关系词与名词性从句连接词
            sentence_logic: grammar-fill.md#句间逻辑衔接
        true:
          node: required_slot
          children:
            noun: grammar-fill.md#名词及所有格
            adjective_or_adverb: grammar-fill.md#形容词副词与比较等级
            pronoun: grammar-fill.md#代词
            numeral: grammar-fill.md#数词
            verb:
              gate: 只在空位已确认需要动词形式时进入
              children:
                predicate: grammar-fill.md#谓语检查时态语态主谓一致
                nonfinite: grammar-fill.md#非谓语作用主被动与先后
    boundaries:
    - 提示词原词性不决定答案词性
    - 介词后不一律排除 doing
    - 只有需要动词形式才进谓语非谓语
  cases:
    canonical: cases/G01/canonical/case.yaml
    counterexample: cases/G01/counterexamples/case.yaml
    boundary: cases/G01/boundary/case.yaml
    transfer: cases/G01/transfer/case.yaml
    hard: cases/G01/hard/case.yaml
  four_step_card:
    start: 看到一个语法填空，还没确定这个位置需要什么功能或词性。
    first_cut: 先标有/无提示词，再在未填句中圈出决定空位功能的主干、标点、限定或连接关系。
    judge: 无提示词进功能词节点；有提示词进空位词性节点；确认需要动词才进谓语/非谓语。
    stop: 决策树只送到正确节点；到达节点后停止总路线，改用该节点的具体句法判据。
  practicality_gate:
    status: design_complete_empirical_pending
    trigger: 任何语法填空的第一步均可由有无括号提示词和未填句结构触发。
    action: 标有/无提示；圈出决定空位的句法位置；沿树选一个下一节点。
    output: reduce；把所有可能词形缩到一个语法功能/词性节点，不直接给词形。
    stop: 到达明确知识节点后停止总树；结构未划清时不得继续猜分支。
    transfer: 有无提示+空位功能可迁移到任何新语法填空。
    efficiency: 减少平铺回忆冠词、介词、从句、词性、非谓语等全部知识的认知负担，把检查限定在当前分支。
    misuse_cost: medium；分支误判会漏掉正确词性，但填回句法/句意复核可及时纠正。
  first_use_test:
    status: designed_not_run
    trigger_success: null
    action_success: null
    evidence_success: null
    stop_rule_success: null
    no_answer_backfit: null
    final_result: pending_real_student_test
    failure_type: null
  evaluation:
    baseline: 看到提示词后罗列可能词形，或无提示词时回忆全部功能词
    trigger_precision: null
    trigger_recall: null
    resolution_rate: null
    standalone_rate: null
    assist_rate: null
    false_trigger_rate: null
    transfer_rate: null
    time_complexity_gain: null
    primary_benefit_hypothesis: 降低分支选择的认知负担，避免提示词词性牵引和过早进入谓语/非谓语。
    boundary_accuracy: null
