routes:
- question_type: 阅读理解
  symptoms:
  - 两个选项都像原文，找到定位句仍无法区分。
  - 选项前半句能对上，但整项是否成立拿不准。
  spoken_aliases:
  - 两个选项都像对
  - 两个选项都像原文
  - 两个选项都对得上
  method_id: R01
  role: decider
  first_action: 把候选拆成原文已有内容 A 加新增内容 B。
  stop_rule: 没逐字出现，不等于没有依据。
- question_type: 阅读理解
  symptoms:
  - 原文和选项关键词一样，但关系总判错。
  - 容易把愿望当事实、把能力当意愿，或把动作发出者和承受者调换。
  spoken_aliases: []
  method_id: R02
  role: decider
  first_action: 把原文和候选都填进谁 → 做什么 → 对谁三个槽位。
  stop_rule: 关键词一样，不代表动作关系一样。
- question_type: 阅读理解
  symptoms:
  - 主旨题总在两个相关选项之间摇摆。
  - 容易选范围最大、词频最高或只概括一部分的选项。
  spoken_aliases:
  - 主旨二选一
  - 主旨题二选一
  method_id: R06
  role: decider
  first_action: 先把全文压成 2–4 个不可缺核心块 A+B+C，再用候选逐块拼图。
  stop_rule: 范围大，不等于主旨对。
- question_type: 阅读理解
  symptoms:
  - 长文读完只记得零散事实，说不出全文在完成什么任务。
  - 主旨题只会数重复词或抄段首句，无法形成完整主题判断。
  spoken_aliases:
  - 主旨二选一
  - 主旨题二选一
  - 读完不知道文章说什么
  method_id: R09
  role: framework
  first_action: 依次压出对象、核心判断和全文结构任务。
  stop_rule: 词频高，不等于主题完整。
- question_type: 阅读理解
  symptoms:
  - 选项换了表达，需要核同一断言
  spoken_aliases: []
  method_id: R03
  role: interpreter
  first_action: 并排圈出原文与选项的对象、动作和限定词，逐格核语义是否相同
  stop_rule: 词义不能确认、对象不同或定位句不足以闭合时停止替换，向必要上下文求证；对应词数量不证明答案。
- question_type: 阅读理解
  symptoms:
  - 候选带比较级或最高级
  spoken_aliases: []
  method_id: R04
  role: decider
  first_action: 列出比较双方、属性、方向、程度、范围、时间与条件，逐格回文核对
  stop_rule: 只有一方数值、比较维度不同或原比较未找到时停止定案；最高级不是自动错误，相对更好不自动支持全范围最好。
- question_type: 阅读理解
  symptoms:
  - 两个有依据的候选可能属于同一因果链
  spoken_aliases: []
  method_id: R05
  role: decider
  first_action: 先圈题干问原因还是结果，再写出原文支持的原因→结果，比较候选落点
  stop_rule: 候选未各自得到支持、因果桥无原文证据、只是先后或并列时停止；问 why/reason/cause 时停止套选果偏好。
- question_type: 阅读理解
  symptoms:
  - 多个细节真实并列且题干允许归为一组
  spoken_aliases: []
  method_id: R07
  role: reducer
  first_action: 把同层并列项框成一组，核候选是否只截取组内局部
  stop_rule: and/also 只作入口；不同层级、状态阶段不同、题干只问一项时拆组。无不能回答所问的内容理由，不可共同排除。
- question_type: 阅读理解
  symptoms:
  - 题干问例子的作用而不是例子细节
  spoken_aliases: []
  method_id: R08
  role: interpreter
  first_action: 圈例子前后被支持的观点，再用例子内容检验它实际支持哪句
  stop_rule: 直接问例中事实时不启动作用排除；候选更抽象却没有前后观点与例中动作支持时停止初判，不能补造作者用途。
- question_type: 阅读理解
  symptoms:
  - 代词使对象或动作归属不清
  spoken_aliases: []
  method_id: R10
  role: interpreter
  first_action: 列候选先行词，把每个换回原句，核数、动作角色和完整语义
  stop_rule: 同数候选仍需比角色；状态不能压成单个名词。附近不足就扩大上下文；没有明确指示解释关系时不进入词义推断分支。
- question_type: 阅读理解
  symptoms:
  - 定位长句主干与枝叶混在一起
  spoken_aliases:
  - 原文找到了但句子看不懂
  - 定位句看不懂
  - 长句读不懂
  - 长句看不懂
  method_id: R11
  role: interpreter
  first_action: 圈谓语和对应主体，划开修饰枝叶，但保留否定、条件、范围和比较
  stop_rule: 枝叶中含改变结论的否定、条件、范围或比较时必须恢复；不能将目标当现状、多个动作当已证过程或转折后当答案。
- question_type: 阅读理解
  symptoms:
  - 找不到与题干对象对应的证据句
  spoken_aliases:
  - 找不到原文
  - 找不到定位句
  - 不知道去哪找证据
  method_id: R12
  role: locator
  first_action: 圈题干有区分力的对象或标签，回文找对应句，再读完整断言
  stop_rule: 同数字、同词或最近位置只提供入口；价格人数日期若为条件需另算或比较。区块不足则扩证，不能假设一题一段。
- question_type: 阅读理解
  symptoms:
  - 题干有可区别于其他段的名词
  spoken_aliases: []
  method_id: R13
  role: locator
  first_action: 圈差异性名词，回原文对应区域，不以同词命中直接定案
  stop_rule: 同一名词跨段或全篇重复、名词没有区分力时停止单词追踪，改用题干动作和限定；不能把出现次数当证据强度。
- question_type: 阅读理解
  symptoms:
  - 文章组织与题目顺序实际相符
  spoken_aliases: []
  method_id: R14
  role: locator
  first_action: 标相邻已定位题的出处，作为当前题查找区间，发现倒叙或偏离就取消区间
  stop_rule: 插叙、回叙、跨段综合、猜词共享出处或当前证据落区间外时取消顺序限制，回全篇定位；已定位不得等同已答对。
- question_type: 阅读理解
  symptoms:
  - 同一名词对应多个动作关系
  spoken_aliases: []
  method_id: R15
  role: interpreter
  first_action: 圈题干动词，配回主体和对象，与定位句的完整谓语比较
  stop_rule: 只命中动词而主体或对象不同，或动作词义尚不明时停止关系等同；定位句缺原因指代时转补证。
- question_type: 阅读理解
  symptoms:
  - 题干问全文或指定段主旨
  spoken_aliases: []
  method_id: R16
  role: framework
  first_action: 先圈全文/段落范围，再写对象与核心判断，回各关键段检查覆盖
  stop_rule: 段落主题已清时不机械压全文；局部事实、一般推断或人物品质题不直接套主旨。共同词、抽象程度和首尾结构不独立证明概括。
- question_type: 阅读理解
  symptoms:
  - 定位句缺原因、指代或转折关系
  spoken_aliases: []
  method_id: R17
  role: verifier
  first_action: 明确缺哪种关系，只向前后扩读到能补清它的句子，再核主体和动作
  stop_rule: 定位句已闭合就不扩读；前后固定一句仍不足就按缺口继续找，关键内容未展示或仍不能闭合时暂留，不补造关系。
- question_type: 七选五
  symptoms:
  - 七个选项感觉都能放，拿到每个空都从 A–G 凭语感试填。
  - 知道结构、主体或时态有用，却容易命中一项就直接定答案。
  spoken_aliases:
  - 七个选项感觉全能放
  - 七个选项都能放
  - 七选五凭感觉乱填
  method_id: F01
  role: reducer
  first_action: 在选项区只做一次三维标记：句型、主角、时间；形成暂定组后立即把候选拼回空前空后。
  stop_rule: 分组只缩范围，不负责定答案。
- question_type: 七选五
  symptoms:
  - 选项存在不同句式且空位有结构线索
  spoken_aliases: []
  method_id: F02
  role: reducer
  first_action: 一次圈出完整句/半句/疑问/祈使等真实结构并分组，再回正文核内容
  stop_rule: 没有可观察句型差异就标无区分度；两项结构都能接时停止结构筛选，不凭大小写、句首修饰或同句型定案。
- question_type: 七选五
  symptoms:
  - 选项谈论的主体或代词不同
  spoken_aliases: []
  method_id: F03
  role: reducer
  first_action: 圈选项主语与指代对象，按实际主体分组，正文发生话题转换时重新核对
  stop_rule: 同主角仍需比谁对什么做什么；正文话题切换要核当前候选，不重新机械三分。指代未还原、共享行动者但对象不同就停主体筛选。
- question_type: 七选五
  symptoms:
  - 选项存在真实时间差异
  spoken_aliases: []
  method_id: F04
  role: reducer
  first_action: 标每项谓语及时间词，按真实事件时间分组，不用分词词尾代替时态
  stop_rule: 非谓语词尾不能分时态；没有真实时间差异就停筛。正文有经历、常态或感悟切换时按局部时间核，不强求全篇表面一致，也不重复三分。
- question_type: 七选五
  symptoms:
  - 空位在段首且可能统领下文
  spoken_aliases:
  - 段首不会
  - 段首空不知道怎么填
  method_id: F05
  role: interpreter
  first_action: 列下文共同对象、动作与段落任务，再核候选能否统领，不把段首自动当中心
  stop_rule: 候选只覆盖一个例子、数据或步骤，或预测展开与后文不符时停初判；段首和Here are等只作入口，指代承接还要核。
- question_type: 七选五
  symptoms:
  - 候选与上下句有对象或词义复现
  spoken_aliases:
  - 看到重复词就想选
  - 同词就想选
  method_id: F06
  role: verifier
  first_action: 圈两边对应对象与动作，标同指或同义关系，再回填核上下句和段落任务
  stop_rule: 只是同主题或翻译通却没有明确呼应时不命名本法；同词多项都能接时比完整断言。形式it、概括名词或latter必须按实际内容还原，不能强找最近名词。
- question_type: 七选五
  symptoms:
  - 空前后显示转折、因果、解释等关系
  spoken_aliases: []
  method_id: F07
  role: verifier
  first_action: 写出两侧完整内容，指出实际关系，再核候选连接后是否成立
  stop_rule: 仅连接词同类、只接前句却冲突后句或措施时点错误时不能通过；否定只做某事不是完全禁止，例子也必须真的支持观点。
- question_type: 七选五
  symptoms:
  - 同一对象有可确认的评价方向
  spoken_aliases: []
  method_id: F08
  role: reducer
  first_action: 圈评价词及它评价的对象，比较候选评价维度，不因同为积极词就定案
  stop_rule: 中性句不强分褒贬；负面处境可能引出改善，否定形式可能表达肯定。方向相同仍不能定案，更不能靠另一空占用来证明。
- question_type: 七选五
  symptoms:
  - 空位与选项是需要拼接的半句
  spoken_aliases: []
  method_id: F09
  role: interpreter
  first_action: 把候选接到现有半句，标主语谓语与连接位置，再检验完整语义
  stop_rule: 结构都可补全时必须比对象、动作和段落任务；不能凭大小写或半句长度选。接成句却与前后内容冲突时停止初判。
- question_type: 七选五
  symptoms:
  - 整篇初填后需要回查
  spoken_aliases: []
  method_id: F10
  role: verifier
  first_action: 逐空回填，核主体、动作、对象、上下句关系及段落任务，不以占用或剩余定案
  stop_rule: 当前空仍有多个内容成立项或关键关系缺失时停止确认并暂留；发现其他项可能对应已填空就返回该处重核，不能无据恢复已证伪项。
- question_type: 七选五
  symptoms:
  - 候选已回填且必须区分竞争项
  spoken_aliases: []
  method_id: F11
  role: decider
  first_action: 逐项核候选主体、动作、对象、上下句关系和段落任务，只以当前空自身的决定性关系定案
  stop_rule: 多项仅局部接通或仍共同成立时暂留，不按主观更像原因撤销另一项；形式、同词、时态、占用或剩余均不能替代当前空自身证据。
- question_type: 完形填空
  symptoms:
  - 当前空不能由孤立语法闭合
  spoken_aliases: []
  method_id: C01
  role: framework
  first_action: 标当前空是词义/关系/搭配角色；找最近对象与动作线索；不足向复现、回答、结果或评价扩；回填核语义
  stop_rule: 当前空自己的词义、搭配或决定性关系仍不明就暂留；主题同向、单句顺口或另一空已填都不证明答案。原空号走两遍，不按难易预排。
- question_type: 完形填空
  symptoms:
  - 空前空后证据尚未闭合
  spoken_aliases: []
  method_id: C02
  role: verifier
  first_action: 圈两侧谁、动作、评价和时间；近处不足再向明确复现或结果扩读，仍不足暂留
  stop_rule: 局部仍不足就暂留，按原空号先做有独立依据的空再返回；相邻待定空、教师先报答案和选项占用都不能给本空作证。不要只截取支持初选的一句。
- question_type: 完形填空
  symptoms:
  - 当前空依赖人物背景或全文基调
  spoken_aliases: []
  method_id: C03
  role: interpreter
  first_action: 从首句记录人物、背景、主题、视角和暂定基调，不据此预编后续情节
  stop_rule: 首句没有的信息不能预编；人物态度、外在表现和实际遭遇须分开。当前空能局部闭合就不机械复述首句，框架不选词。
- question_type: 完形填空
  symptoms:
  - 空内词的句法作用能指向线索类型
  spoken_aliases: []
  method_id: C04
  role: locator
  first_action: 标空内作用，再圈修饰同一对象或动作的结构，不凭词性定案
  stop_rule: 只看词尾或词性仍无法确认所修饰对象时停止定位结论；动词空要另核谁做、指向谁、回应什么，不能把观察者感受当人物行动。
- question_type: 完形填空
  symptoms:
  - 多个候选译义相近或评价同向
  spoken_aliases: []
  method_id: C05
  role: interpreter
  first_action: 并列写出各项具体状态、程度或功能，回原文对象核差异，词义未知就停
  stop_rule: 词义或搭配不能确认时说明缺口并暂停，不能凭主旨或中文翻译强选；情感投入与客观状态要分开。
- question_type: 完形填空
  symptoms:
  - 空位依赖事件先后或时间间隔
  spoken_aliases: []
  method_id: C06
  role: interpreter
  first_action: 写两件事发生时间及间隔，再标先后或因果，不省略题面时间条件
  stop_rule: 事件时间或间隔未给就标未知；先后不证明因果，身份或状态改变不证明时长改变。额外时间要求无据时停止初判。
- question_type: 完形填空
  symptoms:
  - 名词空需要同一人物物件或事件线索
  spoken_aliases: []
  method_id: C07
  role: locator
  first_action: 圈原词/同义/同源复现并核是否同一对象，不把复现直接当答案
  stop_rule: 宽泛类别、同词或复现次数不构成定案；同名不同事件需分开，邻句不足可找后面几句，但缺同指关系就停止采用该线索。
- question_type: 完形填空
  symptoms:
  - 题面给出评价或结果可核当前行为
  spoken_aliases: []
  method_id: C08
  role: verifier
  first_action: 先还原结果所评价的具体行为，再核候选是否有真实题面联系，不能由猜定空互证
  stop_rule: 结果所评价对象不清、连接关系无题面依据或仅同为积极词时暂留；相邻待定空不能互证，结果也不能补造题面未给的行为。
- question_type: 完形填空
  symptoms:
  - 连续动作需要先后或因果衔接
  spoken_aliases: []
  method_id: C09
  role: interpreter
  first_action: 按已有动作画先后链，逐个标连接关系，不增添题面没有的时长或因果
  stop_rule: 动作多不证明因果或完整过程；单句各自顺口不证明整段成立。题面未给的时长、动作方式或角色关系不补造，链边无据就暂留。
- question_type: 语法填空
  symptoms:
  - 看到括号里的词就立即开始变形，不知道变成哪类词。
  - 无提示词时把所有功能词一起猜，有提示词时又见动词就直接判谓语/非谓语。
  spoken_aliases:
  - 有提示词不知道怎么变
  - 括号里的词怎么变
  method_id: G01
  role: framework
  first_action: 圈出空后的括号提示词（若有），再圈空前后支配或修饰词，在未填句上标明空位成分；确认需要动词才分谓语/非谓语。
  stop_rule: 提示词是什么词性，不等于答案就是什么词性。
- question_type: 语法填空
  symptoms:
  - 开始处理语法空位
  spoken_aliases: []
  method_id: G02
  role: framework
  first_action: 只标有/无提示词，再回完整句确认位置功能，不先改提示词
  stop_rule: 提示词是否存在、未填句主干或分句边界不清时停在确认节点；无提示词不能锁死为四类，还可能是句间连接副词。
- question_type: 语法填空
  symptoms:
  - 名词前缺限定且确认为冠词路线
  spoken_aliases: []
  method_id: G03
  role: decider
  first_action: 圈中心名词、单复数和已有修饰，回语境核特指泛指再定冠词
  stop_rule: 已有其他限定、中心名词未确认或所指是否唯一不清时停；of修饰或定语从句不能自动证明the，a/an按读音而非字母。
- question_type: 语法填空
  symptoms:
  - 空位需要代词或所有格功能
  spoken_aliases: []
  method_id: G04
  role: decider
  first_action: 标空位作主语/宾语/限定/反身功能，回指实际对象再用节点规则
  stop_rule: 代词所指或省略内容不清先停回指；介词后不必然宾格，it可能是形式主/宾语，反身需动作回到主体或具体结构支持。
- question_type: 语法填空
  symptoms:
  - 空位已判需要介词
  spoken_aliases: []
  method_id: G05
  role: decider
  first_action: 圈介词后的中心词及所属动作，核场景关系或固定搭配，陌生搭配不猜
  stop_rule: 搭配未知或场景关系不能确认时暂停；多于两个对象不自动among，数量增加了与增加到须分开，不能把宽泛方向口诀作唯一依据。
- question_type: 语法填空
  symptoms:
  - 句间连接位置且可能是从句
  spoken_aliases: []
  method_id: G06
  role: decider
  first_action: 分别圈两侧谓语，核从句是否缺主语、宾语、表语或状语，再判连接功能
  stop_rule: 只知先行词是地点、时间或原因不能定where/when/why；从句类型、缺口或实际搭配不明就停。结构完整仍要核语义，不用发生/未发生一条口诀决定why/how。
- question_type: 语法填空
  symptoms:
  - 两个结构完整的句子缺逻辑连接
  spoken_aliases: []
  method_id: G07
  role: decider
  first_action: 写两侧完整意思，标实际转折/因果/并列等关系，不由单个提示词定案
  stop_rule: 标点或中文转折不能独立定词；句子成分未完整先回从句节点。However等功能须按本句说明，不能把所有逻辑词称为并列连词。
- question_type: 语法填空
  symptoms:
  - 有提示词但不确定空位需要什么
  spoken_aliases: []
  method_id: G08
  role: reducer
  first_action: 圈空位前后修饰与支配结构，标名/形/副/代/数/动功能，再进对应分支
  stop_rule: 提示词原词性不证明答案词性；分句主干不清先拆句，名词性位置还要区分派生名词与动名词，不能见动词提示就走非谓语。
- question_type: 语法填空
  symptoms:
  - 空位已确认需名词或所有格
  spoken_aliases: []
  method_id: G09
  role: decider
  first_action: 圈限定、数量和所有关系，核派生、单复数或所有格，不见提示动词就进动词路线
  stop_rule: 名词性功能不排除所有doing；介词后不一律派生名词，也不一律doing。名词修饰另一名词可能仍保留名词，结构搭配未核就停。
- question_type: 语法填空
  symptoms:
  - 空位确定作修饰或表语
  spoken_aliases: []
  method_id: G10
  role: decider
  first_action: 圈被修饰词和比较结构，判形/副及级别，不机械加比较级
  stop_rule: 修饰名词不能忽略名词作定语的分支；没有等级差异不强造比较级，-ing/-ed形容词须按对象和状态而非人/物标签机械分。
- question_type: 语法填空
  symptoms:
  - 空位已确定需要数量或顺序
  spoken_aliases: []
  method_id: G11
  role: decider
  first_action: 圈数量/次序线索，按节点规则处理基数、序数或词形
  stop_rule: 只看到一个数字提示不能确定功能；排序线索和数量所指不清就停，不把中文数字或冠词单独当序数证明。
- question_type: 语法填空
  symptoms:
  - 空位已确认需要动词形式
  spoken_aliases:
  - 不知道谓语还是非谓语
  - 分不清谓语和非谓语
  method_id: G12
  role: reducer
  first_action: 圈句内已有谓语与连接词，核空位是否承担谓语，再分谓语/非谓语
  stop_rule: 未判空位功能先停；总句有谓语不等于本分句不需谓语，并列谓语或另起从句须另核。不能只数全句动词或按词尾二分。
- question_type: 语法填空
  symptoms:
  - 空位是谓语且需判时态
  spoken_aliases: []
  method_id: G13
  role: decider
  first_action: 圈明确时间、上下文事件先后和句内语态，再与真主语核数
  stop_rule: 单个since/by等只提示，不免上下文参照核对；主语角色、状态性分词或时间参照不明就停，不执行有be/无be快速二分口诀。
- question_type: 语法填空
  symptoms:
  - 主谓间有修饰造成数判断混乱
  spoken_aliases: []
  method_id: G14
  role: verifier
  first_action: 划开插入和修饰，圈真正主语中心词，核谓语一致，保留否定条件
  stop_rule: 最近名词不一定主语，集合或数量结构须回完整节点；状态性过去分词与被动动作需另核，不能执行有be/无be口诀。
- question_type: 语法填空
  symptoms:
  - 空位已确认非谓语
  spoken_aliases: []
  method_id: G15
  role: decider
  first_action: 标句法作用、逻辑主语与动作的主被动、同谓语的先后关系，再选择形式
  stop_rule: 介词、逗号或一个词尾不能替三轴；逻辑主语或搭配不明就停。形式表示相对关系，不套绝对现在/过去，也不将课程简化清单当无条件判据。
- question_type: 语法填空
  symptoms:
  - 非谓语动作归属尚不明确
  spoken_aliases: []
  method_id: G16
  role: verifier
  first_action: 圈非谓语的逻辑主语，再核谁执行或承受动作，不只看最近名词
  stop_rule: 最近名词不独立证明动作主人；状语非谓语与主句主体不一致时停，检查是否有明确独立结构，不能补造未出现的主人。
- question_type: 语法填空
  symptoms:
  - 长句修饰妨碍识别空位成分
  spoken_aliases:
  - 长句看不出空位成分
  - 长句找不到空位成分
  method_id: G17
  role: interpreter
  first_action: 圈主干谓语和对应主语，暂划介词短语、非谓语、插入语和从句，再恢复决定空位的修饰、否定与条件
  stop_rule: 只暂划不永久删；空可能就在从句或短语内，必须恢复其分句边界。主干不足判空功能时停，不从填后词形倒贴成分。
- question_type: 语法填空
  symptoms:
  - 整篇完成后核对考点分布
  spoken_aliases: []
  method_id: G18
  role: verifier
  first_action: 列每空实际考点，发现重复只触发回查，不能推翻该空独立句法语义证据
  stop_rule: 一般不重复不是禁止重复；未核当前空独立证据前不得改词，不能为了凑分布把两个已成立结构拆成不同考点。
- question_type: 语法填空
  symptoms:
  - 提示词初变形后需要复核
  spoken_aliases: []
  method_id: G19
  role: verifier
  first_action: 对照原提示词与空位成分记录变形路线，一般一次只是回查提示，不凭次数选答案
  stop_rule: 一般一次不排除本句支持的更复杂形式；提示词原词性也可能与答案相同。结构未核前不因次数撤销原答案或强制换词类。
- question_type: 应用文
  symptoms:
  - 应用文题面要点或稿件任务不清
  spoken_aliases: []
  method_id: A01
  role: framework
  first_action: 按文体、对象、要点、逻辑、语言逐栏记录题面与原稿证据，先任务后语言
  stop_rule: 无题目只能校对可见语言和大致结构；无全文不做全篇诊断。书写只看清晰原稿是否影响交际，五检项目不是逐项扣分表。
- question_type: 应用文
  symptoms:
  - 有题目但需要从审题到成稿路线
  spoken_aliases: []
  method_id: A02
  role: framework
  first_action: 先圈限定和全部要点，搭文体骨架，再依原六步造句、组篇、升级和复核
  stop_rule: 题目或交际对象不清先补信息；基础句或内容未成立时停止升级。模板不合语境不得照抄，完成六步不保证分数。
- question_type: 应用文
  symptoms:
  - 要点已确定但简单句写不出来
  spoken_aliases: []
  method_id: A03
  role: interpreter
  first_action: 先写主体，再写动作或状态，最后嵌入题面支持的场景细节
  stop_rule: 主体或动作不确定先回要点，不能编背景补空；句子主干、搭配或时态不成立先修准确，不急着加修饰。
- question_type: 应用文
  symptoms:
  - 多个动作要合成复杂句
  spoken_aliases: []
  method_id: A04
  role: interpreter
  first_action: 每个动作先写正确简单句，再按真实关系用从句、非谓语或连接词粘连
  stop_rule: 基础句未正确先修句；逻辑关系不明不合并。非谓语的动作主体或从句依附不成立，退回独立句，不为复杂度强拼。
- question_type: 应用文
  symptoms:
  - 中文长句信息和修饰混杂
  spoken_aliases: []
  method_id: A05
  role: interpreter
  first_action: 拆核心与修饰，按主体→动作→场景重组，再校时态词性单复数与风格
  stop_rule: 核心与修饰还分不清先停重排；否定、时间、数量或条件不能当枝叶丢掉。改写改变身份、动作或因果时退回原意。
- question_type: 应用文
  symptoms:
  - 课后需积累准确可迁移表达
  spoken_aliases: []
  method_id: A06
  role: framework
  first_action: 先简化中文自行译，再对照范文记录缺失表达；背诵复现后在同结构仿写
  stop_rule: 适用于课后训练，不是考场先看答案；已准确且自然的异写不判错。范文或AI升级改变意思、搭配未核时不背不照抄。
- question_type: 应用文
  symptoms:
  - 基础句准确且需要自然升级
  spoken_aliases: []
  method_id: A07
  role: interpreter
  first_action: 先简化中文、译正确简单句，再加入服务真实逻辑的修饰或从句，搭配不明停升级
  stop_rule: 基础句不成立先修基础；升级引入原任务没有的事件、感受或因果时停止。动作主体、搭配或句法不明则撤回该层，不追求层层加满。
- question_type: 应用文
  symptoms:
  - 应用文需要匹配文体与交际目的
  spoken_aliases: []
  method_id: A08
  role: framework
  first_action: 圈题目文体对象目的，调用对应骨架，不把文体模板算独立原创规则
  stop_rule: 题面格式、已给首尾或目的另有要求时服从题面，不硬套三段或称呼；骨架不是原创品牌判据，也不能以句型齐全判内容完成。
- question_type: 应用文
  symptoms:
  - 题目与学生全文可见且请求批改
  spoken_aliases: []
  method_id: A09
  role: verifier
  first_action: 先按15分五档三维定档，逐条引用题面和原稿证据，缺材料不完整给分
  stop_rule: 无题目或缺全文不给完整分数；仅转写文本不评书写。书写只有清晰原稿且确实影响交际才按源规范降档，不因美观降档；训练模板、五检和高级词不是独立扣分项。
- question_type: 应用文
  symptoms:
  - 课后需要规划作文训练而非现场答案
  spoken_aliases: []
  method_id: A10
  role: framework
  first_action: 按材料中的训练阶段选一个下一步，不把分数锚定当个体提分保证
  stop_rule: 这是课后训练规划，不是当场答案或个体得分预测；基础翻译、任务覆盖未稳不跳到复杂升级，不因背完金句承诺10分或15分。
- question_type: 读后续写
  symptoms:
  - 原文与两段开头语齐全，需要构思
  spoken_aliases: []
  method_id: W01
  role: framework
  first_action: 先读两段开头语找约束，再记录原文人物矛盾与时空，依跳定思提润推进
  stop_rule: 缺原文或任一开头语先停构思，只校现有语言；人物、关键事实或段间接续不成立先修框架。润色不得靠无铺垫的新事件，独立升华句不是必须项。
- question_type: 读后续写
  symptoms:
  - 需要搭两段功能提纲或诊断桥接
  spoken_aliases: []
  method_id: W02
  role: framework
  first_action: 只标学生自写的第1/5/6/9/10句功能，写清衔接、桥接、解决与回扣，不算给定首句
  stop_rule: 给定首句不计学生十句，未抄首句正常；实际不是十句时按功能映射，不为凑数删合理内容。缺原文或首句不判完整衔接，独立升华句非必需。
- question_type: 读后续写
  symptoms:
  - 已读原文首句需要整理情节
  spoken_aliases: []
  method_id: W03
  role: framework
  first_action: 只选需求→困难→行动→结局这一套四格，每格填原文约束，不混用另一版字母定义
  stop_rule: 两版PTSD字母定义不可混用；缺原文约束先停，未铺垫的困难或解决者不能靠填表成立。结果应顺承故事，独立升华句不强制。
- question_type: 读后续写
  symptoms:
  - 两段开头语对人物或行动有约束
  spoken_aliases: []
  method_id: W04
  role: locator
  first_action: 圈开头语的名词和任务，回文找人物与矛盾，再反推段间需要补的动作
  stop_rule: 首句只给约束，不证明唯一剧情；回文找不到任务前提或人物动机就暂留，不凭名词造事件。缺任一首句不能做完整段间反推。
- question_type: 读后续写
  symptoms:
  - 核心行动需要具体连贯描写
  spoken_aliases: []
  method_id: W05
  role: interpreter
  first_action: 把已有行动拆最多三个合理小动作，再加与场景相符的方式，不改变人物能力
  stop_rule: 没有成立的核心行动先回情节，不用拆链发明事件；不机械凑三个动作。主体、物理条件或先后冲突时退回原动作。
- question_type: 读后续写
  symptoms:
  - 续写不知从哪里下笔
  spoken_aliases: []
  method_id: W06
  role: locator
  first_action: 圈核心人物、核心矛盾和关键线索，不额外造主角或无铺垫事故
  stop_rule: 三点未从原文找到先停编写；线索不能自动证明解决动作，新主角或无铺垫事故不能补成第三点。
- question_type: 读后续写
  symptoms:
  - 人物行为或物件需要兑现原文线索
  spoken_aliases: []
  method_id: W07
  role: verifier
  first_action: 把关键行为与原文伏笔逐对连线，找悬空线索，不强行用无关细节
  stop_rule: 对应只找到同词却说不清因果或用途时停止核验；不能为了兑现添加无铺垫能力或事件。缺原文无法证明回扣。
- question_type: 读后续写
  symptoms:
  - 事件跳跃缺因果桥梁
  spoken_aliases: []
  method_id: W08
  role: interpreter
  first_action: 写因为A→行动B→结果C，每条边引用原文或合理铺垫，不让猜测互证
  stop_rule: 某一条边只有猜测互证或物理条件不成立先停推进，补合理动机/行动而不是再添结果。叙事先后不自动等于因果。
- question_type: 读后续写
  symptoms:
  - 主线成立但画面单薄
  spoken_aliases: []
  method_id: W09
  role: interpreter
  first_action: 在推进主线的位置选动作、神态、环境中有用的细节，不每句堆三类
  stop_rule: 人物因果或衔接未成立先修框架；细节只为凑字数且不服务主线时停止添加。采用26S春人与自然万能句式时另遵非功能位限制，环境模板不放结尾，不能泛化成所有描写的绝对位置规则。
- question_type: 读后续写
  symptoms:
  - 连接词堆砌却对象衔接不清
  spoken_aliases: []
  method_id: W10
  role: interpreter
  first_action: 圈相邻句共同对象和代词回指，使用关键词复现，不删掉必要逻辑关系
  stop_rule: 代词有歧义先明确对象；两句对象相同但动作无因果不宣称自然衔接。删连接词会改变逻辑时保留或换准确表达。
- question_type: 读后续写
  symptoms:
  - 解决过程可以加入有铺垫波折
  spoken_aliases: []
  method_id: W11
  role: interpreter
  first_action: 从原文矛盾找小障碍，写解决动作，不凭空新增关键人物事故
  stop_rule: 无原文矛盾轨道或必要铺垫先停设计；新关键人物、事故、超能力不能只为反转加入。框架未完整先解决框架，正向结果不等于强行大团圆。
- question_type: 读后续写
  symptoms:
  - 基础表达准确后需改具体词
  spoken_aliases: []
  method_id: W12
  role: interpreter
  first_action: 圈笼统动词或形容词，用符合场景与搭配的具体词替换，生词搭配不明就停
  stop_rule: 基础意思或句法未准确先修，不先换词；替换词搭配、力度或适用对象不明就停并保留准确常用词，不从词表盲抄。
- question_type: 读后续写
  symptoms:
  - 故事结局需要回应主题
  spoken_aliases: []
  method_id: W13
  role: verifier
  first_action: 圈原文关键细节与解决结果，让结尾回扣它们；独立升华句不是必须项
