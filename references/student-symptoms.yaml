routes:
- question_type: 阅读理解
  symptoms:
  - 两个选项都像原文，找到定位句仍无法区分。
  - 选项前半句能对上，但整项是否成立拿不准。
  spoken_aliases:
  - 两个选项都像对
  - 两个选项都像原文
  - 两个选项都对得上
  method_id: R01
  role: decider
  first_action: 把候选拆成原文已有内容 A 加新增内容 B。
  stop_rule: 共同核心A未确认时不强拆；B有直接或间接支持时停止排除，不能因没原词判错；排除后仍核保留项。
- question_type: 阅读理解
  symptoms:
  - 原文和选项关键词一样，但关系总判错。
  - 容易把愿望当事实、把能力当意愿，或把动作发出者和承受者调换。
  spoken_aliases: []
  method_id: R02
  role: decider
  first_action: 并排圈主体与完整谓语；按本题差异核谁对谁做什么，或希望/事实、能力/意愿，不强制三格串行。
  stop_rule: 没有可比差异就不用；题干已明示共同对象时不因候选省略主体排除，不能据剩余项定案。
- question_type: 阅读理解
  symptoms:
  - 主旨题总在两个相关选项之间摇摆。
  - 容易选范围最大、词频最高或只概括一部分的选项。
  spoken_aliases:
  - 主旨二选一
  - 主旨题二选一
  method_id: R06
  role: decider
  first_action: 把候选拆成谈什么与作什么判断，对照所问范围的已证核心关系，指出具体遗漏。
  stop_rule: 没有已证核心关系先停；省略、近义或上位概念能覆盖时，不能因没原词判缺失。
- question_type: 阅读理解
  symptoms:
  - 长文读完只记得零散事实，说不出全文在完成什么任务。
  - 主旨题只会数重复词或抄段首句，无法形成完整主题判断。
  spoken_aliases:
  - 主旨二选一
  - 主旨题二选一
  - 读完不知道文章说什么
  method_id: R09
  role: framework
  first_action: 先读实际题干及相关选项；共同/重复概念仅作假设；再化简有效首尾，最后读中间段首及必要回答或段尾。
  stop_rule: 局部题或缺主要段落不启动；重复线索缺失只跳过该观察；三格无正文支持则暂留，不编相关题目。
- question_type: 阅读理解
  symptoms:
  - 选项换了表达，需要核同一断言
  spoken_aliases: []
  method_id: R03
  role: interpreter
  first_action: 先圈所问对象、动作与限制定位段落，再用有区分度的候选名词或动作找句；并排核完整动词关系与形副范围。
  stop_rule: 仅结构相似不启动；同词、近义词命中不直接选；词义或所在句不闭合就补必要上下文，保留否定条件。
- question_type: 阅读理解
  symptoms:
  - 候选带比较级或最高级
  spoken_aliases: []
  method_id: R04
  role: decider
  first_action: 在本题内先圈比较候选，尤其多个比较项时优先回文找真实关系，再对齐双方、属性、方向、程度、范围、阶段与条件。
  stop_rule: 未找到同比较词只是未定位，不等于证伪；最高级不自动错，后来状态不补成先前性质；题内优先不改整篇题序。
- question_type: 阅读理解
  symptoms:
  - 两个有依据的候选可能属于同一因果链
  spoken_aliases: []
  method_id: R05
  role: decider
  first_action: 先圈题干所问现象或具体环节；问原因就找与它相连的原因，否则画已证原因→中间结果→最终结果并对齐所问节点。
  stop_rule: 共同对象、先后或并列不足以启动；链或各候选缺依据即停；不把后续结果移作前一环节目的，不由排一项定另一项。
- question_type: 阅读理解
  symptoms:
  - 多个细节真实并列且题干允许归为一组
  spoken_aliases: []
  method_id: R07
  role: reducer
  first_action: 把同层并列项框成一组，核候选是否只截取组内局部
  stop_rule: and/also 只作入口；不同层级、状态阶段不同、题干只问一项时拆组。无不能回答所问的内容理由，不可共同排除。
- question_type: 阅读理解
  symptoms:
  - 题干问例子的作用而不是例子细节
  spoken_aliases: []
  method_id: R08
  role: interpreter
  first_action: 圈例子及必要前后观点，分别写例中发生什么与它支持哪种判断，再核候选声称的作用或覆盖。
  stop_rule: 直接考例中事实不用本法排细节；作用新增无依据则撤回，段首段尾和主题词只作入口，不机械见细节必排。
- question_type: 阅读理解
  symptoms:
  - 代词使对象或动作归属不清
  spoken_aliases: []
  method_id: R10
  role: interpreter
  first_action: 圈指代及所在完整谓语；实体先列可比对象并回填，状态写谁处于什么状态，概念回看它概括的行为并还原内部代词。
  stop_rule: 最近名词、同数或同词性不定案；状态不缩成名词，结果不冒充原状态；附近不足按缺口扩，解释关系不明停词义分支。
- question_type: 阅读理解
  symptoms:
  - 定位长句主干与枝叶混在一起
  spoken_aliases:
  - 原文找到了但句子看不懂
  - 定位句看不懂
  - 长句读不懂
  - 长句看不懂
  - 看不懂长句
  - 句子看不懂
  - 看不懂句子
  - 找不到句子主干
  method_id: R11
  role: interpreter
  first_action: 先圈谓语及对应主体，划分真实结构并保留答题相关修饰；阶段差异核当前与目标，持续差异直接核动作含义和必要上下文。
  stop_rule: 分结构不等于删修饰作答；不强制持续检查前先画时间线或比时长，不凭时态、持续词或转折位置定案；含义不明停该检查。
- question_type: 阅读理解
  symptoms:
  - 找不到与题干对象对应的证据句
  spoken_aliases:
  - 找不到原文
  - 找不到定位句
  - 不知道去哪找证据
  method_id: R12
  role: locator
  first_action: 圈实际题干所问对象和范围，以当前有区分力的专名、数字或其他标志标候选区域。
  stop_rule: 暑4版本前提不成立，不借一般定位放宽；标签无区分度或位置不闭合就换线索或扩证，不假设一题一段。
- question_type: 阅读理解
  symptoms:
  - 题干有可区别于其他段的名词
  spoken_aliases: []
  method_id: R13
  role: locator
  first_action: 圈差异名词或名词短语，回文标候选区域，再配题干实际动作与限定，没原词时查可确认近义表达。
  stop_rule: 同名跨段、名词无区分度或当前表达未确认就换动作线索或补证；不按次数、最近位置或同词定答案。
- question_type: 阅读理解
  symptoms:
  - 文章组织与题目顺序实际相符
  spoken_aliases: []
  method_id: R14
  role: locator
  first_action: 标相邻已定位题的真实出处，暂估当前题可能区间，再以当前题对象和动作回文确认。
  stop_rule: 插叙、回叙、跨段综合、共享出处或证据落区间外时取消限制；不切死一题一段，定位不等于已答对。
- question_type: 阅读理解
  symptoms:
  - 同一名词对应多个动作关系
  spoken_aliases: []
  method_id: R15
  role: interpreter
  first_action: 圈题干动词及对应主体对象，并排配回定位句的完整谓语，保留否定、阶段、范围和条件。
  stop_rule: 主体、对象或动词含义未确认不判等同；缺指代、因果或阶段联系就补必要上下文，不把一致当整项正解。
- question_type: 阅读理解
  symptoms:
  - 题干问全文或指定段主旨
  spoken_aliases: []
  method_id: R16
  role: framework
  first_action: 先圈所问全文/段落范围，扫候选共同对象并去同求异，带不同判断回该范围核贯穿内容及覆盖。
  stop_rule: 局部事实、泛推理或人物品质不套主旨；不并为中心思想；共同词、较宽范围、动态词形或剩余项不定案，段意清楚不机械压全文。
- question_type: 阅读理解
  symptoms:
  - 定位句缺原因、指代或转折关系
  spoken_aliases: []
  method_id: R17
  role: verifier
  first_action: 先写清缺哪条关系，只向必要前后文扩读到能补清它的位置，再回完整断言核主体、动作和限制。
  stop_rule: 定位句已闭合即停扩读；固定邻一句仍不足就按缺口继续，材料不足或关系不明则暂留，不编依据。
- question_type: 七选五
  symptoms:
  - 七个选项感觉都能放，拿到每个空都从 A–G 凭语感试填。
  - 知道结构、主体或时态有用，却容易命中一项就直接定答案。
  spoken_aliases:
  - 七个选项感觉全能放
  - 七个选项都能放
  - 七选五凭感觉乱填
  method_id: F01
  role: reducer
  first_action: 在选项区按句型、实际主角、真谓语时间各标一次组并说清字母；无区分度如实标记，随后按突破口回正文。
  stop_rule: 无区别不编组；发现漏纳、指代或谓语初筛错误可在当前比较纠正，不重演完整三分；不据组小、占用或剩一项选。
- question_type: 七选五
  symptoms:
  - 选项存在不同句式且空位有结构线索
  spoken_aliases: []
  method_id: F02
  role: reducer
  first_action: 一次圈出完整句/半句/疑问/祈使等真实结构并分组，再回正文核内容
  stop_rule: 没有可观察句型差异就标无区分度；两项结构都能接时停止结构筛选，不凭大小写、句首修饰或同句型定案。
- question_type: 七选五
  symptoms:
  - 选项谈论的主体或代词不同
  spoken_aliases: []
  method_id: F03
  role: reducer
  first_action: 开头圈主体与指代并展示暂定字母组，回文确认当前主体对象，再在同组比完整动作及段落推进。
  stop_rule: 同主角但对象不同继续比；新证据改变话题或发现漏纳、指代初筛错误时更正，不重演分组；归属不明暂留。
- question_type: 七选五
  symptoms:
  - 选项存在真实时间差异
  spoken_aliases: []
  method_id: F04
  role: reducer
  first_action: 开头圈真谓语与时间词并说字母组，回文确认局部事件阶段，再在同组比主体、动作、指代、评价与两侧内容。
  stop_rule: 非谓语词尾不分时态；无差异停止该维筛选；经历与感悟可切换，初筛错误可更正但不重演；不只比较异组后就选。
- question_type: 七选五
  symptoms:
  - 空位在段首或第一段段尾附近，且后文围绕共同主题展开
  spoken_aliases:
  - 段首不会
  - 段首空不知道怎么填
  - 第一段段尾要引下文不知道怎么填
  method_id: F05
  role: interpreter
  first_action: 先标候选管一个段还是后续若干分项，概括全部管辖内容的共同对象和展开方向，再核代词承接与实际展开。
  stop_rule: 位置或Here are不定案；只对应一个例子、数据或步骤就撤回初判；不把较概括项推广到任意位置，竞争未闭合继续核。
- question_type: 七选五
  symptoms:
  - 候选与上下句有对象或词义复现
  spoken_aliases:
  - 看到重复词就想选
  - 同词就想选
  method_id: F06
  role: verifier
  first_action: 圈呼应表达并写它承接哪个对象、事件或整句内容，回填两侧；需要时由空后代词反查候选提供的前提。
  stop_rule: 无明确呼应不命名本法；形式it不强找名词，latter要有真实成对对象；前提未引出不提前放，段界连下段起句核。
- question_type: 七选五
  symptoms:
  - 空前后显示转折、因果、解释等关系
  spoken_aliases: []
  method_id: F07
  role: verifier
  first_action: 写出两侧完整内容，指出实际关系，再核候选连接后是否成立
  stop_rule: 仅连接词同类、只接前句却冲突后句或措施时点错误时不能通过；否定只做某事不是完全禁止，例子也必须真的支持观点。
- question_type: 七选五
  symptoms:
  - 同一对象有可确认的评价方向
  spoken_aliases: []
  method_id: F08
  role: reducer
  first_action: 圈评价词及它评价的对象，比较候选评价维度，不因同为积极词就定案
  stop_rule: 中性句不强分褒贬；负面处境可能引出改善，否定形式可能表达肯定。方向相同仍不能定案，更不能靠另一空占用来证明。
- question_type: 七选五
  symptoms:
  - 空位与选项是需要拼接的半句
  spoken_aliases: []
  method_id: F09
  role: interpreter
  first_action: 把候选接到现有半句，标主语谓语与连接位置，再检验完整语义
  stop_rule: 结构都可补全时必须比对象、动作和段落任务；不能凭大小写或半句长度选。接成句却与前后内容冲突时停止初判。
- question_type: 七选五
  symptoms:
  - 整篇初填后需要回查
  spoken_aliases: []
  method_id: F10
  role: verifier
  first_action: 逐空回填核对象、动作、两侧功能与段落任务，再核未选项的内容承接和断言范围，疑似对应已填位置则返回。
  stop_rule: 内容仍多项成立或缺关键关系就暂留；占用与剩余不作本空依据，已证伪项不无据恢复。
- question_type: 七选五
  symptoms:
  - 候选已回填且必须区分竞争项
  spoken_aliases: []
  method_id: F11
  role: decider
  first_action: 并排核竞争项完整断言怎样承接空前具体条件、空后结果与全段问题，标实际支持或冲突。
  stop_rule: 多个候选仍成立则暂留，不按主观更像原因撤销另一项；不靠他空占用、剩一项或无文本的直觉定案。
- question_type: 完形填空
  symptoms:
  - 当前空不能由孤立语法闭合
  spoken_aliases: []
  method_id: C01
  role: framework
  first_action: 标空位角色，圈最近对象/动作提示；最近不足才向真实复现、回答、结果或评价扩读，再回填核具体语义与联系。
  stop_rule: 当前空的决定性词义或关系仍不明就暂留；找到独立提示再返回，不强制原空号、两遍或三遍。
- question_type: 完形填空
  symptoms:
  - 空前空后证据尚未闭合
  spoken_aliases: []
  method_id: C02
  role: verifier
  first_action: 圈两侧对象、动作、评价、时间及候选额外前提；近处够则回填，不够写缺口并向真实复现、回答、结果或评价扩。
  stop_rule: 仍不足就暂留，找到独立提示后返回，不强制原空号；相邻待定空、已占项或先报答案不互证。
- question_type: 完形填空
  symptoms:
  - 当前空依赖人物背景或全文基调
  spoken_aliases: []
  method_id: C03
  role: interpreter
  first_action: 从首句或前几句标人物、背景、主题、视角与暂定基调，再核当前空实际需要的对象和关系。
  stop_rule: 首句未给的信息不预编；积极态度不等于遭遇顺利，外在表现、遭遇与态度不混同；不报课程系列为方法。
- question_type: 完形填空
  symptoms:
  - 空内词的句法作用能指向线索类型
  spoken_aliases: []
  method_id: C04
  role: locator
  first_action: 标空内作用并圈实际修饰同一对象或动作的结构；动词空核谁做、指向谁及真实施受归属。
  stop_rule: 修饰对象、逻辑主语或具体词义未确认先停该定位结论；不凭职业惯例、心理猜测补候选所需前提。
- question_type: 完形填空
  symptoms:
  - 多个候选译义相近或评价同向
  spoken_aliases: []
  method_id: C05
  role: interpreter
  first_action: 并列写出各项具体状态、程度或功能，回原文对象核差异，词义未知就停
  stop_rule: 词义或搭配不能确认时说明缺口并暂停，不能凭主旨或中文翻译强选；情感投入与客观状态要分开。
- question_type: 完形填空
  symptoms:
  - 空位依赖事件先后或时间间隔
  spoken_aliases: []
  method_id: C06
  role: interpreter
  first_action: 写两件事发生时间及间隔，再标先后或因果，不省略题面时间条件
  stop_rule: 事件时间或间隔未给就标未知；先后不证明因果，身份或状态改变不证明时长改变。额外时间要求无据时停止初判。
- question_type: 完形填空
  symptoms:
  - 名词空需要同一人物物件或事件线索
  spoken_aliases: []
  method_id: C07
  role: locator
  first_action: 圈相关表达及其内容，确认仍指同一人物、状态或事件；已知派生关系再核词义，必要时向后找并回填。
  stop_rule: 未知词根不拆猜，共同后缀或形近不当同根；and不强定同向，复现、类别或次数不定案；同指或词义不明暂留。
- question_type: 完形填空
  symptoms:
  - 题面给出评价或结果可核当前行为
  spoken_aliases: []
  method_id: C08
  role: verifier
  first_action: 先还原结果所评价的具体行为，再核候选是否有真实题面联系，不能由猜定空互证
  stop_rule: 结果所评价对象不清、连接关系无题面依据或仅同为积极词时暂留；相邻待定空不能互证，结果也不能补造题面未给的行为。
- question_type: 完形填空
  symptoms:
  - 连续动作需要先后或因果衔接
  spoken_aliases: []
  method_id: C09
  role: interpreter
  first_action: 按已有动作画先后链，逐个标连接关系，不增添题面没有的时长或因果
  stop_rule: 动作多不证明因果或完整过程；单句各自顺口不证明整段成立。题面未给的时长、动作方式或角色关系不补造，链边无据就暂留。
- question_type: 语法填空
  symptoms:
  - 看到括号里的词就立即开始变形，不知道变成哪类词。
  - 无提示词时把所有功能词一起猜，有提示词时又见动词就直接判谓语/非谓语。
  spoken_aliases:
  - 有提示词不知道怎么变
  - 括号里的词怎么变
  method_id: G01
  role: framework
  first_action: 圈出空后的括号提示词（若有），再圈空前后支配或修饰词，在未填句上标明空位成分；确认需要动词才分谓语/非谓语。
  stop_rule: 空位功能或必要句子未确认时先停；到达知识节点即停止总路线，改用节点句法、搭配与句意核验，不把路由当答案。
- question_type: 语法填空
  symptoms:
  - 开始处理语法空位
  spoken_aliases: []
  method_id: G02
  role: framework
  first_action: 只标有/无提示词，再回完整句确认位置功能，不先改提示词
  stop_rule: 提示词是否存在、未填句主干或分句边界不清时停在确认节点；无提示词不能锁死为四类，还可能是句间连接副词。
- question_type: 语法填空
  symptoms:
  - 名词前缺限定且确认为冠词路线
  spoken_aliases: []
  method_id: G03
  role: decider
  first_action: 圈中心名词、单复数和已有修饰，回语境核特指泛指再定冠词
  stop_rule: 已有其他限定、中心名词未确认或所指是否唯一不清时停；of修饰或定语从句不能自动证明the，a/an按读音而非字母。
- question_type: 语法填空
  symptoms:
  - 空位需要代词或所有格功能
  spoken_aliases: []
  method_id: G04
  role: decider
  first_action: 标空位作主语/宾语/限定/反身功能，回指实际对象再用节点规则
  stop_rule: 代词所指或省略内容不清先停回指；介词后不必然宾格，it可能是形式主/宾语，反身需动作回到主体或具体结构支持。
- question_type: 语法填空
  symptoms:
  - 空位已判需要介词
  spoken_aliases: []
  method_id: G05
  role: decider
  first_action: 圈介词后的中心词及所属动作，核场景关系或固定搭配，陌生搭配不猜
  stop_rule: 搭配未知或场景关系不能确认时暂停；多于两个对象不自动among，数量增加了与增加到须分开，不能把宽泛方向口诀作唯一依据。
- question_type: 语法填空
  symptoms:
  - 句间连接位置且可能是从句
  spoken_aliases: []
  method_id: G06
  role: decider
  first_action: 分别圈两侧谓语，核从句是否缺主语、宾语、表语或状语，再判连接功能
  stop_rule: 只知先行词是地点、时间或原因不能定where/when/why；从句类型、缺口或实际搭配不明就停。结构完整仍要核语义，不用发生/未发生一条口诀决定why/how。
- question_type: 语法填空
  symptoms:
  - 两个结构完整的句子缺逻辑连接
  spoken_aliases: []
  method_id: G07
  role: decider
  first_action: 写两侧完整意思，标实际转折/因果/并列等关系，不由单个提示词定案
  stop_rule: 标点或中文转折不能独立定词；句子成分未完整先回从句节点。However等功能须按本句说明，不能把所有逻辑词称为并列连词。
- question_type: 语法填空
  symptoms:
  - 有提示词但不确定空位需要什么
  spoken_aliases: []
  method_id: G08
  role: reducer
  first_action: 圈空位前后修饰与支配结构，标名/形/副/代/数/动功能，再进对应分支
  stop_rule: 提示词原词性不证明答案词性；分句主干不清先拆句，名词性位置还要区分派生名词与动名词，不能见动词提示就走非谓语。
- question_type: 语法填空
  symptoms:
  - 空位已确认需名词或所有格
  spoken_aliases: []
  method_id: G09
  role: decider
  first_action: 圈限定、数量和所有关系，核派生、单复数或所有格，不见提示动词就进动词路线
  stop_rule: 名词性功能不排除所有doing；介词后不一律派生名词，也不一律doing。名词修饰另一名词可能仍保留名词，结构搭配未核就停。
- question_type: 语法填空
  symptoms:
  - 空位确定作修饰或表语
  spoken_aliases: []
  method_id: G10
  role: decider
  first_action: 圈被修饰词和比较结构，判形/副及级别，不机械加比较级
  stop_rule: 修饰名词不能忽略名词作定语的分支；没有等级差异不强造比较级，-ing/-ed形容词须按对象和状态而非人/物标签机械分。
- question_type: 语法填空
  symptoms:
  - 空位已确定需要数量或顺序
  spoken_aliases: []
  method_id: G11
  role: decider
  first_action: 圈数量/次序线索，按节点规则处理基数、序数或词形
  stop_rule: 只看到一个数字提示不能确定功能；排序线索和数量所指不清就停，不把中文数字或冠词单独当序数证明。
- question_type: 语法填空
  symptoms:
  - 空位已确认需要动词形式
  spoken_aliases:
  - 不知道谓语还是非谓语
  - 分不清谓语和非谓语
  method_id: G12
  role: reducer
  first_action: 圈句内已有谓语与连接词，核空位是否承担谓语，再分谓语/非谓语
  stop_rule: 未判空位功能先停；总句有谓语不等于本分句不需谓语，并列谓语或另起从句须另核。不能只数全句动词或按词尾二分。
- question_type: 语法填空
  symptoms:
  - 空位是谓语且需判时态
  spoken_aliases: []
  method_id: G13
  role: decider
  first_action: 圈明确时间、上下文事件先后和句内语态，再与真主语核数
  stop_rule: 单个since/by等只提示，不免上下文参照核对；主语角色、状态性分词或时间参照不明就停，不执行有be/无be快速二分口诀。
- question_type: 语法填空
  symptoms:
  - 主谓间有修饰造成数判断混乱
  spoken_aliases: []
  method_id: G14
  role: verifier
  first_action: 划开插入和修饰，圈真正主语中心词，核谓语一致，保留否定条件
  stop_rule: 最近名词不一定主语，集合或数量结构须回完整节点；状态性过去分词与被动动作需另核，不能执行有be/无be口诀。
- question_type: 语法填空
  symptoms:
  - 空位已确认非谓语
  spoken_aliases: []
  method_id: G15
  role: decider
  first_action: 标句法作用、逻辑主语与动作的主被动、同谓语的先后关系，再选择形式
  stop_rule: 介词、逗号或一个词尾不能替三轴；逻辑主语或搭配不明就停。形式表示相对关系，不套绝对现在/过去，也不将课程简化清单当无条件判据。
- question_type: 语法填空
  symptoms:
  - 非谓语动作归属尚不明确
  spoken_aliases: []
  method_id: G16
  role: verifier
  first_action: 圈非谓语的逻辑主语，再核谁执行或承受动作，不只看最近名词
  stop_rule: 最近名词不独立证明动作主人；状语非谓语与主句主体不一致时停，检查是否有明确独立结构，不能补造未出现的主人。
- question_type: 语法填空
  symptoms:
  - 长句修饰妨碍识别空位成分
  spoken_aliases:
  - 长句看不出空位成分
  - 长句找不到空位成分
  method_id: G17
  role: interpreter
  first_action: 圈主干谓语和对应主语，暂划介词短语、非谓语、插入语和从句，再恢复决定空位的修饰、否定与条件
  stop_rule: 只暂划不永久删；空可能就在从句或短语内，必须恢复其分句边界。主干不足判空功能时停，不从填后词形倒贴成分。
- question_type: 语法填空
  symptoms:
  - 整篇完成后核对考点分布
  spoken_aliases: []
  method_id: G18
  role: verifier
  first_action: 列每空实际考点，发现重复只触发回查，不能推翻该空独立句法语义证据
  stop_rule: 一般不重复不是禁止重复；未核当前空独立证据前不得改词，不能为了凑分布把两个已成立结构拆成不同考点。
- question_type: 语法填空
  symptoms:
  - 提示词初变形后需要复核
  spoken_aliases: []
  method_id: G19
  role: verifier
  first_action: 对照原提示词与空位成分记录变形路线，一般一次只是回查提示，不凭次数选答案
  stop_rule: 一般一次不排除本句支持的更复杂形式；提示词原词性也可能与答案相同。结构未核前不因次数撤销原答案或强制换词类。
- question_type: 应用文
  symptoms:
  - 应用文题面要点或稿件任务不清
  spoken_aliases: []
  method_id: A01
  role: framework
  first_action: 按文体、对象、要点、逻辑、语言逐栏记录题面与原稿证据，先任务后语言
  stop_rule: 无题目只能校对可见语言和大致结构；无全文不做全篇诊断。书写只看清晰原稿是否影响交际，五检项目不是逐项扣分表。
- question_type: 应用文
  symptoms:
  - 有题目但需要从审题到成稿路线
  spoken_aliases: []
  method_id: A02
  role: framework
  first_action: 圈题面限定与全部要点，搭合适文体骨架，写准确单句再按真实关系组篇、升级和复核。
  stop_rule: 题目或对象不清先补材料；基础内容未成立先修，不照抄不合语境模板，不保证分数。
- question_type: 应用文
  symptoms:
  - 要点已确定但简单句写不出来
  spoken_aliases: []
  method_id: A03
  role: interpreter
  first_action: 先写核心主体，再写动作或状态，最后加入题面支持且服务要点的时间地点等细节。
  stop_rule: 主体或动作不明先回要点，不编背景；基础不成立先修，不靠堆修饰升级，基础句式锚定不与另两种方法合并。
- question_type: 应用文
  symptoms:
  - 多个动作要合成复杂句
  spoken_aliases: []
  method_id: A04
  role: interpreter
  first_action: 各动作先独立写成正确简单句，标实际关系，再选合适从句、非谓语、连接词或介词短语粘连。
  stop_rule: 基础句或关系未成立不合并；动作主体或依附错误退回独立句，不为复杂度强拼或把训练配比作语法上限。
- question_type: 应用文
  symptoms:
  - 中文长句信息和修饰混杂
  spoken_aliases: []
  method_id: A05
  role: interpreter
  first_action: 拆核心与修饰信息，按主体→核心动作→场景重组，再校时态、词性、单复数和衔接风格。
  stop_rule: 核心不清先停重排；否定、时间、数量、条件不能当枝叶删；不宣称缺连续口述或新完整例的分支已全面验收。
- question_type: 应用文
  symptoms:
  - 课后需积累准确可迁移表达
  spoken_aliases: []
  method_id: A06
  role: framework
  first_action: 中文必要时先简化，再独立英译、对照范文、记录并背诵缺失词或句式；第五步AI升级可选。
  stop_rule: 范文或AI改变任务、意思或搭配未核就不背不抄；挖空法另列，不塞入寒4五步或改称六步。
- question_type: 应用文
  symptoms:
  - 基础句准确且需要自然升级
  spoken_aliases: []
  method_id: A07
  role: interpreter
  first_action: 并排写出相关简单句，标共同主体和实际关系，再选合适从句、非谓语或介词短语拼接。
  stop_rule: 主体、语义关系或搭配不成立退回独立句；不靠110/120整篇词数选法，不借续写同名定义。
- question_type: 应用文
  symptoms:
  - 应用文需要匹配文体与交际目的
  spoken_aliases: []
  method_id: A08
  role: framework
  first_action: 圈题面文体、对象、目的及明示格式，让各段承担实际要点功能，再选择相应文体骨架。
  stop_rule: 题面已给标题首尾或特殊格式就按要求保留，不硬套段数；示范句型不作每篇配额，骨架齐不等于要点完成。
- question_type: 应用文
  symptoms:
  - 题目与学生全文可见且请求批改
  spoken_aliases: []
  method_id: A09
  role: verifier
  first_action: 先按15分五档三维定档，逐条引用题面和原稿证据，缺材料不完整给分
  stop_rule: 无题目或缺全文不给完整分数；仅转写文本不评书写。书写只有清晰原稿且确实影响交际才按源规范降档，不因美观降档；训练模板、五检和高级词不是独立扣分项。
- question_type: 应用文
  symptoms:
  - 课后需要规划作文训练而非现场答案
  spoken_aliases: []
  method_id: A10
  role: framework
  first_action: 依据现有稿件或练习，标任务骨架、基础翻译、素材调用或自然升级的缺口，选择一个对应阶段的复练动作。
  stop_rule: 没有现稿不精确承诺档次；基础未稳不跳华丽结构，金句积累数量不作单篇使用数，110/120不当整篇词数策略。
- question_type: 读后续写
  symptoms:
  - 原文与两段开头语齐全，需要构思
  spoken_aliases: []
  method_id: W01
  role: framework
  first_action: 先读两首句提出待证问题，再回原文找人物矛盾与时空；依跳定思提润留下线索、冲突主题、构思、功能提纲与润色检查。
  stop_rule: 缺必要材料只校现有语言；人物、事实或衔接不成立先修，不能借独立升华句补框架，也不混同各版五步成文原名。
- question_type: 读后续写
  symptoms:
  - 需要搭两段功能提纲或诊断桥接
  spoken_aliases: []
  method_id: W02
  role: framework
  first_action: 未动笔先在两段首句下列中文提纲，标接第一首句、必要段间桥、接第二首句、解决冲突、回应五处；已有稿则在现稿标这些功能。自写十句才对应1/5/6/9/10。
  stop_rule: 缺原文或任一首句就停完整衔接判断；拟写无依据先留空。已有稿按真实位置核功能，不凑十句；已衔接不补可省过渡或重述第二首句，给定首句不必重抄，独立升华句非必需。
- question_type: 读后续写
  symptoms:
  - 已读原文首句需要整理情节
  spoken_aliases: []
  method_id: W03
  role: framework
  first_action: 先注明版本：寒8板书P目的/T方式/S苦难/D结局；同课表格P需求/T方法/S困难/D结局；逐槽填首句已知与原文约束。
  stop_rule: 未注明版本先停；未知槽留空，不凭口诀补事故或救场者；Needs/Difficulties/Solutions/Denouement不是PTSD英文展开。
- question_type: 读后续写
  symptoms:
  - 两段开头语对人物或行动有约束
  spoken_aliases: []
  method_id: W04
  role: locator
  first_action: 圈首句已明示的人事物、状态、时地和任务，带状态变化的问题回原文，再标段间确有必要的过程。
  stop_rule: 缺首句或前提不足停完整反推；可省过渡不强加，已衔接不重述下一段进行中事件，不凭名词补唯一剧情。
- question_type: 读后续写
  symptoms:
  - 核心行动需要具体连贯描写
  spoken_aliases: []
  method_id: W05
  role: interpreter
  first_action: 圈已有核心行动，拆真实相连的小动作，标人物、先后和因果，再补合语境状态。
  stop_rule: 没有成立行动不拆；人物能力、物理条件或因果不成立则撤回；动作面独立定义未核，不补成动作加心理加环境。
- question_type: 读后续写
  symptoms:
  - 续写不知从哪里下笔
  spoken_aliases: []
  method_id: W06
  role: locator
  first_action: 给这三项各圈真实原文位置，写谁因何受阻、哪条线索约束后续。
  stop_rule: 原文找不到就留缺口，不编主角或事故补齐三点；不把段首句加动作加结局的练习比例当全体写作配额。
- question_type: 读后续写
  symptoms:
  - 人物行为或物件需要兑现原文线索
  spoken_aliases: []
  method_id: W07
  role: verifier
  first_action: 将关键行为、物件结果与原文重要伏笔连线，写清动机、用途或后果，标未兑现的重要联系。
  stop_rule: 只有同词而无真实联系就停确认；不为了兑现添无铺垫能力、事故或人物，缺原文不证明回扣。
- question_type: 读后续写
  symptoms:
  - 事件跳跃缺因果桥梁
  spoken_aliases: []
  method_id: W08
  role: interpreter
  first_action: 写因为A→行动B→结果C，为每条边标原文条件或合理铺垫，逐条说明怎样促成下一步。
  stop_rule: 边上只有猜测互证或物理条件不成立就停推进，先补合理动机/行动，不靠再添结果证明前一步。
- question_type: 读后续写
  symptoms:
  - 主线成立但画面单薄
  spoken_aliases: []
  method_id: W09
  role: interpreter
  first_action: 在推进主线的行动旁选有用的动作、神态或环境细节，注明它显示的状态或推进的环节。
  stop_rule: 框架未成立先修；只凑字数不加。春11环境素材位置建议仅限该组模板，不扩大成所有环境描写禁令或强制句位。
- question_type: 读后续写
  symptoms:
  - 连接词堆砌却对象衔接不清
  spoken_aliases: []
  method_id: W10
  role: interpreter
  first_action: 圈共同对象和代词回指，回填所指并核动作接续；可用关键词复现或指代替代无用连接词。
  stop_rule: 代词歧义先明确对象；同对象不证明有因果，删词会改关系就保留或换准确表达，不为无痕而删逻辑。
- question_type: 读后续写
  symptoms:
  - 解决过程可以加入有铺垫波折
  spoken_aliases: []
  method_id: W11
  role: interpreter
  first_action: 从当前矛盾找合理小障碍，写触发条件与解决行动，再核人物能力和主线不变。
  stop_rule: 无铺垫或框架未完整先停；不加无据关键人物、超能力或事故，每篇不强制转折，正向不等于大团圆。
- question_type: 读后续写
  symptoms:
  - 基础表达准确后需改具体词
  spoken_aliases: []
  method_id: W12
  role: interpreter
  first_action: 圈笼统词，写清此处实际动作或状态，再选对象、力度与搭配匹配的词并回填。
  stop_rule: 基础未准确先修，生词的力度或搭配不明保留准确常用词；不从词表盲抄或按替换数量评分。
- question_type: 读后续写
  symptoms:
  - 故事结局需要回应主题
  spoken_aliases: []
  method_id: W13
  role: verifier
  first_action: 把解决结果对应回原文关键线索，指出行动或感悟怎样带出本题主题。
  stop_rule: 核心矛盾未解先停喊道理；抽象主题不能换成本题内容就撤回，没独立升华句不自动降档或判重大缺失。
- question_type: 读后续写
  symptoms:
  - 功能提纲与扩写位置需要区分
  spoken_aliases: []
  method_id: W14
  role: framework
  first_action: 标接首句、必要桥接、解决与收束等实际功能为骨架，其余位置按本题因果与画面需要选写有把握内容。
  stop_rule: 骨架未接通先补功能；非功能位也受原文约束，不会什么就硬背什么，不因句数或句位本身扣分。
- question_type: 读后续写
  symptoms:
  - 原文首句和学生续写齐全且请求评分
  spoken_aliases: []
  method_id: W15
  role: verifier
  first_action: 按25分档次逐项引用原文与自写稿证据，先核融洽、情节和完整性，再核语言与衔接。
  stop_rule: 缺必要材料不报完整分；不抄给定首句正常；仅原手写可见且影响交际才按规范处理书写，不伪造固定扣分。
- question_type: 读后续写
  symptoms:
  - 课后需确定下一档训练缺口
  spoken_aliases: []
  method_id: W16
  role: framework
  first_action: 按现稿先核完整和因果，再选细节衔接、合理转折或精准表达中的一项复练。
  stop_rule: 缺现稿不精确诊断或承诺升档；基础未稳不跳华丽升级，不机械增加动作、复杂句、转折或独立升华句。
