  decision_rule: 六步留下可见产物：限定/要点表→文体提纲→正确基础句→内容模块→有用的升级→要点和语言复核；未完成前项先补前项，不用模板替代任务。
  verification: 先圈限定和全部要点，搭文体骨架，再依原六步造句、组篇、升级和复核。六步留下可见产物：限定/要点表→文体提纲→正确基础句→内容模块→有用的升级→要点和语言复核；未完成前项先补前项，不用模板替代任务。
    题目或交际对象不清先补信息；基础句或内容未成立时停止升级。模板不合语境不得照抄，完成六步不保证分数。
  stop_rule: 题目或交际对象不清先补信息；基础句或内容未成立时停止升级。模板不合语境不得照抄，完成六步不保证分数。
  common_wrong_instinct: 背好模板就直接填词，不核题目身份、要点和目的。
  failure_cases:
  - 背好模板就直接填词，不核题目身份、要点和目的。
  - 题目或交际对象不清先补信息；基础句或内容未成立时停止升级。模板不合语境不得照抄，完成六步不保证分数。
  counterexamples:
  - 模板有邀请结束语而题目要求感谢，句型再熟也不应照搬；正确简单句已达意时不必强塞复杂结构。此为条件示意，不是真题。
  transfer_pattern: 换题材保留六个动作，提纲、内容与语气服从新题目的限定。
  memory_line: 先圈限定和全部要点，搭文体骨架，再依原六步造句、组篇、升级和复核
