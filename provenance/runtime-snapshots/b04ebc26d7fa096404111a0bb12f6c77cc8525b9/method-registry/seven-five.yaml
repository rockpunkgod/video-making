  entry_copy: '七选五拿到空位就在 A–G 里凭语感试填时，先停一下。第一眼不读正文，只在选项区做一次三分：看句型角色，圈主角/核心话题，找真谓语的时间。某一维没区分度就跳过。分组只得到优先候选，之后必须把它们拼回空前空后，比主体、动作、对象、时间线、前后关系和段落任务。一旦进入内容比较就停止分组，不要遇到新线索又重分。换题材后，三维初筛仍能用。


    你可以直接说：七选五先三分，然后拼回去。'
