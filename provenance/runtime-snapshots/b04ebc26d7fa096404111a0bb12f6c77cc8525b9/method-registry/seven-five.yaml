  transfer_pattern: 陌生题仍按真实句式和空位角色分组，不沿用上题字母或大小写口诀。
  memory_line: 一次圈出完整句/半句/疑问/祈使等真实结构并分组，再回正文核内容
  anti_rule: 同句型 ≠ 同内容。
