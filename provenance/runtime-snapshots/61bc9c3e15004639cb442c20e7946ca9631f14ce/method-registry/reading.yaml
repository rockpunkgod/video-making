    first_cut: 并排圈原文与候选的主体和完整谓语，标这题实际在比哪种差异。
    judge: 只有确认主体、施受或谓语状态被无依据偷换才排除；一致只通过这一核查。
    stop: 没有可比差异就不用；题干已明示共同对象时不因候选省略主体排除，不能据剩余项定案。
