  levels:
    L1: 标当前空是词义/关系/搭配角色；找最近对象与动作线索；不足向复现、回答、结果或评价扩；回填核语义
    L2: 产出当前空的线索路径：空位查词义、关系还是搭配，最近哪句有对象/动作提示，不足向何处扩，回填需核哪条关系；框架本身不定案。
    L3: 当前空的决定性词义或关系仍不明就暂留；找到独立提示再返回，不强制原空号、两遍或三遍。
    L4: 换题材仍先标空位角色、圈最近提示、按缺口扩证并回填，不迁移上篇主题或词对。
  compact:
    line: 标空位角色，圈最近对象/动作提示；最近不足才向真实复现、回答、结果或评价扩读，再回填核具体语义与联系。
    boundary: 当前空的决定性词义或关系仍不明就暂留；找到独立提示再返回，不强制原空号、两遍或三遍。
    10s: 完形不知道查哪儿？先标空的作用、圈近处提示，不足再扩读；线索路径不是答案。
    30s: 完形不知道查哪儿？先标这个空要补动作、状态还是对象，再圈最近一句能提供的提示。例如，人物态度乐观，不代表实际遭遇顺利。词义或关系没闭合先留空，找到独立提示再返回。
    90s: 完形不知道查哪儿？标空位角色，圈最近对象/动作提示；最近不足才向真实复现、回答、结果或评价扩读，再回填核具体语义与联系。这一步得到的是待核框架或计划，不是答案或分数。判断时，产出当前空的线索路径，标已补清和仍缺的关系；内部框架不独立定案。什么时候停，当前空的决定性词义或关系仍不明就暂留；找到独立提示再返回，不强制原空号、两遍或三遍。反例示意，人物态度积极，但实际遭遇不顺利；不能用积极基调选描述顺利遭遇的词。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，先不选词，只标当前空角色，圈最近线索；不足时画扩证方向，再写回填要核的那条联系。
  full:
    summary: 标空位角色，圈最近对象/动作提示；最近不足才向真实复现、回答、结果或评价扩读，再回填核具体语义与联系。 产出当前空的线索路径，标已补清和仍缺的关系；内部框架不独立定案。
    source_boundary: 当前空的决定性词义或关系仍不明就暂留；找到独立提示再返回，不强制原空号、两遍或三遍。
    boundaries:
    - 当前空的决定性词义或关系仍不明就暂留；找到独立提示再返回，不强制原空号、两遍或三遍。
    - 人物态度积极，但实际遭遇不顺利；不能用积极基调选描述顺利遭遇的词。
    section_ids: *id001
    beginner_support:
      first_micro_action: 先标这个空要补动作、状态还是对象，再圈最近一句能提供的提示。
      prerequisite: 先读出本空两侧谁在做什么，区分题面已说与自己猜的内容；决定候选的词义不明就先标出来。
      if_stuck: 只记录已找到的提示；词义或桥接缺证据时暂留，找到独立提示后返回，不以猜空互证。
      example: 人物态度乐观，不代表实际遭遇顺利。
      example_scope: 关系/结构示意，非完整试题，不计真题或已验案例。
      micro_action_is_not_completion: 完成第一小步不等于完整方法成功；继续完成四步卡的判断与停止核验。
      short_stop: 词义或关系没闭合先留空，找到独立提示再返回。
