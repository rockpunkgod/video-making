  verification: 产出有要点和复核记录的成稿计划；六步是通用梳理框架，不冒充独立课程原名算法。 题目或对象不清先补材料；基础内容未成立先修，不照抄不合语境模板，不保证分数。
  stop_rule: 题目或对象不清先补材料；基础内容未成立先修，不照抄不合语境模板，不保证分数。
