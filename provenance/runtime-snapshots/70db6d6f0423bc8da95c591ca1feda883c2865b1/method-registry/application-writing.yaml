    L2: 五栏逐项对照题面与原稿：标出已覆盖、不充分、遗漏或偏离，先圈影响交际任务的缺口，再列确定的语言问题；得到修改清单，不直接得到分数。
    L3: 无题目只能校对可见语言和大致结构；无全文不做全篇诊断。书写只看清晰原稿是否影响交际，五检项目不是逐项扣分表。
    L4: 换文体仍做题面要求—原稿位置配对，具体格式和目的随题目变化。
  compact:
    10s: 作文读着顺却怕漏点？把题面要求逐条对回原稿，先补任务；五检不是扣分表。
    30s: 作文读着顺却怕漏点？先圈题目一个明确要求，在原稿旁标写到了还是没写到，再展开五检。例如，邀请目的写了，时间地点没交代，要先补活动安排。无题目只校语言，无全文不做整篇诊断。
    90s: 作文读着顺却怕漏点？按文体、对象、要点、逻辑、语言逐栏记录题面与原稿证据，先任务后语言。这一步得到的是待核框架或计划，不是答案或分数。判断时，五栏逐项对照题面与原稿：标出已覆盖、不充分、遗漏或偏离，先圈影响交际任务的缺口，再列确定的语言问题；得到修改清单，不直接得到分数。什么时候停，无题目只能校对可见语言和大致结构；无全文不做全篇诊断。书写只看清晰原稿是否影响交际，五检项目不是逐项扣分表。反例示意，语言漂亮但题面核心要点遗漏，不能因高级词多判任务完成；只有转写文本时也不能诊断原稿书写。此为条件示意，不是真题。换题仍检查当前题面的对象和关系，不搬上一题结论。挑战，先不打分、不改全文，给每个题面要点找一个原稿位置；找不到的标遗漏。
  full:
    summary: 按文体、对象、要点、逻辑、语言逐栏记录题面与原稿证据，先任务后语言 五栏逐项对照题面与原稿：标出已覆盖、不充分、遗漏或偏离，先圈影响交际任务的缺口，再列确定的语言问题；得到修改清单，不直接得到分数。
    source_boundary: 无题目只能校对可见语言和大致结构；无全文不做全篇诊断。书写只看清晰原稿是否影响交际，五检项目不是逐项扣分表。
    boundaries:
    - 无题目只能校对可见语言和大致结构；无全文不做全篇诊断。书写只看清晰原稿是否影响交际，五检项目不是逐项扣分表。
    - 语言漂亮但题面核心要点遗漏，不能因高级词多判任务完成；只有转写文本时也不能诊断原稿书写。此为条件示意，不是真题。
    section_ids: *id001
    beginner_support:
      first_micro_action: 先圈题目一个明确要求，在原稿旁标写到了还是没写到，再展开五检。
      prerequisite: 先读清写给谁、要完成哪件事。基础句先做到谁、做什么或是什么清楚；准确简单句可以保留。
      if_stuck: 保留准确简单句和已覆盖要点；不强加复杂句、AI或高级词，不据训练配额扣分。
      example: 邀请目的写了，时间地点没交代，要先补活动安排。
      example_scope: 关系/结构示意，非完整试题，不计真题或已验案例。
      micro_action_is_not_completion: 完成第一小步不等于完整方法成功；继续完成四步卡的判断与停止核验。
      short_stop: 无题目只校语言，无全文不做整篇诊断。
    presentation_revision: 2026-10-28.2
    source_update_note: 寒4五步不吞并赠课挖空版本；春5格式与结尾服从实际任务；国庆表达技巧、修改流程和构思模型分别保名，简单句可保留。
